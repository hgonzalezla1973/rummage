<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:470,&quot;height&quot;:924}}">
class Component extends DCLogic {
  componentDidMount() {
    const draw = () => { if (window.lucide && window.lucide.createIcons) { window.lucide.createIcons(); return true; } return false; };
    if (!draw()) {
      this._t = setInterval(() => { if (draw()) clearInterval(this._t); }, 60);
      setTimeout(() => clearInterval(this._t), 4000);
    }
  }
  componentWillUnmount() { clearInterval(this._t); }
  renderVals() { return {}; }
}
</script>
