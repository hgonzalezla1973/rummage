<style>
:root {
  /* Kraft paper & index card surfaces */
  --paper:#EDE6D6; --paper-2:#F1EAD6; --surface:#F8F4EA; --surface-tint:#FBF8F0;

  /* Sharpie-black ink */
  --ink-900:#211D17; --ink-800:#332E24; --ink-700:#4A4335; --ink-600:#6B6252;
  --ink-500:#8A8069; --ink-400:#9C9280; --ink-300:#C4B593; --ink-200:#D8CBB0; --ink-100:#E8E0CC; --line:#D8CBB0;

  /* Primary — sale-sign red */
  --brand-50:#FBEAEA; --brand-100:#F3CBCB; --brand-200:#E29A9B; --brand-300:#D26C6D;
  --brand-400:#C1272D; --brand-500:#A81F24; --brand-600:#8B1A1E; --brand-700:#6E1417; --brand-800:#4F0F11;

  /* Masking-tape yellow (secondary accent, used sparingly) */
  --tape-50:#FDF6E0; --tape-100:#F8E8B0; --tape-300:#F0C550; --tape-500:#E8B923; --tape-600:#C99C15; --tape-700:#8A6A0D;
  --teal-50:#F0FDFA; --teal-100:#CCFBF1; --teal-300:#5ECEBD; --teal-500:#14B8A6; --teal-600:#0D9488; --teal-700:#0F766E;
  --green-600:#3F5E3A; --green-bg:#E1E8D6; --amber-600:#8A5A12; --amber-bg:#F1E0B8; --red-600:#A81F24; --red-bg:#FBEAEA;
  --coral:#A81F24; --coral-bg:#FBEAEA;

  /* Sale type colors — office-supplies palette so they don't compete with the red accent */
  --type-estate-fg:#2C4A7C; --type-estate-bg:#DCE4EF;
  --type-yard-fg:#3F5E3A;   --type-yard-bg:#E1E8D6;
  --type-moving-fg:#8A5A12; --type-moving-bg:#F1E0B8;

  /* Semantic aliases */
  --text-primary:var(--ink-900); --text-secondary:var(--ink-600); --text-muted:var(--ink-500); --text-faint:var(--ink-400);
  --text-inverse:#FFFFFF; --text-accent:var(--brand-500); --text-link:var(--brand-500);
  --surface-app:var(--paper); --surface-card:var(--surface); --surface-sunken:var(--paper-2); --surface-raised:var(--surface-tint);
  --border-default:var(--line); --border-strong:var(--ink-300); --border-accent:var(--brand-200);
  --accent:var(--brand-400); --accent-hover:var(--brand-500); --accent-press:var(--brand-700);
  --accent-soft:var(--brand-50); --accent-soft-bd:var(--brand-200);
  --secondary:var(--teal-600); --secondary-soft:var(--teal-50); --focus-ring:var(--brand-400);
  --success:var(--green-600); --success-bg:var(--green-bg); --warning:var(--amber-600); --warning-bg:var(--amber-bg);
  --danger:var(--red-600); --danger-bg:var(--red-bg);
  --pin:var(--brand-400); --pin-saved:var(--coral); --live:#3F5E3A;

  --font-display:'Archivo Black','Arial Narrow',system-ui,sans-serif;
  --font-sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'Spline Sans Mono',ui-monospace,'SF Mono',Menlo,monospace;

  --text-2xs:11px; --text-xs:12px; --text-sm:13px; --text-base:15px; --text-md:17px;
  --text-lg:20px; --text-xl:24px; --text-2xl:30px; --text-3xl:38px; --text-4xl:48px;
  --weight-regular:400; --weight-medium:500; --weight-semibold:600; --weight-bold:700; --weight-extra:800;
  --leading-tight:1.1; --leading-snug:1.25; --leading-normal:1.45; --leading-relaxed:1.65;
  --tracking-tight:-0.02em; --tracking-snug:-0.01em; --tracking-normal:0; --tracking-wide:0.02em; --tracking-caps:0.08em;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px;
  --radius-xs:4px; --radius-sm:6px; --radius-md:8px; --radius-lg:10px;
  --radius-xl:14px; --radius-2xl:20px; --radius-pill:999px;

  /* Warm, neutral shadows — no purple tint */
  --shadow-xs:0 1px 3px rgba(33,29,23,.08);
  --shadow-sm:0 2px 10px rgba(33,29,23,.09);
  --shadow-md:0 8px 24px rgba(33,29,23,.12),0 2px 6px rgba(33,29,23,.07);
  --shadow-lg:0 20px 48px rgba(33,29,23,.16),0 6px 14px rgba(33,29,23,.09);
  --shadow-sheet:0 -8px 40px rgba(33,29,23,.14);
  --shadow-pin:0 6px 16px rgba(168,31,36,.35);
  --shadow-focus:0 0 0 3px rgba(193,39,45,.28);

  --safe-top:59px; --tabbar-height:84px;
  --dur-fast:140ms; --dur-base:220ms; --dur-slow:360ms;
  --ease-out:cubic-bezier(.22,1,.36,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
}

@keyframes tutBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes tutPulseRing{0%{transform:scale(.5);opacity:.7}100%{transform:scale(2.1);opacity:0}}

</style>

<div id="root"></div>
<div id="err" style="display:none;position:fixed;inset:0;background:#fff;color:#c00;font-family:monospace;font-size:13px;padding:24px;white-space:pre-wrap;overflow:auto;z-index:99999;"></div>
<script>
window.addEventListener('error', function(e) {
  // Cross-origin scripts (the CDN <script> tags below) report errors as the
  // generic "Script error." with no filename/line — browsers strip all detail
  // for security. That's unactionable noise, not a real crash signal, so
  // don't blank out the whole app over it.
  if (e.message === 'Script error.' && !e.filename) return;
  var d = document.getElementById('err');
  d.style.display = 'block';
  d.textContent = 'JS ERROR:\n' + e.message + '\n\n' + (e.filename||'') + ':' + e.lineno;
});
</script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;


// ── Icon helper ───────────────────────────────────────────────────────────────
function Icon(name, size = 20, opts = {}) {
  const node = window.lucide && window.lucide.icons && window.lucide.icons[name];
  if (!node) return null;
  const walk = (m) => {
    const tag = m[0], attrs = { ...m[1] || {} }, kids = m[2] || [];
    if (tag === 'svg') {
      attrs.width = size; attrs.height = size;
      if (opts.stroke) attrs.stroke = opts.stroke;
      if (opts.fill) attrs.fill = opts.fill;
      if (opts.sw) attrs['stroke-width'] = opts.sw;
    }
    return `<${tag} ${Object.entries(attrs).map(([k,v]) => `${k}="${v}"`).join(' ')}>${kids.map(walk).join('')}</${tag}>`;
  };
  return <span style={{display:'inline-flex',flex:'0 0 auto'}} dangerouslySetInnerHTML={{__html:walk(node)}} />;
}

// Rummage logomark — a map-pin/price-tag mashup (the "find things nearby" +
// "sale" ideas in one shape), in the app's own olive/teal palette rather
// than a generic Lucide icon standing in for the brand.
function RummageMark({ size = 64 }) {
  const gid = 'rmgMarkGrad';
  return (
    <svg width={size} height={size} viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rummage">
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
          <stop offset="0" stopColor="var(--brand-600)" />
          <stop offset="1" stopColor="var(--brand-400)" />
        </linearGradient>
      </defs>
      <path d="M32 4C18.7 4 8 14.6 8 27.7c0 6.2 3 12 7.4 17.6 3.9 4.9 8.8 9.2 12.3 12.1a6 6 0 0 0 8.6 0c3.5-2.9 8.4-7.2 12.3-12.1C53 39.7 56 33.9 56 27.7 56 14.6 45.3 4 32 4Z" fill={`url(#${gid})`} />
      <circle cx="32" cy="26.5" r="10.5" fill="var(--paper)" />
      <circle cx="32" cy="26.5" r="4" fill="var(--tape-500)" />
    </svg>
  );
}

// Full lockup: mark + "Rummage" wordmark, for splash/auth-style screens.
function RummageLogo({ markSize = 56, textSize = 26 }) {
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8}}>
      <RummageMark size={markSize} />
      <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:textSize,letterSpacing:'-0.03em',color:'var(--ink-900)'}}>Rummage</div>
    </div>
  );
}

// ── Sale timing helpers ───────────────────────────────────────────────────────
function parseSaleStart(dateLabel, timeLabel) {
  if (!timeLabel) return null;
  const tMatch = timeLabel.match(/(\d+)(?::(\d+))?\s*(am|pm)/i);
  if (!tMatch) return null;
  let h = parseInt(tMatch[1]);
  const m = tMatch[2] ? parseInt(tMatch[2]) : 0;
  const ap = tMatch[3].toLowerCase();
  if (ap === 'pm' && h !== 12) h += 12;
  if (ap === 'am' && h === 12) h = 0;
  const MO = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const DY = {sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
  const now = new Date();
  const full = dateLabel && dateLabel.match(/\w+,\s+(\w+)\s+(\d+)/);
  if (full) {
    const mo = MO[full[1].toLowerCase().slice(0,3)];
    if (mo !== undefined) {
      const d = new Date(now.getFullYear(), mo, parseInt(full[2]), h, m, 0);
      // Only assume "next year" if the date is clearly a past day, not just
      // today with a start time earlier than the current time (i.e. a sale
      // that's already underway today is still today, not next year).
      if (d.getTime() < now.getTime() - 24*60*60*1000) d.setFullYear(now.getFullYear() + 1);
      return d;
    }
  }
  const dm = dateLabel && dateLabel.match(/^(\w{3})/i);
  if (dm) {
    const dn = DY[dm[1].toLowerCase()];
    if (dn !== undefined) {
      let diff = dn - now.getDay();
      if (diff < 0) diff += 7;
      if (diff === 0 && now.getHours() >= h) diff = 7;
      return new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff, h, m, 0);
    }
  }
  return null;
}

// Whether a sale is happening right now, computed from its actual date/time
// rather than a static flag (which would go stale the moment time passes).
function isSaleLive(dateLabel, timeLabel) {
  const start = parseSaleStart(dateLabel, timeLabel);
  if (!start) return false;
  const allTimes = (timeLabel || '').match(/(\d+)(?::(\d+))?\s*(am|pm)/gi) || [];
  let end = null;
  if (allTimes.length >= 2) {
    const last = allTimes[allTimes.length - 1].match(/(\d+)(?::(\d+))?\s*(am|pm)/i);
    if (last) {
      let h = parseInt(last[1]), m = last[2] ? parseInt(last[2]) : 0;
      const ap = last[3].toLowerCase();
      if (ap === 'pm' && h !== 12) h += 12;
      if (ap === 'am' && h === 12) h = 0;
      end = new Date(start); end.setHours(h, m, 0, 0);
      if (end <= start) end.setDate(end.getDate() + 1);
    }
  }
  const now = Date.now();
  if (now < start.getTime()) return false;
  return end ? now < end.getTime() : false;
}

const SORT_MO_IDX = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
// Sortable timestamp for a sale's start date, parsed from its display label
// (e.g. "Sat, Jul 4 – Sun, Jul 5" → the Jul 4 start). Sales with no
// parseable date sort to the very end rather than the very start.
function saleSortDate(dateLabel) {
  const label = dateLabel || '';
  if (!label) return Infinity;
  const hits = [...label.matchAll(/([A-Za-z]{3,9})\s+(\d{1,2})(?:,?\s*(\d{4}))?/g)]
    .filter(m => SORT_MO_IDX[m[1].toLowerCase().slice(0,3)] !== undefined);
  if (!hits.length) return Infinity;
  const m = hits[0];
  const mo = SORT_MO_IDX[m[1].toLowerCase().slice(0,3)];
  const day = parseInt(m[2]);
  const year = m[3] ? parseInt(m[3]) : new Date().getFullYear();
  return new Date(year, mo, day).getTime();
}

// ── Constants ─────────────────────────────────────────────────────────────────
const CAT = {
  estate: { label:'Estate Sale', glyph:'Armchair' },
  yard:   { label:'Yard Sale',   glyph:'Tent' },
  moving: { label:'Moving Sale', glyph:'Truck' },
};
const FILTER_TYPES = [
  {key:'estate',label:'Estate'},{key:'yard',label:'Yard'},
  {key:'moving',label:'Moving'},
];

// Sale `items` may be plain strings (legacy/scraped) or richer objects — normalize to one shape.
function normalizeItem(it, i, saleId) {
  if (typeof it === 'string') {
    return { id:`${saleId}-item-${i}`, name:it, category:null, price:null, originalPrice:null, sold:false, image:null, condition:null, size:null, description:null };
  }
  return {
    id: it.id || `${saleId}-item-${i}`, name: it.name || it.label || 'Item',
    category: it.category || null, price: it.price ?? null, originalPrice: it.originalPrice ?? null,
    sold: !!it.sold, image: it.image || null, condition: it.condition || null,
    size: it.size || null, description: it.description || null,
  };
}

const AVATARS = [
  {id:'a1',  emoji:'/assets/avatars/avatar_1_1.png', label:'Avatar 1'},
  {id:'a2',  emoji:'/assets/avatars/avatar_1_2.png', label:'Avatar 2'},
  {id:'a3',  emoji:'/assets/avatars/avatar_1_3.png', label:'Avatar 3'},
  {id:'a4',  emoji:'/assets/avatars/avatar_2_1.png', label:'Avatar 4'},
  {id:'a5',  emoji:'/assets/avatars/avatar_2_2.png', label:'Avatar 5'},
  {id:'a6',  emoji:'/assets/avatars/avatar_2_3.png', label:'Avatar 6'},
  {id:'a7',  emoji:'/assets/avatars/avatar_3_1.png', label:'Avatar 7'},
  {id:'a8',  emoji:'/assets/avatars/avatar_3_2.png', label:'Avatar 8'},
  {id:'a9',  emoji:'/assets/avatars/avatar_3_3.png', label:'Avatar 9'},
  {id:'a10', emoji:'/assets/avatars/avatar_4_1.png', label:'Avatar 10'},
  {id:'a11', emoji:'/assets/avatars/avatar_4_2.png', label:'Avatar 11'},
  {id:'a12', emoji:'/assets/avatars/avatar_4_3.png', label:'Avatar 12'},
  {id:'a13', emoji:'/assets/avatars/avatar_5_1.png', label:'Avatar 13'},
  {id:'a14', emoji:'/assets/avatars/avatar_5_2.png', label:'Avatar 14'},
  {id:'a15', emoji:'/assets/avatars/avatar_5_3.png', label:'Avatar 15'},
  ...Array.from({length:16}, (_,i) => ({id:`a${16+i}`, emoji:`/assets/avatars/avatar_6_${i+1}.png`, label:`Avatar ${16+i}`})),
  ...Array.from({length:12}, (_,i) => ({id:`a${32+i}`, emoji:`/assets/avatars/avatar_7_${i+1}.png`, label:`Avatar ${32+i}`})),
];

// No mock data — all listings come from the live API
const ALL_SALES = [];

// ── Design system components ──────────────────────────────────────────────────
function Btn({ variant='primary', size='default', fullWidth, leadingIcon, onClick, children, style }) {
  const base = {
    display:'inline-flex', alignItems:'center', justifyContent:'center',
    gap:8, border:'none', cursor:'pointer', fontFamily:'var(--font-sans)',
    fontWeight:700, letterSpacing:'-0.01em', whiteSpace:'nowrap',
    transition:`all var(--dur-fast) var(--ease-out)`,
    borderRadius:'var(--radius-lg)', width: fullWidth?'100%':'auto',
  };
  const sz = size==='lg' ? {height:56,padding:'0 32px',fontSize:17}
           : size==='sm' ? {height:36,padding:'0 16px',fontSize:13}
           : {height:48,padding:'0 24px',fontSize:15};
  const v = variant==='primary'  ? {background:'var(--ink-900)',color:'#FFFFFF',border:'1px solid var(--ink-200)',boxShadow:'0 6px 20px rgba(33,29,23,.28)'}
          : variant==='secondary'? {background:'var(--ink-900)',color:'#FFFFFF',border:'1px solid var(--ink-200)'}
          : {background:'var(--ink-900)',color:'#FFFFFF',border:'1px solid var(--ink-200)'};
  return (
    <button onClick={onClick} style={{...base,...sz,...v,...style}}>
      {leadingIcon && <span style={{display:'inline-flex'}}>{leadingIcon}</span>}
      {children}
    </button>
  );
}

function Card({ padded=true, interactive, onClick, children, style, elevation }) {
  const shadow = elevation==='lg' ? 'var(--shadow-lg)' : elevation==='md' ? 'var(--shadow-md)' : 'var(--shadow-sm)';
  return (
    <div onClick={onClick} style={{
      background:'var(--surface-card)', border:'none',
      borderRadius:'var(--radius-xl)', boxShadow:shadow,
      padding: padded ? 20 : 0, overflow:'hidden',
      position:'relative', zIndex:0, isolation:'isolate',
      cursor: interactive ? 'pointer' : 'default',
      transition: interactive ? 'box-shadow var(--dur-fast), transform var(--dur-fast)' : 'none',
      ...style,
    }}>
      {children}
    </div>
  );
}

function Badge({ tone, children }) {
  const colors = tone==='live'
    ? {background:'var(--success-bg)',color:'var(--success)'}
    : tone==='success'
    ? {background:'var(--success-bg)',color:'var(--success)'}
    : tone==='accent'
    ? {background:'var(--accent)',color:'#fff'}
    : {background:'var(--surface-sunken)',color:'var(--text-secondary)'};
  return (
    <span style={{
      display:'inline-flex', alignItems:'center', gap:4,
      padding:'2px 8px', borderRadius:'var(--radius-pill)',
      fontFamily:'var(--font-sans)', fontWeight:700, fontSize:'var(--text-2xs)',
      letterSpacing:'0.04em', textTransform:'uppercase', ...colors,
    }}>
      {tone==='live' && <span style={{width:6,height:6,borderRadius:'50%',background:'var(--success)',display:'inline-block'}} />}
      {children}
    </span>
  );
}

// A rotated masking-tape sticker rather than a rounded pill — the one
// deliberately "physical" detail that shows up on every card.
function SaleTypeTag({ type, size }) {
  return (
    <span style={{
      display:'inline-flex', alignItems:'center', gap:4,
      padding: size==='sm' || size==='xs' ? '2px 8px' : '3px 10px',
      borderRadius:'var(--radius-xs)',
      background:'var(--tape-500)', color:'var(--ink-900)',
      fontFamily:'var(--font-mono)', fontWeight:700,
      fontSize: size==='xs' ? 10 : size==='sm' ? 11 : 12,
      letterSpacing:'0.03em', textTransform:'uppercase',
      transform:'rotate(-2deg)', boxShadow:'0 1px 3px rgba(33,29,23,.25)',
    }}>
      {Icon(CAT[type]?.glyph || 'Tag', size==='sm'||size==='xs' ? 11 : 13, {stroke:'currentColor',sw:2})}
      {CAT[type]?.label || type}
    </span>
  );
}

function Avatar({ name='?', size=44, emoji=null }) {
  if (emoji) {
    const isImg = typeof emoji === 'string' && (emoji.startsWith('/') || emoji.startsWith('http') || /\.(png|jpe?g|webp|svg)$/i.test(emoji));
    return (
      <div style={{
        width:size, height:size, borderRadius:'50%', flexShrink:0,
        background:'var(--ink-100)',
        border:'none', overflow:'hidden',
        display:'flex', alignItems:'center', justifyContent:'center',
        fontSize: Math.round(size * 0.52),
        lineHeight:1, userSelect:'none',
      }}>
        {isImg ? <img src={emoji} alt={name} style={{width:'100%',height:'100%',objectFit:'cover'}} /> : emoji}
      </div>
    );
  }
  const initials = name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();

// ── Leaflet real map ──────────────────────────────────────────────────────────
const TYPE_COLOR_HEX = {
  estate:'#2C4A7C', yard:'#3F5E3A', moving:'#8A5A12',
};

function RealMap({ sales, selectedId, onSelect, centerLat=33.9792, centerLng=-118.0328, zoom=13, interactive=true }) {
  const containerRef = useRef(null);
  const mapRef       = useRef(null);
  const markersRef   = useRef({});

  // Init map once on mount
  useEffect(() => {
    const L = window.L;
    if (!L || !containerRef.current || mapRef.current) return;
    const map = L.map(containerRef.current, {
      center: [centerLat, centerLng], zoom,
      zoomControl: false, attributionControl: false,
      scrollWheelZoom: interactive, dragging: interactive,
      touchZoom: interactive, doubleClickZoom: interactive,
      boxZoom: false, keyboard: false,
    });
    L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
      { maxZoom: 19, subdomains: 'abcd' }
    ).addTo(map);
    if (interactive) L.control.zoom({ position: 'bottomright' }).addTo(map);
    // Blue user-location dot at center
    L.circleMarker([centerLat, centerLng], {
      radius: 7, fillColor: '#3B82F6', fillOpacity: 1,
      color: '#fff', weight: 2.5,
    }).addTo(map);
    mapRef.current = map;
    return () => { map.remove(); mapRef.current = null; };
  }, []);

  // Update markers whenever sales or selection changes
  useEffect(() => {
    const L = window.L;
    if (!L || !mapRef.current) return;
    const map = mapRef.current;
    // Remove old markers
    Object.values(markersRef.current).forEach(m => m.remove());
    markersRef.current = {};

    const points = [];
    sales.forEach(s => {
      if (s.lat == null || s.lng == null) return;
      points.push([s.lat, s.lng]);
      const sel   = s.id === selectedId;
      const color = TYPE_COLOR_HEX[s.type] || '#888';
      const size  = sel ? 38 : 28;
      const icon  = L.divIcon({
        className: '',
        html: `<div style="
          width:${size}px;height:${size}px;
          border-radius:50% 50% 50% 0;transform:rotate(45deg);
          background:${sel ? color : '#fff'};border:2.5px solid ${color};
          box-shadow:${sel ? '0 4px 14px rgba(0,0,0,.35)' : '0 2px 6px rgba(0,0,0,.22)'};
          transition:all .18s ease;
        "></div>`,
        iconSize:   [size, size],
        iconAnchor: [size / 2, size],
      });
      const marker = L.marker([s.lat, s.lng], { icon, zIndexOffset: sel ? 1000 : 0 })
        .addTo(map)
        .on('click', () => onSelect?.(s.id));
      markersRef.current[s.id] = marker;
    });

    if (selectedId && markersRef.current[selectedId]) {
      // A specific pin is selected — pan to just that one.
      const target = sales.find(s => s.id === selectedId);
      if (target?.lat && interactive) {
        map.panTo([target.lat, target.lng], { animate: true, duration: 0.4 });
      }
    } else if (interactive && points.length) {
      // Nothing selected — fit the view so every pin is visible at once,
      // instead of opening at a fixed zoom/center that can leave most of a
      // wide-radius search off-screen.
      const bounds = L.latLngBounds([...points, [centerLat, centerLng]]);
      map.fitBounds(bounds, { padding: [48, 48], maxZoom: 15 });
    }
  }, [sales, selectedId]);

  if (!window.L) return <FauxMap sales={sales} selectedId={selectedId} onSelect={onSelect} />;
  return <div ref={containerRef} style={{position:'absolute',inset:0}} />;
}

function proxyImgUrl(url) {
  try {
    const h = new URL(url).hostname;
    if (h === 'estatesales.org' || h.endsWith('.estatesales.org') ||
        h === 'estatesales.net' || h.endsWith('.estatesales.net') ||
        h.endsWith('.amazonaws.com') || h.endsWith('.cloudfront.net') ||
        h.endsWith('.imgix.net') || h.endsWith('.tlcdn.workers.dev') || h === 'eso-cdn.tlcdn.workers.dev' ||
        h === 'images.craigslist.org' || h === 'maps.geoapify.com' ||
        h.endsWith('.fbcdn.net') || h === 'fbcdn.net' || h.endsWith('.facebook.com'))
      return `/api/img?url=${encodeURIComponent(url)}`;
  } catch(_) {}
  return url;
}

// ── Countdown hook ────────────────────────────────────────────────────────────
function useCountdown(dateLabel, timeLabel) {
  const [info, setInfo] = useState({label:'', status:'upcoming'});
  useEffect(() => {
    const start = parseSaleStart(dateLabel, timeLabel);
    if (!start) return;
    const allTimes = (timeLabel||'').match(/(\d+)(?::(\d+))?\s*(am|pm)/gi) || [];
    let end = null;
    if (allTimes.length >= 2) {
      const last = allTimes[allTimes.length - 1].match(/(\d+)(?::(\d+))?\s*(am|pm)/i);
      if (last) {
        let h = parseInt(last[1]), m = last[2] ? parseInt(last[2]) : 0;
        const ap = last[3].toLowerCase();
        if (ap==='pm' && h!==12) h+=12;
        if (ap==='am' && h===12) h=0;
        end = new Date(start); end.setHours(h,m,0,0);
        if (end <= start) end.setDate(end.getDate()+1);
      }
    }
    const calc = () => {
      const now = Date.now(), startMs = start.getTime();
      const diff = startMs - now;
      if (diff > 0) {
        const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000);
        const label = h>=48 ? 'Starts in '+(Math.floor(h/24))+'d'
                    : h>0   ? 'Starts in '+h+'h '+m+'m'
                             : m>0 ? 'Starts in '+m+'m' : 'Starting soon';
        setInfo({label, status:'upcoming'});
      } else if (end && now < end.getTime()) {
        const rem = end.getTime()-now;
        const h = Math.floor(rem/3600000), m = Math.floor((rem%3600000)/60000);
        const label = h>0 ? 'Ends in '+h+'h '+m+'m' : m>0 ? 'Ends in '+m+'m' : 'Ending soon';
        setInfo({label, status:'live'});
      } else {
        setInfo({label:'Ended', status:'ended'});
      }
    };
    calc();
    const t = setInterval(calc, 60000);
    return () => clearInterval(t);
  }, [dateLabel, timeLabel]);
  return info;
}

function PhotoGallery({ images, type, height=260, onBack, saved, onSave, sale, onShare }) {
  const GRADS = {
    estate:['linear-gradient(135deg,#DCE4EF 0%,#B7C7DE 100%)','linear-gradient(135deg,#C7D3E5 0%,#7C97BE 100%)','linear-gradient(135deg,#A8BEDA 0%,#2C4A7C 100%)'],
    yard:  ['linear-gradient(135deg,#E1E8D6 0%,#C1D0AB 100%)','linear-gradient(135deg,#D0DCBB 0%,#8FA877 100%)','linear-gradient(135deg,#B7CBA0 0%,#3F5E3A 100%)'],
    moving:['linear-gradient(135deg,#F1E0B8 0%,#E8CD8E 100%)','linear-gradient(135deg,#EDD7A0 0%,#D9A94A 100%)','linear-gradient(135deg,#E0C070 0%,#8A5A12 100%)'],
  };
  const hasCoords = sale?.lat != null && sale?.lng != null;
  const slides = (images && images.length) ? images : (hasCoords ? ['__MAP__'] : (GRADS[type]||GRADS.estate));
  const total = slides.length;
  const [idx, setIdx] = useState(0);
  const [dragStart, setDragStart] = useState(null);
  const [dragDelta, setDragDelta] = useState(0);
  const [dragging, setDragging] = useState(false);
  const thumbsRef = useRef(null);
  const clamp = n => Math.max(0, Math.min(total-1, n));
  const isUrl = s => typeof s==='string' && (s.startsWith('http') || s.startsWith('data:'));

  const onTouchStart = e => { setDragStart(e.touches[0].clientX); setDragging(true); };
  const onTouchMove  = e => { if (dragStart==null) return; setDragDelta(e.touches[0].clientX - dragStart); };
  const onTouchEnd   = () => {
    if (Math.abs(dragDelta) > 44) setIdx(i => clamp(i + (dragDelta<0?1:-1)));
    setDragStart(null); setDragDelta(0); setDragging(false);
  };

  // Scroll active thumbnail into view — scroll only the strip, not outer containers
  React.useEffect(() => {
    if (!thumbsRef.current || !isUrl(slides[0])) return;
    const el = thumbsRef.current.children[idx];
    if (!el) return;
    const strip = thumbsRef.current;
    const target = el.offsetLeft - (strip.offsetWidth - el.offsetWidth) / 2;
    strip.scrollTo({ left: target, behavior: 'smooth' });
  }, [idx]);

  const hasPhotos = isUrl(slides[0]);

  return (
    <div style={{flexShrink:0, width:'100%', overflow:'hidden'}}>
      {/* Main carousel */}
      <div style={{position:'relative',height,overflow:'hidden',background:'var(--paper-2)'}}>
        <div
          onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
          style={{display:'flex',width:total*100+'%',height:'100%',
            transform:'translateX(calc('+(-idx*(100/total))+'% + '+(dragDelta/total)+'px))',
            transition:dragging?'none':'transform .32s var(--ease-out)',userSelect:'none'}}>
          {slides.map((slide,i) => (
            <div key={i} style={{width:(100/total)+'%',height:'100%',flexShrink:0,overflow:'hidden',
              background:isUrl(slide)?'#111':'transparent'}}>
              {isUrl(slide)
                ? <SaleImg src={slide} height="100%" type={type} blurb={sale?.blurb} title={sale?.title} style={{width:'100%',height:'100%',pointerEvents:'none'}} />
                : slide==='__MAP__'
                ? <div style={{width:'100%',height:'100%',pointerEvents:'none'}}><MapPlaceholder height="100%" width="100%" lat={sale.lat} lng={sale.lng} type={type} id={sale.id} /></div>
                : <div style={{width:'100%',height:'100%',background:slide,display:'flex',alignItems:'flex-end',padding:'0 20px 24px',boxSizing:'border-box'}}>
                    {sale?.blurb ? <p style={{margin:0,fontFamily:'var(--font-sans)',fontSize:14,lineHeight:1.5,color:'rgba(0,0,0,.65)',fontWeight:500,display:'-webkit-box',WebkitLineClamp:4,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{sale.blurb}</p> : null}
                  </div>}
            </div>
          ))}
        </div>
        <div style={{position:'absolute',inset:0,background:'linear-gradient(180deg,rgba(0,0,0,.32) 0%,transparent 30%,transparent 65%,rgba(0,0,0,.18) 100%)',pointerEvents:'none'}} />
        <div style={{position:'absolute',top:'var(--safe-top)',left:14,right:14,display:'flex',justifyContent:'space-between'}}>
          <IconButton icon={Icon('ChevronLeft',22)} shape="circle" aria-label="Back" onClick={onBack} />
          <div style={{display:'flex',gap:8}}>
            <IconButton icon={Icon('Share',19)} shape="circle" aria-label="Share" onClick={()=>onShare && onShare()} />
            <IconButton icon={Icon('Heart',19,sale&&sale.saved?{fill:'var(--coral)',stroke:'var(--coral)'}:{})} shape="circle" aria-label="Save" onClick={()=>onSave&&onSave()} />
          </div>
        </div>
        {idx>0 && (
          <button onClick={()=>setIdx(i=>clamp(i-1))} style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',width:34,height:34,borderRadius:'50%',background:'rgba(255,255,255,.88)',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'var(--shadow-md)'}}>
            {Icon('ChevronLeft',18,{stroke:'var(--ink-900)'})}
          </button>
        )}
        {idx<total-1 && (
          <button onClick={()=>setIdx(i=>clamp(i+1))} style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',width:34,height:34,borderRadius:'50%',background:'rgba(255,255,255,.88)',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'var(--shadow-md)'}}>
            {Icon('ChevronRight',18,{stroke:'var(--ink-900)'})}
          </button>
        )}
        {hasPhotos && (
          <div style={{position:'absolute',bottom:10,right:14,background:'rgba(0,0,0,.52)',backdropFilter:'blur(4px)',color:'#fff',borderRadius:'var(--radius-pill)',padding:'3px 10px',fontSize:11,fontWeight:700,fontFamily:'var(--font-mono)'}}>
            {idx+1} / {total}
          </div>
        )}
      </div>

      {/* Thumbnail strip — only shown when there are real photos */}
      {hasPhotos && total > 1 && (
        <div ref={thumbsRef} style={{display:'flex',gap:4,overflowX:'auto',padding:'6px 8px',background:'var(--surface-app)',scrollbarWidth:'none',WebkitOverflowScrolling:'touch'}}>
          {slides.map((slide, i) => (
            <button key={i} onClick={()=>setIdx(i)} style={{
              flexShrink:0, width:62, height:62, borderRadius:8, overflow:'hidden', padding:0, border:'none',
              outline: i===idx ? '2.5px solid var(--accent)' : '2.5px solid transparent',
              opacity: i===idx ? 1 : 0.62, cursor:'pointer', transition:'opacity .18s,outline .18s',
            }}>
              <SaleImg src={slide} height={62} type={type} />
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function ExploreScreen({ sales, onOpenSale, onOpenFilters, onToggleSave, radiusMi, zip, apiStatus, coverageMessage,
    activeTypes, setActiveTypes, openNow, setOpenNow, withinTwoWeeks, setWithinTwoWeeks, keyword, onClearKeyword, tripIds=[], onToggleTrip }) {
  const [view, setView] = useState('list');
  const [selected, setSelected] = useState(null);
  const [sortBy, setSortBy] = useState('date'); // 'distance' | 'date'
  const selectedTypes = Object.keys(activeTypes).filter(k => activeTypes[k] === true);
  // The ±2 day / 2-week date windowing itself happens upstream in App's
  // allSales filter (withinTwoWeeks only widens that window's future edge) —
  // this screen just applies type/open-now/keyword on top of what it's given.
  // Both modes are a compound sort — the toggle just picks which criterion
  // leads. "Closest" ranks by distance from your account's ZIP first, then
  // breaks ties by soonest date; "Soonest" is the reverse.
  const typeFiltered = sales.filter(s => selectedTypes.length === 0 || selectedTypes.includes(s.type));
  const shown = typeFiltered
    .filter(s => !openNow || isSaleLive(s.dateLabel, s.timeLabel))
    .slice().sort((a, b) => {
      const distDiff = (a.distanceMi ?? 999) - (b.distanceMi ?? 999);
      const dateDiff = saleSortDate(a.dateLabel) - saleSortDate(b.dateLabel);
      return sortBy === 'date' ? (dateDiff || distDiff) : (distDiff || dateDiff);
    });
  const sel = shown.find(s=>s.id===selected) || null;
  // Live count computed independent of the openNow filter itself, so the
  // banner below can say "N sales live now" and offer to apply the filter,
  // rather than only being able to describe results after it's already on.
  const liveCount = typeFiltered.filter(s => isSaleLive(s.dateLabel, s.timeLabel)).length;

          </div>
          <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4}}>
            <span style={{fontSize:14,fontWeight:800,color:'var(--brand-600)',background:'var(--brand-50)',padding:'7px 14px',borderRadius:'var(--radius-pill)',boxShadow:'0 2px 10px rgba(78,79,42,.18)'}}>{radiusMi} mi</span>

function SavedScreen({ sales, onOpenSale, onToggleSave, tripIds=[], onToggleTrip }) {
  const [tab, setTab] = useState('upcoming');
  const saved = sales.filter(s=>s.saved);
  const now = new Date();
  const MO = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};

  const saleEndDate = (s) => {
    const label = s.dateLabel || '';
    const hits = [...label.matchAll(/([A-Za-z]{3,9})\s+(\d{1,2})(?:,?\s*(\d{4}))?/g)]
      .filter(m => MO[m[1].toLowerCase().slice(0,3)] !== undefined);
    if (hits.length) {
      const m = hits[hits.length-1];
      const mo = MO[m[1].toLowerCase().slice(0,3)];
      const day = parseInt(m[2]);
      const yr = m[3] ? parseInt(m[3]) : now.getFullYear();
      return new Date(yr, mo, day, 23, 59, 59);
    }
    return null;
  };

  const upcoming  = saved.filter(s => { const d=saleEndDate(s); return !d || d >= now; });
  const past      = saved.filter(s => { const d=saleEndDate(s); return d && d < now; });
  const happening = upcoming.filter(s => isSaleLive(s.dateLabel, s.timeLabel));
  const shown     = tab==='happening' ? happening : tab==='past' ? past : upcoming;

  const EmptyState = ({icon, title, body}) => (
    <div style={{textAlign:'center',padding:'48px 28px',background:'var(--surface-card)',borderRadius:'var(--radius-2xl)',boxShadow:'var(--shadow-sm)'}}>
      <div style={{fontSize:44,marginBottom:12}}>{icon}</div>
      <p style={{fontWeight:800,fontSize:20,color:'var(--ink-900)',margin:'0 0 8px',letterSpacing:'-0.02em'}}>{title}</p>
      <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',margin:0,lineHeight:1.6}}>{body}</p>
    </div>
  );

  return (
    <div style={{position:'absolute',inset:0,overflowY:'auto',background:'var(--surface-app)'}}>
      <div style={{paddingTop:'var(--safe-top)'}} />
      <div style={{padding:'8px 20px 14px'}}>
        <div className="rmg-eyebrow" style={{marginBottom:4}}>{saved.length} {saved.length===1?'sale':'sales'} saved</div>
        <h1 style={{fontSize:36,fontWeight:900,letterSpacing:'-0.03em',color:'var(--ink-900)',lineHeight:1.05}}>Saved Sales</h1>
        <div style={{marginTop:16}}>
          <SegmentedControl
            options={[
              {value:'upcoming', label:`Upcoming${upcoming.length ? ` · ${upcoming.length}` : ''}`},
              {value:'happening',label:`Now${happening.length ? ` · ${happening.length}` : ''}`},
              {value:'past',     label:`Past${past.length     ? ` · ${past.length}`     : ''}`},
            ]}
            value={tab} onChange={setTab} style={{width:'100%',display:'flex'}} />
        </div>
      </div>
      <div style={{padding:'4px 20px 120px',display:'flex',flexDirection:'column',gap:14}}>
        {saved.length===0 ? (
          <EmptyState icon="🔖" title="Nothing saved yet" body="Tap the heart on any sale to save it here for later." />
        ) : shown.length===0 ? (
          tab==='happening'
            ? <EmptyState icon="⏳" title="None happening now" body="Check the Upcoming tab for sales starting soon." />
            : tab==='past'
            ? <EmptyState icon="📦" title="No past sales" body="Sales you've attended will appear here." />
            : <EmptyState icon="🗓️" title="No upcoming saves" body="Heart a sale on the Explore tab to save it." />
        ) : shown.map(s=>(
          <SaleCard key={s.id} id={s.id} type={s.type} title={s.title} address={s.address} distanceMi={s.distanceMi}
            dateLabel={s.dateLabel} timeLabel={s.timeLabel} photoCount={s.photoCount} images={s.images} blurb={s.blurb}
            lat={s.lat} lng={s.lng}
            saved={s.saved} onSave={()=>onToggleSave(s.id)} onClick={()=>onOpenSale(s.id)}
            inTrip={tripIds.includes(s.id)} onToggleTrip={onToggleTrip ? ()=>onToggleTrip(s.id) : undefined} />
        ))}
      </div>
    </div>
  );
}

// ── Auth Screen ───────────────────────────────────────────────────────────────
function AuthScreen({ onAuth }) {
  const [mode, setMode]         = useState('signin'); // 'signin' | 'signup'
  const [email, setEmail]       = useState('');
  const [password, setPassword] = useState('');
  const [confirm, setConfirm]   = useState('');
  const [fullName, setFullName] = useState('');
  const [selAvatar, setSelAvatar] = useState(AVATARS[0].id);
  const [showPw, setShowPw]         = useState(false);
  const [errors, setErrors]         = useState({});
  const [loading, setLoading]       = useState(false);
  const [authStep, setAuthStep]     = useState('form'); // 'form' | 'verify'
  const [codeDigits, setCodeDigits] = useState(['','','','','','']);
  const [codeError, setCodeError]   = useState('');
  const [resendTimer, setResendTimer] = useState(0);
  const codeRefs = [useRef(),useRef(),useRef(),useRef(),useRef(),useRef()];

  useEffect(() => {
    if (resendTimer <= 0) return;
    const t = setTimeout(() => setResendTimer(n => n-1), 1000);
    return () => clearTimeout(t);
  }, [resendTimer]);

  const validate = () => {
    const e = {};
    if (!fullName.trim() && mode==='signup') e.fullName = 'Name is required';
    if (!email.trim())    e.email    = 'Email is required';
    else if (!/\S+@\S+\.\S+/.test(email)) e.email = 'Enter a valid email';
    if (!password)        e.password = 'Password is required';
    else if (password.length < 6) e.password = 'At least 6 characters';
    if (mode==='signup' && password !== confirm) e.confirm = "Passwords don't match";
    return e;
  };

  const sendCode = () => {
    setResendTimer(30);
    return fetch('/api/send-verification', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: email.trim() }),
    }).then(r => r.json());
  };

  const submit = () => {
    const e = validate();
    if (Object.keys(e).length) { setErrors(e); return; }
    if (mode === 'signin') {
      setLoading(true);
      setTimeout(() => {
        setLoading(false);
        onAuth({ name: email.split('@')[0], email: email.trim(), avatar: AVATARS.find(a=>a.id===selAvatar)?.emoji || null });
      }, 600);
      return;
    }
    setLoading(true);
    sendCode().then(res => {
      setLoading(false);
      if (res.error) { setErrors({ email: res.error }); return; }
      setAuthStep(res.devMode ? 'verify-dev' : 'verify');
      setTimeout(() => codeRefs[0].current?.focus(), 100);
    }).catch(() => {
      setLoading(false);
      setErrors({ email: 'Could not reach the server. Make sure server.js is running on port 3002.' });
    });
  };

  const onDigit = (i, val) => {
    const d = val.replace(/\D/g,'').slice(-1);
    const next = [...codeDigits]; next[i] = d; setCodeDigits(next); setCodeError('');
    if (d && i < 5) setTimeout(() => codeRefs[i+1].current?.focus(), 0);
    if (!d && i > 0) setTimeout(() => codeRefs[i-1].current?.focus(), 0);
  };

  const onCodeKey = (i, e) => {
    if (e.key==='Backspace' && !codeDigits[i] && i>0) codeRefs[i-1].current?.focus();
  };

  const onCodePaste = (e) => {
    const pasted = e.clipboardData.getData('text').replace(/\D/g,'').slice(0,6);
    if (pasted.length===6) { setCodeDigits(pasted.split('')); codeRefs[5].current?.focus(); }
    e.preventDefault();
  };

  const verifyCode = () => {
    const code = codeDigits.join('');
    if (code.length < 6) { setCodeError('Enter all 6 digits'); return; }
    setLoading(true);
    fetch('/api/check-code', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: email.trim(), code }),
    }).then(r=>r.json()).then(res => {
      setLoading(false);
      if (res.error) { setCodeError(res.error); setCodeDigits(['','','','','','']); setTimeout(()=>codeRefs[0].current?.focus(),0); return; }
      onAuth({ name: fullName.trim(), email: email.trim(), avatar: AVATARS.find(a=>a.id===selAvatar)?.emoji || null });
    }).catch(() => { setLoading(false); setCodeError('Could not verify — is the backend server running?'); });
  };

  if (authStep === 'verify' || authStep === 'verify-dev') {
    const isDevMode = authStep === 'verify-dev';
    return (
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'var(--surface-app)',padding:'32px 24px',textAlign:'center'}}>
        <div style={{width:72,height:72,borderRadius:22,background:'linear-gradient(135deg,var(--brand-500),var(--brand-300))',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:20,boxShadow:'0 8px 32px rgba(78,79,42,.30)'}}>
          {Icon('Mail',34,{stroke:'#fff',sw:1.75})}
        </div>
        <h1 style={{fontSize:26,fontWeight:900,letterSpacing:'-0.03em',color:'var(--ink-900)',margin:'0 0 8px'}}>Check your email</h1>
        <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',lineHeight:1.6,margin:'0 0 28px',maxWidth:280}}>
          {isDevMode
            ? <>No SMTP configured — check the <strong style={{color:'var(--ink-900)'}}>server.js console</strong> for your code.</>
            : <>We sent a 6-digit code to<br/><strong style={{color:'var(--ink-900)'}}>{email}</strong></>
          }
        </p>

        {/* 6-digit code input */}
        <div style={{display:'flex',gap:8,marginBottom:12}} onPaste={onCodePaste}>
          {codeDigits.map((d,i) => (
            <input key={i} ref={codeRefs[i]} type="text" inputMode="numeric" maxLength={1} value={d}
              onChange={e=>onDigit(i,e.target.value)} onKeyDown={e=>onCodeKey(i,e)}
              style={{width:44,height:54,textAlign:'center',fontSize:24,fontWeight:800,
                fontFamily:'var(--font-mono)',color:'var(--ink-900)',
                background:'var(--surface-raised)',
                border:'none',
                boxShadow: codeError ? '0 0 0 2px #DC2626' : d ? 'var(--shadow-focus)' : 'var(--shadow-sm)',
                borderRadius:'var(--radius-lg)',outline:'none',
                transition:'border-color var(--dur-fast), box-shadow var(--dur-fast)'}} />
          ))}
        </div>
        {codeError && <div style={{fontFamily:'var(--font-sans)',fontSize:13,color:'#DC2626',marginBottom:12}}>{codeError}</div>}

        <Btn variant="primary" size="lg" fullWidth onClick={verifyCode}
          style={{marginBottom:14,opacity:loading?.6:1,pointerEvents:loading?'none':'auto'}}
          leadingIcon={loading?Icon('Loader',18,{stroke:'#fff'}):null}>
          {loading ? 'Verifying…' : 'Verify Email'}
        </Btn>

        <div style={{display:'flex',alignItems:'center',gap:8,fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-muted)'}}>
          Didn't get it?{' '}
          {resendTimer > 0
            ? <span style={{color:'var(--text-faint)'}}>Resend in {resendTimer}s</span>
            : <span style={{color:'var(--accent)',fontWeight:600,cursor:'pointer'}} onClick={()=>sendCode()}>Resend code</span>
          }
        </div>
        <button type="button" onClick={()=>setAuthStep('form')} style={{marginTop:16,fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-faint)',background:'none',border:'none',cursor:'pointer'}}>
          ← Back
        </button>
      </div>
    );
  }

  return (
    <div style={{position:'absolute',inset:0,overflowY:'auto',background:'var(--surface-app)'}}>
      <div style={{paddingTop:'var(--safe-top)'}} />

      {/* Branding */}
      <div style={{padding:'24px 24px 20px',textAlign:'center'}}>
        <div style={{margin:'0 auto 16px',filter:'drop-shadow(0 8px 20px rgba(78,79,42,.32))'}}>
          <RummageLogo markSize={60} textSize={24} />
        </div>
        <div style={{fontWeight:900,fontSize:22,letterSpacing:'-0.03em',color:'var(--ink-900)',lineHeight:1.1}}>

const FEEDBACK_CATS = [
  { key:'bug',     label:'Bug report',       icon:'Bug' },
  { key:'feature', label:'Feature request',  icon:'Lightbulb' },
  { key:'general', label:'General feedback', icon:'MessageSquare' },
  { key:'listing', label:'Listing issue',    icon:'Flag' },
];

function FeedbackScreen({ onBack, userEmail }) {
  const [cat, setCat]       = useState('general');
  const [message, setMessage] = useState('');
  const [sent, setSent]     = useState(false);
  const [sending, setSending] = useState(false);
  const [error, setError]   = useState('');

  const submit = () => {
    if (!message.trim() || sending) return;
    setSending(true);
    setError('');
    fetch('/api/feedback', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ category: cat, message: message.trim(), userEmail }),
    })
      .then(r => r.json())
      .then(res => {
        setSending(false);
        if (res.error) { setError('Could not send — try again in a moment.'); return; }
        setSent(true);
      })
      .catch(() => { setSending(false); setError('Could not reach the server. Make sure server.js is running.'); });
  };

  if (sent) {
    return (
      <div style={{position:'absolute',inset:0,background:'var(--surface-app)',zIndex:50,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'32px 28px',textAlign:'center'}}>
        <div style={{width:80,height:80,borderRadius:'50%',background:'var(--brand-50)',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:20,boxShadow:'0 8px 32px rgba(78,79,42,.20)'}}>
          {Icon('CheckCircle',40,{stroke:'var(--accent)'})}
        </div>
        <h2 style={{fontSize:26,fontWeight:900,letterSpacing:'-0.03em',color:'var(--ink-900)',margin:'0 0 10px'}}>Thanks for your feedback!</h2>
        <p style={{fontFamily:'var(--font-sans)',fontSize:15,color:'var(--text-muted)',lineHeight:1.6,margin:'0 0 32px',maxWidth:280}}>
          We read every message and use it to make Rummage better.
        </p>
        <Btn variant="primary" size="lg" onClick={onBack}>Back to Account</Btn>
      </div>
    );
  }

  return (
    <div style={{position:'absolute',inset:0,background:'var(--surface-app)',zIndex:50,display:'flex',flexDirection:'column'}}>
      <div style={{paddingTop:'var(--safe-top)',background:'rgba(237,230,214,0.96)',backdropFilter:'blur(24px)',borderBottom:'1px solid var(--line)'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,padding:'10px 16px 14px'}}>
          <IconButton icon={Icon('ChevronLeft',22)} shape="circle" aria-label="Back" onClick={onBack} />
          <h1 style={{fontSize:20,fontWeight:800,letterSpacing:'-0.02em',color:'var(--ink-900)',margin:0}}>Send Feedback</h1>
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'20px 20px 48px',display:'flex',flexDirection:'column',gap:20}}>
        <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',margin:0,lineHeight:1.6}}>
          We'd love to hear from you. Let us know what's working, what isn't, or what you'd like to see.
        </p>

        {/* Category */}
        <div>
          <div className="rmg-eyebrow" style={{marginBottom:12}}>Category</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            {FEEDBACK_CATS.map(c => {
              const on = cat === c.key;
              return (
                <button key={c.key} type="button" onClick={() => setCat(c.key)} style={{
                  display:'flex',alignItems:'center',gap:10,padding:'14px 16px',
                  background: on ? 'var(--accent)' : 'var(--surface-card)',
                  borderRadius:'var(--radius-xl)',border:'none',cursor:'pointer',textAlign:'left',
                  boxShadow: on ? '0 4px 14px rgba(78,79,42,.35)' : 'var(--shadow-sm)',
                  transition:'all var(--dur-fast)',
                }}>
                  <span style={{display:'inline-flex',color: on ? '#fff' : 'var(--accent)'}}>
                    {Icon(c.icon, 18, {stroke:'currentColor'})}
                  </span>
                  <span style={{fontFamily:'var(--font-sans)',fontWeight:600,fontSize:13,color: on ? '#fff' : 'var(--ink-900)',lineHeight:1.2}}>{c.label}</span>
                </button>
              );
            })}
          </div>
        </div>

        {/* Message */}
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          <div className="rmg-eyebrow">Your message</div>
          <textarea
            value={message}
            onChange={e => setMessage(e.target.value)}
            placeholder="Tell us what's on your mind…"
            rows={6}
            style={{
              width:'100%',padding:'14px 16px',fontFamily:'var(--font-sans)',fontSize:15,
              color:'var(--text-primary)',background:'var(--surface-card)',
              border:'none',borderRadius:'var(--radius-lg)',
              boxShadow:'var(--shadow-sm)',outline:'none',resize:'none',
              lineHeight:1.6,boxSizing:'border-box',
            }}
          />
          <div style={{fontFamily:'var(--font-sans)',fontSize:12,color:'var(--text-faint)',textAlign:'right'}}>{message.length} / 500</div>
        </div>

        {error && <div style={{fontFamily:'var(--font-sans)',fontSize:13,color:'var(--red-600, #DC2626)'}}>{error}</div>}

        <Btn variant="primary" size="lg" fullWidth
          onClick={submit}
          style={{opacity: (message.trim() && !sending) ? 1 : 0.45, pointerEvents: (message.trim() && !sending) ? 'auto' : 'none'}}
          leadingIcon={Icon('Send',18,{stroke:'#fff'})}>
          {sending ? 'Sending…' : 'Send feedback'}
        </Btn>
      </div>
    </div>
  );
}

// ── Account Screen ─────────────────────────────────────────────────────────────
function AccountScreen({ radiusMi, setRadiusMi, zip, setZip, authUser, onSignOut, onUpdateUser, userListings=[], onDeleteListing, onOpenSale, savedCount=0, onOpenNotifications, onReplayWalkthrough }) {
  const [name, setName] = useState(authUser?.name || 'Rummager');
  const [avatar, setAvatar] = useState(authUser?.avatar || null);
  const [saleTypes, setSaleTypes] = useState({estate:true,yard:true,moving:true});
  const [push, setPush] = useState(true);
  const [newSales, setNewSales] = useState(true);
  const [reminders, setReminders] = useState(true);
  const [dailyDigest, setDailyDigest] = useState(!!authUser?.digestOptIn);
  const [digestToast, setDigestToast] = useState(null);

  const syncDigestSubscription = (enabled, overrides={}) => {
    if (!authUser?.email) return;
    const body = enabled
      ? { email: authUser.email, zip: overrides.zip ?? zip, radiusMi: overrides.radiusMi ?? radiusMi, saleTypes: overrides.saleTypes ?? saleTypes }
      : { email: authUser.email };
    fetch(enabled ? '/api/subscribe' : '/api/unsubscribe', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body),
    }).catch(()=>{});
  };

  const toggleDailyDigest = (checked) => {
    if (checked && !authUser?.email) {
      setDigestToast('Sign in with an email to get the daily digest');
      setTimeout(()=>setDigestToast(null), 3000);
      return;
    }
    setDailyDigest(checked);
    onUpdateUser?.({ ...authUser, digestOptIn: checked });
    syncDigestSubscription(checked);
    setDigestToast(checked ? "Daily digest on — we'll email you today's sales each morning" : 'Daily digest turned off');
    setTimeout(()=>setDigestToast(null), 3000);
  };

  // Edit sheet: null | 'profile' | 'zip' | 'radius' | 'types'
  const [sheet, setSheet] = useState(null);
  const [draft, setDraft] = useState({});
  const [page, setPage] = useState(null); // null | 'help' | 'feedback' | 'privacy'
  const [deleteConfirm, setDeleteConfirm] = useState(null); // listing id pending delete

  const openSheet = (key) => {
    const defaults = {
      profile: { name, avatar },
      zip:     { zip },
      radius:  { radiusMi },
      types:   { saleTypes: {...saleTypes} },
    };
    setDraft(defaults[key]);
    setSheet(key);
  };

  const saveSheet = () => {
    if (sheet==='profile') {
      const newName   = draft.name;
      const newAvatar = draft.avatar ?? null;
      setName(newName);
      setAvatar(newAvatar);
      onUpdateUser?.({ ...authUser, name: newName, avatar: newAvatar });
    }
    if (sheet==='zip')    setZip(draft.zip);
    if (sheet==='radius') setRadiusMi(draft.radiusMi);
    if (sheet==='types')  setSaleTypes(draft.saleTypes);
    if (dailyDigest && ['zip','radius','types'].includes(sheet)) {
      syncDigestSubscription(true, {
        zip: sheet==='zip' ? draft.zip : undefined,
        radiusMi: sheet==='radius' ? draft.radiusMi : undefined,
        saleTypes: sheet==='types' ? draft.saleTypes : undefined,
      });
    }
    setSheet(null);
  };

  const typeCount = Object.values(saleTypes).filter(Boolean).length;
  const typesLabel = typeCount === Object.keys(saleTypes).length ? 'All' : typeCount === 0 ? 'None' : `${typeCount} selected`;
  const chev = Icon('ChevronRight',18,{stroke:'var(--text-faint)'});

  return (
    <div style={{position:'absolute',inset:0,overflowY:'auto',background:'var(--surface-app)'}}>
      <div style={{paddingTop:'var(--safe-top)'}} />
      <div style={{padding:'8px 20px 120px'}}>
        <h1 style={{fontSize:36,fontWeight:900,letterSpacing:'-0.03em',color:'var(--ink-900)',lineHeight:1.05,marginBottom:16}}>Account</h1>

        {/* Profile card */}
        <Card padded={false}>
          {/* Gradient banner */}
          <div style={{height:56,background:'linear-gradient(135deg,var(--brand-600) 0%,var(--brand-400) 100%)',position:'relative'}}>
            <button type="button" onClick={()=>openSheet('profile')}
              style={{position:'absolute',top:8,right:12,fontFamily:'var(--font-sans)',fontWeight:600,fontSize:13,color:'rgba(255,255,255,.9)',background:'rgba(255,255,255,.18)',border:'none',borderRadius:'var(--radius-pill)',padding:'5px 14px',cursor:'pointer',backdropFilter:'blur(4px)'}}>
              Edit
            </button>
          </div>
          <div style={{padding:'0 16px 16px'}}>
            <div style={{marginTop:-28,marginBottom:10,display:'inline-block',borderRadius:'50%',border:'3px solid var(--surface-card)',overflow:'hidden',position:'relative',zIndex:1}}>
              <Avatar name={name} size={56} emoji={avatar} />
            </div>
            <div style={{fontWeight:800,letterSpacing:'-0.025em',fontSize:20,color:'var(--text-primary)'}}>{name}</div>
            <div style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:13,color:'var(--text-muted)',marginTop:2}}>{Icon('MapPin',13,{stroke:'var(--accent)'})} {zip}</div>
            {/* Stats row */}
            <div style={{display:'flex',gap:0,marginTop:14,borderTop:'1px solid var(--border-default)',paddingTop:14}}>
              {[
                {n: savedCount,         label:'Saved'},
                {n: userListings.length, label:'Listed'},
              ].map((stat,i) => (
                <div key={i} style={{flex:1,textAlign:'center',borderRight:i===0?'1px solid var(--border-default)':'none'}}>
                  <div style={{fontWeight:800,fontSize:22,color:'var(--ink-900)',letterSpacing:'-0.02em'}}>{stat.n}</div>
                  <div style={{fontFamily:'var(--font-sans)',fontSize:12,color:'var(--text-muted)',marginTop:1}}>{stat.label}</div>
                </div>
              ))}
            </div>
          </div>
        </Card>

        {/* Search defaults */}
        <div className="rmg-eyebrow" style={{padding:'0 4px 8px',marginTop:22}}>Search defaults</div>
        <Card padded={false}>
          <ListRow first icon={Icon('MapPin',18)} label="Home ZIP code" value={zip} trailing={chev} onClick={()=>openSheet('zip')} />
          <ListRow icon={Icon('Ruler',18)} label="Default radius" value={`${radiusMi} mi`} trailing={chev} onClick={()=>openSheet('radius')} />
          <ListRow icon={Icon('Tag',18)} label="Sale types" value={typesLabel} trailing={chev} onClick={()=>openSheet('types')} />
        </Card>

        {/* Notifications */}
        <div className="rmg-eyebrow" style={{padding:'0 4px 8px',marginTop:22}}>Notifications</div>
        <Card padded={false}>

// ── Trip routing helpers ──────────────────────────────────────────────────────
function fmtDist(m) {
  const ft = Math.round(m * 3.281);
  if (ft < 1000) return `${ft} ft`;
  return `${(m / 1609.34).toFixed(1)} mi`;
}
function fmtTime(s) {
  const m = Math.round(s / 60);
  if (m < 60) return `${m} min`;
  return `${Math.floor(m / 60)}h ${m % 60}m`;
}
function maneuverIcon(type, modifier) {
  if (type === 'arrive') return 'MapPin';
  if (type === 'depart') return 'Navigation';
  if (type === 'roundabout' || type === 'rotary') return 'RefreshCw';
  if (modifier === 'uturn') return 'RotateCcw';
  if (modifier === 'slight left' || modifier === 'left' || modifier === 'sharp left') return 'ArrowLeft';
  if (modifier === 'slight right' || modifier === 'right' || modifier === 'sharp right') return 'ArrowRight';
  return 'ArrowUp';
}
function maneuverText(step) {
  const { type, modifier } = step.maneuver;
  const road = step.name || 'the road';
  if (type === 'depart') return `Head ${modifier || 'forward'} on ${road}`;
  if (type === 'arrive') return 'Arrive at stop';
  if (type === 'turn') return `Turn ${modifier || ''} onto ${road}`;
  if (type === 'new name') return `Continue onto ${road}`;
  if (type === 'continue') return `Continue on ${road}`;
  if (type === 'merge') return `Merge onto ${road}`;
  if (type === 'fork') return `Keep ${modifier || 'straight'} toward ${road}`;
  if (type === 'end of road') return `Turn ${modifier || ''} onto ${road}`;
  if (type === 'roundabout' || type === 'rotary') {
    const exit = step.maneuver.exit ? ` (exit ${step.maneuver.exit})` : '';
    return `Take the roundabout${exit} onto ${road}`;
  }
  return `Continue on ${road}`;
}

async function fetchOsrmRoute(waypoints) {
  // waypoints: [{lat,lng}, ...]
  const coords = waypoints.map(p => `${p.lng},${p.lat}`).join(';');
  const url = `https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=true`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('OSRM error');
  const data = await r.json();
  if (!data.routes?.length) throw new Error('No route');
  const route = data.routes[0];
  return {
    geometry: route.geometry.coordinates,   // [[lng,lat], ...]
    legs: route.legs,
    totalDist: route.distance,
    totalTime: route.duration,
  };
}

// Distance in meters between two {lat,lng} points
function geoDistM(a, b) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const sin = Math.sin(dLat / 2), cos = Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2);
  return 2 * R * Math.asin(Math.sqrt(sin * sin + cos * cos));
}

// ── Trip Map (Leaflet) ────────────────────────────────────────────────────────
function TripMap({ stops, userLoc, livePos, routeCoords, height = 260, interactive = true }) {
  const divRef = useRef(null);
  const mapRef = useRef(null);
  const liveDotRef = useRef(null);

  // Init map once
  useEffect(() => {
    if (!divRef.current || !window.L || mapRef.current) return;
    mapRef.current = window.L.map(divRef.current, { zoomControl: false, attributionControl: false, dragging: interactive, scrollWheelZoom: interactive });
    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapRef.current);
    return () => { if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; } };
  }, []);

  // Redraw stops + route when data changes
  useEffect(() => {
    const map = mapRef.current;
    if (!map || !window.L) return;
    map.eachLayer(l => { if (!(l instanceof window.L.TileLayer)) map.removeLayer(l); });
    liveDotRef.current = null;

    const bounds = [];

    // Route polyline (real roads)
    if (routeCoords?.length > 1) {
      const latlngs = routeCoords.map(([lng, lat]) => [lat, lng]);
      window.L.polyline(latlngs, { color: '#f97316', weight: 4, opacity: 0.85 }).addTo(map);
      latlngs.forEach(p => bounds.push(p));
    }

    // Origin dot (initial userLoc, greyed when live tracking)
    if (userLoc && !livePos) {
      window.L.circleMarker([userLoc.lat, userLoc.lng], {
        radius: 9, fillColor: '#3b82f6', color: '#fff', weight: 2.5, fillOpacity: 1
      }).addTo(map);
      bounds.push([userLoc.lat, userLoc.lng]);
    }

    // Stop markers
    stops.forEach((s, i) => {
      if (!s.lat || !s.lng) return;
      const icon = window.L.divIcon({
        html: `<div style="background:#f97316;color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);font-family:sans-serif">${i + 1}</div>`,
        iconSize: [30, 30], iconAnchor: [15, 15], className: ''
      });
      window.L.marker([s.lat, s.lng], { icon }).addTo(map);
      bounds.push([s.lat, s.lng]);
    });

    // Live GPS dot
    if (livePos) {
      liveDotRef.current = window.L.circleMarker([livePos.lat, livePos.lng], {
        radius: 10, fillColor: '#3b82f6', color: '#fff', weight: 2.5, fillOpacity: 1
      }).addTo(map);
      bounds.push([livePos.lat, livePos.lng]);
    }

    if (bounds.length > 0) map.fitBounds(bounds, { padding: [32, 32], maxZoom: 15 });
    else map.setView([33.979, -118.032], 12);
  }, [stops, userLoc, routeCoords]);

  // Smoothly move live dot without redrawing everything
  useEffect(() => {
    if (!liveDotRef.current || !livePos) return;
    liveDotRef.current.setLatLng([livePos.lat, livePos.lng]);
    mapRef.current?.panTo([livePos.lat, livePos.lng], { animate: true, duration: 0.8 });
  }, [livePos?.lat, livePos?.lng]);

  return <div ref={divRef} style={{ width: '100%', height, borderRadius: 'var(--radius-xl)', overflow: 'hidden' }} />;
}
