<style>
:root {
  /* Kraft paper & index card surfaces */
  --paper:#EDE6D6; --paper-2:#F1EAD6; --surface:#F8F4EA; --surface-tint:#FBF8F0;

  /* Sharpie-black ink */
  --ink-900:#211D17; --ink-800:#332E24; --ink-700:#4A4335; --ink-600:#6B6252;
  --ink-500:#8A8069; --ink-400:#9C9280; --ink-300:#C4B593; --ink-200:#D8CBB0; --ink-100:#E8E0CC; --line:#D8CBB0;

  /* Primary — sale-sign red */
  --brand-50:#FBEAEA; --brand-100:#F3CBCB; --brand-200:#E29A9B; --brand-300:#D26C6D;
  --brand-400:#C1272D; --brand-500:#A81F24; --brand-600:#8B1A1E; --brand-700:#6E1417; --brand-800:#4F0F11;

  /* Masking-tape yellow (secondary accent, used sparingly) */
  --tape-50:#FDF6E0; --tape-100:#F8E8B0; --tape-300:#F0C550; --tape-500:#E8B923; --tape-600:#C99C15; --tape-700:#8A6A0D;
  --teal-50:#F0FDFA; --teal-100:#CCFBF1; --teal-300:#5ECEBD; --teal-500:#14B8A6; --teal-600:#0D9488; --teal-700:#0F766E;
  --green-600:#3F5E3A; --green-bg:#E1E8D6; --amber-600:#8A5A12; --amber-bg:#F1E0B8; --red-600:#A81F24; --red-bg:#FBEAEA;
  --coral:#A81F24; --coral-bg:#FBEAEA;

  /* Sale type colors — office-supplies palette so they don't compete with the red accent */
  --type-estate-fg:#2C4A7C; --type-estate-bg:#DCE4EF;
  --type-yard-fg:#3F5E3A;   --type-yard-bg:#E1E8D6;
  --type-moving-fg:#8A5A12; --type-moving-bg:#F1E0B8;

  /* Semantic aliases */
  --text-primary:var(--ink-900); --text-secondary:var(--ink-600); --text-muted:var(--ink-500); --text-faint:var(--ink-400);
  --text-inverse:#FFFFFF; --text-accent:var(--brand-500); --text-link:var(--brand-500);
  --surface-app:var(--paper); --surface-card:var(--surface); --surface-sunken:var(--paper-2); --surface-raised:var(--surface-tint);
  --border-default:var(--line); --border-strong:var(--ink-300); --border-accent:var(--brand-200);
  --accent:var(--brand-400); --accent-hover:var(--brand-500); --accent-press:var(--brand-700);
  --accent-soft:var(--brand-50); --accent-soft-bd:var(--brand-200);
  --secondary:var(--teal-600); --secondary-soft:var(--teal-50); --focus-ring:var(--brand-400);
  --success:var(--green-600); --success-bg:var(--green-bg); --warning:var(--amber-600); --warning-bg:var(--amber-bg);
  --danger:var(--red-600); --danger-bg:var(--red-bg);
  --pin:var(--brand-400); --pin-saved:var(--coral); --live:#3F5E3A;

  --font-display:'Archivo Black','Arial Narrow',system-ui,sans-serif;
  --font-sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'Spline Sans Mono',ui-monospace,'SF Mono',Menlo,monospace;

  --text-2xs:11px; --text-xs:12px; --text-sm:13px; --text-base:15px; --text-md:17px;
  --text-lg:20px; --text-xl:24px; --text-2xl:30px; --text-3xl:38px; --text-4xl:48px;
  --weight-regular:400; --weight-medium:500; --weight-semibold:600; --weight-bold:700; --weight-extra:800;
  --leading-tight:1.1; --leading-snug:1.25; --leading-normal:1.45; --leading-relaxed:1.65;
  --tracking-tight:-0.02em; --tracking-snug:-0.01em; --tracking-normal:0; --tracking-wide:0.02em; --tracking-caps:0.08em;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px;
  --radius-xs:4px; --radius-sm:6px; --radius-md:8px; --radius-lg:10px;
  --radius-xl:14px; --radius-2xl:20px; --radius-pill:999px;

  /* Warm, neutral shadows — no purple tint */
  --shadow-xs:0 1px 3px rgba(33,29,23,.08);
  --shadow-sm:0 2px 10px rgba(33,29,23,.09);
  --shadow-md:0 8px 24px rgba(33,29,23,.12),0 2px 6px rgba(33,29,23,.07);
  --shadow-lg:0 20px 48px rgba(33,29,23,.16),0 6px 14px rgba(33,29,23,.09);
  --shadow-sheet:0 -8px 40px rgba(33,29,23,.14);
  --shadow-pin:0 6px 16px rgba(168,31,36,.35);
  --shadow-focus:0 0 0 3px rgba(193,39,45,.28);

  --safe-top:59px; --safe-bottom:0px; --safe-left:0px; --safe-right:0px; --tabbar-height:84px;
  --dur-fast:140ms; --dur-base:220ms; --dur-slow:360ms;
  --ease-out:cubic-bezier(.22,1,.36,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
}

<div id="err" style="display:none;position:fixed;inset:0;background:#fff;color:#c00;font-family:monospace;font-size:13px;padding:24px;white-space:pre-wrap;overflow:auto;z-index:99999;"></div>
<script>
window.addEventListener('error', function(e) {
  // Cross-origin scripts (the CDN <script> tags below) report errors as the
  // generic "Script error." with no filename/line — browsers strip all detail
  // for security. That's unactionable noise, not a real crash signal, so
  // don't blank out the whole app over it.
  if (e.message === 'Script error.' && !e.filename) return;
  var d = document.getElementById('err');
  d.style.display = 'block';
  d.textContent = 'JS ERROR:\n' + e.message + '\n\n' + (e.filename||'') + ':' + e.lineno;
});
</script>
<script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js" async></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// When this page is loaded from the live site, relative /api/... calls hit
// the same origin as expected. When it's bundled inside the native app shell
// (capacitor://, ionic://, or a file:// page with no real HTTP origin),
// those relative calls have nowhere to go, so route them to the deployed
// backend explicitly instead.
const API_BASE = (window.Capacitor?.isNativePlatform?.() || !/^https?:$/.test(location.protocol))
  ? 'https://rummagedeals.com'
  : '';

// True for the native app and for real phones/tablets browsing the site
// directly (rummagedeals.com in mobile Safari) — these get a full-bleed
// layout with real device safe-area insets. False for desktop browsers,
// which keep the phone-mockup preview frame. Computed once: "pointer: coarse"
// reflects the primary input hardware, which doesn't change on rotation, so a
// real phone can never flip out of mobile mode just by turning sideways (a
// plain width check would, since landscape reports a wide innerWidth).
const isMobileDevice = !!(window.Capacitor?.isNativePlatform?.()
  || (window.matchMedia?.('(pointer: coarse)').matches && navigator.maxTouchPoints > 0));

// ── Icon helper ───────────────────────────────────────────────────────────────
function Icon(name, size = 20, opts = {}) {
  const node = window.lucide && window.lucide.icons && window.lucide.icons[name];
  if (!node) return null;
  const walk = (m) => {
    const tag = m[0], attrs = { ...m[1] || {} }, kids = m[2] || [];
    if (tag === 'svg') {
      attrs.width = size; attrs.height = size;
      if (opts.stroke) attrs.stroke = opts.stroke;
      if (opts.fill) attrs.fill = opts.fill;
      if (opts.sw) attrs['stroke-width'] = opts.sw;
    }
    return `<${tag} ${Object.entries(attrs).map(([k,v]) => `${k}="${v}"`).join(' ')}>${kids.map(walk).join('')}</${tag}>`;
  };
  return <span style={{display:'inline-flex',flex:'0 0 auto'}} dangerouslySetInnerHTML={{__html:walk(node)}} />;
}

// Rummage logomark — a map-pin/price-tag mashup (the "find things nearby" +
// "sale" ideas in one shape), in the app's own olive/teal palette rather
// than a generic Lucide icon standing in for the brand.
function RummageMark({ size = 64 }) {
  const gid = 'rmgMarkGrad';
  return (
    <svg width={size} height={size} viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rummage">
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
          <stop offset="0" stopColor="var(--brand-600)" />
          <stop offset="1" stopColor="var(--brand-400)" />
        </linearGradient>
      </defs>
      <path d="M32 4C18.7 4 8 14.6 8 27.7c0 6.2 3 12 7.4 17.6 3.9 4.9 8.8 9.2 12.3 12.1a6 6 0 0 0 8.6 0c3.5-2.9 8.4-7.2 12.3-12.1C53 39.7 56 33.9 56 27.7 56 14.6 45.3 4 32 4Z" fill={`url(#${gid})`} />
      <circle cx="32" cy="26.5" r="10.5" fill="var(--paper)" />
      <circle cx="32" cy="26.5" r="4" fill="var(--tape-500)" />
    </svg>
  );
}

// Full lockup: mark + "Rummage" wordmark, for splash/auth-style screens.
function RummageLogo({ markSize = 56, textSize = 26 }) {
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8}}>
      <RummageMark size={markSize} />
      <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:textSize,letterSpacing:'-0.03em',color:'var(--ink-900)'}}>Rummage</div>
    </div>
  );
}

// ── Sound & celebration effects ─────────────────────────────────────────────
// Synthesized with the Web Audio API rather than shipped audio files -- a
// couple of oscillators is plenty for a short UI ping/chime and avoids
// bundling assets for something this small.
let _audioCtx = null;
// Plain module-level flag, not React state -- playPing/playTripBlip/etc. are
// called from all over the app (avatar taps, listing opens, auth), and
// gating each call site individually would mean threading a "sound on?"
// prop through every one of them. The on-screen toggle button keeps its
// own React state in sync with this via setSoundEnabled() so it re-renders.
let _soundEnabled = (() => { try { return localStorage.getItem('rummage_sound') !== 'off'; } catch (_) { return true; } })();
function isSoundEnabled() { return _soundEnabled; }
function setSoundEnabled(v) {
  _soundEnabled = v;
  try { localStorage.setItem('rummage_sound', v ? 'on' : 'off'); } catch (_) {}
}
function getAudioCtx() {
  if (!_soundEnabled) return null;
  if (!window.AudioContext && !window.webkitAudioContext) return null;
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === 'suspended') _audioCtx.resume().catch(()=>{});
  return _audioCtx;
}
function playPing() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(760, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1180, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.14, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.14);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.15);
  } catch (_) {}
}
function playCelebration() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  try {
    const now = ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => { // C5 E5 G5 C6
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const t = now + i * 0.09;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(0.2, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.45);
    });
  } catch (_) {}
}
// Two-note blip for adding/removing a sale from the trip planner -- lighter
// than the celebration chime (this isn't as big a moment as finishing
// sign-up), distinct from the ping/boom already used elsewhere. Rising
// pitch reads as "added," the same two notes played in reverse read as
// "removed," without needing two unrelated sounds.
function playTripBlip(added) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  try {
    const now = ctx.currentTime;
    const [f1, f2] = added ? [600, 900] : [900, 600];
    [[f1, 0], [f2, 0.07]].forEach(([freq, delay]) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t = now + delay;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(0.16, t + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.13);
    });
  } catch (_) {}
}

// Confetti scoped to the phone-mockup frame (id="phone-frame") rather than
// canvas-confetti's default full-browser-window canvas -- the app renders
// inside a scaled/centered phone mockup, so an unscoped burst would fire
// across the dark backdrop around it instead of the actual "screen."
function burstConfetti() {
  const frame = document.getElementById('phone-frame');
  if (!frame || !window.confetti) return;
  const canvas = document.createElement('canvas');
  canvas.width = frame.clientWidth;
  canvas.height = frame.clientHeight;
  canvas.style.cssText = 'position:absolute;inset:0;z-index:9999;pointer-events:none';
  frame.appendChild(canvas);
  const fire = window.confetti.create(canvas, { resize: false, useWorker: true });
  fire({
    particleCount: 100, spread: 75, startVelocity: 42, gravity: 1.1, ticks: 220,
    origin: { x: 0.5, y: 0.35 },
    colors: ['#C1272D', '#E8B923', '#3F5E3A', '#2C4A7C', '#211D17'],
  });
  setTimeout(() => canvas.remove(), 3200);
}

// ── Sale timing helpers ───────────────────────────────────────────────────────
function parseSaleStart(dateLabel, timeLabel) {
  if (!timeLabel) return null;
  const tMatch = timeLabel.match(/(\d+)(?::(\d+))?\s*(am|pm)/i);
  if (!tMatch) return null;
  let h = parseInt(tMatch[1]);
  const m = tMatch[2] ? parseInt(tMatch[2]) : 0;
  const ap = tMatch[3].toLowerCase();
  if (ap === 'pm' && h !== 12) h += 12;
  if (ap === 'am' && h === 12) h = 0;
  const MO = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const DY = {sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
  const now = new Date();
  const full = dateLabel && dateLabel.match(/\w+,\s+(\w+)\s+(\d+)/);
  if (full) {
    const mo = MO[full[1].toLowerCase().slice(0,3)];
    if (mo !== undefined) {
      const d = new Date(now.getFullYear(), mo, parseInt(full[2]), h, m, 0);
      // Only assume "next year" once the sale's LAST day has clearly passed
      // — checking just the start day would push a still-in-progress
      // multi-day sale (e.g. viewing day 2 of a "Jul 9 – Jul 11" sale, where
      // day 1 is already >24h behind "now") a full year into the future.
      const allHits = [...dateLabel.matchAll(/([A-Za-z]{3,9})\s+(\d{1,2})/g)]
        .filter(hm => MO[hm[1].toLowerCase().slice(0,3)] !== undefined);
      const lastHit = allHits[allHits.length - 1] || full;
      const lastMo  = MO[lastHit[1].toLowerCase().slice(0,3)];
      const rangeEnd = new Date(now.getFullYear(), lastMo, parseInt(lastHit[2]), 23, 59, 59);
      if (rangeEnd.getTime() < now.getTime() - 24*60*60*1000) d.setFullYear(now.getFullYear() + 1);
      return d;
    }
  }
  const dm = dateLabel && dateLabel.match(/^(\w{3})/i);
  if (dm) {
    const dn = DY[dm[1].toLowerCase()];
    if (dn !== undefined) {
      let diff = dn - now.getDay();
      if (diff < 0) diff += 7;
      if (diff === 0 && now.getHours() >= h) diff = 7;
      return new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff, h, m, 0);
    }
  }
  return null;
}

// Shared start/end resolver for a sale's date range. For multi-day sales
// (e.g. "Thu, Jul 9 – Sat, Jul 11") the end time must land on the LAST day
// of the range, not the start day — anchoring it to the start day's date
// (the original bug here) made every multi-day sale look "ended" as soon as
// the first day's closing time passed, even on day 2 or 3.
function parseSaleDateRange(dateLabel, timeLabel) {
  const start = parseSaleStart(dateLabel, timeLabel);
  if (!start) return { start: null, end: null };

  const MO = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const allTimes = (timeLabel || '').match(/(\d+)(?::(\d+))?\s*(am|pm)/gi) || [];
  if (allTimes.length < 2) return { start, end: null };

  const last = allTimes[allTimes.length - 1].match(/(\d+)(?::(\d+))?\s*(am|pm)/i);
  if (!last) return { start, end: null };
  let endH = parseInt(last[1]), endM = last[2] ? parseInt(last[2]) : 0;
  const ap = last[3].toLowerCase();
  if (ap === 'pm' && endH !== 12) endH += 12;
  if (ap === 'am' && endH === 12) endH = 0;

  // Find the actual end date — the LAST "Month Day" occurrence in the label
  // — which may differ from the start date for multi-day sales.
  const hits = [...(dateLabel || '').matchAll(/([A-Za-z]{3,9})\s+(\d{1,2})/g)]
    .filter(m => MO[m[1].toLowerCase().slice(0,3)] !== undefined);
  let end;
  if (hits.length) {
    const h = hits[hits.length - 1];
    const mo = MO[h[1].toLowerCase().slice(0,3)];
    end = new Date(start.getFullYear(), mo, parseInt(h[2]), endH, endM, 0);
    // Range spans a year boundary (e.g. "Dec 30 – Jan 2") — the end date
    // must be next year if it would otherwise land before the start.
    if (end.getTime() < start.getTime()) end.setFullYear(end.getFullYear() + 1);
  } else {
    end = new Date(start); end.setHours(endH, endM, 0, 0);
    if (end <= start) end.setDate(end.getDate() + 1);
  }
  return { start, end };
}

// Whether a sale is happening right now, computed from its actual date/time
// rather than a static flag (which would go stale the moment time passes).
function isSaleLive(dateLabel, timeLabel) {
  const { start, end } = parseSaleDateRange(dateLabel, timeLabel);
  if (!start) return false;
  const now = Date.now();
  if (now < start.getTime()) return false;
  return end ? now < end.getTime() : false;
}

const SORT_MO_IDX = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
// Sortable timestamp for a sale's start date, parsed from its display label
// (e.g. "Sat, Jul 4 – Sun, Jul 5" → the Jul 4 start). Sales with no
// parseable date sort to the very end rather than the very start.
function saleSortDate(dateLabel) {
  const label = dateLabel || '';
  if (!label) return Infinity;
  const hits = [...label.matchAll(/([A-Za-z]{3,9})\s+(\d{1,2})(?:,?\s*(\d{4}))?/g)]
    .filter(m => SORT_MO_IDX[m[1].toLowerCase().slice(0,3)] !== undefined);
  if (!hits.length) return Infinity;
  const m = hits[0];
  const mo = SORT_MO_IDX[m[1].toLowerCase().slice(0,3)];
  const day = parseInt(m[2]);
  const year = m[3] ? parseInt(m[3]) : new Date().getFullYear();
  return new Date(year, mo, day).getTime();
}

// ── Leaflet real map ──────────────────────────────────────────────────────────
const TYPE_COLOR_HEX = {
  estate:'#2C4A7C', yard:'#3F5E3A', moving:'#8A5A12',
};

function RealMap({ sales, selectedId, onSelect, centerLat=33.9792, centerLng=-118.0328, zoom=13, interactive=true }) {
  const containerRef = useRef(null);
  const mapRef       = useRef(null);
  const markersRef   = useRef({});

  // Init map once on mount
  useEffect(() => {
    const L = window.L;
    if (!L || !containerRef.current || mapRef.current) return;
    const map = L.map(containerRef.current, {
      center: [centerLat, centerLng], zoom,
      zoomControl: false, attributionControl: false,
      scrollWheelZoom: interactive, dragging: interactive,
      touchZoom: interactive, doubleClickZoom: interactive,
      boxZoom: false, keyboard: false,
    });
    L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
      { maxZoom: 19, subdomains: 'abcd' }
    ).addTo(map);
    if (interactive) L.control.zoom({ position: 'bottomright' }).addTo(map);
    // Blue user-location dot at center
    L.circleMarker([centerLat, centerLng], {
      radius: 7, fillColor: '#3B82F6', fillOpacity: 1,
      color: '#fff', weight: 2.5,
    }).addTo(map);
    mapRef.current = map;
    return () => { map.remove(); mapRef.current = null; };
  }, []);

  // Update markers whenever sales or selection changes
  useEffect(() => {
    const L = window.L;
    if (!L || !mapRef.current) return;
    const map = mapRef.current;
    // Remove old markers
    Object.values(markersRef.current).forEach(m => m.remove());
    markersRef.current = {};

    const points = [];
    sales.forEach(s => {
      if (s.lat == null || s.lng == null) return;
      points.push([s.lat, s.lng]);
      const sel   = s.id === selectedId;
      const color = TYPE_COLOR_HEX[s.type] || '#888';
      const size  = sel ? 38 : 28;
      const icon  = L.divIcon({
        className: '',
        html: `<div style="
          width:${size}px;height:${size}px;
          border-radius:50% 50% 50% 0;transform:rotate(45deg);
          background:${sel ? color : '#fff'};border:2.5px solid ${color};
          box-shadow:${sel ? '0 4px 14px rgba(0,0,0,.35)' : '0 2px 6px rgba(0,0,0,.22)'};
          transition:all .18s ease;
        "></div>`,
        iconSize:   [size, size],
        iconAnchor: [size / 2, size],
      });
      const marker = L.marker([s.lat, s.lng], { icon, zIndexOffset: sel ? 1000 : 0 })
        .addTo(map)
        .on('click', () => onSelect?.(s.id));
      markersRef.current[s.id] = marker;
    });

    if (selectedId && markersRef.current[selectedId]) {
      // A specific pin is selected — pan to just that one.
      const target = sales.find(s => s.id === selectedId);
      if (target?.lat && interactive) {
        map.panTo([target.lat, target.lng], { animate: true, duration: 0.4 });
      }
    } else if (interactive && points.length) {
      // Nothing selected — fit the view so every pin is visible at once,
      // instead of opening at a fixed zoom/center that can leave most of a
      // wide-radius search off-screen.
      const bounds = L.latLngBounds([...points, [centerLat, centerLng]]);
      map.fitBounds(bounds, { padding: [48, 48], maxZoom: 15 });
    }
  }, [sales, selectedId]);

  if (!window.L) return <FauxMap sales={sales} selectedId={selectedId} onSelect={onSelect} />;
  return <div ref={containerRef} style={{position:'absolute',inset:0}} />;
}

function proxyImgUrl(url) {
  try {
    const h = new URL(url).hostname;
    if (h === 'estatesales.org' || h.endsWith('.estatesales.org') ||
        h === 'estatesales.net' || h.endsWith('.estatesales.net') ||
        h.endsWith('.amazonaws.com') || h.endsWith('.cloudfront.net') ||
        h.endsWith('.imgix.net') || h.endsWith('.tlcdn.workers.dev') || h === 'eso-cdn.tlcdn.workers.dev' ||
        h === 'images.craigslist.org' || h === 'maps.geoapify.com' ||
        h.endsWith('.fbcdn.net') || h === 'fbcdn.net' || h.endsWith('.facebook.com'))
      return `${API_BASE}/api/img?url=${encodeURIComponent(url)}`;
  } catch(_) {}
  return url;
}

// Image with automatic fallback to a location map (or a generic placeholder if
// there are no coordinates either) on load error.
function SaleImg({ src, height, width, style, type, blurb, title, lat, lng, id }) {
  const [failed, setFailed] = React.useState(false);
  const [tall, setTall] = React.useState(false);
  if (!src || failed) {
    if (lat != null && lng != null) return <MapPlaceholder height={height} width={width} lat={lat} lng={lng} type={type} id={id} />;
    return <PhotoPlaceholder height={height} type={type} blurb={blurb} title={title} />;
  }
  const ps = PLACEHOLDER_STYLES[type] || PLACEHOLDER_STYLES.yard;
  // Sellers on OfferUp/Facebook often post a tall flyer graphic instead of a
  // photo. Hard-cropping that to fill a landscape/square card slices off the
  // date, address, or headline, so letterbox portrait images instead of
  // cover-cropping them.
  return (
    <div style={{ width: width || '100%', height, overflow:'hidden', background: tall ? ps.bg : 'transparent', ...style }}>
      <img
        src={proxyImgUrl(src)}
        onError={() => setFailed(true)}
        onLoad={e => { const { naturalWidth: w, naturalHeight: h } = e.target; if (w && h && h / w > 1.15) setTall(true); }}
        style={{ width:'100%', height:'100%', objectFit: tall ? 'contain' : 'cover', display:'block' }}
      />
    </div>
  );
}

// ── Countdown hook ────────────────────────────────────────────────────────────
function useCountdown(dateLabel, timeLabel) {
  const [info, setInfo] = useState({label:'', status:'upcoming'});
  useEffect(() => {
    const { start, end } = parseSaleDateRange(dateLabel, timeLabel);
    if (!start) return;
    const calc = () => {
      const now = Date.now(), startMs = start.getTime();
      const diff = startMs - now;
      if (diff > 0) {
        const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000);
        const label = h>=48 ? 'Starts in '+(Math.floor(h/24))+'d'
                    : h>0   ? 'Starts in '+h+'h '+m+'m'
                             : m>0 ? 'Starts in '+m+'m' : 'Starting soon';
        setInfo({label, status:'upcoming'});
      } else if (end && now < end.getTime()) {
        const rem = end.getTime()-now;
        const h = Math.floor(rem/3600000), m = Math.floor((rem%3600000)/60000);
        const label = h>0 ? 'Ends in '+h+'h '+m+'m' : m>0 ? 'Ends in '+m+'m' : 'Ending soon';
        setInfo({label, status:'live'});
      } else {
        setInfo({label:'Ended', status:'ended'});
      }
    };
    calc();
    const t = setInterval(calc, 60000);
    return () => clearInterval(t);
  }, [dateLabel, timeLabel]);
  return info;
}

function useViewport() {
  const [size, setSize] = useState(() => ({ width: window.innerWidth, height: window.innerHeight }));
  useEffect(() => {
    const onResize = () => setSize({ width: window.innerWidth, height: window.innerHeight });
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  return { ...size, isLandscape: size.width > size.height };
}

// ── Photo gallery ─────────────────────────────────────────────────────────────
// Full-screen photo viewer -- tap any real photo in PhotoGallery to open.
// Swipe or use the arrow buttons to move between photos, double-tap (or the
// zoom button) to enlarge further, pinch on touch devices. Purely a viewer:
// no save/share actions duplicated here, just Escape/X to close.
function PhotoLightbox({ images, startIndex=0, onClose }) {
  const [idx, setIdx] = useState(startIndex);
  const [zoomed, setZoomed] = useState(false);
  const [dragStart, setDragStart] = useState(null);
  const [dragDelta, setDragDelta] = useState(0);
  const total = images.length;
  const clamp = n => Math.max(0, Math.min(total-1, n));
  const zoomRef = useRef(null);

  useEffect(() => {
    const onKey = e => { if (e.key==='Escape') onClose(); if (e.key==='ArrowLeft') setIdx(i=>clamp(i-1)); if (e.key==='ArrowRight') setIdx(i=>clamp(i+1)); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  // transform:scale() only changes how the image is painted, not its layout
  // box, so the scrollable container has nothing to scroll -- the zoomed-in
  // detail beyond the original frame was unreachable. Sizing the image itself
  // (instead of transforming it) gives the wrapper real scroll area, and we
  // start centered since that's usually where the interesting detail is.
  useEffect(() => {
    if (zoomed && zoomRef.current) {
      const el = zoomRef.current;
      el.scrollLeft = (el.scrollWidth - el.clientWidth) / 2;
      el.scrollTop = (el.scrollHeight - el.clientHeight) / 2;
    }
  }, [zoomed, idx]);

  const onTouchStart = e => { if (zoomed) return; setDragStart(e.touches[0].clientX); };
  const onTouchMove  = e => { if (zoomed || dragStart==null) return; setDragDelta(e.touches[0].clientX - dragStart); };
  const onTouchEnd   = () => {
    if (Math.abs(dragDelta) > 60) setIdx(i => clamp(i + (dragDelta<0?1:-1)));
    setDragStart(null); setDragDelta(0);
  };

  return (
    <div style={{position:'absolute',inset:0,zIndex:200,background:'rgba(10,9,7,.97)',display:'flex',flexDirection:'column'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'var(--safe-top) 14px 0',flexShrink:0}}>
        <span style={{fontFamily:'var(--font-mono)',fontSize:12,color:'rgba(255,255,255,.7)',padding:'8px 0'}}>{idx+1} / {total}</span>
        <div style={{display:'flex',gap:8}}>
          <button type="button" onClick={()=>setZoomed(z=>!z)} aria-label={zoomed?'Zoom out':'Zoom in'}
            style={{width:38,height:38,borderRadius:'50%',background:'rgba(255,255,255,.14)',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
            {Icon(zoomed?'ZoomOut':'ZoomIn',18,{stroke:'#fff'})}
          </button>
          <button type="button" onClick={onClose} aria-label="Close"
            style={{width:38,height:38,borderRadius:'50%',background:'rgba(255,255,255,.14)',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
            {Icon('X',20,{stroke:'#fff'})}
          </button>
        </div>
      </div>
      <div style={{flex:1,position:'relative',overflow:'hidden'}}
        onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}>
        <div style={{display:'flex',width:total*100+'%',height:'100%',
          transform:'translateX(calc('+(-idx*(100/total))+'% + '+(zoomed?0:dragDelta/total)+'px))',
          transition:dragStart!=null?'none':'transform .32s var(--ease-out)'}}>
          {images.map((src,i) => {
            const active = zoomed && i===idx;
            return (
              <div key={i} ref={active ? zoomRef : null} onDoubleClick={()=>setZoomed(z=>!z)} style={{
                width:(100/total)+'%',height:'100%',flexShrink:0,
                display: active ? 'block' : 'flex',
                alignItems:'center',justifyContent:'center',
                overflow: active ? 'auto' : 'hidden',
                WebkitOverflowScrolling:'touch',
              }}>
                <img src={proxyImgUrl(src)} style={{
                  width: active ? '220%' : '100%',
                  height: active ? '220%' : '100%',
                  objectFit:'contain',display:'block',
                  cursor: zoomed && i===idx ? 'zoom-out' : 'zoom-in',
                }} onClick={()=>i===idx && setZoomed(z=>!z)} />
              </div>
            );
          })}
        </div>
      </div>
      {!zoomed && idx>0 && (
        <button onClick={()=>setIdx(i=>clamp(i-1))} style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',width:38,height:38,borderRadius:'50%',background:'rgba(0,0,0,.55)',backdropFilter:'blur(4px)',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'var(--shadow-md)'}}>
          {Icon('ChevronLeft',20,{stroke:'#fff',sw:2.5})}
        </button>
      )}
      {!zoomed && idx<total-1 && (
        <button onClick={()=>setIdx(i=>clamp(i+1))} style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',width:38,height:38,borderRadius:'50%',background:'rgba(0,0,0,.55)',backdropFilter:'blur(4px)',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'var(--shadow-md)'}}>
          {Icon('ChevronRight',20,{stroke:'#fff',sw:2.5})}
        </button>
      )}
    </div>
  );
}

function PhotoGallery({ images, type, height=260, onBack, saved, onSave, sale, onShare }) {
  const GRADS = {
    estate:['linear-gradient(135deg,#DCE4EF 0%,#B7C7DE 100%)','linear-gradient(135deg,#C7D3E5 0%,#7C97BE 100%)','linear-gradient(135deg,#A8BEDA 0%,#2C4A7C 100%)'],
    yard:  ['linear-gradient(135deg,#E1E8D6 0%,#C1D0AB 100%)','linear-gradient(135deg,#D0DCBB 0%,#8FA877 100%)','linear-gradient(135deg,#B7CBA0 0%,#3F5E3A 100%)'],
    moving:['linear-gradient(135deg,#F1E0B8 0%,#E8CD8E 100%)','linear-gradient(135deg,#EDD7A0 0%,#D9A94A 100%)','linear-gradient(135deg,#E0C070 0%,#8A5A12 100%)'],
  };
  const hasCoords = sale?.lat != null && sale?.lng != null;
  const slides = (images && images.length) ? images : (hasCoords ? ['__MAP__'] : (GRADS[type]||GRADS.estate));
  const total = slides.length;
  const [idx, setIdx] = useState(0);
  const [dragStart, setDragStart] = useState(null);
  const [dragDelta, setDragDelta] = useState(0);
  const [dragging, setDragging] = useState(false);
  const thumbsRef = useRef(null);
  const [lightboxOpen, setLightboxOpen] = useState(false);
  const clamp = n => Math.max(0, Math.min(total-1, n));
  const isUrl = s => typeof s==='string' && (s.startsWith('http') || s.startsWith('data:'));

  const onTouchStart = e => { setDragStart(e.touches[0].clientX); setDragging(true); };
  const onTouchMove  = e => { if (dragStart==null) return; setDragDelta(e.touches[0].clientX - dragStart); };
  const onTouchEnd   = () => {
    if (Math.abs(dragDelta) > 44) setIdx(i => clamp(i + (dragDelta<0?1:-1)));
    setDragStart(null); setDragDelta(0); setDragging(false);
  };

  // Scroll active thumbnail into view — scroll only the strip, not outer containers
  React.useEffect(() => {
    if (!thumbsRef.current || !isUrl(slides[0])) return;
    const el = thumbsRef.current.children[idx];
    if (!el) return;
    const strip = thumbsRef.current;
    const target = el.offsetLeft - (strip.offsetWidth - el.offsetWidth) / 2;
    strip.scrollTo({ left: target, behavior: 'smooth' });
  }, [idx]);

  const hasPhotos = isUrl(slides[0]);

  return (
    <div style={{flexShrink:0, width:'100%', overflow:'hidden'}}>
      {/* Main carousel */}
      <div style={{position:'relative',height,overflow:'hidden',background:'var(--paper-2)'}}>
        <div
          onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
          style={{display:'flex',width:total*100+'%',height:'100%',
            transform:'translateX(calc('+(-idx*(100/total))+'% + '+(dragDelta/total)+'px))',
            transition:dragging?'none':'transform .32s var(--ease-out)',userSelect:'none'}}>
          {slides.map((slide,i) => (
            <div key={i} onClick={()=>isUrl(slide) && setLightboxOpen(true)} style={{width:(100/total)+'%',height:'100%',flexShrink:0,overflow:'hidden',
              background:isUrl(slide)?'#111':'transparent',cursor:isUrl(slide)?'zoom-in':'default'}}>
              {isUrl(slide)
                ? <SaleImg src={slide} height="100%" type={type} blurb={sale?.blurb} title={sale?.title} style={{width:'100%',height:'100%',pointerEvents:'none'}} />
                : slide==='__MAP__'
                ? <div style={{width:'100%',height:'100%',pointerEvents:'none'}}><MapPlaceholder height="100%" width="100%" lat={sale.lat} lng={sale.lng} type={type} id={sale.id} /></div>
                : <div style={{width:'100%',height:'100%',background:slide,display:'flex',alignItems:'flex-end',padding:'0 20px 24px',boxSizing:'border-box'}}>
                    {sale?.blurb ? <p style={{margin:0,fontFamily:'var(--font-sans)',fontSize:14,lineHeight:1.5,color:'rgba(0,0,0,.65)',fontWeight:500,display:'-webkit-box',WebkitLineClamp:4,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{sale.blurb}</p> : null}
                  </div>}
            </div>
          ))}
        </div>
        <div style={{position:'absolute',inset:0,background:'linear-gradient(180deg,rgba(0,0,0,.32) 0%,transparent 30%,transparent 65%,rgba(0,0,0,.18) 100%)',pointerEvents:'none'}} />
        <div style={{position:'absolute',top:'var(--safe-top)',left:14,right:14,display:'flex',justifyContent:'space-between'}}>
          <button onClick={onBack} aria-label="Back" style={{display:'flex',alignItems:'center',gap:4,background:'rgba(0,0,0,.55)',backdropFilter:'blur(4px)',border:'none',borderRadius:'var(--radius-pill)',padding:'7px 14px 7px 10px',cursor:'pointer'}}>
            {Icon('ChevronLeft',18,{stroke:'#fff',sw:2.5})}
            <span style={{color:'#fff',fontSize:13,fontWeight:700,fontFamily:'var(--font-sans)'}}>Back</span>
          </button>
          <div style={{display:'flex',gap:8}}>
            <IconButton icon={Icon('Share',19)} shape="circle" aria-label="Share" onClick={()=>onShare && onShare()} />
            <IconButton icon={Icon('Heart',19,sale&&sale.saved?{fill:'var(--coral)',stroke:'var(--coral)'}:{})} shape="circle" aria-label="Save" onClick={()=>onSave&&onSave()} />
          </div>
        </div>
        {idx>0 && (
          <button onClick={()=>setIdx(i=>clamp(i-1))} style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',width:34,height:34,borderRadius:'50%',background:'rgba(0,0,0,.55)',backdropFilter:'blur(4px)',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'var(--shadow-md)'}}>
            {Icon('ChevronLeft',18,{stroke:'#fff',sw:2.5})}
          </button>
        )}
        {idx<total-1 && (
          <button onClick={()=>setIdx(i=>clamp(i+1))} style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',width:34,height:34,borderRadius:'50%',background:'rgba(0,0,0,.55)',backdropFilter:'blur(4px)',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'var(--shadow-md)'}}>
            {Icon('ChevronRight',18,{stroke:'#fff',sw:2.5})}
          </button>
        )}
        {hasPhotos && (
          <div style={{position:'absolute',bottom:10,right:14,background:'rgba(0,0,0,.52)',backdropFilter:'blur(4px)',color:'#fff',borderRadius:'var(--radius-pill)',padding:'3px 10px',fontSize:11,fontWeight:700,fontFamily:'var(--font-mono)'}}>
            {idx+1} / {total}
          </div>
        )}
      </div>

      {/* Thumbnail strip — only shown when there are real photos */}
      {hasPhotos && total > 1 && (
        <div ref={thumbsRef} style={{display:'flex',gap:4,overflowX:'auto',padding:'6px 8px',background:'var(--surface-app)',scrollbarWidth:'none',WebkitOverflowScrolling:'touch'}}>
          {slides.map((slide, i) => (
            <button key={i} onClick={()=>setIdx(i)} style={{
              flexShrink:0, width:62, height:62, borderRadius:8, overflow:'hidden', padding:0, border:'none',
              outline: i===idx ? '2.5px solid var(--accent)' : '2.5px solid transparent',
              opacity: i===idx ? 1 : 0.62, cursor:'pointer', transition:'opacity .18s,outline .18s',
            }}>
              <SaleImg src={slide} height={62} type={type} />
            </button>
          ))}
        </div>
      )}

      {lightboxOpen && hasPhotos && (
        <PhotoLightbox images={slides.filter(isUrl)} startIndex={idx} onClose={()=>setLightboxOpen(false)} />
      )}
    </div>
  );
}

  return (

function SavedScreen({ sales, onOpenSale, onToggleSave, tripIds=[], onToggleTrip }) {
  const [tab, setTab] = useState('upcoming');
  const saved = sales.filter(s=>s.saved);
  const now = new Date();
  const MO = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};

  const saleEndDate = (s) => {
    const label = s.dateLabel || '';
    const hits = [...label.matchAll(/([A-Za-z]{3,9})\s+(\d{1,2})(?:,?\s*(\d{4}))?/g)]
      .filter(m => MO[m[1].toLowerCase().slice(0,3)] !== undefined);
    if (hits.length) {
      const m = hits[hits.length-1];
      const mo = MO[m[1].toLowerCase().slice(0,3)];
      const day = parseInt(m[2]);
      const yr = m[3] ? parseInt(m[3]) : now.getFullYear();
      return new Date(yr, mo, day, 23, 59, 59);
    }
    return null;
  };

  const upcoming  = saved.filter(s => { const d=saleEndDate(s); return !d || d >= now; });
  const past      = saved.filter(s => { const d=saleEndDate(s); return d && d < now; });
  const happening = upcoming.filter(s => isSaleLive(s.dateLabel, s.timeLabel));
  const shown     = tab==='happening' ? happening : tab==='past' ? past : upcoming;

  const EmptyState = ({icon, title, body}) => (
    <div style={{textAlign:'center',padding:'48px 28px',background:'var(--surface-card)',borderRadius:'var(--radius-2xl)',boxShadow:'var(--shadow-sm)'}}>
      <div style={{fontSize:44,marginBottom:12}}>{icon}</div>
      <p style={{fontWeight:800,fontSize:20,color:'var(--ink-900)',margin:'0 0 8px',letterSpacing:'-0.02em'}}>{title}</p>
      <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',margin:0,lineHeight:1.6}}>{body}</p>

        <h1 style={{fontSize:36,fontWeight:900,letterSpacing:'-0.03em',color:'var(--ink-900)',lineHeight:1.05}}>Saved Sales</h1>
        <div style={{marginTop:16}}>
          <SegmentedControl
            options={[
              {value:'upcoming', label:`Upcoming${upcoming.length ? ` · ${upcoming.length}` : ''}`},
              {value:'happening',label:`Now${happening.length ? ` · ${happening.length}` : ''}`},
              {value:'past',     label:`Past${past.length     ? ` · ${past.length}`     : ''}`},
            ]}
            value={tab} onChange={setTab} style={{width:'100%',display:'flex'}} />
        </div>
      </div>
      <div style={{padding:'4px 20px 120px',display:'flex',flexDirection:'column',gap:14}}>
        {saved.length===0 ? (
          <EmptyState icon="🔖" title="Nothing saved yet" body="Tap the heart on any sale to save it here for later." />
        ) : shown.length===0 ? (
          tab==='happening'
            ? <EmptyState icon="⏳" title="None happening now" body="Check the Upcoming tab for sales starting soon." />
            : tab==='past'
            ? <EmptyState icon="📦" title="No past sales" body="Sales you've attended will appear here." />
            : <EmptyState icon="🗓️" title="No upcoming saves" body="Heart a sale on the Explore tab to save it." />
        ) : shown.map(s=>(
          <SaleCard key={s.id} id={s.id} type={s.type} title={s.title} address={s.address} distanceMi={s.distanceMi}
            dateLabel={s.dateLabel} timeLabel={s.timeLabel} photoCount={s.photoCount} images={s.images} blurb={s.blurb}
            lat={s.lat} lng={s.lng}
            saved={s.saved} onSave={()=>onToggleSave(s.id)} onClick={()=>onOpenSale(s.id)}
            inTrip={tripIds.includes(s.id)} onToggleTrip={onToggleTrip ? ()=>onToggleTrip(s.id) : undefined} />
        ))}
      </div>
    </div>
  );
}

// ── Auth Screen ───────────────────────────────────────────────────────────────
// Verification is email-based (via Resend). Phone/SMS verification was
// tried via Twilio, but the toll-free number got stuck in a rejected-then-
// blocked-from-resubmitting state with no fast resolution, while email has
// worked reliably the whole time -- reverted back to email for now.
function AuthScreen({ onAuth }) {
  const [mode, setMode]         = useState('signin'); // 'signin' | 'signup'
  const [email, setEmail]       = useState('');
  const [password, setPassword] = useState('');
  const [confirm, setConfirm]   = useState('');
  const [fullName, setFullName] = useState('');
  // Optional -- verification still runs on email (see sendCode/verifyCode
  // below). This collects phone + shows the SMS consent disclosure so the
  // toll-free registration has a real, truthful point of collection to
  // point to, without switching the app back to phone-based verification
  // before Twilio's side is actually approved.
  const [phone, setPhone] = useState('');
  const [selAvatar, setSelAvatar] = useState(AVATARS[0].id);
  const [showPw, setShowPw]         = useState(false);
  const [errors, setErrors]         = useState({});
  const [loading, setLoading]       = useState(false);
  const [authStep, setAuthStep]     = useState('form'); // 'form' | 'verify'
  const [codeDigits, setCodeDigits] = useState(['','','','','','']);
  const [codeError, setCodeError]   = useState('');
  const [resendTimer, setResendTimer] = useState(0);
  const [legalPage, setLegalPage]     = useState(null); // null | 'terms' | 'privacy'
  const [appleLoading, setAppleLoading] = useState(false);
  const [appleError, setAppleError]     = useState('');
  const codeRefs = [useRef(),useRef(),useRef(),useRef(),useRef(),useRef()];

  useEffect(() => {
    if (resendTimer <= 0) return;
    const t = setTimeout(() => setResendTimer(n => n-1), 1000);
    return () => clearTimeout(t);
  }, [resendTimer]);

  if (legalPage === 'terms')   return <TermsScreen   onBack={()=>setLegalPage(null)} />;
  if (legalPage === 'privacy') return <PrivacyScreen onBack={()=>setLegalPage(null)} />;

  const validate = () => {
    const e = {};
    if (!fullName.trim() && mode==='signup') e.fullName = 'Name is required';
    if (!email.trim())    e.email    = 'Email is required';
    else if (!/\S+@\S+\.\S+/.test(email)) e.email = 'Enter a valid email';
    if (!password)        e.password = 'Password is required';
    else if (password.length < 6) e.password = 'At least 6 characters';
    if (mode==='signup' && password !== confirm) e.confirm = "Passwords don't match";
    return e;
  };

  const sendCode = () => {
    setResendTimer(30);
    return fetch(`${API_BASE}/api/send-verification`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: email.trim() }),
    }).then(r => r.json());
  };

  // Sign in with Apple -- shown only inside the native app (see render below),
  // since that's the actual Apple requirement (guideline 4.8) when offering
  // email sign-up. Uses Apple's web JS SDK rather than a native Capacitor
  // plugin: this app has no bundler, so there's nowhere for an npm-imported
  // native plugin to be wired in without introducing one just for this.
  const signInWithApple = async () => {
    if (!window.AppleID) { setAppleError('Sign in with Apple is unavailable right now — try again in a moment.'); return; }
    setAppleError(''); setAppleLoading(true);
    try {
      window.AppleID.auth.init({
        clientId: 'com.rummagedeals.web',
        scope: 'name email',
        redirectURI: 'https://rummagedeals.com/auth/apple/callback',
        usePopup: true,
      });
      const result = await window.AppleID.auth.signIn();
      const idToken = result.authorization?.id_token;
      // Apple only ever includes the user's name on their very first sign-in
      // — never again after that — so this has to be captured and forwarded
      // right now or it's gone for good.
      const name = [result.user?.name?.firstName, result.user?.name?.lastName].filter(Boolean).join(' ') || null;
      const res = await fetch(`${API_BASE}/api/auth/apple`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identityToken: idToken, name }),
      });
      const data = await res.json();
      setAppleLoading(false);
      if (data.error) { setAppleError(data.error); return; }
      playCelebration(); burstConfetti();
      onAuth({ name: data.name || 'Rummager', email: data.email, avatar: null });
    } catch (err) {
      setAppleLoading(false);
      if (err?.error === 'popup_closed_by_user') return; // user cancelled -- not a real error
      setAppleError('Apple sign-in failed — please try again.');
    }
  };

  const submit = () => {
    const e = validate();
    if (Object.keys(e).length) { setErrors(e); return; }
    if (mode === 'signin') {
      setLoading(true);
      setTimeout(() => {
        setLoading(false);
        onAuth({ name: fullName.trim() || 'Rummager', email: email.trim(), avatar: AVATARS.find(a=>a.id===selAvatar)?.emoji || null });
      }, 600);
      return;
    }
    setLoading(true);
    sendCode().then(res => {
      setLoading(false);
      if (res.error) { setErrors({ email: res.error }); return; }
      setAuthStep(res.devMode ? 'verify-dev' : 'verify');
      setTimeout(() => codeRefs[0].current?.focus(), 100);
    }).catch(() => {
      setLoading(false);
      setErrors({ email: 'Could not reach the server. Make sure server.js is running on port 3002.' });
    });
  };

  const onDigit = (i, val) => {
    const d = val.replace(/\D/g,'').slice(-1);
    const next = [...codeDigits]; next[i] = d; setCodeDigits(next); setCodeError('');
    if (d && i < 5) setTimeout(() => codeRefs[i+1].current?.focus(), 0);
    if (!d && i > 0) setTimeout(() => codeRefs[i-1].current?.focus(), 0);
  };

  const onCodeKey = (i, e) => {
    if (e.key==='Backspace' && !codeDigits[i] && i>0) codeRefs[i-1].current?.focus();
  };

  const onCodePaste = (e) => {
    const pasted = e.clipboardData.getData('text').replace(/\D/g,'').slice(0,6);
    if (pasted.length===6) { setCodeDigits(pasted.split('')); codeRefs[5].current?.focus(); }
    e.preventDefault();
  };

  const verifyCode = () => {
    const code = codeDigits.join('');
    if (code.length < 6) { setCodeError('Enter all 6 digits'); return; }
    setLoading(true);
    fetch(`${API_BASE}/api/check-code`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: email.trim(), code }),
    }).then(r=>r.json()).then(res => {
      setLoading(false);
      if (res.error) { setCodeError(res.error); setCodeDigits(['','','','','','']); setTimeout(()=>codeRefs[0].current?.focus(),0); return; }
      playCelebration();
      burstConfetti();
      onAuth({ name: fullName.trim(), email: email.trim(), avatar: AVATARS.find(a=>a.id===selAvatar)?.emoji || null });
    }).catch(() => { setLoading(false); setCodeError('Could not verify — is the backend server running?'); });
  };

  if (authStep === 'verify' || authStep === 'verify-dev') {
    const isDevMode = authStep === 'verify-dev';
    return (
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'var(--surface-app)',padding:'32px 24px',textAlign:'center'}}>
        <div style={{width:72,height:72,borderRadius:22,background:'linear-gradient(135deg,var(--brand-500),var(--brand-300))',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:20,boxShadow:'0 8px 32px rgba(78,79,42,.30)'}}>
          {Icon('Mail',34,{stroke:'#fff',sw:1.75})}
        </div>
        <h1 style={{fontSize:26,fontWeight:900,letterSpacing:'-0.03em',color:'var(--ink-900)',margin:'0 0 8px'}}>Check your email</h1>
        <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',lineHeight:1.6,margin:'0 0 28px',maxWidth:280}}>
          {isDevMode
            ? <>No email provider configured — check the <strong style={{color:'var(--ink-900)'}}>server.js console</strong> for your code.</>
            : <>We sent a 6-digit code to<br/><strong style={{color:'var(--ink-900)'}}>{email}</strong></>
          }
        </p>

        {/* 6-digit code input */}
        <div style={{display:'flex',gap:8,marginBottom:12}} onPaste={onCodePaste}>
          {codeDigits.map((d,i) => (
            <input key={i} ref={codeRefs[i]} type="text" inputMode="numeric" maxLength={1} value={d}
              onChange={e=>onDigit(i,e.target.value)} onKeyDown={e=>onCodeKey(i,e)}
              style={{width:44,height:54,textAlign:'center',fontSize:24,fontWeight:800,
                fontFamily:'var(--font-mono)',color:'var(--ink-900)',
                background:'var(--surface-raised)',
                border:'none',
                boxShadow: codeError ? '0 0 0 2px #DC2626' : d ? 'var(--shadow-focus)' : 'var(--shadow-sm)',
                borderRadius:'var(--radius-lg)',outline:'none',
                transition:'border-color var(--dur-fast), box-shadow var(--dur-fast)'}} />
          ))}
        </div>
        {codeError && <div style={{fontFamily:'var(--font-sans)',fontSize:13,color:'#DC2626',marginBottom:12}}>{codeError}</div>}

        <Btn variant="primary" size="lg" fullWidth onClick={verifyCode}
          style={{marginBottom:14,opacity:loading?.6:1,pointerEvents:loading?'none':'auto'}}
          leadingIcon={loading?Icon('Loader',18,{stroke:'#fff'}):null}>
          {loading ? 'Verifying…' : 'Verify Email'}
        </Btn>

        <div style={{display:'flex',alignItems:'center',gap:8,fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-muted)'}}>
          Didn't get it?{' '}
          {resendTimer > 0
            ? <span style={{color:'var(--text-faint)'}}>Resend in {resendTimer}s</span>
            : <span style={{color:'var(--accent)',fontWeight:600,cursor:'pointer'}} onClick={()=>sendCode()}>Resend code</span>
          }
        </div>
        <button type="button" onClick={()=>setAuthStep('form')} style={{marginTop:16,fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-faint)',background:'none',border:'none',cursor:'pointer'}}>
          ← Back
        </button>
      </div>
    );
  }

  return (
    <div style={{position:'absolute',inset:0,overflowY:'auto',background:'var(--surface-app)'}}>
      <div style={{paddingTop:'var(--safe-top)'}} />

      {/* Branding */}
      <div style={{padding:'24px 24px 20px',textAlign:'center'}}>
        <div style={{margin:'0 auto 16px',filter:'drop-shadow(0 8px 20px rgba(78,79,42,.32))'}}>
          <RummageLogo markSize={60} textSize={24} />
        </div>
        <div style={{fontWeight:900,fontSize:22,letterSpacing:'-0.03em',color:'var(--ink-900)',lineHeight:1.1}}>
          {mode==='signin' ? 'Welcome back' : 'Join Rummage'}
        </div>
        <div style={{fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-muted)',marginTop:4}}>
          {mode==='signin' ? 'Sign in to find sales near you' : 'Create your free account'}
        </div>
      </div>

      {/* Mode tabs */}
      <div style={{margin:'0 24px 20px'}}>
        <div style={{display:'flex',background:'var(--surface-sunken)',borderRadius:'var(--radius-lg)',padding:3}}>
          {[{value:'signin',label:'Sign In'},{value:'signup',label:'Create Account'}].map(opt=>(
            <button key={opt.value} type="button"
              onClick={()=>{setMode(opt.value);setErrors({});}}
              style={{flex:1,height:40,cursor:'pointer',borderRadius:'calc(var(--radius-lg) - 2px)',fontFamily:'var(--font-sans)',fontWeight:700,fontSize:13,
                border: mode===opt.value ? '1px solid var(--ink-200)' : 'none',
                background: mode===opt.value ? 'var(--ink-900)' : 'transparent',
                color: mode===opt.value ? '#fff' : 'var(--text-muted)',
                boxShadow: mode===opt.value ? 'var(--shadow-sm)' : 'none',
                transition:'all var(--dur-base) var(--ease-spring)',
              }}>
              {opt.label}
            </button>
          ))}
        </div>
      </div>

      <div style={{padding:'0 24px 100px',display:'flex',flexDirection:'column',gap:14}}>

        {/* Sign in with Apple — native app only; Apple requires this be
            offered wherever email sign-up is (guideline 4.8) */}
        {window.Capacitor?.isNativePlatform?.() && (
          <>
            <button type="button" onClick={signInWithApple} disabled={appleLoading} style={{
              display:'flex',alignItems:'center',justifyContent:'center',gap:8,height:48,
              borderRadius:'var(--radius-lg)',border:'none',background:'#000',color:'#fff',
              fontFamily:'var(--font-sans)',fontWeight:600,fontSize:15,cursor:'pointer',
              opacity:appleLoading?.6:1,
            }}>
              {appleLoading ? Icon('Loader',18,{stroke:'#fff'}) : <span style={{fontSize:19,lineHeight:1}}>{''}</span>}
              {appleLoading ? 'Signing in…' : 'Sign in with Apple'}
            </button>
            {appleError && <div style={{fontFamily:'var(--font-sans)',fontSize:13,color:'#DC2626',textAlign:'center'}}>{appleError}</div>}
            <div style={{display:'flex',alignItems:'center',gap:10,margin:'2px 0'}}>
              <div style={{flex:1,height:1,background:'var(--border-default)'}} />
              <span style={{fontFamily:'var(--font-sans)',fontSize:12,color:'var(--text-faint)'}}>or continue with email</span>
              <div style={{flex:1,height:1,background:'var(--border-default)'}} />
            </div>
          </>
        )}

        {/* Avatar picker — sign up only */}
        {mode==='signup' && (
          <div>
            <div className="rmg-eyebrow" style={{marginBottom:10}}>Pick your avatar</div>
            <div style={{display:'flex',gap:8,overflowX:'auto',paddingBottom:6,scrollbarWidth:'none'}}>
              {AVATARS.map(av => {
                const on = selAvatar===av.id;
                return (
                  <button key={av.id} type="button" onClick={()=>{playPing();setSelAvatar(av.id);}} aria-label={av.label} style={{
                    flexShrink:0,width:52,height:52,borderRadius:'50%',overflow:'hidden',
                    border:'2.5px solid '+(on?'var(--accent)':'transparent'),
                    background:on?'var(--brand-50)':'var(--surface-sunken)',
                    padding:0,fontSize:26,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',
                    boxShadow:on?'var(--shadow-focus)':'none',
                    transition:'all var(--dur-base) var(--ease-spring)',
                  }}>
                    <img src={av.emoji} alt={av.label} style={{width:'100%',height:'100%',objectFit:'cover'}} />
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {mode==='signup' && (
          <Field label="Full name" value={fullName} onChange={v=>{setFullName(v);setErrors(p=>({...p,fullName:''}));}}
            placeholder="Your name" error={errors.fullName} />
        )}

        <Field label="Email address" value={email} onChange={v=>{setEmail(v);setErrors(p=>({...p,email:''}));}}
          type="email" placeholder="you@example.com" error={errors.email} autoCapitalize="none" />

        {mode==='signup' && (
          <div>
            <Field label="Phone number (optional)" value={phone} onChange={setPhone}
              type="tel" placeholder="(555) 123-4567" autoCapitalize="none" />
            <p style={{fontFamily:'var(--font-sans)',fontSize:12,color:'var(--text-faint)',lineHeight:1.5,margin:'6px 2px 0'}}>
              By entering your phone number and creating an account, you agree to receive a one-time SMS verification code from Rummage. Message and data rates may apply. We don't send marketing texts.
            </p>
          </div>
        )}

        <Field label="Password" value={password} onChange={v=>{setPassword(v);setErrors(p=>({...p,password:''}));}}

// Downscales a photo client-side (long edge capped, re-encoded as JPEG)
// before it ever reaches the server -- a phone camera photo can be 4-12MB;
// nothing about identifying an item needs that resolution, and keeping the
// upload small matters more on mobile data than the quality difference.
function downscalePhoto(file, maxEdge = 1024, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read that file'));
    reader.onload = () => {
      img.onerror = () => reject(new Error('Could not read that image'));
      img.onload = () => {
        const scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function PriceCheckScreen({ onBack }) {
  const [photo, setPhoto]     = useState(null); // data URL, downscaled
  const [loading, setLoading] = useState(false);
  const [result, setResult]   = useState(null); // { itemName, low, high, sources }
  const [error, setError]     = useState(null);
  const fileInputRef = useRef(null);

  const onFilePicked = async (e) => {
    const file = e.target.files?.[0];
    e.target.value = ''; // allow picking the same file again later
    if (!file) return;
    setError(null); setResult(null);
    try {
      setPhoto(await downscalePhoto(file));
    } catch (err) {
      setError(err.message);
    }
  };

  const checkValue = () => {
    if (!photo) return;
    setLoading(true); setError(null); setResult(null);
    fetch(`${API_BASE}/api/price-check`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: photo }),
    }).then(r => r.json()).then(data => {
      setLoading(false);
      if (data.error) { setError(data.error); return; }
      setResult(data);
    }).catch(() => { setLoading(false); setError('Could not reach the server. Make sure server.js is running.'); });
  };

  const reset = () => { setPhoto(null); setResult(null); setError(null); };

  return (
    <div style={{position:'absolute',inset:0,background:'var(--surface-app)',zIndex:50,display:'flex',flexDirection:'column'}}>

            </p>
            <input ref={fileInputRef} type="file" accept="image/*" capture="environment" style={{display:'none'}} onChange={onFilePicked} />
            <button type="button" onClick={()=>fileInputRef.current?.click()} style={{

              <span style={{fontFamily:'var(--font-sans)',fontSize:12,color:'var(--text-faint)'}}>JPEG or PNG</span>
            </button>
          </>

        {error && (

                        <div style={{fontFamily:'var(--font-sans)',fontWeight:600,fontSize:13,color:'var(--text-primary)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.title}</div>
                        <div style={{fontFamily:'var(--font-mono)',fontSize:11,color:'var(--text-faint)',marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{new URL(s.url).hostname.replace(/^www\./,'')}</div>
                      </div>
                      <div style={{fontFamily:'var(--font-mono)',fontWeight:700,fontSize:14,color:'var(--brand-500)',flexShrink:0}}>${s.price}</div>
                    </a>
                  ))}
                </Card>
              </div>
            )}

            <Btn variant="ghost" size="lg" fullWidth leadingIcon={Icon('RotateCcw',16)} onClick={reset}>Check another item</Btn>
          </>
        )}
      </div>
    </div>
  );
}

          </Btn>
        </div>
      </div>
    </Card>
  );
}

function VintageStoresScreen({ onBack, zip, tripIds=[], onToggleTrip, onStoresLoaded }) {
  const [loading, setLoading] = useState(true);
  const [stores, setStores]   = useState([]);
  const [error, setError]     = useState(null);

  useEffect(() => {
    setLoading(true); setError(null);
    fetch(`${API_BASE}/api/vintage-stores?zip=${encodeURIComponent(zip)}`)
      .then(r => r.json())
      .then(data => {
        if (data.error) { setError(data.error); setStores([]); }
        else { setStores(data.stores || []); onStoresLoaded && onStoresLoaded(data.stores || []); }
      })
      .catch(() => setError('Could not reach the server. Make sure server.js is running.'))
      .finally(() => setLoading(false));
  }, [zip]);

  return (
    <div style={{position:'absolute',inset:0,background:'var(--surface-app)',zIndex:50,display:'flex',flexDirection:'column'}}>
      <div style={{paddingTop:'var(--safe-top)',background:'rgba(237,230,214,0.96)',backdropFilter:'blur(24px)',borderBottom:'1px solid var(--line)'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,padding:'10px 16px 14px'}}>
          <IconButton icon={Icon('ChevronLeft',22)} shape="circle" aria-label="Back" onClick={onBack} />
          <h1 style={{fontSize:20,fontWeight:800,letterSpacing:'-0.02em',color:'var(--ink-900)',margin:0}}>Vintage Stores</h1>
        </div>
      </div>

      <div style={{flex:1,overflowY:'auto',padding:'18px 20px 48px'}}>
        <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',lineHeight:1.5,margin:'0 0 16px'}}>
          Thrift, vintage, antique &amp; consignment shops near {zip}, closest first.
        </p>

        {loading ? (
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:10,padding:'60px 0'}}>
            {Icon('Loader',28,{stroke:'var(--text-faint)'})}
            <div style={{fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-muted)'}}>Finding stores near you…</div>
          </div>
        ) : error ? (
          <div style={{display:'flex',alignItems:'flex-start',gap:10,background:'var(--amber-bg)',borderRadius:'var(--radius-lg)',padding:'12px 14px'}}>
            {Icon('AlertTriangle',16,{stroke:'var(--amber-600)'})}
            <span style={{fontFamily:'var(--font-sans)',fontSize:13,color:'var(--amber-600)',lineHeight:1.5}}>{error}</span>
          </div>
        ) : stores.length === 0 ? (
          <div style={{textAlign:'center',padding:'48px 16px'}}>
            <div style={{fontSize:40,marginBottom:10}}>🗺️</div>
            <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',margin:0}}>No vintage stores found nearby.</p>
          </div>
        ) : (
          stores.map(store => (
            <VintageStoreCard key={store.id} store={store} inTrip={tripIds.includes(store.id)} onToggleTrip={()=>onToggleTrip(store.id)} />
          ))
        )}
      </div>
    </div>
  );
}

// ── Account Screen ─────────────────────────────────────────────────────────────
function AccountScreen({ radiusMi, setRadiusMi, zip, setZip, authUser, onSignOut, onUpdateUser, userListings=[], onDeleteListing, onOpenSale, savedCount=0, onOpenNotifications, onReplayWalkthrough, tripIds=[], onToggleTrip, onStoresLoaded }) {
  const [name, setName] = useState(authUser?.name || 'Rummager');
  const [avatar, setAvatar] = useState(authUser?.avatar || null);
  const digestEmail = authUser?.email || '';
  const [saleTypes, setSaleTypes] = useState({estate:true,yard:true,moving:true});
  const [push, setPush] = useState(false);
  const [newSales, setNewSales] = useState(true);
  const [reminders, setReminders] = useState(true);
  const [dailyDigest, setDailyDigest] = useState(!!authUser?.digestOptIn);
  const [digestToast, setDigestToast] = useState(null);
  const [soundOn, setSoundOn] = useState(() => isSoundEnabled());
  const toggleSound = (checked) => { setSoundEnabled(checked); setSoundOn(checked); };

  const syncDigestSubscription = (enabled, overrides={}) => {
    const emailToUse = overrides.email ?? digestEmail;
    if (!emailToUse) return;
    const body = enabled
      ? { email: emailToUse, zip: overrides.zip ?? zip, radiusMi: overrides.radiusMi ?? radiusMi, saleTypes: overrides.saleTypes ?? saleTypes }
      : { email: emailToUse };
    fetch(`${API_BASE}${enabled ? '/api/subscribe' : '/api/unsubscribe'}`, {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body),
    }).catch(()=>{});
  };

  // newSales/reminders are intentionally still inert -- no trigger logic
  // exists server-side yet to back them (this phase only proves the
  // register-device -> backend-can-send pipeline works, via a manual test
  // send). Wiring them now would claim behavior that doesn't exist.
  const togglePush = async (checked) => {
    if (!checked) {
      setPush(false);
      if (digestEmail) {
        fetch(`${API_BASE}/api/push/register`, {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ email: digestEmail, pushToken: null }),
        }).catch(()=>{});
      }
      setDigestToast('Push notifications turned off');
      setTimeout(()=>setDigestToast(null), 3000);
      return;
    }
    if (!digestEmail) {
      setDigestToast('Sign in to enable push notifications');
      setTimeout(()=>setDigestToast(null), 3000);
      return;
    }
    const PN = window.Capacitor?.Plugins?.PushNotifications;
    if (!PN) {
      setDigestToast('Push notifications need the Rummage app, not the browser');
      setTimeout(()=>setDigestToast(null), 3000);
      return;
    }
    try {
      const perm = await PN.requestPermissions();
      if (perm.receive !== 'granted') {
        setDigestToast('Push permission denied — enable it in iOS Settings to turn this on');
        setTimeout(()=>setDigestToast(null), 3000);
        return;
      }
      await PN.register(); // device token arrives via the app-level 'registration' listener
      setPush(true);
      setDigestToast('Push notifications turned on');
      setTimeout(()=>setDigestToast(null), 3000);
    } catch (err) {
      setDigestToast("Couldn't turn on push notifications — try again");
      setTimeout(()=>setDigestToast(null), 3000);
    }
  };

  const toggleDailyDigest = (checked) => {
    if (checked && !digestEmail) {
      setDigestToast('Sign in with an email to get the daily digest');
      setTimeout(()=>setDigestToast(null), 3000);
      return;
    }
    setDailyDigest(checked);
    onUpdateUser?.({ ...authUser, digestOptIn: checked });
    syncDigestSubscription(checked);
    setDigestToast(checked ? "Daily digest on — we'll email you today's sales each morning" : 'Daily digest turned off');
    setTimeout(()=>setDigestToast(null), 3000);
  };

  // Edit sheet: null | 'profile' | 'zip' | 'radius' | 'types'
  const [sheet, setSheet] = useState(null);
  const [draft, setDraft] = useState({});
  const [page, setPage] = useState(null); // null | 'help' | 'feedback' | 'terms' | 'privacy' | 'pricecheck'
  const [deleteConfirm, setDeleteConfirm] = useState(null); // listing id pending delete

  const openSheet = (key) => {
    const defaults = {
      profile: { name, avatar },

    setDraft(defaults[key]);
    setSheet(key);
  };

  const saveSheet = () => {
    if (sheet==='profile') {
      const newName   = draft.name;
      const newAvatar = draft.avatar ?? null;
      setName(newName);
      setAvatar(newAvatar);
      onUpdateUser?.({ ...authUser, name: newName, avatar: newAvatar });

    if (sheet==='zip')    setZip(draft.zip);
    if (sheet==='radius') setRadiusMi(draft.radiusMi);
    if (sheet==='types')  setSaleTypes(draft.saleTypes);
    if (dailyDigest && ['zip','radius','types'].includes(sheet)) {

    setSheet(null);

  const typeCount = Object.values(saleTypes).filter(Boolean).length;

              Edit
            </button>
          </div>
          <div style={{padding:'0 16px 16px'}}>
            <div style={{marginTop:-28,marginBottom:10,display:'inline-block',borderRadius:'50%',border:'3px solid var(--surface-card)',overflow:'hidden',position:'relative',zIndex:1}}>
              <Avatar name={name} size={56} emoji={avatar} />
            </div>
            <div style={{fontWeight:800,letterSpacing:'-0.025em',fontSize:20,color:'var(--text-primary)'}}>{name}</div>
            <div style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:13,color:'var(--text-muted)',marginTop:2}}>{Icon('MapPin',13,{stroke:'var(--accent)'})} {zip}</div>
            {/* Stats row */}
            <div style={{display:'flex',gap:0,marginTop:14,borderTop:'1px solid var(--border-default)',paddingTop:14}}>
              {[
                {n: savedCount,         label:'Saved'},
                {n: userListings.length, label:'Listed'},
              ].map((stat,i) => (
                <div key={i} style={{flex:1,textAlign:'center',borderRight:i===0?'1px solid var(--border-default)':'none'}}>
                  <div style={{fontWeight:800,fontSize:22,color:'var(--ink-900)',letterSpacing:'-0.02em'}}>{stat.n}</div>
                  <div style={{fontFamily:'var(--font-sans)',fontSize:12,color:'var(--text-muted)',marginTop:1}}>{stat.label}</div>
                </div>
              ))}
            </div>
          </div>
        </Card>

        {/* Search defaults */}
        <div className="rmg-eyebrow" style={{padding:'0 4px 8px',marginTop:22}}>Search defaults</div>
        <Card padded={false}>
          <ListRow first icon={Icon('MapPin',18)} label="Home ZIP code" value={zip} trailing={chev} onClick={()=>openSheet('zip')} />
          <ListRow icon={Icon('Ruler',18)} label="Default radius" value={`${radiusMi} mi`} trailing={chev} onClick={()=>openSheet('radius')} />

        {/* Notifications */}

        <Card padded={false}>
          <ListRow first icon={Icon('Bell',18)} label="Push notifications" trailing={<Switch checked={push} onChange={togglePush} />} />
          <ListRow icon={Icon('Sparkles',18)} label="New sales nearby" sublabel="Within your radius" trailing={<Switch checked={newSales} onChange={setNewSales} />} />
          <ListRow icon={Icon('Clock',18)} label="Sale reminders" sublabel="1 hour before saved sales" trailing={<Switch checked={reminders} onChange={setReminders} />} />
          <ListRow icon={Icon('Mail',18)} label="Daily digest email" sublabel={digestEmail ? `Today's sales, sent to ${digestEmail}` : 'Sign in to enable'} trailing={<Switch checked={dailyDigest} onChange={toggleDailyDigest} />} />
          {onOpenNotifications && (
            <ListRow icon={Icon('BellRing',18)} label="View notifications" trailing={chev} onClick={onOpenNotifications} />
          )}
        </Card>

        {/* Sound */}
        <div className="rmg-eyebrow" style={{padding:'0 4px 8px',marginTop:22}}>Sound</div>
        <Card padded={false}>
          <ListRow first icon={Icon(soundOn ? 'Volume2' : 'VolumeX',18)} label="Sound effects" sublabel="Pings, chimes, and confetti sounds" trailing={<Switch checked={soundOn} onChange={toggleSound} />} />

        {/* My Listings */}
        <div className="rmg-eyebrow" style={{padding:'0 4px 8px',marginTop:22}}>My Listings</div>
        {userListings.length === 0 ? (
          <Card>
