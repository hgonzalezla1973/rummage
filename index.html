      <div style={{paddingTop:'var(--safe-top)'}} />
      <div style={{padding:'8px 20px 0'}}>
        <h1 style={{fontSize:32,fontWeight:900,letterSpacing:'-0.03em',color:'var(--ink-900)',lineHeight:1.05,marginBottom:4}}>
          {step===1 ? 'List Your Sale' : step===2 ? 'Sale Details' : 'Preview'}
        </h1>
        <p style={{fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-muted)',margin:'0 0 14px'}}>
          {step===1 ? 'What kind of sale are you hosting?' : step===2 ? 'Tell shoppers where and when to show up.' : 'This is how your listing will appear.'}
        </p>
      </div>

      {/* Step progress */}
      <div style={{display:'flex',gap:6,margin:'0 20px 4px'}}>
        {STEPS.map((label,i) => {
          const n = i+1, active = n===step, done = n<step;
          return (
            <div key={n} style={{flex:1,display:'flex',flexDirection:'column',gap:5,alignItems:'center'}}>
              <div style={{width:'100%',height:4,borderRadius:2,background:done||active?'var(--accent)':'var(--ink-100)',transition:'background var(--dur-base)',boxShadow:active?'0 2px 8px rgba(249,115,22,.4)':'none'}} />
              <span style={{fontFamily:'var(--font-sans)',fontSize:10,fontWeight:active?700:500,color:active?'var(--accent)':done?'var(--ink-600)':'var(--text-faint)'}}>{label}</span>
            </div>
          );
        })}
      </div>

      {/* ── Step 1: Type + Photos ── */}
      {step===1 && (
        <div style={{padding:'16px 20px 120px',display:'flex',flexDirection:'column',gap:24}}>
          <div>
            <div className="rmg-eyebrow" style={{marginBottom:12}}>Sale type</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              {[
                {key:'estate',bg:'#F5F3FF',fg:'#7C3AED',emoji:'🛋️',desc:'Full household'},
                {key:'yard',  bg:'#F0FDF4',fg:'#15803D',emoji:'⛺', desc:'Driveway or yard'},
                {key:'thrift',bg:'#FFF7ED',fg:'#C2410C',emoji:'👗', desc:'Ongoing store'},
                {key:'moving',bg:'#FFFBEB',fg:'#B45309',emoji:'📦', desc:'Everything must go'},
              ].map(tc => {
                const on = saleType===tc.key;
                return (
                  <button key={tc.key} type="button" onClick={()=>setSaleType(tc.key)} style={{
                    position:'relative',display:'flex',flexDirection:'column',alignItems:'flex-start',
                    padding:'16px 14px 14px',gap:6,
                    background: on ? tc.fg : tc.bg,
                    border:'3px solid ' + (on ? tc.fg : 'transparent'),
                    borderRadius:'var(--radius-xl)',cursor:'pointer',textAlign:'left',
                    transition:'all var(--dur-base) var(--ease-spring)',
                    boxShadow: on ? '0 8px 24px ' + tc.fg + '55' : 'none',
                  }}>
                    <span style={{fontSize:30,lineHeight:1}}>{tc.emoji}</span>
                    <div style={{fontWeight:800,fontSize:14,lineHeight:1.2,color:on?'#fff':tc.fg}}>{CAT[tc.key].label}</div>
                    <div style={{fontFamily:'var(--font-sans)',fontSize:11,color:on?'rgba(255,255,255,.75)':tc.fg+'99',lineHeight:1.3}}>{tc.desc}</div>
                    <span style={{
                      position:'absolute',top:10,right:10,width:20,height:20,borderRadius:'50%',
                      border:'2px solid ' + (on ? 'rgba(255,255,255,.6)' : tc.fg + '55'),
                      background:on?'rgba(255,255,255,.25)':'transparent',
                      display:'flex',alignItems:'center',justifyContent:'center',
                    }}>
                      {on && Icon('Check',11,{stroke:'#fff',sw:3})}
                    </span>
                  </button>
                );
              })}
            </div>
          </div>

          <div>
            <div className="rmg-eyebrow" style={{marginBottom:10}}>
              Photos
              <span style={{textTransform:'none',fontWeight:400,letterSpacing:0,fontSize:12,color:'var(--text-faint)',marginLeft:6}}>optional — up to 4</span>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              {[0,1,2,3].map(idx=>(
                <label key={idx} htmlFor={`rmg-photo-${idx}`} style={{
                  aspectRatio:'4/3',borderRadius:'var(--radius-lg)',overflow:'hidden',
                  background:photos[idx]?'transparent':'var(--surface-sunken)',
                  border:`1.5px dashed ${photos[idx]?'transparent':'var(--border-strong)'}`,
                  display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',position:'relative',
                }}>
                  {photos[idx]
                    ? <>
                        <img src={photos[idx]} style={{width:'100%',height:'100%',objectFit:'cover'}} />
                        <span style={{position:'absolute',top:5,right:5,width:20,height:20,borderRadius:'50%',background:'rgba(0,0,0,.55)',display:'flex',alignItems:'center',justifyContent:'center'}}
                          onClick={e=>{e.preventDefault();setPhotos(p=>{const n=[...p];n[idx]=null;return n;});}}>
                          {Icon('X',11,{stroke:'#fff',sw:2.5})}
                        </span>
                      </>
                    : <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6,color:'var(--text-faint)'}}>
                        {Icon('ImagePlus',26,{stroke:'currentColor'})}
                        <span style={{fontFamily:'var(--font-sans)',fontSize:11,fontWeight:500}}>{idx===0?'Cover photo':'Add photo'}</span>
                      </div>
                  }
                  <input id={`rmg-photo-${idx}`} type="file" accept="image/*" style={{display:'none'}} onChange={e=>handleFile(e,idx)} />
                </label>
              ))}
            </div>
          </div>

          <div style={{display:'flex',gap:10}}>
            <Btn variant="secondary" size="lg" onClick={()=>setStep(0)}>Back</Btn>
            <Btn variant="primary" size="lg" fullWidth trailingIcon={Icon('ArrowRight',18)} onClick={()=>setStep(2)}>Continue</Btn>
          </div>
        </div>
      )}

      {/* ── Step 2: Details ── */}
      {step===2 && (
        <div style={{padding:'16px 20px 120px',display:'flex',flexDirection:'column',gap:14}}>
          <div>
            <Label required>Listing title</Label>
            <RmgInput placeholder="e.g. Weekend Yard Sale" value={title}
              onChange={e=>setTitle(e.target.value)} onBlur={()=>setTouched(t=>({...t,title:true}))}
              style={errStyle('title')} />
            <ErrMsg field="title" />
          </div>
          <div>
            <Label required>Street address</Label>
            <RmgInput leadingIcon={Icon('MapPin',19)} placeholder="123 Main St" value={addr}
              onChange={e=>setAddr(e.target.value)} onBlur={()=>setTouched(t=>({...t,addr:true}))}
              style={errStyle('addr')} />
            <ErrMsg field="addr" />
          </div>
          <div>
            <Label required>ZIP code</Label>
            <RmgInput placeholder="90601" inputMode="numeric" value={zip}
              onChange={e=>setZip(e.target.value)} onBlur={()=>setTouched(t=>({...t,zip:true}))}
              style={errStyle('zip')} />
            <ErrMsg field="zip" />
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <div>
              <Label required>Start date</Label>
              <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)}
                onBlur={()=>setTouched(t=>({...t,startDate:true}))}
                style={{...inputStyle,...errStyle('startDate')}} />
              <ErrMsg field="startDate" />
            </div>
            <div>
              <Label>End date</Label>
              <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)} style={inputStyle} />
            </div>
          </div>
          <div>
            <Label>Hours</Label>
            <RmgInput leadingIcon={Icon('Clock',19)} placeholder="e.g. 8am – 3pm" value={hrs} onChange={e=>setHrs(e.target.value)} />
          </div>
          <div>
            <Label>How can shoppers reach you?</Label>
            <RmgInput leadingIcon={Icon('Phone',19)} placeholder="Phone number or email address" value={contact} onChange={e=>setContact(e.target.value)} />
            <div style={{fontFamily:'var(--font-sans)',fontSize:12,color:'var(--text-faint)',marginTop:5,lineHeight:1.5}}>
              Shoppers will see a "Contact Seller" button on your listing. Only visible to Rummage users.
            </div>
          </div>
          <div>
            <Label>Description</Label>
            <textarea placeholder="What's for sale? Furniture, clothing, tools, collectibles…"
              value={desc} onChange={e=>setDesc(e.target.value)}
              style={{...inputStyle,height:'auto',minHeight:100,padding:'12px 14px',resize:'vertical',lineHeight:1.5}} />
          </div>
          <div style={{display:'flex',gap:10,marginTop:4}}>
            <Btn variant="secondary" size="lg" onClick={()=>setStep(1)}>Back</Btn>
            <Btn variant="primary" size="lg" fullWidth trailingIcon={Icon('ArrowRight',18)} onClick={tryNext2}>Preview</Btn>
          </div>
        </div>
      )}

      {/* ── Step 3: Preview + Publish ── */}
      {step===3 && (
        <div style={{padding:'16px 20px 120px',display:'flex',flexDirection:'column',gap:18}}>
          <Card padded={false} style={{overflow:'hidden'}}>
            <div style={{height:190,background:'var(--surface-sunken)',position:'relative',overflow:'hidden'}}>
              {photos.find(Boolean)
                ? <img src={photos.find(Boolean)} style={{width:'100%',height:'100%',objectFit:'cover'}} />
                : <div style={{height:'100%',background:`linear-gradient(135deg,${({estate:'#F5F3FF,#C4B5FD',yard:'#F0FDF4,#86EFAC',thrift:'#FFF7ED,#FED7AA',moving:'#FFFBEB,#FDE68A'})[saleType]||'#FFF7ED,#FED7AA'})`,display:'flex',alignItems:'center',justifyContent:'center',opacity:.7}}>
                    {Icon('Image',36,{stroke:'#fff',sw:1})}
                  </div>
              }
              <div style={{position:'absolute',top:10,left:10}}><SaleTypeTag type={saleType} /></div>
              {photos.filter(Boolean).length>1 && (
                <div style={{position:'absolute',bottom:10,right:10,background:'rgba(28,25,23,.65)',borderRadius:'var(--radius-pill)',padding:'3px 10px',fontFamily:'var(--font-mono)',fontSize:11,color:'#fff',fontWeight:600}}>
                  +{photos.filter(Boolean).length-1} more
                </div>
              )}
            </div>
            <div style={{padding:'14px 16px 18px'}}>
              <div style={{fontWeight:800,letterSpacing:'-0.025em',fontSize:19,color:'var(--text-primary)',marginBottom:5}}>{title}</div>
              <div style={{display:'flex',alignItems:'center',gap:6,fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-muted)',marginBottom:3}}>
                {Icon('MapPin',13,{stroke:'var(--accent)'})} {addr}, {zip}
              </div>
              <div style={{display:'flex',flexWrap:'wrap',gap:'4px 14px',fontFamily:'var(--font-mono)',fontSize:12,color:'var(--text-muted)',marginBottom:contact?6:0}}>
                <span style={{display:'flex',alignItems:'center',gap:4}}>{Icon('Calendar',12)} {fmtDate(startDate)}{endDate&&endDate!==startDate?' – '+fmtDate(endDate):''}</span>
                {hrs && <span style={{display:'flex',alignItems:'center',gap:4}}>{Icon('Clock',12)} {hrs}</span>}
              </div>
              {contact && (
                <div style={{display:'inline-flex',alignItems:'center',gap:6,marginTop:4,padding:'5px 12px',borderRadius:'var(--radius-pill)',background:'var(--brand-50)',boxShadow:'0 0 0 1.5px var(--brand-200)'}}>
                  {Icon('Phone',13,{stroke:'var(--accent)'})}
                  <span style={{fontFamily:'var(--font-sans)',fontSize:12,fontWeight:600,color:'var(--accent)'}}>Contact Seller</span>
                </div>
              )}
              {desc && <div style={{fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-secondary)',marginTop:8,lineHeight:1.5}}>{desc}</div>}
            </div>
          </Card>

          {!contact && (
            <div style={{background:'var(--surface-sunken)',borderRadius:'var(--radius-lg)',padding:'12px 14px',display:'flex',gap:10,alignItems:'flex-start'}}>
              {Icon('Info',16,{stroke:'var(--ink-500)'})}
              <p style={{fontFamily:'var(--font-sans)',fontSize:12,color:'var(--text-muted)',margin:0,lineHeight:1.5}}>
                No contact info added. Shoppers won't be able to reach you directly. <span style={{color:'var(--accent)',fontWeight:600,cursor:'pointer'}} onClick={()=>setStep(2)}>Add it now →</span>
              </p>
            </div>
          )}

          <div style={{display:'flex',gap:10}}>
            <Btn variant="secondary" size="lg" onClick={()=>setStep(2)}>Edit</Btn>
            <Btn variant="primary" size="lg" fullWidth leadingIcon={Icon('Rocket',18)} onClick={publish}>Publish Listing</Btn>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState('explore');
  const [authUser, _setAuthUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem('rummage_user') || 'null'); } catch { return null; }
  });
  const setAuthUser = user => {
    if (user) localStorage.setItem('rummage_user', JSON.stringify(user));
    else localStorage.removeItem('rummage_user');
    _setAuthUser(user);
  };
  const [activeTypes, setActiveTypes] = useState({});
  const [openNow, setOpenNow]         = useState(false);
  const [keyword, setKeyword]         = useState('');
  const [detailId, setDetailId] = useState(null);
  const [filtersOpen, setFiltersOpen] = useState(false);
  const [radiusMi, setRadiusMi] = useState(5);
  const [savedIds, setSavedIds] = useState({});
  const [userListings, setUserListings] = useState([]);
  const [apiListings, setApiListings]   = useState([]);
  const [apiStatus, setApiStatus]       = useState('idle'); // idle | loading | ok | error
  const [scale, setScale] = useState(1);
  const [libsReady, setLibsReady] = useState(false);
  const frameRef = useRef(null);

  // Fetch live listings from local backend
  const fetchApiListings = (zip, radius) => {
    setApiStatus('loading');
    fetch(`http://localhost:3002/api/listings?zip=${zip}&radius=${radius}`)
      .then(r => r.json())
      .then(data => { setApiListings(data.listings || []); setApiStatus('ok'); })
      .catch(() => setApiStatus('error'));
  };

  useEffect(() => {
    const fit = () => {
      const s = Math.min((window.innerWidth - 32) / 390, (window.innerHeight - 32) / 844, 1);
      setScale(Math.max(s, 0.2));
    };
    window.addEventListener('resize', fit);
    fit();
    const poll = setInterval(() => {
      if (window.lucide?.icons) { clearInterval(poll); setLibsReady(true); }
    }, 60);
    // Try to pull live listings on load
    fetchApiListings('90601', 10);
    // Restore any pending reminders from localStorage
    if (Notification.permission === 'granted') restoreReminders(ALL_SALES);
    return () => { window.removeEventListener('resize', fit); clearInterval(poll); };
  }, []);

  // Re-fetch when radius changes (debounced 600ms)
  const radiusRef = useRef(radiusMi);
  useEffect(() => {
    radiusRef.current = radiusMi;
    const t = setTimeout(() => fetchApiListings('90601', radiusMi), 600);
    return () => clearTimeout(t);
  }, [radiusMi]);

  const MO_IDX = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);

  const kwMatch = (s) => {
    if (!keyword.trim()) return true;
    const q = keyword.toLowerCase();
    return [s.title, s.blurb, s.address, s.neighborhood, ...(s.items||[])].join(' ').toLowerCase().includes(q);
  };

  const allSales = [...ALL_SALES, ...apiListings, ...userListings]
    .map(s => {
      const mock = MOCK_LATLNG[s.id];
      return {
        ...s,
        lat: s.lat ?? (mock ? mock[0] : null),
        lng: s.lng ?? (mock ? mock[1] : null),
        saved: !!savedIds[s.id],
      };
    })
    .filter(s => {
      const label = s.dateLabel || '';
      if (!label) return true;
      // Scan for every "MonthName DD" or "MonthName DD, YYYY" — use the LAST match (end of range)
      const hits = [...label.matchAll(/([A-Za-z]{3,9})\s+(\d{1,2})(?:,?\s*(\d{4}))?/g)]
        .filter(m => MO_IDX[m[1].toLowerCase().slice(0,3)] !== undefined);
      if (hits.length) {
        const m    = hits[hits.length - 1];
        const mo   = MO_IDX[m[1].toLowerCase().slice(0,3)];
        const day  = parseInt(m[2]);
        const year = m[3] ? parseInt(m[3]) : todayStart.getFullYear();
        const endDay = new Date(year, mo, day);
        return endDay >= todayStart;
      }
      return true; // no parseable month+day → keep visible
    });
  let salesInRadius = allSales.filter(s=>s.distanceMi<=radiusMi).filter(kwMatch);
  if (salesInRadius.length===0 && !keyword) salesInRadius = allSales.slice(0,1);
  const detailSale = allSales.find(s=>s.id===detailId)||null;
  const savedCount = allSales.filter(s=>s.saved).length;

  const toggleSave = (id) => setSavedIds(p=>({...p,[id]:!p[id]}));
  const ic = (name, size) => libsReady ? Icon(name, size) : null;

  const tabItems = [
    {key:'explore',label:'Explore',  icon:ic('Map',24)},
    {key:'saved',  label:'Saved',    icon:ic('Heart',24),badge:savedCount>0},
    {key:'list',   label:'List',     icon:ic('PlusCircle',24)},
    {key:'search', label:'Search',   icon:ic('Search',24)},
    {key:'account',label:'Account',  icon:ic('User',24)},
  ];

  return (
    <div style={{position:'fixed',inset:0,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',background:'linear-gradient(145deg,#1C1917 0%,#292524 50%,#3C3330 100%)'}}>
      <div style={{width:390,height:844,flexShrink:0,position:'relative',background:'var(--surface-app)',borderRadius:52,overflow:'hidden',boxShadow:'0 40px 90px rgba(0,0,0,.55),0 0 0 11px #0C0A09,0 0 0 13px #211E1D',transform:`scale(${scale})`}}>

        {/* App screens */}
        {tab==='explore' && !detailSale && (
          <ExploreScreen sales={salesInRadius} radiusMi={radiusMi} apiStatus={apiStatus}
            onOpenSale={setDetailId} onOpenFilters={()=>setFiltersOpen(true)} onToggleSave={toggleSave}
            activeTypes={activeTypes} setActiveTypes={setActiveTypes}
            openNow={openNow} setOpenNow={setOpenNow}
            keyword={keyword} onClearKeyword={()=>setKeyword('')} />
        )}
        {tab==='saved' && !detailSale && (
          <SavedScreen sales={allSales} onOpenSale={setDetailId} onToggleSave={toggleSave} />
        )}
        {tab==='search' && !detailSale && (
          <SearchScreen radiusMi={radiusMi} setRadiusMi={setRadiusMi}
            activeTypes={activeTypes} setActiveTypes={setActiveTypes}
            keyword={keyword} setKeyword={setKeyword}
            onSearch={()=>setTab('explore')} />
        )}
        {tab==='list' && !detailSale && (
          <ListScreen onPublish={listing=>{setUserListings(p=>[...p,listing]);setTab('explore');}} />
        )}
        {tab==='account' && !detailSale && (
          authUser
            ? <AccountScreen
                radiusMi={radiusMi} setRadiusMi={setRadiusMi}
                authUser={authUser}
                onSignOut={()=>setAuthUser(null)}
                onUpdateUser={user=>setAuthUser(user)}
                userListings={userListings}
                savedCount={savedCount}
                onDeleteListing={id=>setUserListings(p=>p.filter(l=>l.id!==id))}
                onOpenSale={id=>{setDetailId(id);}}
              />
            : <AuthScreen onAuth={user=>setAuthUser(user)} />
        )}

        {/* Tab bar */}
        {!detailSale && (
          <div style={{position:'absolute',left:0,right:0,bottom:0,zIndex:30}}>
            <TabBar active={tab} onChange={k=>{setTab(k);setDetailId(null);}} items={tabItems} />
          </div>
        )}

        {/* Filters sheet */}
        {filtersOpen && (
          <FiltersSheet onClose={()=>setFiltersOpen(false)} radiusMi={radiusMi} setRadiusMi={setRadiusMi} count={salesInRadius.length} />
        )}

        {/* Detail */}
        {detailSale && (
          <div style={{position:'absolute',inset:0,zIndex:60}}>
            <DetailScreen sale={detailSale} onBack={()=>setDetailId(null)} onToggleSave={toggleSave} />
          </div>
        )}

        {/* iOS status bar */}
        <div style={{position:'absolute',top:0,left:0,right:0,height:54,zIndex:70,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px 32px 0',pointerEvents:'none',fontFamily:'var(--font-sans)',fontWeight:700,fontSize:15,color:'var(--ink-900)'}}>
          <span style={{fontVariantNumeric:'tabular-nums'}}>9:41</span>
          <span style={{display:'inline-flex',gap:7,alignItems:'center'}}>
            <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7.5" width="3" height="4.5" rx="1" fill="currentColor"/><rect x="5" y="5" width="3" height="7" rx="1" fill="currentColor"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
            <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M1.6 4.4a10 10 0 0 1 13.8 0" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><path d="M4.4 7.3a6 6 0 0 1 8.2 0" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><circle cx="8.5" cy="10.3" r="1.6" fill="currentColor"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.2" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="18" height="8" rx="1.8" fill="currentColor"/><path d="M23 4v4a2.1 2.1 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>
          </span>
        </div>
        <div style={{position:'absolute',top:11,left:'50%',transform:'translateX(-50%)',width:120,height:34,background:'#14110F',borderRadius:20,zIndex:75}} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
