        {store.rating && (
          <div style={{display:'flex',alignItems:'center',gap:10,marginTop:8}}>
            <span style={{display:'inline-flex',alignItems:'center',gap:3,fontFamily:'var(--font-sans)',fontSize:12,color:'var(--text-muted)',fontWeight:600}}>
              {Icon('Star',13,{fill:'#E8A93B',stroke:'#E8A93B'})} {store.rating}{store.ratingsCount ? ` (${store.ratingsCount})` : ''}
            </span>
          </div>
        )}
        <div style={{display:'flex',gap:8,marginTop:12}}>
          <Btn variant="secondary" size="sm" fullWidth leadingIcon={Icon('Navigation',14)} onClick={openDirections}>Directions</Btn>
          <Btn variant={inTrip ? 'primary' : 'secondary'} size="sm" fullWidth leadingIcon={Icon(inTrip?'Check':'Plus',14)} onClick={onToggleTrip}>
            {inTrip ? 'In trip' : 'Add to trip'}
          </Btn>
        </div>
      </div>
    </Card>
  );
}

function VintageStoresScreen({ onBack, zip, tripIds=[], onToggleTrip, onStoresLoaded }) {
  const [loading, setLoading] = useState(true);
  const [stores, setStores]   = useState([]);
  const [error, setError]     = useState(null);

  useEffect(() => {
    setLoading(true); setError(null);
    fetch(`${API_BASE}/api/vintage-stores?zip=${encodeURIComponent(zip)}`)
      .then(r => r.json())
      .then(data => {
        if (data.error) { setError(data.error); setStores([]); }
        else { setStores(data.stores || []); onStoresLoaded && onStoresLoaded(data.stores || []); }
      })
      .catch(() => setError('Could not reach the server. Make sure server.js is running.'))
      .finally(() => setLoading(false));
  }, [zip]);

  return (
    <div style={{position:'absolute',inset:0,background:'var(--surface-app)',zIndex:50,display:'flex',flexDirection:'column'}}>
      <div style={{paddingTop:'var(--safe-top)',background:'rgba(246,246,246,0.96)',backdropFilter:'blur(24px)',borderBottom:'1px solid var(--line)'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,padding:'10px 16px 14px'}}>
          <IconButton icon={Icon('ChevronLeft',22)} shape="circle" aria-label="Back" onClick={onBack} />
          <h1 style={{fontSize:20,fontWeight:800,letterSpacing:'-0.02em',color:'var(--ink-900)',margin:0}}>Vintage Stores</h1>
        </div>
      </div>

      <div style={{flex:1,overflowY:'auto',padding:'18px 20px 48px'}}>
        <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',lineHeight:1.5,margin:'0 0 16px'}}>
          Thrift, vintage, antique &amp; consignment shops near {zip}, closest first.
        </p>

        {loading ? (
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:10,padding:'60px 0'}}>
            {Icon('Loader',28,{stroke:'var(--text-faint)'})}
            <div style={{fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-muted)'}}>Finding stores near you…</div>
          </div>
        ) : error ? (
          <div style={{display:'flex',alignItems:'flex-start',gap:10,background:'var(--amber-bg)',borderRadius:'var(--radius-lg)',padding:'12px 14px'}}>
            {Icon('AlertTriangle',16,{stroke:'var(--amber-600)'})}
            <span style={{fontFamily:'var(--font-sans)',fontSize:13,color:'var(--amber-600)',lineHeight:1.5}}>{error}</span>
          </div>
        ) : stores.length === 0 ? (
          <div style={{textAlign:'center',padding:'48px 16px'}}>
            <div style={{fontSize:40,marginBottom:10}}>🗺️</div>
            <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',margin:0}}>No vintage stores found nearby.</p>
          </div>
        ) : (
          stores.map(store => (
            <VintageStoreCard key={store.id} store={store} inTrip={tripIds.includes(store.id)} onToggleTrip={()=>onToggleTrip(store.id)} />
          ))
        )}
      </div>
    </div>
  );
}

// ── Account Screen ─────────────────────────────────────────────────────────────
function AccountScreen({ radiusMi, setRadiusMi, zip, setZip, authUser, onSignOut, onUpdateUser, userListings=[], onDeleteListing, onOpenSale, savedCount=0, onOpenNotifications, onReplayWalkthrough, tripIds=[], onToggleTrip, onStoresLoaded }) {
  const [name, setName] = useState(authUser?.name || 'Rummager');
  const [avatar, setAvatar] = useState(authUser?.avatar || null);
  const digestEmail = authUser?.email || '';
  const [saleTypes, setSaleTypes] = useState({estate:true,yard:true,moving:true});
  const [interestTags, setInterestTags] = useState({});
  const [push, setPush] = useState(false);
  const [newSales, setNewSales] = useState(true);
  const [reminders, setReminders] = useState(true);
  const [interestAlerts, setInterestAlerts] = useState(true);
  const [dailyDigest, setDailyDigest] = useState(!!authUser?.digestOptIn);
  const [digestToast, setDigestToast] = useState(null);

  const syncDigestSubscription = (enabled, overrides={}) => {
    const emailToUse = overrides.email ?? digestEmail;
    if (!emailToUse) return;
    const body = enabled
      ? { email: emailToUse, zip: overrides.zip ?? zip, radiusMi: overrides.radiusMi ?? radiusMi, saleTypes: overrides.saleTypes ?? saleTypes }
      : { email: emailToUse };
    fetch(`${API_BASE}${enabled ? '/api/subscribe' : '/api/unsubscribe'}`, {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body),
    }).catch(()=>{});
  };

  const togglePush = async (checked) => {
    if (!checked) {
      setPush(false);
      if (digestEmail) {
        fetch(`${API_BASE}/api/push/register`, {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ email: digestEmail, pushToken: null }),
        }).catch(()=>{});
      }
      setDigestToast('Push notifications turned off');
      setTimeout(()=>setDigestToast(null), 3000);
      return;
    }
    if (!digestEmail) {
      setDigestToast('Sign in to enable push notifications');
      setTimeout(()=>setDigestToast(null), 3000);
      return;
    }
    const PN = window.Capacitor?.Plugins?.PushNotifications;
    if (!PN) {
      setDigestToast('Push notifications need the Rummage app, not the browser');
      setTimeout(()=>setDigestToast(null), 3000);
      return;
    }
    try {
      const perm = await PN.requestPermissions();
      if (perm.receive !== 'granted') {
        setDigestToast('Push permission denied — enable it in iOS Settings to turn this on');
        setTimeout(()=>setDigestToast(null), 3000);
        return;
      }
      await PN.register(); // device token arrives via the app-level 'registration' listener
      setPush(true);
      setDigestToast('Push notifications turned on');
      setTimeout(()=>setDigestToast(null), 3000);
    } catch (err) {
      setDigestToast("Couldn't turn on push notifications — try again");
      setTimeout(()=>setDigestToast(null), 3000);
    }
  };

  // These two only set a preference flag server-side (whether an already-
  // registered device should receive that category of push) -- they don't
  // themselves register for push, so they're meaningful even before the
  // master "Push notifications" toggle above has ever been turned on.
  const toggleNewSales = (checked) => {
    setNewSales(checked);
    if (digestEmail) {
      fetch(`${API_BASE}/api/push/register`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ email: digestEmail, notifyNewSales: checked }),
      }).catch(()=>{});
    }
  };
  const toggleReminders = (checked) => {
    setReminders(checked);
    if (digestEmail) {
      fetch(`${API_BASE}/api/push/register`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ email: digestEmail, notifyReminders: checked }),
      }).catch(()=>{});
    }
  };
  const toggleInterestAlerts = (checked) => {
    setInterestAlerts(checked);
    if (digestEmail) {
      fetch(`${API_BASE}/api/push/register`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ email: digestEmail, notifyInterests: checked }),
      }).catch(()=>{});
    }
  };

  const toggleDailyDigest = (checked) => {
    if (checked && !digestEmail) {
      setDigestToast('Sign in with an email to get the daily digest');
      setTimeout(()=>setDigestToast(null), 3000);
      return;
    }
    setDailyDigest(checked);
    onUpdateUser?.({ ...authUser, digestOptIn: checked });
    syncDigestSubscription(checked);
    setDigestToast(checked ? "Daily digest on — we'll email you today's sales each morning" : 'Daily digest turned off');
    setTimeout(()=>setDigestToast(null), 3000);
  };

  // Edit sheet: null | 'profile' | 'zip' | 'radius' | 'types' | 'mapsApp' | 'interests'
  const [sheet, setSheet] = useState(null);
  const [draft, setDraft] = useState({});
  const [page, setPage] = useState(null); // null | 'help' | 'feedback' | 'terms' | 'privacy' | 'pricecheck'
  const [deleteConfirm, setDeleteConfirm] = useState(null); // listing id pending delete
  const [mapsApp, setMapsApp] = useState(() => getPreferredMapsApp());

  const openSheet = (key) => {
    const defaults = {
      profile:   { name, avatar },
      zip:       { zip },
      radius:    { radiusMi },
      types:     { saleTypes: {...saleTypes} },
      mapsApp:   { mapsApp },
      interests: { interestTags: {...interestTags} },
    };
    setDraft(defaults[key]);
    setSheet(key);
  };

  const saveSheet = () => {
    if (sheet==='profile') {
      const newName   = draft.name;
      const newAvatar = draft.avatar ?? null;
      setName(newName);
      setAvatar(newAvatar);
      onUpdateUser?.({ ...authUser, name: newName, avatar: newAvatar });
    }
    if (sheet==='zip')    setZip(draft.zip);
    if (sheet==='radius') setRadiusMi(draft.radiusMi);
    if (sheet==='types')  setSaleTypes(draft.saleTypes);
    if (sheet==='mapsApp') { setPreferredMapsApp(draft.mapsApp); setMapsApp(draft.mapsApp); }
    if (sheet==='interests') {
      setInterestTags(draft.interestTags);
      const selected = Object.keys(draft.interestTags).filter(k => draft.interestTags[k]);
      if (digestEmail) {
        fetch(`${API_BASE}/api/push/register`, {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ email: digestEmail, interestTags: selected, notifyInterests: selected.length > 0 }),
        }).catch(()=>{});
      }
    }
    if (dailyDigest && ['zip','radius','types'].includes(sheet)) {
      syncDigestSubscription(true, {
        zip: sheet==='zip' ? draft.zip : undefined,
        radiusMi: sheet==='radius' ? draft.radiusMi : undefined,
        saleTypes: sheet==='types' ? draft.saleTypes : undefined,
      });
    }
    setSheet(null);
  };

  const typeCount = Object.values(saleTypes).filter(Boolean).length;
  const typesLabel = typeCount === Object.keys(saleTypes).length ? 'All' : typeCount === 0 ? 'None' : `${typeCount} selected`;
  const interestCount = Object.values(interestTags).filter(Boolean).length;
  const interestsLabel = interestCount === 0 ? 'None' : `${interestCount} selected`;
  const chev = Icon('ChevronRight',18,{stroke:'var(--text-faint)'});

  return (
    <>
    <div style={{position:'absolute',inset:0,overflowY:'auto',background:'var(--surface-app)'}}>
      <div style={{paddingTop:'var(--safe-top)'}} />
      <div style={{padding:'8px 20px 120px'}}>
        <h1 style={{fontSize:36,fontWeight:900,letterSpacing:'-0.03em',color:'var(--ink-900)',lineHeight:1.05,marginBottom:16}}>Account</h1>

        {/* Profile card */}
        <Card padded={false}>
          {/* Banner */}
          <div style={{height:56,background:'var(--ink-900)',position:'relative'}}>
            <button type="button" onClick={()=>openSheet('profile')}
              style={{position:'absolute',top:8,right:12,fontFamily:'var(--font-sans)',fontWeight:600,fontSize:13,color:'rgba(255,255,255,.9)',background:'rgba(255,255,255,.18)',border:'none',borderRadius:'var(--radius-btn)',padding:'5px 14px',cursor:'pointer',backdropFilter:'blur(4px)'}}>
              Edit
            </button>
          </div>
          <div style={{padding:'16px 16px'}}>
            <div style={{fontWeight:800,letterSpacing:'-0.025em',fontSize:20,color:'var(--text-primary)'}}>{name}</div>
            <div style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:13,color:'var(--text-muted)',marginTop:2}}>{Icon('MapPin',13,{stroke:'var(--accent)'})} {zip}</div>
            {/* Stats row */}
            <div style={{display:'flex',gap:0,marginTop:14,borderTop:'1px solid var(--border-default)',paddingTop:14}}>
              {[
                {n: savedCount,         label:'Saved'},
                {n: userListings.length, label:'Listed'},
              ].map((stat,i) => (
                <div key={i} style={{flex:1,textAlign:'center',borderRight:i===0?'1px solid var(--border-default)':'none'}}>
                  <div style={{fontWeight:800,fontSize:22,color:'var(--ink-900)',letterSpacing:'-0.02em'}}>{stat.n}</div>
                  <div style={{fontFamily:'var(--font-sans)',fontSize:12,color:'var(--text-muted)',marginTop:1}}>{stat.label}</div>
                </div>
              ))}
            </div>
          </div>
        </Card>

        {/* Search defaults */}
        <div className="rmg-eyebrow" style={{padding:'0 4px 8px',marginTop:22}}>Search defaults</div>
        <Card padded={false}>
          <ListRow first icon={Icon('MapPin',18)} label="Home ZIP code" value={zip || 'Not set'} trailing={chev} onClick={()=>openSheet('zip')} />
          <ListRow icon={Icon('Ruler',18)} label="Default radius" value={`${radiusMi} mi`} trailing={chev} onClick={()=>openSheet('radius')} />
          <ListRow icon={Icon('Tag',18)} label="Sale types" value={typesLabel} trailing={chev} onClick={()=>openSheet('types')} />
          <ListRow icon={Icon('Sparkles',18)} label="Interests" value={interestsLabel} trailing={chev} onClick={()=>openSheet('interests')} />
          <ListRow icon={Icon('Navigation',18)} label="Preferred maps app" value={MAPS_APPS.find(a=>a.key===mapsApp)?.label || 'Apple Maps'} trailing={chev} onClick={()=>openSheet('mapsApp')} />
        </Card>

        {/* Notifications */}
        <div className="rmg-eyebrow" style={{padding:'0 4px 8px',marginTop:22}}>Notifications</div>
        <Card padded={false}>
          <ListRow first icon={Icon('Bell',18)} label="Push notifications" trailing={<Switch checked={push} onChange={togglePush} />} />
          <ListRow icon={Icon('Sparkles',18)} label="New sales nearby" sublabel="Within your radius" trailing={<Switch checked={newSales} onChange={toggleNewSales} />} />
          <ListRow icon={Icon('Clock',18)} label="Sale reminders" sublabel="About 30 min before saved sales" trailing={<Switch checked={reminders} onChange={toggleReminders} />} />
          <ListRow icon={Icon('Sparkles',18)} label="Interest alerts" sublabel="When a sale lists something you're into" trailing={<Switch checked={interestAlerts} onChange={toggleInterestAlerts} />} />
          <ListRow icon={Icon('Mail',18)} label="Daily digest email" sublabel={digestEmail ? `Today's sales, sent to ${digestEmail}` : 'Sign in to enable'} trailing={<Switch checked={dailyDigest} onChange={toggleDailyDigest} />} />
          {onOpenNotifications && (
            <ListRow icon={Icon('BellRing',18)} label="View notifications" trailing={chev} onClick={onOpenNotifications} />
          )}
        </Card>

        {/* My Listings */}
        <div className="rmg-eyebrow" style={{padding:'0 4px 8px',marginTop:22}}>My Listings</div>
        {userListings.length === 0 ? (
          <Card>
            <div style={{textAlign:'center',padding:'10px 0 6px'}}>
              <div style={{fontSize:32,marginBottom:8}}>🏷️</div>
              <div style={{fontWeight:700,fontSize:15,color:'var(--ink-900)',marginBottom:4}}>No listings yet</div>
              <div style={{fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-muted)',lineHeight:1.5}}>
                Post your first sale from the List tab and it'll appear here.
              </div>
            </div>
          </Card>
        ) : (
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {userListings.map(listing => (
              <div key={listing.id} style={{background:'var(--surface-card)',borderRadius:'var(--radius-xl)',border:'1px solid var(--border-default)',overflow:'hidden'}}>
                <div style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px'}}>
                  {/* Thumbnail */}
                  <div style={{width:56,height:56,borderRadius:'var(--radius-lg)',overflow:'hidden',flexShrink:0,background:'var(--surface-sunken)'}}>
                    {listing.images?.[0]
                      ? <img src={listing.images[0]} style={{width:'100%',height:'100%',objectFit:'cover'}} />
                      : <div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center'}}>
                          {Icon('Image',22,{stroke:'var(--text-faint)'})}
                        </div>
                    }
                  </div>
                  {/* Info */}
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:700,fontSize:14,color:'var(--ink-900)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{listing.title}</div>
                    <div style={{fontFamily:'var(--font-sans)',fontSize:12,color:'var(--text-muted)',marginTop:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{listing.address}</div>
                    <div style={{display:'flex',alignItems:'center',gap:6,marginTop:4}}>
                      <SaleTypeTag type={listing.type} size="xs" />
                      {listing.dateLabel && (
                        <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'var(--text-faint)'}}>{listing.dateLabel}</span>
                      )}
                    </div>
                  </div>
                  {/* Actions */}
                  <div style={{display:'flex',gap:6,flexShrink:0}}>
                    <button type="button" onClick={()=>onOpenSale?.(listing.id)}
                      style={{height:32,padding:'0 12px',borderRadius:'var(--radius-btn)',background:'var(--brand-50,#ede9ff)',border:'none',cursor:'pointer',fontFamily:'var(--font-sans)',fontWeight:600,fontSize:12,color:'var(--secondary)',whiteSpace:'nowrap'}}>
                      View
                    </button>
                    <button type="button" onClick={()=>setDeleteConfirm(listing.id)}
                      style={{width:32,height:32,borderRadius:'50%',background:'var(--surface-sunken)',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                      {Icon('Trash2',15,{stroke:'#EF4444'})}
                    </button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}

        {/* Vintage Stores access moved to the Explore screen's "Thrift Stores"
            chip, so its Account entry was removed. */}
        {/* Price Check disabled 2026-08-27 -- see the block comment around
            PriceCheckScreen for why and how to re-enable.
        <div className="rmg-eyebrow" style={{padding:'0 4px 8px',marginTop:22}}>Tools</div>
        <Card padded={false}>
          <ListRow first icon={Icon('Camera',18)} label="Price Check" sublabel="Snap a photo, get an estimated value" trailing={chev} onClick={()=>setPage('pricecheck')} />
        </Card>
        */}

        {/* Support */}
        <div className="rmg-eyebrow" style={{padding:'0 4px 8px',marginTop:22}}>Support</div>
        <Card padded={false}>
          <ListRow first icon={Icon('CircleHelp',18)} label="Help & FAQ" trailing={chev} onClick={()=>setPage('help')} />
          <ListRow icon={Icon('MessageSquare',18)} label="Send feedback" trailing={chev} onClick={()=>setPage('feedback')} />
          <ListRow icon={Icon('FileText',18)} label="Terms of Service" trailing={chev} onClick={()=>setPage('terms')} />
          <ListRow icon={Icon('Shield',18)} label="Privacy" trailing={chev} onClick={()=>setPage('privacy')} />
          {onReplayWalkthrough && (
            <ListRow icon={Icon('Sparkles',18)} label="Replay app tutorial" trailing={chev} onClick={onReplayWalkthrough} />
          )}
        </Card>
        <div style={{marginTop:16}}>
          <Card padded={false}>
            {authUser?.guest
              ? <ListRow first icon={Icon('LogIn',18)} label="Sign in" sublabel="Create a free account to save your settings" onClick={onSignOut} />
              : <ListRow first icon={Icon('LogOut',18)} label="Sign out" danger onClick={onSignOut} />
            }
          </Card>
        </div>
        <div style={{textAlign:'center',marginTop:18,fontFamily:'var(--font-mono)',fontSize:11,color:'var(--text-faint)'}}>Rummage · v1.0.0</div>
      </div>
    </div>

    {/* Overlays below render as siblings of the scrollable content above,
        not descendants of it -- position:absolute,inset:0 on a descendant
        of a scrolled overflowY:auto container is relative to that
        container's (scrolled-away) top, not the current viewport, so an
        overlay opened while scrolled down (e.g. any Support row, which
        sits well below the fold) would mount pinned off-screen above the
        visible area and look like the tap did nothing. */}

    {/* Delete confirmation sheet */}
      {deleteConfirm && (
        <div style={{position:'absolute',inset:0,zIndex:80,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
          <div onClick={()=>setDeleteConfirm(null)} style={{position:'absolute',inset:0,background:'rgba(28,25,23,.42)',backdropFilter:'blur(2px)'}} />
          <div style={{position:'relative',background:'var(--surface-card)',borderRadius:'var(--radius-xl) var(--radius-xl) 0 0',padding:'24px 20px 36px',boxShadow:'var(--shadow-sheet)'}}>
            <div style={{textAlign:'center',marginBottom:20}}>
              <div style={{width:52,height:52,borderRadius:'50%',background:'#FEF2F2',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px'}}>
                {Icon('Trash2',24,{stroke:'#EF4444'})}
              </div>
              <div style={{fontWeight:800,fontSize:19,color:'var(--ink-900)',marginBottom:6}}>Delete listing?</div>
              <div style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',lineHeight:1.5}}>
                This will remove your listing from the map immediately. This can't be undone.
              </div>
            </div>
            <div style={{display:'flex',gap:10}}>
              <Btn variant="ghost" size="lg" fullWidth onClick={()=>setDeleteConfirm(null)}>Cancel</Btn>
              <Btn variant="primary" size="lg" fullWidth onClick={()=>{onDeleteListing?.(deleteConfirm);setDeleteConfirm(null);}}
                style={{background:'#EF4444',boxShadow:'0 4px 16px rgba(239,68,68,.35)'}}>
                Delete
              </Btn>
            </div>
          </div>
        </div>
      )}

      {/* Edit profile sheet */}
      {sheet==='profile' && (
        <EditSheet title="Edit profile" onSave={saveSheet} onCancel={()=>setSheet(null)}>
          {/* Name field */}
          <div>
            <label style={{fontFamily:'var(--font-sans)',fontWeight:600,fontSize:13,color:'var(--ink-900)',display:'block',marginBottom:6}}>Display name</label>
            <RmgInput placeholder="Your name" value={draft.name||''} onChange={e=>setDraft(d=>({...d,name:e.target.value}))} />
          </div>
        </EditSheet>
      )}

      {/* Edit ZIP sheet */}
      {sheet==='zip' && (
        <EditSheet title="Home ZIP code" onSave={saveSheet} onCancel={()=>setSheet(null)}>
          <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',margin:0}}>Sales are sorted by distance from this ZIP code.</p>
          <RmgInput leadingIcon={Icon('MapPin',19)} placeholder="e.g. 90601" inputMode="numeric"
            value={draft.zip||''} onChange={e=>setDraft(d=>({...d,zip:e.target.value}))} />
        </EditSheet>
      )}

      {/* Edit radius sheet */}
      {sheet==='radius' && (
        <EditSheet title="Default radius" onSave={saveSheet} onCancel={()=>setSheet(null)}>
          <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',margin:0}}>How far out to search when you open the app.</p>
          <DistanceStepper value={draft.radiusMi||5} onChange={v=>setDraft(d=>({...d,radiusMi:v}))} />
        </EditSheet>
      )}

      {/* Edit sale types sheet */}
      {sheet==='types' && (
        <EditSheet title="Sale types" onSave={saveSheet} onCancel={()=>setSheet(null)}>
          <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',margin:0}}>Only show these types by default on the map.</p>
          <div style={{display:'flex',flexDirection:'column',gap:2}}>
            {FILTER_TYPES.map(t => {
              const on = !!draft.saleTypes?.[t.key];
              return (

// ── Trip routing helpers ──────────────────────────────────────────────────────
function fmtDist(m) {
  const ft = Math.round(m * 3.281);
  if (ft < 1000) return `${ft} ft`;
  return `${(m / 1609.34).toFixed(1)} mi`;
}
function fmtTime(s) {
  const m = Math.round(s / 60);
  if (m < 60) return `${m} min`;
  return `${Math.floor(m / 60)}h ${m % 60}m`;
}
async function fetchOsrmRoute(waypoints) {
  // waypoints: [{lat,lng}, ...]. steps=false -- the app only ever shows
  // per-leg distance/duration (a passive preview), never turn-by-turn
  // instructions, so there's no need to pay for OSRM's step breakdown.
  const coords = waypoints.map(p => `${p.lng},${p.lat}`).join(';');
  const url = `https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=false`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('OSRM error');
  const data = await r.json();
  if (!data.routes?.length) throw new Error('No route');
  const route = data.routes[0];
  return {
    geometry: route.geometry.coordinates,   // [[lng,lat], ...]
    legs: route.legs,
    totalDist: route.distance,
    totalTime: route.duration,
  };
}

// ── Maps app preference ──────────────────────────────────────────────────────
// Which external navigation app "Directions" hands off to. Persisted like the
// other simple device-local prefs in this file (trip, saved).
const MAPS_APPS = [
  { key:'google', label:'Google Maps' },
  { key:'waze',   label:'Waze' },
  { key:'apple',  label:'Apple Maps' },
];
// Defaults to Apple Maps -- it's always present and works natively with no
// separate app install, unlike Google Maps/Waze, which on a device that
// doesn't have them installed silently falls back to opening their website
// in a browser instead of "the native mapping functionality" App Review
// expects to be reachable out of the box, before a user ever visits the
// preference in Account settings.
function getPreferredMapsApp() {
  try { return localStorage.getItem('rummage_maps_app') || 'apple'; } catch (_) { return 'apple'; }
}
function setPreferredMapsApp(v) {
  try { localStorage.setItem('rummage_maps_app', v); } catch (_) {}
}

// Builds a directions URL for the given app. `dest` is {lat,lng} or a text
// {query}. `waypoints` (optional, Google-only) -- Waze and Apple Maps only
// have a documented single-destination URL scheme, so a multi-stop trip
// still resolves to just the final stop for those two. Origin is left out on
// purpose: every one of these apps resolves an omitted origin to the user's
// live location at the moment the link opens, fresher than a location we
// fetched earlier.
function buildMapsUrl(app, dest, waypoints) {
  const hasCoords = dest.lat != null && dest.lng != null;
  if (app === 'waze') {
    return hasCoords
      ? `https://waze.com/ul?ll=${dest.lat},${dest.lng}&navigate=yes`
      : `https://waze.com/ul?q=${encodeURIComponent(dest.query || '')}&navigate=yes`;
  }
  if (app === 'apple') {
    return hasCoords
      ? `https://maps.apple.com/?daddr=${dest.lat},${dest.lng}`
      : `https://maps.apple.com/?q=${encodeURIComponent(dest.query || '')}`;
  }
  if (hasCoords) {
    const params = new URLSearchParams({ api: '1', destination: `${dest.lat},${dest.lng}`, travelmode: 'driving' });
    if (waypoints?.length) params.set('waypoints', waypoints.map(w => `${w.lat},${w.lng}`).join('|'));
    return `https://www.google.com/maps/dir/?${params.toString()}`;
  }
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dest.query || '')}`;
}

// window.open(url, '_blank') is unreliable from inside the native WKWebView
// shell for a JS-invoked open (as opposed to a real <a target=_blank> click)
// -- Capacitor's popup handling doesn't consistently hand off to Safari/the
// target app for it, which is exactly what showed up as "the button doesn't
// do anything, I have to open Maps myself." Setting location.href instead
// routes through WKWebView's navigation delegate, which Capacitor does
// correctly intercept for external-domain and custom-scheme handoff, on both
// native and plain mobile web.
function openExternalUrl(url) {
  if (!url) return;
  window.location.href = url;
}

// Builds a trip-stops URL for the current preferred app (multi-stop only
// honored for Google -- see buildMapsUrl).
function buildTripMapsUrl(stops) {
  const pts = stops.filter(s => s.lat != null && s.lng != null).map(s => ({ lat: s.lat, lng: s.lng }));
  if (!pts.length) return null;
  const destination = pts[pts.length - 1];
  const waypoints = pts.slice(0, -1);
  return buildMapsUrl(getPreferredMapsApp(), destination, waypoints);
}

// ── Trip Map (Leaflet) ────────────────────────────────────────────────────────
function TripMap({ stops, userLoc, routeCoords, height = 260, interactive = true }) {
  const divRef = useRef(null);
  const mapRef = useRef(null);

  // Init map once
  useEffect(() => {
    if (!divRef.current || !window.L || mapRef.current) return;
    mapRef.current = window.L.map(divRef.current, { zoomControl: false, attributionControl: false, dragging: interactive, scrollWheelZoom: interactive });
    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapRef.current);
    return () => { if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; } };
  }, []);

  // Redraw stops + route when data changes
  useEffect(() => {
    const map = mapRef.current;
    if (!map || !window.L) return;
    map.eachLayer(l => { if (!(l instanceof window.L.TileLayer)) map.removeLayer(l); });

    const bounds = [];

    // Route polyline (real roads)
    if (routeCoords?.length > 1) {
      const latlngs = routeCoords.map(([lng, lat]) => [lat, lng]);
      window.L.polyline(latlngs, { color: '#0d9488', weight: 4, opacity: 0.85 }).addTo(map);
      latlngs.forEach(p => bounds.push(p));
    }

    // Origin dot
    if (userLoc) {
      window.L.circleMarker([userLoc.lat, userLoc.lng], {
        radius: 9, fillColor: '#3b82f6', color: '#fff', weight: 2.5, fillOpacity: 1
      }).addTo(map);
      bounds.push([userLoc.lat, userLoc.lng]);
    }

    // Stop markers
    stops.forEach((s, i) => {
      if (!s.lat || !s.lng) return;
      const icon = window.L.divIcon({
        html: `<div style="background:#0d9488;color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);font-family:sans-serif">${i + 1}</div>`,
        iconSize: [30, 30], iconAnchor: [15, 15], className: ''
      });
      window.L.marker([s.lat, s.lng], { icon }).addTo(map);
      bounds.push([s.lat, s.lng]);
    });

    if (bounds.length > 0) map.fitBounds(bounds, { padding: [32, 32], maxZoom: 15 });
    else map.setView([39.8283, -98.5795], 3); // nothing to show yet -- neutral view, not a real place
  }, [stops, userLoc, routeCoords]);

  return <div ref={divRef} style={{ width: '100%', height, borderRadius: 'var(--radius-xl)', overflow: 'hidden' }} />;
}

function TripPlannerPanel({ allSales, tripIds, onToggleTrip, onClearTrip, onClose, onOpenSale, asTab=false }) {
  const [userLoc, setUserLoc]       = useState(null);
  const [locError, setLocError]     = useState(null);
  const [route, setRoute]           = useState(null);   // {geometry, legs, totalDist, totalTime}
  const [routeLoading, setRouteLoading] = useState(false);
  const [routeError, setRouteError] = useState(null);

  const tripSales = allSales.filter(s => tripIds.includes(s.id));
  const ordered   = userLoc
    ? [...tripSales].sort((a, b) =>
        Math.hypot((a.lat||0)-userLoc.lat,(a.lng||0)-userLoc.lng) -
        Math.hypot((b.lat||0)-userLoc.lat,(b.lng||0)-userLoc.lng))
    : tripSales;

  // Get user location once on open. A locate attempt is bumped to retry
  // without leaving the screen after the user grants permission late (e.g.
  // they dismissed the browser prompt, then enabled it in settings).
  const [locateAttempt, setLocateAttempt] = useState(0);
  useEffect(() => {
    if (!navigator.geolocation) { setLocError('Location unavailable on this device'); return; }
    setLocError(null);
    navigator.geolocation.getCurrentPosition(
      pos => { setUserLoc({ lat: pos.coords.latitude, lng: pos.coords.longitude }); setLocError(null); },
      err => setLocError(
        err.code === 1 ? "Location access is off — enable it for this site in your browser or device settings"
        : err.code === 3 ? 'Location took too long to respond'
        : 'Could not get your location'
      ),
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 5 * 60 * 1000 }
    );
  }, [locateAttempt]);

  // Fetch OSRM route whenever stops or userLoc change -- purely a passive
  // preview (polyline + per-stop distance/time on the map below), not
  // turn-by-turn guidance. Actual navigation is handed off to Google Maps.
  useEffect(() => {
    const stops = ordered.filter(s => s.lat && s.lng);
    if (stops.length < 1) { setRoute(null); return; }
    const waypoints = userLoc ? [userLoc, ...stops] : stops;
    if (waypoints.length < 2) { setRoute(null); return; }
    setRouteLoading(true); setRouteError(null);
    fetchOsrmRoute(waypoints)
      .then(r => { setRoute(r); setRouteLoading(false); })
      .catch(() => { setRouteError('Could not load route'); setRouteLoading(false); });
  }, [tripIds, userLoc?.lat, userLoc?.lng]);

          <div style={{ fontFamily: 'var(--font-sans)', fontSize: 13, color: 'var(--text-muted)', marginTop: 1 }}>
            {routeLoading ? 'Calculating route…'
              : route ? `${fmtDist(route.totalDist)} · ${fmtTime(route.totalTime)} · ${ordered.length} stops`
              : ordered.length === 0 ? 'Add sales to plan a route'
              : `${ordered.length} ${ordered.length === 1 ? 'stop' : 'stops'} · sorted nearest first`}
          </div>
        </div>
        {!asTab && <IconButton icon={Icon('X', 20)} variant="ghost" aria-label="Close" onClick={onClose} />}
      </div>

        {/* Map */}
        <div style={{ padding: '0 14px 10px' }}>
          {tripSales.length > 0
            ? <TripMap stops={ordered} userLoc={userLoc} routeCoords={route?.geometry} />
            : <div style={{ height: 200, borderRadius: 'var(--radius-xl)', background: 'var(--surface-sunken)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 8 }}>
                {Icon('Route', 36, { stroke: 'var(--text-faint)' })}
                <div style={{ fontFamily: 'var(--font-sans)', fontSize: 14, color: 'var(--text-muted)' }}>Your route will appear here</div>
              </div>
          }
        </div>

        {/* Stops */}
        <div style={{ flex: 1, overflowY: 'auto', padding: '0 14px' }}>
          {tripSales.length === 0 ? (
            <div style={{ textAlign: 'center', padding: '24px 0 28px' }}>
              <div style={{ fontSize: 40, marginBottom: 8 }}>🗺️</div>
              <div style={{ fontWeight: 700, fontSize: 16, color: 'var(--ink-900)', marginBottom: 4 }}>No stops yet</div>
              <div style={{ fontFamily: 'var(--font-sans)', fontSize: 13, color: 'var(--text-muted)', lineHeight: 1.5 }}>
                Tap <strong>Add to trip</strong> on any sale card to build your route.

                <div style={{ flex: 1, minWidth: 0 }}>

                  {Icon('X', 13, { stroke: 'var(--text-muted)' })}
                </button>
              </div>
            ))
          )}
          <div style={{ height: 8 }} />
        </div>

        {/* Bottom actions */}
        <div style={{ padding: '12px 14px 36px', borderTop: '1px solid var(--border-default)', display: 'flex', flexDirection: 'column', gap: 10 }}>
          {/* {locError && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, background: 'var(--amber-bg)', borderRadius: 'var(--radius-lg)', padding: '10px 12px' }}>
              {Icon('AlertTriangle', 14, { stroke: 'var(--amber-600)' })}
              <span style={{ flex: 1, fontFamily: 'var(--font-sans)', fontSize: 12, color: 'var(--amber-600)', lineHeight: 1.4 }}>{locError}</span>
              <button type="button" onClick={() => setLocateAttempt(n => n + 1)} style={{ flexShrink: 0, background: 'none', border: 'none', cursor: 'pointer', fontFamily: 'var(--font-sans)', fontWeight: 700, fontSize: 12, color: 'var(--amber-600)', textDecoration: 'underline', padding: 0 }}>
                Retry
              </button>
            </div>
          )} */}
          <div style={{ display: 'flex', gap: 10 }}>
            {tripSales.length > 0 && (
              <Btn variant="ghost" size="lg" leadingIcon={Icon('Trash2', 16)} onClick={onClearTrip}>Clear</Btn>
            )}
            <Btn variant="primary" size="lg" fullWidth
              leadingIcon={Icon('Navigation', 18)}
              style={{ opacity: tripSales.length ? 1 : 0.5 }}
              onClick={() => openExternalUrl(tripSales.length ? buildTripMapsUrl(ordered) : null)}>
              Open in {MAPS_APPS.find(a => a.key === getPreferredMapsApp())?.label || 'Apple Maps'}
            </Btn>
          </div>
        </div>
    </>
  );

  if (asTab) {
    return (
      <div style={{ position: 'absolute', inset: 0, background: 'var(--surface-app)', display: 'flex', flexDirection: 'column', overflowY: 'auto' }}>
        <div style={{ paddingTop: 'var(--safe-top)' }} />
        {planContent}
        <div style={{ height: 90 }} />
      </div>
    );
  }

  return (
    <div style={{ position: 'absolute', inset: 0, zIndex: 65, display: 'flex', flexDirection: 'column', justifyContent: 'flex-end' }}>
      <div onClick={onClose} style={{ position: 'absolute', inset: 0, background: 'rgba(28,25,23,.45)', backdropFilter: 'blur(3px)' }} />
      <div style={{ position: 'relative', background: 'var(--paper)', borderRadius: 'var(--radius-xl) var(--radius-xl) 0 0', boxShadow: 'var(--shadow-sheet)', maxHeight: '92vh', display: 'flex', flexDirection: 'column' }}>
        {planContent}
      </div>
    </div>
  );
}

// Shared "open directions" behavior for a sale — used by the sale detail screen
// as well as the items gallery / item detail screens.
function openSaleDirections(s, onNavigateTo) {
  if (onNavigateTo) { onNavigateTo(); return; }
  const app = getPreferredMapsApp();
  // Prefer the precise pin coordinates over the address text — most sources
  // (Craigslist, OfferUp, Facebook) never expose a full street address, only
  // a city/neighborhood, which makes a text search land nowhere near the
  // actual location. We always have an accurate lat/lng for the map pin.
  const dest = s.lat != null && s.lng != null
    ? { lat: s.lat, lng: s.lng }
    : { query: [s.address, s.neighborhood].filter(Boolean).join(', ') };
  openExternalUrl(buildMapsUrl(app, dest));
}

// ── Share sheet ─────────────────────────────────────────────────────────────────
function ShareSheet({ sale, onClose }) {
  const [toast, setToast] = useState(null);
  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2500); };

  // sale.url is the scraped SOURCE listing (Craigslist/OfferUp/etc.) -- those
  // expire or get deleted constantly (especially Craigslist), so a shared
  // link built from it routinely goes dead within days and never pointed
  // back at Rummage anyway. Share the same stable /app?sale=<id> deep link
  // the daily digest email already uses instead.
  const url = sale?.id ? `https://rummagedeals.com/app?sale=${encodeURIComponent(sale.id)}` : window.location.href;
  const metaLine = [sale?.dateLabel, sale?.timeLabel, sale?.address || sale?.neighborhood].filter(Boolean).join(' · ');
  const shareText = sale?.title ? `${sale.title} — ${metaLine}` : metaLine;

  const openWindow = (u) => window.open(u, '_blank', 'noopener,noreferrer,width=600,height=640');

  const copyLink = async () => {
    try { await navigator.clipboard.writeText(`${shareText}\n${url}`); showToast('Link copied to clipboard'); }
    catch { showToast('Could not copy — try again'); }
  };

  const shareTo = (channel) => {
    switch (channel) {
      case 'facebook':
        openWindow(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`);
        break;
      case 'twitter':
        openWindow(`https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(url)}`);
        break;
      case 'instagram':
        // Instagram has no web share-intent API — copy the caption+link and hand off to Instagram.
        navigator.clipboard?.writeText(`${shareText}\n${url}`).catch(() => {});
        showToast('Caption copied — paste it into your Instagram post or DM');
        window.open('https://www.instagram.com/', '_blank', 'noopener,noreferrer');
        break;
      case 'chat':
        // Opens the device's default messaging app with the sale pre-filled.
        window.open(`sms:?&body=${encodeURIComponent(`${shareText} ${url}`)}`, '_blank');
        break;
    }
  };

  const CHANNELS = [
    { key:'facebook',  label:'Facebook',  icon:'Facebook',      bg:'#1877F2' },
    { key:'twitter',   label:'Twitter/X', icon:'Twitter',       bg:'#14171A' },
    { key:'instagram', label:'Instagram', icon:'Instagram',     bg:'linear-gradient(135deg,#F58529,#DD2A7B 60%,#8134AF)' },
    { key:'chat',      label:'Message',   icon:'MessageCircle', bg:'var(--secondary)' },
  ];

  return (
    <div style={{position:'absolute',inset:0,zIndex:9999,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
      <div onClick={onClose} style={{position:'absolute',inset:0,background:'rgba(28,25,23,.42)',backdropFilter:'blur(2px)'}} />
      <div style={{position:'relative',background:'var(--surface-app)',borderTopLeftRadius:'var(--radius-2xl)',borderTopRightRadius:'var(--radius-2xl)',padding:'10px 20px calc(24px + env(safe-area-inset-bottom,0px))',boxShadow:'var(--shadow-sheet)'}}>
        <div style={{width:36,height:4,borderRadius:2,background:'var(--ink-200)',margin:'2px auto 14px'}} />
        <div style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:18,color:'var(--text-primary)',marginBottom:4}}>Share this sale</div>
        {sale?.title && (
          <div style={{fontSize:13,color:'var(--text-muted)',marginBottom:16,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{sale.title}</div>
        )}
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:8}}>
          {CHANNELS.map(c => (
            <button key={c.key} type="button" onClick={()=>shareTo(c.key)} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6,background:'none',border:'none',cursor:'pointer',padding:'6px 0'}}>
              <span style={{width:52,height:52,borderRadius:'50%',background:c.bg,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'var(--shadow-sm)'}}>
                {Icon(c.icon,22,{stroke:'#fff'})}
              </span>
              <span style={{fontFamily:'var(--font-sans)',fontSize:11,color:'var(--text-secondary)',fontWeight:600}}>{c.label}</span>
            </button>
          ))}
        </div>
        <button type="button" onClick={copyLink} style={{width:'100%',display:'flex',alignItems:'center',gap:12,padding:'13px 4px',background:'none',border:'none',borderTop:'1px solid var(--border-default)',cursor:'pointer',textAlign:'left'}}>
          <span style={{width:36,height:36,borderRadius:'50%',background:'var(--surface-sunken)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{Icon('Link',17,{stroke:'var(--text-secondary)'})}</span>
          <span style={{fontFamily:'var(--font-sans)',fontWeight:600,fontSize:14,color:'var(--text-primary)'}}>Copy link</span>
        </button>
        {typeof navigator!=='undefined' && navigator.share && (
          <button type="button" onClick={async ()=>{
              try { await navigator.share({ title: sale?.title, text: shareText, url }); onClose(); }
              catch(e) { if (e.name !== 'AbortError') showToast('Could not share'); }
            }}
            style={{width:'100%',display:'flex',alignItems:'center',gap:12,padding:'13px 4px',background:'none',border:'none',borderTop:'1px solid var(--border-default)',cursor:'pointer',textAlign:'left'}}>
            <span style={{width:36,height:36,borderRadius:'50%',background:'var(--surface-sunken)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{Icon('Share2',17,{stroke:'var(--text-secondary)'})}</span>
            <span style={{fontFamily:'var(--font-sans)',fontWeight:600,fontSize:14,color:'var(--text-primary)'}}>More options…</span>
          </button>
        )}
      </div>
      {toast && (
        <div style={{position:'absolute',bottom:110,left:16,right:16,background:'var(--ink-900)',color:'#fff',borderRadius:'var(--radius-xl)',padding:'14px 18px',fontWeight:600,fontSize:14,textAlign:'center',boxShadow:'var(--shadow-lg)',animation:'slideUp .3s var(--ease-out)',zIndex:10000}}>
          {toast}
        </div>
      )}
    </div>
  );
}

function DetailScreen({ sale, onBack, hideBack=false, photoHeight, onToggleSave, inTrip=false, onToggleTrip, onNavigateTo, onOpenItems }) {
  const s = sale;
  const openDirections = () => openSaleDirections(s, onNavigateTo);
  const [shareOpen, setShareOpen] = useState(false);
  const { height: vh, isLandscape } = useViewport();

  return (
    <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',background:'var(--surface-app)',overflow:'hidden'}}>
      <div className="rmg-scroll-hidden" style={{flex:1,overflowY:'auto',overflowX:'hidden'}}>
        <PhotoGallery
          images={s.images}
          type={s.type}
          height={photoHeight ?? (isLandscape ? Math.min(280, Math.round(vh * 0.35)) : 280)}
          onBack={onBack}
          hideBack={hideBack}
          saved={s.saved}
          onSave={()=>onToggleSave(s.id)}
          sale={s}
          onShare={()=>setShareOpen(true)}
        />
        <div style={{padding:'16px 18px 0'}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10,flexWrap:'wrap'}}>
            <SaleTypeTag type={s.type} />
          </div>
          <h1 style={{fontWeight:800,letterSpacing:'-0.025em',fontSize:28,lineHeight:1.12,letterSpacing:'-0.02em',color:'var(--text-primary)'}}>{s.title}</h1>
          {/* Plain label/value list instead of icon-in-a-circle rows -- no
              icon glyph needed to tell "when" from "where" apart when the
              mono uppercase label already says so. */}
          <div style={{margin:'18px 0'}}>
            {[
              s.dateLabel && ['When', s.dateLabel, s.timeLabel],
              (s.address || s.neighborhood) && ['Where', s.address || s.neighborhood, `${s.distanceMi} mi away`],
              s.price && ['Price', s.price, null],
            ].filter(Boolean).map(([label,a,b],i)=>(
              <div key={i} style={{display:'flex',gap:16,padding:'11px 0',borderTop:'1px solid var(--border-default)'}}>
                <span style={{flex:'0 0 64px',fontFamily:'var(--font-mono)',fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:'var(--text-muted)',paddingTop:2}}>{label}</span>
                <div style={{minWidth:0}}>
                  <div style={{fontFamily:'var(--font-sans)',fontWeight:600,fontSize:15,color:'var(--text-primary)'}}>{a}</div>
                  {b && <div style={{fontFamily:'var(--font-mono)',fontSize:13,color:'var(--text-muted)',marginTop:2,fontVariantNumeric:'tabular-nums'}}>{b}</div>}
                </div>
              </div>
            ))}
            {/* Most sources only ever expose city/neighborhood, and even ones
                that can show a full street address often don't publish it
                until shortly before the sale (common industry practice, to
                avoid early crowding). A real street address starts with a
                house number -- city-only text never does -- so that's used
                to detect which case this listing is in. Directions already
                navigates by lat/lng regardless, so this is reassurance, not
                a limitation notice. */}
            {!/^\d/.test((s.address || '').trim()) && (
              <div style={{padding:'10px 0 0 80px',fontFamily:'var(--font-sans)',fontSize:12.5,color:'var(--text-muted)',lineHeight:1.4}}>
                Exact address not yet shared by the seller — tap Directions below for the precise location.
              </div>
            )}
          </div>
        </div>
        <div style={{margin:'0 18px',height:130,borderRadius:'var(--radius-xl)',overflow:'hidden',position:'relative',zIndex:0,isolation:'isolate',boxShadow:'var(--shadow-sm)'}}>
          <RealMap sales={s.lat ? [s] : []} selectedId={s.id} onSelect={()=>{}}
            centerLat={s.lat} centerLng={s.lng}
            zoom={15} interactive={false} />
        </div>
        <div style={{padding:'20px 18px 6px'}}>
          <h2 style={{fontWeight:800,letterSpacing:'-0.025em',fontSize:19,color:'var(--text-primary)',marginBottom:8}}>About this sale</h2>
          <p style={{fontFamily:'var(--font-sans)',fontSize:15,lineHeight:1.55,color:'var(--text-secondary)'}}>{s.blurb}</p>
        </div>
        {s.items && s.items.length>0 && (() => {
          // Real listings' items are usually just plain category tags with no
          // photo — a "See all" link into a gallery of blank placeholder
          // squares isn't useful, so only offer it when at least one item
          // actually has a real image worth looking at.
          const hasItemImages = s.items.some(it => typeof it==='object' && it && it.image);
          return (
            <div style={{padding:'14px 18px 8px'}}>
              {hasItemImages && (
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10,gap:8}}>
                  <h2 style={{fontWeight:800,letterSpacing:'-0.025em',fontSize:19,color:'var(--text-primary)'}}>What you'll find</h2>
                  {onOpenItems && (
                    <button type="button" onClick={onOpenItems} style={{background:'none',border:'none',cursor:'pointer',fontFamily:'var(--font-sans)',fontWeight:700,fontSize:13,color:'var(--secondary)',display:'flex',alignItems:'center',gap:2,flexShrink:0}}>
                      See all {s.items.length} {Icon('ChevronRight',14,{stroke:'currentColor'})}
                    </button>
                  )}
                </div>
              )}
              <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                {s.items.map((it,i)=>{
                  const label = typeof it==='string' ? it : it.name;
                  return (
                    <span key={typeof it==='string'?it:(it.id||i)} style={{fontFamily:'var(--font-sans)',fontWeight:500,fontSize:13,color:'var(--text-secondary)',background:'var(--surface-card)',boxShadow:'var(--shadow-xs)',padding:'7px 14px',borderRadius:'var(--radius-pill)'}}>{label}</span>
                  );
                })}
              </div>
            </div>
          );
        })()}
        {s.host && (
          <div style={{padding:'16px 18px 8px'}}>
            <Card>
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <Avatar name={s.host} size={44} />
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontFamily:'var(--font-sans)',fontWeight:600,fontSize:15,color:'var(--text-primary)'}}>{s.host}</div>
                  <div style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:13,color:'var(--text-muted)'}}>{Icon('BadgeCheck',13,{stroke:'var(--secondary)'})} Verified host</div>
                </div>
                {Icon('ChevronRight',20,{stroke:'var(--text-faint)'})}
              </div>
            </Card>
          </div>
        )}
        <div style={{height:80}} />
      </div>
      <div style={{padding:'12px 16px 28px',background:'rgba(246,246,246,.95)',backdropFilter:'blur(16px)',borderTop:'1.5px solid var(--border-default)',display:'flex',flexDirection:'column',gap:10}}>
        {s.contact ? (
          <Btn variant="primary" size="lg" fullWidth leadingIcon={Icon('MessageCircle',18)}
            onClick={()=>{
              const c = s.contact.trim();
              if (/^\+?[\d\s\-().]{7,}$/.test(c)) window.open('sms:'+c.replace(/\s/g,''),'_blank');
              else if (c.includes('@')) window.open('mailto:'+c,'_blank');
              else window.open('tel:'+c,'_blank');
            }}>
            Contact Seller
          </Btn>
        ) : null}
        <div style={{display:'flex',gap:8}}>
          {onToggleTrip ? (
            <>
              <button type="button" onClick={openDirections} aria-label="Directions" style={{
                width:52,height:52,borderRadius:'var(--radius-btn)',flexShrink:0,
                background:'var(--ink-900)',border:'1px solid var(--ink-200)',cursor:'pointer',
                display:'flex',alignItems:'center',justifyContent:'center',
              }}>
                {Icon('Navigation',20,{stroke:'#fff'})}
              </button>
              <div style={{flex:1,minWidth:0}}>
                <Btn variant={inTrip?'secondary':'primary'} fullWidth
                  leadingIcon={Icon(inTrip?'RouteOff':'Route',16)}
                  onClick={onToggleTrip}
                  style={inTrip?{borderColor:'var(--secondary)',color:'var(--secondary)'}:{}}>
                  {inTrip ? 'In trip' : 'Add to trip'}
                </Btn>
              </div>
            </>
          ) : (
            // No trip planner on the desktop web experience (SaleDetailPage /
            // the in-page preview modal both skip onToggleTrip) -- a lone
            // "Add to trip" there toggled state nothing on desktop could ever
            // show back, so Directions becomes the one full-width action
            // instead of sharing the row with a dead-looking icon button.
            <Btn variant="primary" size="lg" fullWidth leadingIcon={Icon('Navigation',18)} onClick={openDirections}>
              Directions
            </Btn>
          )}
        </div>
      </div>
      {shareOpen && <ShareSheet sale={s} onClose={()=>setShareOpen(false)} />}
    </div>
  );
}

function ItemThumb({ src, size, fallbackIcon, stroke='currentColor', sw=1.5 }) {
  const [failed, setFailed] = useState(false);
  if (!src || failed) return Icon(fallbackIcon, size, {stroke, sw});
  return <img src={src} onError={()=>setFailed(true)} style={{width:'100%',height:'100%',objectFit:'cover',filter:PHOTO_FILTER}} />;
}

        <div style={{padding:'20px 18px 8px'}}>
          <h2 style={{fontWeight:800,letterSpacing:'-0.025em',fontSize:17,color:'var(--text-primary)',marginBottom:10}}>Part of this sale</h2>
          <button type="button" onClick={onOpenSale} style={{width:'100%',textAlign:'left',display:'flex',alignItems:'center',gap:12,padding:12,background:'var(--surface-card)',border:'1px solid var(--border-default)',borderRadius:'var(--radius-lg)',boxShadow:'var(--shadow-xs)',cursor:'pointer'}}>

              <div style={{fontFamily:'var(--font-mono)',fontSize:12,color:'var(--text-muted)',marginTop:1}}>{sale.dateLabel} · {sale.distanceMi} mi</div>
            </div>

        {others.length>0 && (
          <div style={{padding:'12px 0 20px'}}>
            <div style={{padding:'0 18px',fontFamily:'var(--font-sans)',fontWeight:700,fontSize:15,color:'var(--text-primary)',marginBottom:10}}>More from this sale</div>
            <div style={{display:'flex',gap:10,overflowX:'auto',padding:'0 18px'}}>
              {others.map(o => (
                <button key={o.id} type="button" onClick={()=>onSelectItem(items.indexOf(o))} style={{width:104,flexShrink:0,background:'none',border:'none',padding:0,cursor:'pointer',textAlign:'left'}}>
                  <div style={{aspectRatio:'1',background:'linear-gradient(135deg,var(--brand-50),var(--paper-2))',borderRadius:'var(--radius-md)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--ink-300)',overflow:'hidden'}}>
                    {o.image ? <img src={o.image} style={{width:'100%',height:'100%',objectFit:'cover'}} /> : Icon('Image',22,{stroke:'currentColor',sw:1.5})}
                  </div>
                  {o.price!=null && <div style={{fontFamily:'var(--font-mono)',fontSize:12,color:'var(--text-primary)',marginTop:5}}>{o.price}</div>}
                </button>
              ))}
            </div>
          </div>
        )}
      </div>
      <div style={{display:'flex',gap:10,padding:'12px 16px 28px',background:'rgba(246,246,246,.95)',backdropFilter:'blur(16px)',borderTop:'1.5px solid var(--border-default)',flexShrink:0}}>
        <div style={{flex:1}}>
          <Btn variant="primary" size="lg" fullWidth leadingIcon={Icon('Navigation',18)}
            onClick={()=>openSaleDirections(sale)}>Get directions</Btn>
        </div>
      </div>
    </div>
  );
}

            <span style={{width:40,height:40,borderRadius:'50%',background:n.iconBg,color:n.iconFg,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              {Icon(n.icon,19,{stroke:'currentColor'})}

            <div style={{flex:1,minWidth:0}}>

// ── List a Sale screen ────────────────────────────────────────────────────────
function ListScreen({ onPublish }) {
  const [step, setStep]           = useState(0);
  const [saleType, setSaleType]   = useState('yard');
  const [photos, setPhotos]       = useState([]);
  const [title, setTitle]         = useState('');
  const [addr, setAddr]           = useState('');
  const [zip, setZip]             = useState('');
  const [startDate, setStartDate] = useState('');
  const [endDate, setEndDate]     = useState('');
  const [hrs, setHrs]             = useState('');
  const [desc, setDesc]           = useState('');
  const [contact, setContact]     = useState('');
  const [touched, setTouched]     = useState({});
  const [published, setPublished] = useState(null);
  const [previewIdx, setPreviewIdx] = useState(0);
  const [photoError, setPhotoError] = useState(null);
  const { isLandscape } = useViewport();

  // Replaces the photo already sitting in slot `idx` (re-picking an existing tile).
  const handleFile = (e, idx) => {
    const file = e.target.files?.[0];
    e.target.value = ''; // allow re-picking the same file after an error
    if (!file) return;
    setPhotoError(null);
    downscalePhoto(file).then(dataUrl => {
      setPhotos(prev => { const n=[...prev]; n[idx]=dataUrl; return n; });
    }).catch(() => {
      // Most likely cause: a HEIC/HEIF photo on a browser that can't decode
      // it client-side (Safari/iOS can; desktop Chrome and Firefox can't).
      setPhotoError("Couldn't read that photo — if it's a HEIC/HEIF file, try converting it to JPEG first, or use a different photo.");
    });
  };

  // Appends a new photo via the trailing "Add photo" tile — the grid has no
  // fixed slot count, so this just grows the array by one instead of writing
  // into a preallocated index.
  const handleAddFile = (e) => {
    const file = e.target.files?.[0];
    e.target.value = '';
    if (!file) return;
    setPhotoError(null);
    downscalePhoto(file).then(dataUrl => {
      setPhotos(prev => [...prev, dataUrl]);
    }).catch(() => {
      setPhotoError("Couldn't read that photo — if it's a HEIC/HEIF file, try converting it to JPEG first, or use a different photo.");
    });
  };

  // Keep listing categories honest — the title has to say what kind of sale it is.
  const titleTrimmed = title.trim();
  const titleHasCategory = /\b(yard|estate|moving)\b/i.test(titleTrimmed);
  const required2 = { title: !!titleTrimmed && titleHasCategory, addr: addr.trim(), zip: zip.trim(), startDate };
  const missing2  = Object.entries(required2).filter(([,v])=>!v).map(([k])=>k);
  const canNext2  = missing2.length === 0;

  const tryNext2 = () => {
    if (!canNext2) { setTouched({title:true,addr:true,zip:true,startDate:true}); return; }
    setPreviewIdx(0);
    setStep(3);
  };

  const fmtDate = iso => {
    if (!iso) return '';
    const [y,m,d] = iso.split('-').map(Number);
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return months[m-1]+' '+d+', '+y;
  };

  const publish = () => {
    const dateStr = fmtDate(startDate) + (endDate && endDate!==startDate ? ' – '+fmtDate(endDate) : '');
    const listing = {
      id: 'u'+Date.now(),
      type: saleType,
      title: title.trim(),
      address: addr.trim()+', '+zip.trim(),
      neighborhood: 'Your listing',
      distanceMi: 0.4,
      dateLabel: dateStr,
      timeLabel: hrs.trim() || 'Hours TBD',
      photoCount: photos.filter(Boolean).length,
      images: photos.filter(Boolean),
      blurb: desc.trim(),
      price: '',
      items: [],
      x: 50, y: 50,
      isOwnListing: true,
      contact: contact.trim(),
    };
    onPublish(listing);
    setPublished(listing);
    setStep(4);
  };

  const inputStyle = {
    width:'100%', height:48, padding:'0 14px',
    fontFamily:'var(--font-sans)', fontSize:14, color:'var(--text-primary)',
    background:'var(--surface-card)', border:'none', boxShadow:'var(--shadow-sm)',
    borderRadius:'var(--radius-md)', outline:'none', boxSizing:'border-box',
  };

  const errStyle = (field) => touched[field] && !required2[field] ? {borderColor:'#DC2626'} : {};

  const Label = ({children,required}) => (
    <label style={{fontFamily:'var(--font-sans)',fontWeight:600,fontSize:13,color:'var(--ink-900)',display:'block',marginBottom:6}}>
      {children}{required && <span style={{color:'#DC2626',marginLeft:3}}>*</span>}
    </label>
  );

  const ErrMsg = ({field}) => {
    if (!touched[field] || required2[field]) return null;
    const msg = field==='title' && titleTrimmed
      ? 'Title must include "yard", "estate", or "moving"'
      : 'This field is required';
    return <div style={{fontFamily:'var(--font-sans)',fontSize:12,color:'#DC2626',marginTop:4}}>{msg}</div>;
  };

  const STEPS = ['Sale type','Details','Preview'];

  if (step===0) {
    return (
      <div style={{position:'absolute',inset:0,overflowY:'auto',background:'var(--surface-app)'}}>
        <div style={{paddingTop:'var(--safe-top)'}} />
        <div style={{padding:'20px 20px 0'}}>
          <h1 style={{fontSize:32,fontWeight:900,letterSpacing:'-0.03em',color:'var(--ink-900)',lineHeight:1.05,marginBottom:4}}>Sell Your Stuff</h1>
          <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',margin:'0 0 24px',lineHeight:1.6}}>
            Got a garage full of treasures? List your sale and let local shoppers find you.
          </p>
        </div>

        {/* Hero CTA block */}
        <div style={{margin:'0 20px 20px'}}>
          <button type="button" onClick={()=>setStep(1)} style={{
            width:'100%',borderRadius:'var(--radius-2xl)',border:'none',cursor:'pointer',
            background:'var(--brand-grad)',
            padding:'28px 24px',textAlign:'left',
            transition:'transform var(--dur-base) var(--ease-spring), box-shadow var(--dur-base)',
          }}
            onMouseDown={e=>e.currentTarget.style.transform='scale(.98)'}
            onMouseUp={e=>e.currentTarget.style.transform='scale(1)'}
            onTouchStart={e=>e.currentTarget.style.transform='scale(.98)'}
            onTouchEnd={e=>e.currentTarget.style.transform='scale(1)'}
          >
            <div style={{fontSize:48,marginBottom:14,lineHeight:1}}>🏷️</div>
            <div style={{fontWeight:900,fontSize:24,color:'#fff',letterSpacing:'-0.03em',lineHeight:1.1,marginBottom:8}}>
              List Your Sale
            </div>
            <div style={{fontFamily:'var(--font-sans)',fontSize:14,color:'rgba(255,255,255,.8)',lineHeight:1.5,marginBottom:20}}>
              Post your yard sale, estate sale, or moving sale. It'll show up on the map so nearby shoppers can find you in minutes.
            </div>
            <div style={{display:'inline-flex',alignItems:'center',gap:8,background:'rgba(255,255,255,.2)',borderRadius:'var(--radius-pill)',padding:'10px 18px',backdropFilter:'blur(4px)'}}>
              <span style={{fontFamily:'var(--font-sans)',fontWeight:700,fontSize:14,color:'#fff'}}>Get started</span>
              {Icon('ArrowRight',16,{stroke:'#fff',sw:2.5})}
            </div>
          </button>
        </div>

        {/* How it works */}
        <div style={{padding:'0 20px calc(120px + var(--safe-bottom))'}}>
          <div className="rmg-eyebrow" style={{marginBottom:14}}>How it works</div>
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            {/* One neutral icon treatment for all three steps -- was a
                different hardcoded color+background per row (teal, green,
                blue), reading as a generic template feature list rather
                than this app's own single-accent language. */}
            {[
              {icon:'Tag',        step:'1', title:'Pick your sale type',   body:'Yard, estate, or moving — you choose.'},
              {icon:'FileText',   step:'2', title:'Add the details',       body:'Address, dates, hours, photos, and how shoppers can reach you.'},
              {icon:'MapPin',     step:'3', title:'Go live on the map',    body:'Your pin drops instantly. Local shoppers see it right away.'},
            ].map(row => (
              <div key={row.step} style={{display:'flex',alignItems:'flex-start',gap:14,padding:'16px 18px',background:'var(--surface-card)',borderRadius:'var(--radius-xl)',border:'1px solid var(--border-default)'}}>
                <div style={{width:42,height:42,borderRadius:'var(--radius-lg)',background:'var(--surface-sunken)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                  {Icon(row.icon,20,{stroke:'var(--ink-900)'})}
                </div>
                <div style={{minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:14,color:'var(--ink-900)',marginBottom:2}}>{row.title}</div>
                  <div style={{fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-muted)',lineHeight:1.4}}>{row.body}</div>
                </div>
                <div style={{width:22,height:22,borderRadius:0,background:'var(--brand-100)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontFamily:'var(--font-mono)',fontWeight:800,fontSize:11,color:'var(--secondary)'}}>
                  {row.step}
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  if (step===4 && published) {
    return (
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'var(--surface-app)',padding:'32px 24px',textAlign:'center'}}>
        <div style={{width:88,height:88,borderRadius:0,background:'var(--brand-50)',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:24}}>
          {Icon('CheckCircle',44,{stroke:'var(--accent)'})}
        </div>
        <h1 style={{fontSize:32,fontWeight:900,letterSpacing:'-0.03em',color:'var(--ink-900)',margin:'0 0 10px'}}>You're live!</h1>
        <p style={{fontFamily:'var(--font-sans)',fontSize:15,color:'var(--text-muted)',lineHeight:1.6,margin:'0 0 32px',maxWidth:280}}>
          Your {CAT[published.type]?.label.toLowerCase()} is on the map. Shoppers nearby can find it right now.
        </p>
        <Card padded={false} style={{overflow:'hidden',width:'100%',maxWidth:320,marginBottom:28,textAlign:'left'}}>
          <div style={{height:120,background:'var(--surface-sunken)',position:'relative',overflow:'hidden'}}>
            {published.images?.[0]
              ? <img src={published.images[0]} style={{width:'100%',height:'100%',objectFit:'cover'}} />
              : <div style={{height:'100%',background:'#E8E5DE',display:'flex',alignItems:'center',justifyContent:'center'}}>
                  {Icon('Image',32,{stroke:'#A39D8F',sw:1})}
                </div>
            }
          </div>
          <div style={{padding:'12px 14px 14px'}}>
            <div style={{marginBottom:3}}><SaleTypeTag type={published.type} size="sm" /></div>
            <div style={{fontWeight:800,fontSize:16,color:'var(--ink-900)',marginBottom:4}}>{published.title}</div>
            <div style={{fontFamily:'var(--font-sans)',fontSize:12,color:'var(--text-muted)'}}>{published.address}</div>
            <div style={{fontFamily:'var(--font-mono)',fontSize:12,color:'var(--text-muted)',marginTop:2}}>{published.dateLabel} · {published.timeLabel}</div>
          </div>
        </Card>
        {/* flex:'none' -- see the same override on the verify-email screen's
            button for why (this is the same vertical-centered-column shape). */}
        <Btn variant="primary" size="lg" fullWidth style={{flex:'none'}} leadingIcon={Icon('Map',18)} onClick={()=>{setStep(0);setTitle('');setAddr('');setZip('');setStartDate('');setEndDate('');setHrs('');setDesc('');setContact('');setPhotos([]);setTouched({});setPublished(null);}}>
          Back to Map
        </Btn>
      </div>
    );
  }

  return (
    <div style={{position:'absolute',inset:0,overflowY:'auto',background:'var(--surface-app)'}}>
      <div style={{paddingTop:'var(--safe-top)'}} />
      <div style={{padding:'8px 20px 0'}}>
        <h1 style={{fontSize:32,fontWeight:900,letterSpacing:'-0.03em',color:'var(--ink-900)',lineHeight:1.05,marginBottom:4}}>
          {step===1 ? 'List Your Sale' : step===2 ? 'Sale Details' : 'Preview'}
        </h1>
        <p style={{fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-muted)',margin:'0 0 14px'}}>
          {step===1 ? 'What kind of sale are you hosting?' : step===2 ? 'Tell shoppers where and when to show up.' : 'This is how your listing will appear.'}
        </p>
      </div>

      {/* Step progress */}
      <div style={{display:'flex',gap:6,margin:'0 20px 4px'}}>
        {STEPS.map((label,i) => {
          const n = i+1, active = n===step, done = n<step;
          return (
            <div key={n} style={{flex:1,display:'flex',flexDirection:'column',gap:5,alignItems:'center'}}>
              <div style={{width:'100%',height:4,borderRadius:0,background:done||active?'var(--accent)':'var(--ink-100)',transition:'background var(--dur-base)'}} />
              <span style={{fontFamily:'var(--font-sans)',fontSize:10,fontWeight:active?700:500,color:active?'var(--accent)':done?'var(--ink-600)':'var(--text-faint)'}}>{label}</span>
            </div>
          );
        })}
      </div>

      {/* ── Step 1: Type + Photos ── */}
      {step===1 && (
        <div style={{padding:'16px 20px 120px',display:'flex',flexDirection:'column',gap:24,maxWidth:isLandscape?480:undefined,margin:isLandscape?'0 auto':undefined}}>
          <div>
            <div className="rmg-eyebrow" style={{marginBottom:12}}>Sale type</div>
            <div style={{display:'grid',gridTemplateColumns:isLandscape?'1fr 1fr 1fr':'1fr 1fr',gap:10}}>
              {/* Same neutral treatment for all three types -- was a
                  different hardcoded bg/fg color per type plus a matching
                  colored glow when selected; now one flat unselected
                  style and one solid-black selected style, everywhere. */}
              {[
                {key:'estate',emoji:'🛋️',desc:'Full household'},
                {key:'yard',  emoji:'⛺', desc:'Driveway or yard'},
                {key:'moving',emoji:'📦', desc:'Everything must go'},
              ].map(tc => {
                const on = saleType===tc.key;
                return (
                  <button key={tc.key} type="button" onClick={()=>setSaleType(tc.key)} style={{
                    position:'relative',display:'flex',flexDirection:'column',alignItems:'flex-start',
                    padding:'16px 14px 14px',gap:6,
                    background: on ? 'var(--ink-900)' : 'var(--surface-sunken)',
                    border:'1px solid ' + (on ? 'var(--ink-900)' : 'var(--border-default)'),
                    borderRadius:'var(--radius-xl)',cursor:'pointer',textAlign:'left',
                    transition:'all var(--dur-base) var(--ease-spring)',

function WalkthroughScreen({ onDone, userName }) {
  const [idx, setIdx] = useState(0);
  const [dragStart, setDragStart] = useState(null);
  const [dragDelta, setDragDelta] = useState(0);
  const total = TUTORIAL_SLIDES.length;
  const last = idx === total - 1;

  const onTouchStart = e => setDragStart(e.touches[0].clientX);
  const onTouchMove  = e => { if (dragStart != null) setDragDelta(e.touches[0].clientX - dragStart); };
  const onTouchEnd   = () => {
    if (dragDelta < -44 && !last) setIdx(i => i + 1);
    else if (dragDelta > 44 && idx > 0) setIdx(i => i - 1);
    setDragStart(null); setDragDelta(0);
  };

  return (
    <div style={{position:'absolute',inset:0,zIndex:9000,display:'flex',flexDirection:'column',background:'var(--surface-app)'}}>
      <div style={{paddingTop:'calc(var(--safe-top) + 8px)'}} />
      <div
        onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
        style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'0 32px',textAlign:'center'}}>
        <div style={{marginBottom:32}}>{TUTORIAL_SLIDES[idx].visual}</div>
        <h1 style={{fontWeight:800,letterSpacing:'-0.025em',fontSize:24,color:'var(--text-primary)',marginBottom:12,lineHeight:1.2}}>{TUTORIAL_SLIDES[idx].title}</h1>
        <p style={{fontFamily:'var(--font-sans)',fontSize:15,lineHeight:1.55,color:'var(--text-secondary)',maxWidth:300,margin:0}}>{TUTORIAL_SLIDES[idx].body}</p>
        {idx===0 && userName && (
          <p style={{fontFamily:'var(--font-sans)',fontWeight:700,fontSize:15,color:'var(--secondary)',maxWidth:300,margin:'10px 0 0'}}>
            Nice to see you again, {userName}!
          </p>
        )}
      </div>
      <div style={{display:'flex',justifyContent:'center',gap:7,paddingBottom:24}}>
        {TUTORIAL_SLIDES.map((_,i)=>(
          <span key={i} style={{width: i===idx?20:7,height:7,borderRadius:'var(--radius-pill)',background: i===idx?'var(--accent)':'var(--ink-200)',transition:'all var(--dur-base) var(--ease-out)'}} />
        ))}
      </div>
      <div style={{display:'flex',alignItems:'center',gap:14,padding:'0 24px 40px'}}>
        <button type="button" onClick={onDone} style={{background:'none',border:'none',cursor:'pointer',fontFamily:'var(--font-sans)',fontWeight:600,fontSize:14,color:'var(--text-muted)',padding:'12px 4px'}}>
          Skip
        </button>
        <Btn variant="primary" size="lg" fullWidth
          onClick={()=> last ? onDone() : setIdx(i=>i+1)}>
          {last ? 'Get started' : 'Next'}
        </Btn>
      </div>
    </div>
  );
}

        <div style={{fontFamily:'var(--font-mono)',fontSize:11.5,color:'var(--text-faint)'}}>{s.dateLabel}{s.timeLabel?` · ${s.timeLabel}`:''}</div>
        {s.blurb && (
          <p style={{margin:0,fontSize:12.5,color:'var(--text-muted)',lineHeight:1.5,
            display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{s.blurb}</p>
        )}

          <div style={{marginTop:'auto',paddingTop:4,display:'flex',alignItems:'center',gap:4,fontSize:11,color:'var(--text-faint)',fontFamily:'var(--font-mono)'}}>

function WebHomeScreen({
  sales, zip, setZip, locating, locationDenied, onRequestLocation,
  radiusMi, setRadiusMi, activeTypes, setActiveTypes, keyword, setKeyword,
  onOpenSale, onToggleSave, apiStatus, coverageMessage, mapCenter, onOpenPost,
}) {
  const [dayFilter, setDayFilter] = useState(null); // null = All, else 0 (Sun) .. 6 (Sat)
  const [showMap, setShowMap] = useState(false);
  const [savedOnly, setSavedOnly] = useState(false);
  const [zipDraft, setZipDraft] = useState('');
  const selectedTypes = Object.keys(activeTypes).filter(k => activeTypes[k] === true);

  const typeFiltered = sales.filter(s => selectedTypes.length === 0 || selectedTypes.includes(s.type));
  const scoped = savedOnly ? typeFiltered.filter(s => s.saved) : typeFiltered;
  const shown = (dayFilter==null ? scoped : scoped.filter(s => saleWeekdays(s.dateLabel).includes(dayFilter)))
    .slice().sort((a,b) => (a.distanceMi ?? 999) - (b.distanceMi ?? 999));

  const DAY_LABELS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const dayCounts = DAY_LABELS.map((_,d) => scoped.filter(s => saleWeekdays(s.dateLabel).includes(d)).length);
  const maxDay = Math.max(1, ...dayCounts);
  const savedCount = sales.filter(s=>s.saved).length;
  // Drawn from `shown` (not the unfiltered `sales`) so every thumbnail here
  // always has a matching card below to scroll to -- a sale hidden by the
  // active day/type/saved filter wouldn't have a rendered card at all.
  const photoSales = shown.filter(s => s.images && s.images.length).slice(0, 18);

  const cardRefs = useRef({});
  const [highlightId, setHighlightId] = useState(null);
  // Clicking a photo-strip thumbnail scrolls its matching card into view
  // instead of opening it -- the card itself is what opens the listing.
  // Mirrors yardsaletreasuremap.com's photo-strip -> list-row behavior.
  const scrollToCard = (id) => {
    const el = cardRefs.current[id];
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setHighlightId(id);
    setTimeout(() => setHighlightId(h => h === id ? null : h), 1600);
  };
  // Opening a listing hands off to a dedicated page for just that sale,
  // rather than a modal over the browse grid -- /app?sale=<id> is the same
  // stable deep link the share sheet and digest emails already use.
  const openSaleTab = (id) => window.open(`/app?sale=${encodeURIComponent(id)}`, '_blank', 'noopener');

  const wrap = { maxWidth: 1180, margin: '0 auto', padding: '0 28px' };

  return (
    <div style={{minHeight:'100%', background:'var(--paper)'}}>
      <nav style={{position:'sticky', top:0, zIndex:20, background:'rgba(247,245,240,.92)', backdropFilter:'blur(16px)', borderBottom:'1px solid var(--line)'}}>
        <div style={{...wrap, display:'flex', alignItems:'center', justifyContent:'space-between', height:68}}>
