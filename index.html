// ── Trip routing helpers ──────────────────────────────────────────────────────
function fmtDist(m) {
  const ft = Math.round(m * 3.281);
  if (ft < 1000) return `${ft} ft`;
  return `${(m / 1609.34).toFixed(1)} mi`;
}
function fmtTime(s) {
  const m = Math.round(s / 60);
  if (m < 60) return `${m} min`;
  return `${Math.floor(m / 60)}h ${m % 60}m`;
}
async function fetchOsrmRoute(waypoints) {
  // waypoints: [{lat,lng}, ...]. steps=false -- the app only ever shows
  // per-leg distance/duration (a passive preview), never turn-by-turn
  // instructions, so there's no need to pay for OSRM's step breakdown.
  const coords = waypoints.map(p => `${p.lng},${p.lat}`).join(';');
  const url = `https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=false`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('OSRM error');
  const data = await r.json();
  if (!data.routes?.length) throw new Error('No route');
  const route = data.routes[0];
  return {
    geometry: route.geometry.coordinates,   // [[lng,lat], ...]
    legs: route.legs,
    totalDist: route.distance,
    totalTime: route.duration,
  };
}

// Builds a Google Maps multi-stop directions URL -- the one navigation app
// with an actual documented multi-waypoint URL scheme (Apple Maps and Waze
// only support a single destination), so "Start Trip" always hands off to
// Google Maps regardless of platform. Origin is left out on purpose: Google
// Maps resolves an omitted origin to the user's live location at the moment
// the link opens, which is fresher than a location we fetched earlier.
function buildGoogleMapsTripUrl(stops) {
  const pts = stops.filter(s => s.lat != null && s.lng != null).map(s => `${s.lat},${s.lng}`);
  if (!pts.length) return null;
  const destination = pts[pts.length - 1];
  const waypoints = pts.slice(0, -1);
  const params = new URLSearchParams({ api: '1', destination, travelmode: 'driving' });
  if (waypoints.length) params.set('waypoints', waypoints.join('|'));
  return `https://www.google.com/maps/dir/?${params.toString()}`;
}

// ── Trip Map (Leaflet) ────────────────────────────────────────────────────────
function TripMap({ stops, userLoc, routeCoords, height = 260, interactive = true }) {
  const divRef = useRef(null);
  const mapRef = useRef(null);

  // Init map once
  useEffect(() => {
    if (!divRef.current || !window.L || mapRef.current) return;
    mapRef.current = window.L.map(divRef.current, { zoomControl: false, attributionControl: false, dragging: interactive, scrollWheelZoom: interactive });
    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapRef.current);
    return () => { if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; } };
  }, []);

  // Redraw stops + route when data changes
  useEffect(() => {
    const map = mapRef.current;
    if (!map || !window.L) return;
    map.eachLayer(l => { if (!(l instanceof window.L.TileLayer)) map.removeLayer(l); });

    const bounds = [];

    // Route polyline (real roads)
    if (routeCoords?.length > 1) {
      const latlngs = routeCoords.map(([lng, lat]) => [lat, lng]);
      window.L.polyline(latlngs, { color: '#f97316', weight: 4, opacity: 0.85 }).addTo(map);
      latlngs.forEach(p => bounds.push(p));
    }

    // Origin dot
    if (userLoc) {
      window.L.circleMarker([userLoc.lat, userLoc.lng], {
        radius: 9, fillColor: '#3b82f6', color: '#fff', weight: 2.5, fillOpacity: 1
      }).addTo(map);
      bounds.push([userLoc.lat, userLoc.lng]);
    }

    // Stop markers
    stops.forEach((s, i) => {
      if (!s.lat || !s.lng) return;
      const icon = window.L.divIcon({
        html: `<div style="background:#f97316;color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);font-family:sans-serif">${i + 1}</div>`,
        iconSize: [30, 30], iconAnchor: [15, 15], className: ''
      });
      window.L.marker([s.lat, s.lng], { icon }).addTo(map);
      bounds.push([s.lat, s.lng]);
    });

    if (bounds.length > 0) map.fitBounds(bounds, { padding: [32, 32], maxZoom: 15 });
    else map.setView([33.979, -118.032], 12);
  }, [stops, userLoc, routeCoords]);

  return <div ref={divRef} style={{ width: '100%', height, borderRadius: 'var(--radius-xl)', overflow: 'hidden' }} />;
}

// ── Trip Planner Panel ────────────────────────────────────────────────────────
function TripPlannerPanel({ allSales, tripIds, onToggleTrip, onClearTrip, onClose, onOpenSale, asTab=false }) {
  const [userLoc, setUserLoc]       = useState(null);
  const [locError, setLocError]     = useState(null);
  const [route, setRoute]           = useState(null);   // {geometry, legs, totalDist, totalTime}
  const [routeLoading, setRouteLoading] = useState(false);
  const [routeError, setRouteError] = useState(null);

  const tripSales = allSales.filter(s => tripIds.includes(s.id));
  const ordered   = userLoc
    ? [...tripSales].sort((a, b) =>
        Math.hypot((a.lat||0)-userLoc.lat,(a.lng||0)-userLoc.lng) -
        Math.hypot((b.lat||0)-userLoc.lat,(b.lng||0)-userLoc.lng))
    : tripSales;

  // Get user location once on open. A locate attempt is bumped to retry
  // without leaving the screen after the user grants permission late (e.g.
  // they dismissed the browser prompt, then enabled it in settings).
  const [locateAttempt, setLocateAttempt] = useState(0);
  useEffect(() => {
    if (!navigator.geolocation) { setLocError('Location unavailable on this device'); return; }
    setLocError(null);
    navigator.geolocation.getCurrentPosition(
      pos => { setUserLoc({ lat: pos.coords.latitude, lng: pos.coords.longitude }); setLocError(null); },
      err => setLocError(
        err.code === 1 ? "Location access is off — enable it for this site in your browser or device settings"
        : err.code === 3 ? 'Location took too long to respond'
        : 'Could not get your location'
      ),
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 5 * 60 * 1000 }
    );
  }, [locateAttempt]);

  // Fetch OSRM route whenever stops or userLoc change -- purely a passive
  // preview (polyline + per-stop distance/time on the map below), not
  // turn-by-turn guidance. Actual navigation is handed off to Google Maps.
  useEffect(() => {
    const stops = ordered.filter(s => s.lat && s.lng);
    if (stops.length < 1) { setRoute(null); return; }
    const waypoints = userLoc ? [userLoc, ...stops] : stops;
    if (waypoints.length < 2) { setRoute(null); return; }
    setRouteLoading(true); setRouteError(null);
    fetchOsrmRoute(waypoints)
      .then(r => { setRoute(r); setRouteLoading(false); })
      .catch(() => { setRouteError('Could not load route'); setRouteLoading(false); });
  }, [tripIds, userLoc?.lat, userLoc?.lng]);

  // ── Plan mode ────────────────────────────────────────────────────────────
  const planContent = (
    <>
      {/* Header */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: asTab ? '8px 16px 8px' : '16px 16px 8px' }}>
        <div>
          {asTab && <div className="rmg-eyebrow" style={{ marginBottom: 2 }}>Navigate your day</div>}
          <div style={{ fontWeight: 900, fontSize: asTab ? 28 : 20, letterSpacing: '-0.03em', color: 'var(--ink-900)', lineHeight: 1.05 }}>My Trip</div>
          <div style={{ fontFamily: 'var(--font-sans)', fontSize: 13, color: 'var(--text-muted)', marginTop: 1 }}>
            {routeLoading ? 'Calculating route…'
              : route ? `${fmtDist(route.totalDist)} · ${fmtTime(route.totalTime)} · ${ordered.length} stops`
              : ordered.length === 0 ? 'Add sales to plan a route'
              : `${ordered.length} ${ordered.length === 1 ? 'stop' : 'stops'} · sorted nearest first`}
          </div>
        </div>
        {!asTab && <IconButton icon={Icon('X', 20)} variant="ghost" aria-label="Close" onClick={onClose} />}
      </div>

        {/* Map */}
        <div style={{ padding: '0 14px 10px' }}>
          {tripSales.length > 0
            ? <TripMap stops={ordered} userLoc={userLoc} routeCoords={route?.geometry} />
            : <div style={{ height: 200, borderRadius: 'var(--radius-xl)', background: 'var(--surface-sunken)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 8 }}>
                {Icon('Route', 36, { stroke: 'var(--text-faint)' })}
                <div style={{ fontFamily: 'var(--font-sans)', fontSize: 14, color: 'var(--text-muted)' }}>Your route will appear here</div>
              </div>
          }
        </div>

        {/* Stops */}
        <div style={{ flex: 1, overflowY: 'auto', padding: '0 14px' }}>
          {tripSales.length === 0 ? (
            <div style={{ textAlign: 'center', padding: '24px 0 28px' }}>
              <div style={{ fontSize: 40, marginBottom: 8 }}>🗺️</div>
              <div style={{ fontWeight: 700, fontSize: 16, color: 'var(--ink-900)', marginBottom: 4 }}>No stops yet</div>
              <div style={{ fontFamily: 'var(--font-sans)', fontSize: 13, color: 'var(--text-muted)', lineHeight: 1.5 }}>
                Tap <strong>Add to trip</strong> on any sale card to build your route.
              </div>
            </div>
          ) : (
            ordered.map((s, i) => (
              <div key={s.id} onClick={() => {
                  if (s.type === 'store') { window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.title)}&query_place_id=${s.id.replace('store-','')}`, '_blank'); return; }
                  onOpenSale(s.id); onClose();
                }}
                style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '11px 0', borderBottom: '1px solid var(--border-default)', cursor: 'pointer' }}>
                <div style={{ width: 30, height: 30, borderRadius: '50%', background: 'var(--brand-500)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: 13, flexShrink: 0 }}>{i + 1}</div>
                {s.images?.[0]
                  ? <img src={proxyImgUrl(s.images[0])} style={{ width: 44, height: 44, borderRadius: 'var(--radius-md)', objectFit: 'cover', flexShrink: 0 }} />
                  : <div style={{ width: 44, height: 44, borderRadius: 'var(--radius-md)', background: 'var(--surface-sunken)', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{Icon('Image', 18, { stroke: 'var(--text-faint)' })}</div>
                }
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 700, fontSize: 14, color: 'var(--ink-900)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{s.title}</div>
                  <div style={{ fontFamily: 'var(--font-sans)', fontSize: 12, color: 'var(--text-muted)', marginTop: 1 }}>
                    {route?.legs?.[i] ? `${fmtDist(route.legs[i].distance)} · ${fmtTime(route.legs[i].duration)}` : `${s.distanceMi} mi away`}{s.dateLabel ? ` · ${s.dateLabel}` : ''}
                  </div>
                </div>
                <button type="button" onClick={e => { e.stopPropagation(); onToggleTrip(s.id); }}
                  style={{ width: 30, height: 30, borderRadius: '50%', border: '1.5px solid var(--border-strong)', background: 'transparent', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', flexShrink: 0 }}>
                  {Icon('X', 13, { stroke: 'var(--text-muted)' })}
                </button>
              </div>
            ))
          )}
          <div style={{ height: 8 }} />
        </div>

        {/* Bottom actions */}
        <div style={{ padding: '12px 14px 36px', borderTop: '1px solid var(--border-default)', display: 'flex', flexDirection: 'column', gap: 10 }}>
          {/* {locError && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, background: 'var(--amber-bg)', borderRadius: 'var(--radius-lg)', padding: '10px 12px' }}>
              {Icon('AlertTriangle', 14, { stroke: 'var(--amber-600)' })}
              <span style={{ flex: 1, fontFamily: 'var(--font-sans)', fontSize: 12, color: 'var(--amber-600)', lineHeight: 1.4 }}>{locError}</span>
              <button type="button" onClick={() => setLocateAttempt(n => n + 1)} style={{ flexShrink: 0, background: 'none', border: 'none', cursor: 'pointer', fontFamily: 'var(--font-sans)', fontWeight: 700, fontSize: 12, color: 'var(--amber-600)', textDecoration: 'underline', padding: 0 }}>
                Retry
              </button>
            </div>
          )} */}
          <div style={{ display: 'flex', gap: 10 }}>
            {tripSales.length > 0 && (
              <Btn variant="ghost" size="lg" leadingIcon={Icon('Trash2', 16)} onClick={onClearTrip}>Clear</Btn>
            )}
            <Btn variant="primary" size="lg" fullWidth
              leadingIcon={Icon('Navigation', 18)}
              style={{ opacity: tripSales.length ? 1 : 0.5 }}
              onClick={() => {
                const url = tripSales.length ? buildGoogleMapsTripUrl(ordered) : null;
                if (url) window.open(url, '_blank');
              }}>
              Open in Google Maps
            </Btn>
          </div>
        </div>
    </>
  );

  if (asTab) {
    return (
      <div style={{ position: 'absolute', inset: 0, background: 'var(--surface-app)', display: 'flex', flexDirection: 'column', overflowY: 'auto' }}>
        <div style={{ paddingTop: 'var(--safe-top)' }} />
        {planContent}
        <div style={{ height: 90 }} />
      </div>
    );
  }

  return (
    <div style={{ position: 'absolute', inset: 0, zIndex: 65, display: 'flex', flexDirection: 'column', justifyContent: 'flex-end' }}>
      <div onClick={onClose} style={{ position: 'absolute', inset: 0, background: 'rgba(28,25,23,.45)', backdropFilter: 'blur(3px)' }} />
      <div style={{ position: 'relative', background: 'var(--paper)', borderRadius: 'var(--radius-xl) var(--radius-xl) 0 0', boxShadow: 'var(--shadow-sheet)', maxHeight: '92vh', display: 'flex', flexDirection: 'column' }}>
        {planContent}
      </div>
    </div>
  );
}

// Shared "open directions" behavior for a sale — used by the sale detail screen
// as well as the items gallery / item detail screens.
function openSaleDirections(s, onNavigateTo) {
  if (onNavigateTo) { onNavigateTo(); return; }
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  // Prefer the precise pin coordinates over the address text — most sources
  // (Craigslist, OfferUp, Facebook) never expose a full street address, only
  // a city/neighborhood, which makes a text search land nowhere near the
  // actual location. We always have an accurate lat/lng for the map pin.
  if (s.lat != null && s.lng != null) {
    const dest = `${s.lat},${s.lng}`;
    window.open(isIOS ? `maps://maps.apple.com/?daddr=${dest}` : `https://www.google.com/maps/dir/?api=1&destination=${dest}`, '_blank');
    return;
  }
  const addr = [s.address, s.neighborhood].filter(Boolean).join(', ');
  const q = encodeURIComponent(addr);
  window.open(isIOS ? `maps://maps.apple.com/?q=${q}` : `https://www.google.com/maps/search/?api=1&query=${q}`, '_blank');
}

// ── Share sheet ─────────────────────────────────────────────────────────────────
function ShareSheet({ sale, onClose }) {
  const [toast, setToast] = useState(null);
  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2500); };

  const url = sale?.url || window.location.href;
  const metaLine = [sale?.dateLabel, sale?.timeLabel, sale?.address || sale?.neighborhood].filter(Boolean).join(' · ');
  const shareText = sale?.title ? `${sale.title} — ${metaLine}` : metaLine;

  const openWindow = (u) => window.open(u, '_blank', 'noopener,noreferrer,width=600,height=640');

  const copyLink = async () => {
    try { await navigator.clipboard.writeText(`${shareText}\n${url}`); showToast('Link copied to clipboard'); }
    catch { showToast('Could not copy — try again'); }
  };

  const shareTo = (channel) => {
    switch (channel) {
      case 'facebook':
        openWindow(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`);
        break;
      case 'twitter':
        openWindow(`https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(url)}`);
        break;
      case 'instagram':
        // Instagram has no web share-intent API — copy the caption+link and hand off to Instagram.
        navigator.clipboard?.writeText(`${shareText}\n${url}`).catch(() => {});
        showToast('Caption copied — paste it into your Instagram post or DM');
        window.open('https://www.instagram.com/', '_blank', 'noopener,noreferrer');
        break;
      case 'chat':
        // Opens the device's default messaging app with the sale pre-filled.
        window.open(`sms:?&body=${encodeURIComponent(`${shareText} ${url}`)}`, '_blank');
        break;
    }
  };

  const CHANNELS = [
    { key:'facebook',  label:'Facebook',  icon:'Facebook',      bg:'#1877F2' },
    { key:'twitter',   label:'Twitter/X', icon:'Twitter',       bg:'#14171A' },
    { key:'instagram', label:'Instagram', icon:'Instagram',     bg:'linear-gradient(135deg,#F58529,#DD2A7B 60%,#8134AF)' },
    { key:'chat',      label:'Message',   icon:'MessageCircle', bg:'var(--secondary)' },
  ];

  return (
    <div style={{position:'absolute',inset:0,zIndex:9999,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
      <div onClick={onClose} style={{position:'absolute',inset:0,background:'rgba(28,25,23,.42)',backdropFilter:'blur(2px)'}} />
      <div style={{position:'relative',background:'var(--surface-app)',borderTopLeftRadius:'var(--radius-2xl)',borderTopRightRadius:'var(--radius-2xl)',padding:'10px 20px calc(24px + env(safe-area-inset-bottom,0px))',boxShadow:'var(--shadow-sheet)'}}>
        <div style={{width:36,height:4,borderRadius:2,background:'var(--ink-200)',margin:'2px auto 14px'}} />
        <div style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:18,color:'var(--text-primary)',marginBottom:4}}>Share this sale</div>
        {sale?.title && (
          <div style={{fontSize:13,color:'var(--text-muted)',marginBottom:16,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{sale.title}</div>
        )}
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:8}}>
          {CHANNELS.map(c => (
            <button key={c.key} type="button" onClick={()=>shareTo(c.key)} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6,background:'none',border:'none',cursor:'pointer',padding:'6px 0'}}>
              <span style={{width:52,height:52,borderRadius:'50%',background:c.bg,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'var(--shadow-sm)'}}>
                {Icon(c.icon,22,{stroke:'#fff'})}
              </span>
              <span style={{fontFamily:'var(--font-sans)',fontSize:11,color:'var(--text-secondary)',fontWeight:600}}>{c.label}</span>
            </button>
          ))}
        </div>
        <button type="button" onClick={copyLink} style={{width:'100%',display:'flex',alignItems:'center',gap:12,padding:'13px 4px',background:'none',border:'none',borderTop:'1px solid var(--border-default)',cursor:'pointer',textAlign:'left'}}>
          <span style={{width:36,height:36,borderRadius:'50%',background:'var(--surface-sunken)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{Icon('Link',17,{stroke:'var(--text-secondary)'})}</span>
          <span style={{fontFamily:'var(--font-sans)',fontWeight:600,fontSize:14,color:'var(--text-primary)'}}>Copy link</span>
        </button>
        {typeof navigator!=='undefined' && navigator.share && (
          <button type="button" onClick={async ()=>{
              try { await navigator.share({ title: sale?.title, text: shareText, url }); onClose(); }
              catch(e) { if (e.name !== 'AbortError') showToast('Could not share'); }
            }}
            style={{width:'100%',display:'flex',alignItems:'center',gap:12,padding:'13px 4px',background:'none',border:'none',borderTop:'1px solid var(--border-default)',cursor:'pointer',textAlign:'left'}}>
            <span style={{width:36,height:36,borderRadius:'50%',background:'var(--surface-sunken)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{Icon('Share2',17,{stroke:'var(--text-secondary)'})}</span>
            <span style={{fontFamily:'var(--font-sans)',fontWeight:600,fontSize:14,color:'var(--text-primary)'}}>More options…</span>
          </button>
        )}
      </div>
      {toast && (
        <div style={{position:'absolute',bottom:110,left:16,right:16,background:'var(--ink-900)',color:'#fff',borderRadius:'var(--radius-xl)',padding:'14px 18px',fontWeight:600,fontSize:14,textAlign:'center',boxShadow:'var(--shadow-lg)',animation:'slideUp .3s var(--ease-out)',zIndex:10000}}>
          {toast}
        </div>
      )}
    </div>
  );
}

      {shareOpen && <ShareSheet sale={s} onClose={()=>setShareOpen(false)} />}

  );

function ItemThumb({ src, size, fallbackIcon, stroke='currentColor', sw=1.5 }) {
  const [failed, setFailed] = useState(false);
  if (!src || failed) return Icon(fallbackIcon, size, {stroke, sw});
  return <img src={src} onError={()=>setFailed(true)} style={{width:'100%',height:'100%',objectFit:'cover'}} />;
}

          </button>
        </div>
        {others.length>0 && (
          <div style={{padding:'12px 0 20px'}}>
            <div style={{padding:'0 18px',fontFamily:'var(--font-sans)',fontWeight:700,fontSize:15,color:'var(--text-primary)',marginBottom:10}}>More from this sale</div>
            <div style={{display:'flex',gap:10,overflowX:'auto',padding:'0 18px'}}>
              {others.map(o => (
                <button key={o.id} type="button" onClick={()=>onSelectItem(items.indexOf(o))} style={{width:104,flexShrink:0,background:'none',border:'none',padding:0,cursor:'pointer',textAlign:'left'}}>
                  <div style={{aspectRatio:'1',background:'linear-gradient(135deg,var(--brand-50),var(--paper-2))',borderRadius:'var(--radius-md)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--ink-300)',overflow:'hidden'}}>
                    {o.image ? <img src={o.image} style={{width:'100%',height:'100%',objectFit:'cover'}} /> : Icon('Image',22,{stroke:'currentColor',sw:1.5})}
                  </div>
                  {o.price!=null && <div style={{fontFamily:'var(--font-mono)',fontSize:12,color:'var(--text-primary)',marginTop:5}}>{o.price}</div>}
                </button>
              ))}
            </div>
          </div>
        )}
      </div>
      <div style={{display:'flex',gap:10,padding:'12px 16px 28px',background:'rgba(237,230,214,.95)',backdropFilter:'blur(16px)',borderTop:'1.5px solid var(--border-default)',flexShrink:0}}>
        <div style={{flex:1}}>
          <Btn variant="primary" size="lg" fullWidth leadingIcon={Icon('Navigation',18)}
            onClick={()=>openSaleDirections(sale)}>Get directions</Btn>
        </div>
      </div>
    </div>
  );
}

        <div style={{display:'flex',alignItems:'center',gap:8,padding:'6px 12px 12px'}}>
          <IconButton icon={Icon('ChevronLeft',20)} variant="ghost" aria-label="Back" onClick={onBack} />
          <span style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:20,color:'var(--text-primary)'}}>Notifications</span>
          {notifications.length>0 && (

          )}

      </div>
      <div style={{flex:1,overflowY:'auto',padding:'8px 0 24px'}}>
        {notifications.length===0 ? (
          <div style={{textAlign:'center',padding:'60px 32px'}}>
            <div style={{width:56,height:56,borderRadius:'50%',background:'var(--surface-sunken)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 14px'}}>
              {Icon('Bell',24,{stroke:'var(--text-faint)'})}
            </div>
            <div style={{fontWeight:700,fontSize:15,color:'var(--ink-900)',marginBottom:4}}>No notifications yet</div>
            <div style={{fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-muted)',lineHeight:1.5}}>List a sale and we'll keep you posted here.</div>
          </div>
        ) : notifications.map(n => (
          <button key={n.id} type="button" onClick={()=>n.saleId && onOpenSale?.(n.saleId)}
            style={{width:'100%',textAlign:'left',border:'none',borderBottom:'1px solid var(--border-default)',
              background: (!readAll && n.unread) ? 'var(--accent-soft)' : 'transparent',
              cursor:n.saleId?'pointer':'default',display:'flex',gap:12,padding:'12px 18px 12px 26px',position:'relative'}}>
            {!readAll && n.unread && <span style={{position:'absolute',left:6,top:'50%',transform:'translateY(-50%)',width:8,height:8,borderRadius:'50%',background:'var(--accent)'}} />}
            <span style={{width:40,height:40,borderRadius:'50%',background:n.iconBg,color:n.iconFg,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              {Icon(n.icon,19,{stroke:'currentColor'})}
            </span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontFamily:'var(--font-sans)',fontWeight:700,fontSize:15,color:'var(--text-primary)'}}>{n.title}</div>
              <div style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-secondary)',marginTop:1}}>{n.body}</div>
              <div style={{fontFamily:'var(--font-mono)',fontSize:12,color:'var(--text-muted)',marginTop:4}}>{n.time}</div>
            </div>
          </button>
        ))}
      </div>
    </div>
  );
}

// ── List a Sale screen ────────────────────────────────────────────────────────
function ListScreen({ onPublish }) {
  const [step, setStep]           = useState(0);
  const [saleType, setSaleType]   = useState('yard');
  const [photos, setPhotos]       = useState([]);
  const [title, setTitle]         = useState('');
  const [addr, setAddr]           = useState('');
  const [zip, setZip]             = useState('');
  const [startDate, setStartDate] = useState('');
  const [endDate, setEndDate]     = useState('');
  const [hrs, setHrs]             = useState('');
  const [desc, setDesc]           = useState('');
  const [contact, setContact]     = useState('');
  const [touched, setTouched]     = useState({});
  const [published, setPublished] = useState(null);
  const [previewIdx, setPreviewIdx] = useState(0);
  const [photoError, setPhotoError] = useState(null);
  const { isLandscape } = useViewport();

  const handleFile = (e, idx) => {
    const file = e.target.files?.[0];
    e.target.value = ''; // allow re-picking the same file after an error
    if (!file) return;
    setPhotoError(null);
    downscalePhoto(file).then(dataUrl => {
      setPhotos(prev => { const n=[...prev]; n[idx]=dataUrl; return n; });
    }).catch(() => {
      // Most likely cause: a HEIC/HEIF photo on a browser that can't decode
      // it client-side (Safari/iOS can; desktop Chrome and Firefox can't).
      setPhotoError("Couldn't read that photo — if it's a HEIC/HEIF file, try converting it to JPEG first, or use a different photo.");
    });
  };

  // Keep listing categories honest — the title has to say what kind of sale it is.
  const titleTrimmed = title.trim();
  const titleHasCategory = /\b(yard|estate|moving)\b/i.test(titleTrimmed);
  const required2 = { title: !!titleTrimmed && titleHasCategory, addr: addr.trim(), zip: zip.trim(), startDate };
  const missing2  = Object.entries(required2).filter(([,v])=>!v).map(([k])=>k);
  const canNext2  = missing2.length === 0;

  const tryNext2 = () => {
    if (!canNext2) { setTouched({title:true,addr:true,zip:true,startDate:true}); return; }
    setPreviewIdx(0);
    setStep(3);
  };

  const fmtDate = iso => {
    if (!iso) return '';
    const [y,m,d] = iso.split('-').map(Number);
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return months[m-1]+' '+d+', '+y;
  };

  const publish = () => {
    const dateStr = fmtDate(startDate) + (endDate && endDate!==startDate ? ' – '+fmtDate(endDate) : '');
    const listing = {
      id: 'u'+Date.now(),
      type: saleType,
      title: title.trim(),
      address: addr.trim()+', '+zip.trim(),
      neighborhood: 'Your listing',
      distanceMi: 0.4,
      dateLabel: dateStr,
      timeLabel: hrs.trim() || 'Hours TBD',
      photoCount: photos.filter(Boolean).length,
      images: photos.filter(Boolean),
      blurb: desc.trim(),
      price: '',
      items: [],
      x: 50, y: 50,
      isOwnListing: true,
      contact: contact.trim(),
    };
    onPublish(listing);
    setPublished(listing);
    setStep(4);
  };

  const inputStyle = {
    width:'100%', height:48, padding:'0 14px',
    fontFamily:'var(--font-sans)', fontSize:14, color:'var(--text-primary)',
    background:'var(--surface-card)', border:'none', boxShadow:'var(--shadow-sm)',
    borderRadius:'var(--radius-md)', outline:'none', boxSizing:'border-box',
  };

  const errStyle = (field) => touched[field] && !required2[field] ? {borderColor:'#DC2626'} : {};

  const Label = ({children,required}) => (
    <label style={{fontFamily:'var(--font-sans)',fontWeight:600,fontSize:13,color:'var(--ink-900)',display:'block',marginBottom:6}}>
      {children}{required && <span style={{color:'#DC2626',marginLeft:3}}>*</span>}
    </label>
  );

  const ErrMsg = ({field}) => {
    if (!touched[field] || required2[field]) return null;
    const msg = field==='title' && titleTrimmed
      ? 'Title must include "yard", "estate", or "moving"'
      : 'This field is required';
    return <div style={{fontFamily:'var(--font-sans)',fontSize:12,color:'#DC2626',marginTop:4}}>{msg}</div>;
  };

  const STEPS = ['Sale type','Details','Preview'];

  if (step===0) {
    return (
      <div style={{position:'absolute',inset:0,overflowY:'auto',background:'var(--surface-app)'}}>
        <div style={{paddingTop:'var(--safe-top)'}} />
        <div style={{padding:'20px 20px 0'}}>
          <h1 style={{fontSize:32,fontWeight:900,letterSpacing:'-0.03em',color:'var(--ink-900)',lineHeight:1.05,marginBottom:4}}>Sell Your Stuff</h1>
          <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',margin:'0 0 24px',lineHeight:1.6}}>
            Got a garage full of treasures? List your sale and let local shoppers find you.
          </p>
        </div>

        {/* Hero CTA block */}
        <div style={{margin:'0 20px 20px'}}>
          <button type="button" onClick={()=>setStep(1)} style={{
            width:'100%',borderRadius:'var(--radius-2xl)',border:'none',cursor:'pointer',
            background:'linear-gradient(135deg,var(--brand-600) 0%,var(--brand-500) 100%)',
            padding:'28px 24px',textAlign:'left',
            boxShadow:'0 12px 40px rgba(78,79,42,.38)',
            transition:'transform var(--dur-base) var(--ease-spring), box-shadow var(--dur-base)',
          }}
            onMouseDown={e=>e.currentTarget.style.transform='scale(.98)'}
            onMouseUp={e=>e.currentTarget.style.transform='scale(1)'}
            onTouchStart={e=>e.currentTarget.style.transform='scale(.98)'}
            onTouchEnd={e=>e.currentTarget.style.transform='scale(1)'}
          >
            <div style={{fontSize:48,marginBottom:14,lineHeight:1}}>🏷️</div>
            <div style={{fontWeight:900,fontSize:24,color:'#fff',letterSpacing:'-0.03em',lineHeight:1.1,marginBottom:8}}>
              List Your Sale
            </div>
            <div style={{fontFamily:'var(--font-sans)',fontSize:14,color:'rgba(255,255,255,.8)',lineHeight:1.5,marginBottom:20}}>
              Post your yard sale, estate sale, or moving sale. It'll show up on the map so nearby shoppers can find you in minutes.
            </div>
            <div style={{display:'inline-flex',alignItems:'center',gap:8,background:'rgba(255,255,255,.2)',borderRadius:'var(--radius-pill)',padding:'10px 18px',backdropFilter:'blur(4px)'}}>
              <span style={{fontFamily:'var(--font-sans)',fontWeight:700,fontSize:14,color:'#fff'}}>Get started</span>
              {Icon('ArrowRight',16,{stroke:'#fff',sw:2.5})}
            </div>
          </button>
        </div>

        {/* How it works */}
        <div style={{padding:'0 20px calc(120px + var(--safe-bottom))'}}>
          <div className="rmg-eyebrow" style={{marginBottom:14}}>How it works</div>
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            {[
              {icon:'Tag',        color:'#A81F24', bg:'#FBEAEA', step:'1', title:'Pick your sale type',   body:'Yard, estate, or moving — you choose.'},
              {icon:'FileText',   color:'#3F5E3A', bg:'#E1E8D6', step:'2', title:'Add the details',       body:'Address, dates, hours, photos, and how shoppers can reach you.'},
              {icon:'MapPin',     color:'#2C4A7C', bg:'#DCE4EF', step:'3', title:'Go live on the map',    body:'Your pin drops instantly. Local shoppers see it right away.'},
            ].map(row => (
              <div key={row.step} style={{display:'flex',alignItems:'flex-start',gap:14,padding:'16px 18px',background:'var(--surface-card)',borderRadius:'var(--radius-xl)',boxShadow:'var(--shadow-sm)'}}>
                <div style={{width:42,height:42,borderRadius:'var(--radius-lg)',background:row.bg,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                  {Icon(row.icon,20,{stroke:row.color})}
                </div>
                <div style={{minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:14,color:'var(--ink-900)',marginBottom:2}}>{row.title}</div>
                  <div style={{fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-muted)',lineHeight:1.4}}>{row.body}</div>
                </div>
                <div style={{width:22,height:22,borderRadius:'50%',background:'var(--brand-100)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontFamily:'var(--font-mono)',fontWeight:800,fontSize:11,color:'var(--accent)'}}>
                  {row.step}
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  if (step===4 && published) {
    return (
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'var(--surface-app)',padding:'32px 24px',textAlign:'center'}}>
        <div style={{width:88,height:88,borderRadius:'50%',background:'linear-gradient(135deg,var(--brand-100),var(--brand-200))',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:24,boxShadow:'0 12px 40px rgba(78,79,42,.25)'}}>
          {Icon('CheckCircle',44,{stroke:'var(--accent)'})}
        </div>
        <h1 style={{fontSize:32,fontWeight:900,letterSpacing:'-0.03em',color:'var(--ink-900)',margin:'0 0 10px'}}>You're live!</h1>
        <p style={{fontFamily:'var(--font-sans)',fontSize:15,color:'var(--text-muted)',lineHeight:1.6,margin:'0 0 32px',maxWidth:280}}>
          Your {CAT[published.type]?.label.toLowerCase()} is on the map. Shoppers nearby can find it right now.
        </p>
        <Card padded={false} style={{overflow:'hidden',width:'100%',maxWidth:320,marginBottom:28,textAlign:'left'}}>
          <div style={{height:120,background:'var(--surface-sunken)',position:'relative',overflow:'hidden'}}>
            {published.images?.[0]
              ? <img src={published.images[0]} style={{width:'100%',height:'100%',objectFit:'cover'}} />
              : <div style={{height:'100%',background:`linear-gradient(135deg,${({estate:'#DCE4EF,#A8BEDA',yard:'#E1E8D6,#B7CBA0',moving:'#F1E0B8,#E0C070'})[published.type]||'#F1EAD6,#D8CBB0'})`,display:'flex',alignItems:'center',justifyContent:'center'}}>
                  {Icon('Image',32,{stroke:'rgba(255,255,255,.5)',sw:1})}
                </div>
            }
            <div style={{position:'absolute',top:10,left:10}}><SaleTypeTag type={published.type} /></div>
          </div>
          <div style={{padding:'12px 14px 14px'}}>
            <div style={{fontWeight:800,fontSize:16,color:'var(--ink-900)',marginBottom:4}}>{published.title}</div>
            <div style={{fontFamily:'var(--font-sans)',fontSize:12,color:'var(--text-muted)'}}>{published.address}</div>
            <div style={{fontFamily:'var(--font-mono)',fontSize:12,color:'var(--text-muted)',marginTop:2}}>{published.dateLabel} · {published.timeLabel}</div>
          </div>
        </Card>
        <Btn variant="primary" size="lg" fullWidth leadingIcon={Icon('Map',18)} onClick={()=>{setStep(0);setTitle('');setAddr('');setZip('');setStartDate('');setEndDate('');setHrs('');setDesc('');setContact('');setPhotos([]);setTouched({});setPublished(null);}}>
          Back to Map
        </Btn>
      </div>
    );
  }

  return (
    <div style={{position:'absolute',inset:0,overflowY:'auto',background:'var(--surface-app)'}}>
      <div style={{paddingTop:'var(--safe-top)'}} />
      <div style={{padding:'8px 20px 0'}}>
        <h1 style={{fontSize:32,fontWeight:900,letterSpacing:'-0.03em',color:'var(--ink-900)',lineHeight:1.05,marginBottom:4}}>
          {step===1 ? 'List Your Sale' : step===2 ? 'Sale Details' : 'Preview'}
        </h1>
        <p style={{fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-muted)',margin:'0 0 14px'}}>
          {step===1 ? 'What kind of sale are you hosting?' : step===2 ? 'Tell shoppers where and when to show up.' : 'This is how your listing will appear.'}
        </p>
      </div>

      {/* Step progress */}
      <div style={{display:'flex',gap:6,margin:'0 20px 4px'}}>
        {STEPS.map((label,i) => {
          const n = i+1, active = n===step, done = n<step;
          return (
            <div key={n} style={{flex:1,display:'flex',flexDirection:'column',gap:5,alignItems:'center'}}>
              <div style={{width:'100%',height:4,borderRadius:2,background:done||active?'var(--accent)':'var(--ink-100)',transition:'background var(--dur-base)',boxShadow:active?'0 2px 8px rgba(78,79,42,.4)':'none'}} />
              <span style={{fontFamily:'var(--font-sans)',fontSize:10,fontWeight:active?700:500,color:active?'var(--accent)':done?'var(--ink-600)':'var(--text-faint)'}}>{label}</span>
            </div>
          );
        })}
      </div>

      {/* ── Step 1: Type + Photos ── */}
      {step===1 && (
        <div style={{padding:'16px 20px 120px',display:'flex',flexDirection:'column',gap:24,maxWidth:isLandscape?480:undefined,margin:isLandscape?'0 auto':undefined}}>
          <div>
            <div className="rmg-eyebrow" style={{marginBottom:12}}>Sale type</div>
            <div style={{display:'grid',gridTemplateColumns:isLandscape?'1fr 1fr 1fr':'1fr 1fr',gap:10}}>
              {[
                {key:'estate',bg:'#DCE4EF',fg:'#2C4A7C',emoji:'🛋️',desc:'Full household'},
                {key:'yard',  bg:'#E1E8D6',fg:'#3F5E3A',emoji:'⛺', desc:'Driveway or yard'},
                {key:'moving',bg:'#F1E0B8',fg:'#8A5A12',emoji:'📦', desc:'Everything must go'},
              ].map(tc => {
                const on = saleType===tc.key;
                return (
                  <button key={tc.key} type="button" onClick={()=>setSaleType(tc.key)} style={{
                    position:'relative',display:'flex',flexDirection:'column',alignItems:'flex-start',
                    padding:'16px 14px 14px',gap:6,
                    background: on ? tc.fg : tc.bg,
                    border:'3px solid ' + (on ? tc.fg : 'transparent'),
                    borderRadius:'var(--radius-xl)',cursor:'pointer',textAlign:'left',
                    transition:'all var(--dur-base) var(--ease-spring)',
                    boxShadow: on ? '0 8px 24px ' + tc.fg + '55' : 'none',
                  }}>
                    <span style={{fontSize:30,lineHeight:1}}>{tc.emoji}</span>
                    <div style={{fontWeight:800,fontSize:14,lineHeight:1.2,color:on?'#fff':tc.fg}}>{CAT[tc.key].label}</div>
                    <div style={{fontFamily:'var(--font-sans)',fontSize:11,color:on?'rgba(255,255,255,.75)':tc.fg+'99',lineHeight:1.3}}>{tc.desc}</div>
                    <span style={{
                      position:'absolute',top:10,right:10,width:20,height:20,borderRadius:'50%',
                      border:'2px solid ' + (on ? 'rgba(255,255,255,.6)' : tc.fg + '55'),
                      background:on?'rgba(255,255,255,.25)':'transparent',
                      display:'flex',alignItems:'center',justifyContent:'center',
                    }}>
                      {on && Icon('Check',11,{stroke:'#fff',sw:3})}
                    </span>
                  </button>
                );
              })}
            </div>
          </div>

          <div>
            <div className="rmg-eyebrow" style={{marginBottom:10}}>
              Photos
              <span style={{textTransform:'none',fontWeight:400,letterSpacing:0,fontSize:12,color:'var(--text-faint)',marginLeft:6}}>optional — up to 12</span>
            </div>
            {photoError && (
              <div style={{display:'flex',alignItems:'flex-start',gap:8,background:'var(--amber-bg)',borderRadius:'var(--radius-lg)',padding:'10px 12px',marginBottom:10}}>
                {Icon('AlertTriangle',15,{stroke:'var(--amber-600)'})}
                <span style={{fontFamily:'var(--font-sans)',fontSize:12,color:'var(--amber-600)',lineHeight:1.4}}>{photoError}</span>
              </div>
            )}
            <div style={{display:'grid',gridTemplateColumns:isLandscape?'repeat(auto-fill,minmax(100px,1fr))':'1fr 1fr 1fr',gap:10}}>
              {Array.from({length:12},(_,i)=>i).map(idx=>(
                <label key={idx} htmlFor={`rmg-photo-${idx}`} style={{
                  aspectRatio:'4/3',borderRadius:'var(--radius-lg)',overflow:'hidden',
                  background:photos[idx]?'transparent':'var(--surface-sunken)',
                  border:`1.5px dashed ${photos[idx]?'transparent':'var(--border-strong)'}`,
                  display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',position:'relative',
                }}>
                  {photos[idx]
                    ? <>
                        <img src={photos[idx]} style={{width:'100%',height:'100%',objectFit:'cover'}} />
                        <span style={{position:'absolute',top:5,right:5,width:20,height:20,borderRadius:'50%',background:'rgba(0,0,0,.55)',display:'flex',alignItems:'center',justifyContent:'center'}}
                          onClick={e=>{e.preventDefault();setPhotos(p=>{const n=[...p];n[idx]=null;return n;});}}>
                          {Icon('X',11,{stroke:'#fff',sw:2.5})}
                        </span>
                      </>
                    : <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6,color:'var(--text-faint)'}}>
                        {Icon('ImagePlus',26,{stroke:'currentColor'})}
                        <span style={{fontFamily:'var(--font-sans)',fontSize:11,fontWeight:500}}>{idx===0?'Cover photo':'Add photo'}</span>
                      </div>
                  }
                  <input id={`rmg-photo-${idx}`} type="file" accept="image/*" style={{display:'none'}} onChange={e=>handleFile(e,idx)} />
                </label>
              ))}
            </div>
          </div>

          <div style={{display:'flex',gap:10}}>
            <Btn variant="secondary" size="lg" onClick={()=>setStep(0)}>Back</Btn>
            <Btn variant="primary" size="lg" fullWidth trailingIcon={Icon('ArrowRight',18)} onClick={()=>setStep(2)}>Continue</Btn>
          </div>
        </div>
      )}

      {/* ── Step 2: Details ── */}
      {step===2 && (
        <div style={{padding:'16px 20px 120px',display:'flex',flexDirection:'column',gap:14,maxWidth:isLandscape?480:undefined,margin:isLandscape?'0 auto':undefined}}>
          <div>
            <Label required>Listing title</Label>
            <RmgInput placeholder="e.g. Weekend Yard Sale" value={title}
              onChange={e=>setTitle(e.target.value)} onBlur={()=>setTouched(t=>({...t,title:true}))}
              style={errStyle('title')} />
            <ErrMsg field="title" />
            {!(touched.title && !required2.title) && (
              <div style={{fontFamily:'var(--font-sans)',fontSize:12,color:'var(--text-muted)',marginTop:4}}>Must include "yard", "estate", or "moving"</div>
            )}
          </div>
          <div>
            <Label required>Street address</Label>
            <RmgInput leadingIcon={Icon('MapPin',19)} placeholder="123 Main St" value={addr}
              onChange={e=>setAddr(e.target.value)} onBlur={()=>setTouched(t=>({...t,addr:true}))}
              style={errStyle('addr')} />
            <ErrMsg field="addr" />
          </div>

                {hrs && <span style={{display:'flex',alignItems:'center',gap:4}}>{Icon('Clock',12)} {hrs}</span>}

              {contact && (

function WalkthroughScreen({ onDone, userName }) {
  const [idx, setIdx] = useState(0);
  const [dragStart, setDragStart] = useState(null);
  const [dragDelta, setDragDelta] = useState(0);
  const total = TUTORIAL_SLIDES.length;
  const last = idx === total - 1;

  const onTouchStart = e => setDragStart(e.touches[0].clientX);
  const onTouchMove  = e => { if (dragStart != null) setDragDelta(e.touches[0].clientX - dragStart); };
  const onTouchEnd   = () => {
    if (dragDelta < -44 && !last) setIdx(i => i + 1);
    else if (dragDelta > 44 && idx > 0) setIdx(i => i - 1);
    setDragStart(null); setDragDelta(0);
  };

  return (
    <div style={{position:'absolute',inset:0,zIndex:9000,display:'flex',flexDirection:'column',background:'var(--surface-app)'}}>
      <div style={{paddingTop:'calc(var(--safe-top) + 8px)'}} />
      <div
        onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
        style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'0 32px',textAlign:'center'}}>
        <div style={{marginBottom:32}}>{TUTORIAL_SLIDES[idx].visual}</div>
        <h1 style={{fontWeight:800,letterSpacing:'-0.025em',fontSize:24,color:'var(--text-primary)',marginBottom:12,lineHeight:1.2}}>{TUTORIAL_SLIDES[idx].title}</h1>
        <p style={{fontFamily:'var(--font-sans)',fontSize:15,lineHeight:1.55,color:'var(--text-secondary)',maxWidth:300,margin:0}}>{TUTORIAL_SLIDES[idx].body}</p>
        {idx===0 && userName && (
          <p style={{fontFamily:'var(--font-sans)',fontWeight:700,fontSize:15,color:'var(--accent)',maxWidth:300,margin:'10px 0 0'}}>
            Nice to see you again, {userName}!
          </p>
        )}
      </div>
      <div style={{display:'flex',justifyContent:'center',gap:7,paddingBottom:24}}>
        {TUTORIAL_SLIDES.map((_,i)=>(
          <span key={i} style={{width: i===idx?20:7,height:7,borderRadius:'var(--radius-pill)',background: i===idx?'var(--accent)':'var(--ink-200)',transition:'all var(--dur-base) var(--ease-out)'}} />
        ))}
      </div>
      <div style={{display:'flex',alignItems:'center',gap:14,padding:'0 24px 40px'}}>
        <button type="button" onClick={onDone} style={{background:'none',border:'none',cursor:'pointer',fontFamily:'var(--font-sans)',fontWeight:600,fontSize:14,color:'var(--text-muted)',padding:'12px 4px'}}>
          Skip
        </button>
        <Btn variant="primary" size="lg" fullWidth
          onClick={()=> last ? onDone() : setIdx(i=>i+1)}>
          {last ? 'Get started' : 'Next'}
        </Btn>
      </div>
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState('explore');
  const [showWalkthrough, setShowWalkthrough] = useState(true);
  const finishWalkthrough = () => setShowWalkthrough(false);
  const [authUser, _setAuthUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem('rummage_user') || 'null'); } catch { return null; }
  });
  const setAuthUser = user => {
    if (user) localStorage.setItem('rummage_user', JSON.stringify(user));
    else localStorage.removeItem('rummage_user');
    _setAuthUser(user);
  };
  const [activeTypes, setActiveTypes] = useState({});
  const [openNow, setOpenNow]         = useState(false);
  const [withinTwoWeeks, setWithinTwoWeeks] = useState(false);
  const [keyword, setKeyword]         = useState('');
  const [detailId, setDetailId] = useState(null);
  // Every "open this listing" entry point routes through here so the ping
  // sound plays exactly once, consistently, regardless of which screen
  // (Explore, Saved, Search, notifications...) the tap came from.
  const openSaleDetail = (id) => { playPing(); setDetailId(id); };
  const [itemsView, setItemsView] = useState(null); // null | {mode:'gallery'} | {mode:'item', idx}
  const [notificationsOpen, setNotificationsOpen] = useState(false);
  const [filtersOpen, setFiltersOpen] = useState(false);
  const [vintageStoresOpen, setVintageStoresOpen] = useState(false);
  const [tripIds, setTripIds] = useState(() => { try { return JSON.parse(localStorage.getItem('rummage-trip') || '[]'); } catch { return []; } });

  const toggleTrip = (id) => setTripIds(prev => {
    const adding = !prev.includes(id);
    const next = adding ? [...prev, id] : prev.filter(x => x !== id);
    localStorage.setItem('rummage-trip', JSON.stringify(next));
    playTripBlip(adding);
    return next;
  });
  const clearTrip = () => { setTripIds([]); localStorage.removeItem('rummage-trip'); };
  // Vintage stores are fetched on-demand by VintageStoresScreen (Places API
  // costs money per call, so we don't want this hitting on every app load).
  // Kept in App state -- not just the screen -- so a store added to the trip
  // can still be resolved to a full stop object (title/lat/lng) by
  // TripPlannerPanel even after the user navigates away from that screen.
  const [vintageStores, setVintageStores] = useState(() => {
    try { return JSON.parse(localStorage.getItem('rummage_vintage_stores') || '[]'); } catch { return []; }
  });
  const addVintageStores = (stores) => setVintageStores(prev => {
    const merged = [...prev];
    stores.forEach(s => { if (!merged.find(m => m.id === s.id)) merged.push(s); });
    localStorage.setItem('rummage_vintage_stores', JSON.stringify(merged));
    return merged;
  });
  const [radiusMi, setRadiusMi] = useState(15);
  const [zip, _setZip] = useState(() => localStorage.getItem('rummage_zip') || '90601');
  const setZip = (z) => { localStorage.setItem('rummage_zip', z); _setZip(z); };
  const [savedIds, setSavedIds] = useState({});
  const [userListings, setUserListings] = useState([]);
  const [apiListings, setApiListings]   = useState([]);
  const [apiStatus, setApiStatus]       = useState('idle'); // idle | loading | ok | error
  const [coverageMessage, setCoverageMessage] = useState(null);
  const [scale, setScale] = useState(1);
  const [libsReady, setLibsReady] = useState(false);
  const frameRef = useRef(null);

  // Auto geo-detection: if the device's current GPS location resolves to a
  // different ZIP than the saved home ZIP (e.g. you're traveling), search
  // near where you actually are instead of silently showing sales back
  // home. Detected once per session on load, not continuously watched —
  // this is "am I somewhere else right now," not live turn-by-turn
  // tracking (that already exists separately, in the trip navigator).
  const [detectedZip, setDetectedZip] = useState(null);
  const [detectedCity, setDetectedCity] = useState(null);
  const [useHomeZip, setUseHomeZip] = useState(false); // explicit "no, use my home ZIP" override
  useEffect(() => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      pos => {
        fetch(`${API_BASE}/api/reverse-geocode?lat=${pos.coords.latitude}&lng=${pos.coords.longitude}`)
          .then(r => r.json())
          .then(data => { if (data.zip) { setDetectedZip(data.zip); setDetectedCity(data.city || null); } })
          .catch(() => {});
      },
      () => {}, // permission denied or unavailable — fall back to home ZIP silently
      { enableHighAccuracy: false, timeout: 8000, maximumAge: 10 * 60 * 1000 }
    );
  }, []);
  const awayFromHome = !!(detectedZip && detectedZip !== zip);
  const effectiveZip = (awayFromHome && !useHomeZip) ? detectedZip : zip;

  // Fetch live listings from local backend
  const fetchApiListings = (zip, radius) => {
    setApiStatus('loading');
    fetch(`${API_BASE}/api/listings?zip=${zip}&radius=${radius}`)
      .then(r => r.json())
      .then(data => {
        setApiListings(data.listings || []);
        setCoverageMessage(data.outOfCoverage ? data.message : null);
        setApiStatus('ok');
      })
      .catch(() => setApiStatus('error'));
  };

  useEffect(() => {
    const fit = () => {
      const s = Math.min((window.innerWidth - 32) / 390, (window.innerHeight - 32) / 844, 1);
      setScale(Math.max(s, 0.2));
    };
    window.addEventListener('resize', fit);
    fit();
    const poll = setInterval(() => {
      if (window.lucide?.icons) { clearInterval(poll); setLibsReady(true); }
    }, 60);
    return () => { window.removeEventListener('resize', fit); clearInterval(poll); };
  }, []);

  // Re-fetch whenever the effective search ZIP or radius changes (debounced
  // 600ms) — also covers the initial load, since effects always run once
  // on mount.
  useEffect(() => {
    const t = setTimeout(() => fetchApiListings(effectiveZip, radiusMi), 600);
    return () => clearTimeout(t);
  }, [effectiveZip, radiusMi]);

  const MO_IDX = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);

  const kwMatch = (s) => {
    if (!keyword.trim()) return true;
    const q = keyword.toLowerCase();
    return [s.title, s.blurb, s.address, s.neighborhood, ...(s.items||[])].join(' ').toLowerCase().includes(q);
  };

  // Default window is 2 days before today through 2 days after — wide enough
  // to still catch a sale that started yesterday, but not a stale posting
  // from weeks ago. "Within 2 weeks" (the Explore toggle) only widens the
  // future edge of that window, not the past edge.
  const PAST_WINDOW_MS = 2 * 24 * 60 * 60 * 1000;
  const futureWindowMs = (withinTwoWeeks ? 14 : 2) * 24 * 60 * 60 * 1000;
  const windowStart = todayStart.getTime() - PAST_WINDOW_MS;
  const windowEnd   = todayStart.getTime() + futureWindowMs;

  const allSales = [...ALL_SALES, ...apiListings, ...userListings]
    .map(s => ({ ...s, saved: !!savedIds[s.id] }))
    .filter(s => {
      // If we can't determine when a sale is/was happening, we can't show it —
      // no date means no way to tell it apart from a stale, long-dead listing.
      const label = s.dateLabel || '';
      if (!label) return false;
      // Scan for every "MonthName DD" or "MonthName DD, YYYY" — first match is
      // the start of the range, last match is the end (a single date has both
      // point to the same hit).
      const hits = [...label.matchAll(/([A-Za-z]{3,9})\s+(\d{1,2})(?:,?\s*(\d{4}))?/g)]
        .filter(m => MO_IDX[m[1].toLowerCase().slice(0,3)] !== undefined);
      if (!hits.length) return false; // dateLabel present but unparseable → can't confirm it's current
      const toDate = m => new Date(m[3] ? parseInt(m[3]) : todayStart.getFullYear(), MO_IDX[m[1].toLowerCase().slice(0,3)], parseInt(m[2])).getTime();
      const startDay = toDate(hits[0]);
      const endDay   = toDate(hits[hits.length - 1]);
      // Overlap test: the sale's [startDay, endDay] range must intersect [windowStart, windowEnd].
      return endDay >= windowStart && startDay <= windowEnd;
    });
  let salesInRadius = allSales.filter(s=>s.distanceMi<=radiusMi).filter(kwMatch);
  if (salesInRadius.length===0 && !keyword) salesInRadius = allSales.slice(0,1);
  const detailSale = allSales.find(s=>s.id===detailId)||null;

  // Deep link support (?sale=<id>, used by the daily digest email's "Open
  // in app" links) — open straight to that sale once it shows up in
  // allSales, then strip the param so navigating away/back doesn't reopen it.
  useEffect(() => {
    const saleId = new URLSearchParams(window.location.search).get('sale');
    if (!saleId || detailId) return;
    if (allSales.some(s => s.id === saleId)) {
      setDetailId(saleId);
      window.history.replaceState({}, '', window.location.pathname);
    }
  }, [allSales, detailId]);

  // Push notifications: registered once for the app's lifetime (not tied to
  // whichever screen is active) so a tapped notification opens the right
  // sale via the same openSaleDetail every other entry point uses, and a
  // device token reaches the backend as soon as it's issued -- even if
  // AccountScreen (where the toggle lives) isn't mounted anymore by then.
  const authUserRef = useRef(authUser);
  useEffect(() => { authUserRef.current = authUser; }, [authUser]);
  useEffect(() => {
    const PN = window.Capacitor?.Plugins?.PushNotifications;
    if (!isMobileDevice || !PN) return;
    // addListener's return value isn't consistently a Promise across
    // Capacitor/plugin versions (confirmed via on-device testing: chaining
    // .then() here threw "is not a function") -- these listeners live for
    // the app's whole lifetime anyway (this effect never re-runs or
    // unmounts in practice), so there's nothing worth cleaning up.
    PN.addListener('registration', (token) => {
      const email = authUserRef.current?.email;
      if (!email) return;
      fetch(`${API_BASE}/api/push/register`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, pushToken: token.value }),
      }).catch(() => {});
    });
    PN.addListener('registrationError', (err) => {
      console.warn('Push registration failed:', err);
    });
    PN.addListener('pushNotificationActionPerformed', (action) => {
      const saleId = action.notification?.data?.saleId;
      if (saleId) openSaleDetail(saleId);
    });
  }, []);
  const savedCount = allSales.filter(s=>s.saved).length;

  const toggleSave = (id) => setSavedIds(p=>({...p,[id]:!p[id]}));
  const ic = (name, size) => libsReady ? Icon(name, size) : null;

  const closeDetail = () => { setDetailId(null); setItemsView(null); };

  // Notifications feed — built from real in-app activity (sales published).
  const notifications = React.useMemo(() => {
    const list = [];
    userListings.forEach(l => {
      list.push({
        id:'listing-'+l.id, icon:'Tag', iconBg:'var(--surface-sunken)', iconFg:'var(--text-secondary)',
        title:'Your sale went live', body:`${l.title} is now visible to nearby shoppers.`,
        time:'Just now', unread:false, saleId:l.id,
      });
    });
    return list;
  }, [userListings]);

  const tabItems = [
    {key:'explore',label:'Explore',  icon:ic('Map',24)},
    {key:'saved',  label:'Saved',    icon:ic('Heart',24),   badge:savedCount>0},
    {key:'list',   label:'List',     icon:ic('PlusCircle',24)},
    {key:'trip',   label:'My Trip',  icon:ic('Route',24),   badge:tripIds.length>0},
    {key:'account',label:'Account',  icon:ic('User',24)},
  ];

  // Rendered once, then dropped into whichever shell below actually mounts —
  // real phones/tablets (isMobileDevice) get a full-bleed shell with real
  // safe-area insets, everything else keeps the phone-mockup preview frame.
  // Both shells share the id="phone-frame" (only one ever mounts at a time)
  // so burstConfetti()'s `document.getElementById('phone-frame')` lookup
  // keeps working unchanged in either mode.
  const screens = (
    <>
        {/* App screens */}
        {tab==='explore' && !detailSale && (
          <ExploreScreen sales={salesInRadius} radiusMi={radiusMi} zip={effectiveZip} apiStatus={apiStatus} coverageMessage={coverageMessage}
            homeZip={zip} detectedCity={detectedCity} awayFromHome={awayFromHome} useHomeZip={useHomeZip} setUseHomeZip={setUseHomeZip}
            onOpenSale={openSaleDetail} onOpenFilters={()=>setFiltersOpen(true)} onToggleSave={toggleSave}
            activeTypes={activeTypes} setActiveTypes={setActiveTypes}
            openNow={openNow} setOpenNow={setOpenNow}
            withinTwoWeeks={withinTwoWeeks} setWithinTwoWeeks={setWithinTwoWeeks}
            keyword={keyword} onClearKeyword={()=>setKeyword('')}
            tripIds={tripIds} onToggleTrip={toggleTrip}
            onOpenVintageStores={()=>setVintageStoresOpen(true)} />
        )}
        {tab==='saved' && !detailSale && (
          <SavedScreen sales={allSales} onOpenSale={openSaleDetail} onToggleSave={toggleSave}
            tripIds={tripIds} onToggleTrip={toggleTrip} />
        )}
        {tab==='trip' && !detailSale && (
          <TripPlannerPanel
            allSales={[...allSales, ...vintageStores]} tripIds={tripIds}
            onToggleTrip={toggleTrip} onClearTrip={clearTrip}
            onClose={()=>setTab('explore')}
            onOpenSale={openSaleDetail}
            asTab={true}
          />
        )}
        {tab==='search' && !detailSale && (
          <SearchScreen radiusMi={radiusMi} setRadiusMi={setRadiusMi}
            activeTypes={activeTypes} setActiveTypes={setActiveTypes}
            keyword={keyword} setKeyword={setKeyword}
            onSearch={()=>setTab('explore')} />
        )}
        {tab==='list' && !detailSale && (
          <ListScreen onPublish={listing=>{setUserListings(p=>[...p,listing]);setTab('explore');}} />
        )}
        {tab==='account' && !detailSale && (
          authUser
            ? <AccountScreen
                radiusMi={radiusMi} setRadiusMi={setRadiusMi}
                zip={zip} setZip={setZip}
                authUser={authUser}
                onSignOut={()=>setAuthUser(null)}
                onUpdateUser={user=>setAuthUser(user)}
                userListings={userListings}
                savedCount={savedCount}
                onDeleteListing={id=>setUserListings(p=>p.filter(l=>l.id!==id))}
                onOpenSale={openSaleDetail}
                onOpenNotifications={()=>setNotificationsOpen(true)}
                onReplayWalkthrough={()=>setShowWalkthrough(true)}
                tripIds={tripIds} onToggleTrip={toggleTrip}
                onStoresLoaded={addVintageStores}
              />
            : <AuthScreen onAuth={user=>setAuthUser(user)} />
        )}


        {/* Tab bar */}
        {!detailSale && (
          <div style={{position:'absolute',left:0,right:0,bottom:0,zIndex:30}}>
            <TabBar active={tab} onChange={k=>{setTab(k);closeDetail();}} items={tabItems} />
          </div>
        )}

        {/* Filters sheet */}
        {filtersOpen && (
          <FiltersSheet onClose={()=>setFiltersOpen(false)} radiusMi={radiusMi} setRadiusMi={setRadiusMi} count={salesInRadius.length} />
        )}

        {vintageStoresOpen && (
          <VintageStoresScreen onBack={()=>setVintageStoresOpen(false)} zip={effectiveZip} tripIds={tripIds} onToggleTrip={toggleTrip} onStoresLoaded={addVintageStores} />
        )}


        {/* Detail */}
        {detailSale && (
          <div style={{position:'absolute',inset:0,zIndex:60,overflow:'hidden'}}>
            <DetailScreen sale={detailSale} onBack={closeDetail} onToggleSave={toggleSave}
              inTrip={tripIds.includes(detailSale.id)} onToggleTrip={()=>toggleTrip(detailSale.id)}
              onOpenItems={detailSale.items?.length>0 ? ()=>setItemsView({mode:'gallery'}) : undefined}
              onNavigateTo={() => {
                if (!tripIds.includes(detailSale.id)) toggleTrip(detailSale.id);
                setDetailId(null);
                setItemsView(null);
                setTab('trip');
              }} />
          </div>
        )}

        {/* Items gallery / item detail */}
        {detailSale && itemsView && (
          <div style={{position:'absolute',inset:0,zIndex:65,overflow:'hidden'}}>
            {itemsView.mode==='gallery' && (
              <ItemsGalleryScreen sale={detailSale}
                onBack={()=>setItemsView(null)}
                onOpenItem={idx=>setItemsView({mode:'item', idx})}
                onDirections={()=>openSaleDirections(detailSale)} />
            )}
            {itemsView.mode==='item' && (
              <ItemDetailScreen sale={detailSale} idx={itemsView.idx}
                onBack={()=>setItemsView({mode:'gallery'})}
                onOpenSale={()=>setItemsView(null)}
                onSelectItem={idx=>setItemsView({mode:'item', idx})} />
            )}
          </div>
        )}

        {/* Notifications */}
        {notificationsOpen && (
          <div style={{position:'absolute',inset:0,zIndex:80,overflow:'hidden'}}>
            <NotificationsScreen notifications={notifications}
              onBack={()=>setNotificationsOpen(false)}
              onOpenSale={id=>{ setNotificationsOpen(false); setItemsView(null); openSaleDetail(id); }} />
          </div>
        )}
    </>
  );

  const walkthrough = showWalkthrough && <WalkthroughScreen onDone={finishWalkthrough} userName={authUser?.name} />;

  if (isMobileDevice) {
    // Full-bleed shell for real phones/tablets (native app or mobile Safari):
    // no scaled mockup, no painted-on fake status bar/notch -- the real
    // device chrome shows through, and real safe-area insets (which move to
    // the left/right edge in landscape, not just top/bottom) replace the
    // fixed --safe-top constant used throughout every screen.
    return (
      <div id="phone-frame" style={{
        position:'fixed', inset:0, overflow:'hidden', background:'var(--surface-app)',
        '--safe-top':'env(safe-area-inset-top, 20px)',
        '--safe-bottom':'env(safe-area-inset-bottom, 0px)',
        '--safe-left':'env(safe-area-inset-left, 0px)',
        '--safe-right':'env(safe-area-inset-right, 0px)',
      }}>
        {screens}
        {walkthrough}
      </div>
    );
  }

  return (
    <div style={{position:'fixed',inset:0,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',background:'linear-gradient(145deg,#1C1917 0%,#292524 50%,#3C3330 100%)'}}>
      <div id="phone-frame" style={{width:390,height:844,flexShrink:0,position:'relative',background:'var(--surface-app)',borderRadius:52,overflow:'hidden',boxShadow:'0 40px 90px rgba(0,0,0,.55),0 0 0 11px #0C0A09,0 0 0 13px #211E1D',transform:`scale(${scale})`}}>
        {screens}

        {/* iOS status bar */}
        <div style={{position:'absolute',top:0,left:0,right:0,height:54,zIndex:70,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px 32px 0',pointerEvents:'none',fontFamily:'var(--font-sans)',fontWeight:700,fontSize:15,color:'var(--ink-900)'}}>
          <span style={{fontVariantNumeric:'tabular-nums'}}>9:41</span>
          <span style={{display:'inline-flex',gap:7,alignItems:'center'}}>
            <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7.5" width="3" height="4.5" rx="1" fill="currentColor"/><rect x="5" y="5" width="3" height="7" rx="1" fill="currentColor"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
            <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M1.6 4.4a10 10 0 0 1 13.8 0" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><path d="M4.4 7.3a6 6 0 0 1 8.2 0" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><circle cx="8.5" cy="10.3" r="1.6" fill="currentColor"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.2" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="18" height="8" rx="1.8" fill="currentColor"/><path d="M23 4v4a2.1 2.1 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>
          </span>
        </div>
        <div style={{position:'absolute',top:11,left:'50%',transform:'translateX(-50%)',width:120,height:34,background:'#14110F',borderRadius:20,zIndex:75}} />

        {walkthrough}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
