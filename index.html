<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rummage — Find the good stuff nearby</title>
<link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  /* "Clean SaaS Monochrome" (from a referenced product-UI style-guide pin):
     warm off-white surface, a black/warm-gray neutral scale, and a single
     deep-teal action accent (CTAs, focus/links, "live now") -- real rounded
     corners and soft elevation shadows instead of the previous straight-
     edges/hairline-border system. Every color below is still read through
     the same --semantic-alias tokens the whole app already used, so
     retuning here is enough to recolor/reshape the app without touching
     components. */
  --paper:#F7F5F0; --paper-2:#EFEBE2; --surface:#FFFFFF; --surface-tint:#FFFFFF;

  /* Neutral ink — warm-tinted black/gray scale (not true cool gray) */
  --ink-900:#1C1B17; --ink-800:#2C2A24; --ink-700:#4A473F; --ink-600:#675F52;
  --ink-500:#8A8579; --ink-400:#A39D8F; --ink-300:#C7C3B9; --ink-200:#DEDACE; --ink-100:#E8E5DE; --line:#E8E5DE;

  /* Primary — one deep-teal accent, spent only on "live now" and the
     primary action. (Still named --brand-* so every existing call site
     just picks up the new color without edits.) */
  --brand-50:#E4EFEE; --brand-100:#B8D3D2; --brand-200:#7AACAA; --brand-300:#3D8482;
  --brand-400:#146664; --brand-500:#0F504E; --brand-600:#0C403E; --brand-700:#093230; --brand-800:#072624;
  --brand-grad:#146664;

  --tape-50:#EFEBE2; --tape-100:#E8E5DE; --tape-300:#DEDACE; --tape-500:#FFFFFF; --tape-600:#DEDACE; --tape-700:#8A8579;
  --teal-50:#E4EFEE; --teal-100:#B8D3D2; --teal-300:#7AACAA; --teal-500:#146664; --teal-600:#0F504E; --teal-700:#093230;
  --green-600:#1E8E5A; --green-bg:#E3F5EC; --amber-600:#9A7B0A; --amber-bg:#FDF3D6; --red-600:#D6392F; --red-bg:#FBE4E2;
  --coral:#C2453B; --coral-bg:#FBE4E2;

  /* Sale type: plain text labels now, not colored pills -- these three
     stay defined (a couple of call sites still read them for icon tint on
     a neutral surface) but no longer drive a per-category background. */
  --type-estate-fg:var(--ink-600); --type-estate-bg:var(--paper-2);
  --type-yard-fg:var(--ink-600);   --type-yard-bg:var(--paper-2);
  --type-moving-fg:var(--ink-600); --type-moving-bg:var(--paper-2);

  /* Semantic aliases */
  --text-primary:var(--ink-900); --text-secondary:var(--ink-600); --text-muted:var(--ink-500); --text-faint:var(--ink-400);
  --text-inverse:#FFFFFF; --text-accent:var(--brand-400); --text-link:var(--brand-400);
  --surface-app:var(--paper); --surface-card:var(--surface); --surface-sunken:var(--paper-2); --surface-raised:var(--surface-tint);
  --border-default:var(--line); --border-strong:var(--ink-900); --border-accent:var(--brand-200);
  --accent:var(--brand-400); --accent-hover:var(--brand-500); --accent-press:var(--brand-700);
  --accent-soft:var(--brand-50); --accent-soft-bd:var(--brand-200);
  --secondary:var(--brand-400); --secondary-soft:var(--brand-50); --focus-ring:var(--brand-400);
  --success:var(--green-600); --success-bg:var(--green-bg); --warning:var(--amber-600); --warning-bg:var(--amber-bg);
  --danger:var(--red-600); --danger-bg:var(--red-bg);
  --pin:var(--ink-900); --pin-saved:var(--coral);

  --font-display:'Inter',system-ui,-apple-system,sans-serif;
  --font-sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'Inter',ui-monospace,'SF Mono',Menlo,monospace;

  --text-2xs:11px; --text-xs:12px; --text-sm:13px; --text-base:15px; --text-md:17px;
  --text-lg:20px; --text-xl:24px; --text-2xl:30px; --text-3xl:38px; --text-4xl:48px;
  --weight-regular:400; --weight-medium:500; --weight-semibold:600; --weight-bold:700; --weight-extra:800;
  --leading-tight:1.1; --leading-snug:1.25; --leading-normal:1.45; --leading-relaxed:1.65;
  --tracking-tight:-0.02em; --tracking-snug:-0.01em; --tracking-normal:0; --tracking-wide:0.02em; --tracking-caps:0.08em;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px;
  /* Real rounded corners, replacing the previous straight-edges system. */
  --radius-xs:6px; --radius-sm:8px; --radius-md:10px; --radius-lg:12px;
  --radius-xl:16px; --radius-2xl:20px; --radius-pill:999px; --radius-btn:999px;

  /* Soft elevation shadows, replacing the previous flattened-to-none set. */
  --shadow-xs:0 1px 2px rgba(28,27,23,.04);
  --shadow-sm:0 1px 3px rgba(28,27,23,.06), 0 1px 2px rgba(28,27,23,.04);
  --shadow-md:0 4px 12px rgba(28,27,23,.08);
  --shadow-lg:0 12px 32px rgba(28,27,23,.14);
  --shadow-sheet:0 -4px 16px rgba(28,27,23,.10);
  --shadow-pin:0 2px 6px rgba(28,27,23,.18);
  --shadow-focus:0 0 0 3px var(--brand-100);

  --safe-top:59px; --safe-bottom:0px; --safe-left:0px; --safe-right:0px; --tabbar-height:84px;
  --dur-fast:140ms; --dur-base:220ms; --dur-slow:360ms;
  --ease-out:cubic-bezier(.22,1,.36,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--surface-app);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-family:var(--font-sans);font-size:var(--text-base);line-height:var(--leading-normal);color:var(--text-primary)}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:900;letter-spacing:-0.03em;line-height:1.02;margin:0}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
.rmg-eyebrow{font-family:var(--font-sans);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--text-muted)}
/* Scrolling stays enabled, just without the visible track/thumb -- used on
   DetailScreen's inner scroll pane, where a classic Windows-Chrome scrollbar
   would otherwise sit at the edge of the centered desktop content column
   instead of the window edge, reading as a stray bar floating mid-page. */
.rmg-scroll-hidden{scrollbar-width:none;-ms-overflow-style:none}
.rmg-scroll-hidden::-webkit-scrollbar{display:none}
.rmg-data{font-family:var(--font-mono);font-weight:500;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:var(--surface-card);border:2px solid var(--accent);box-shadow:var(--shadow-md);cursor:pointer}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--surface-card);border:2px solid var(--accent);box-shadow:var(--shadow-md);cursor:pointer}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes heart-pop{0%{transform:scale(1)}20%{transform:scale(1.55)}55%{transform:scale(.88)}75%{transform:scale(1.15)}100%{transform:scale(1)}}
.heart-pop{animation:heart-pop .5s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes tutBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes tutPulseRing{0%{transform:scale(.5);opacity:.7}100%{transform:scale(2.1);opacity:0}}
@keyframes tutTap{0%,100%{transform:scale(1)}50%{transform:scale(.82)}}
@keyframes tutDraw{from{stroke-dashoffset:140}to{stroke-dashoffset:0}}
@keyframes tutFloat{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
</style>
</head>
<body>
<div id="root"></div>
<div id="err" style="display:none;position:fixed;inset:0;background:#fff;color:#c00;font-family:monospace;font-size:13px;padding:24px;white-space:pre-wrap;overflow:auto;z-index:99999;"></div>
<script>
window.addEventListener('error', function(e) {
  // Cross-origin scripts (the CDN <script> tags below) report errors as the
  // generic "Script error." with no filename/line — browsers strip all detail
  // for security. That's unactionable noise, not a real crash signal, so
  // don't blank out the whole app over it.
  if (e.message === 'Script error.' && !e.filename) return;
  var d = document.getElementById('err');
  d.style.display = 'block';
  d.textContent = 'JS ERROR:\n' + e.message + '\n\n' + (e.filename||'') + ':' + e.lineno;
});
</script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// When this page is loaded from the live site, relative /api/... calls hit
// the same origin as expected. When it's bundled inside the native app shell
// (capacitor://, ionic://, or a file:// page with no real HTTP origin),
// those relative calls have nowhere to go, so route them to the deployed
// backend explicitly instead.
const API_BASE = (window.Capacitor?.isNativePlatform?.() || !/^https?:$/.test(location.protocol))
  ? 'https://rummagedeals.com'
  : '';

// True for the native app and for real phones/tablets browsing the site
// directly (rummagedeals.com in mobile Safari) — these get a full-bleed
// layout with real device safe-area insets. False for desktop browsers,
// which keep the phone-mockup preview frame. Computed once: "pointer: coarse"
// reflects the primary input hardware, which doesn't change on rotation, so a
// real phone can never flip out of mobile mode just by turning sideways (a
// plain width check would, since landscape reports a wide innerWidth).
const isMobileDevice = !!(window.Capacitor?.isNativePlatform?.()
  || (window.matchMedia?.('(pointer: coarse)').matches && navigator.maxTouchPoints > 0));

// ── Icon helper ───────────────────────────────────────────────────────────────
function Icon(name, size = 20, opts = {}) {
  const node = window.lucide && window.lucide.icons && window.lucide.icons[name];
  if (!node) return null;
  const walk = (m) => {
    const tag = m[0], attrs = { ...m[1] || {} }, kids = m[2] || [];
    if (tag === 'svg') {
      attrs.width = size; attrs.height = size;
      if (opts.stroke) attrs.stroke = opts.stroke;
      if (opts.fill) attrs.fill = opts.fill;
      if (opts.sw) attrs['stroke-width'] = opts.sw;
    }
    return `<${tag} ${Object.entries(attrs).map(([k,v]) => `${k}="${v}"`).join(' ')}>${kids.map(walk).join('')}</${tag}>`;
  };
  return <span style={{display:'inline-flex',flex:'0 0 auto'}} dangerouslySetInnerHTML={{__html:walk(node)}} />;
}

// Rummage logomark — a map-pin/price-tag mashup (the "find things nearby" +
// "sale" ideas in one shape), in the app's own olive/teal palette rather
// than a generic Lucide icon standing in for the brand.
function RummageMark({ size = 64 }) {
  const gid = 'rmgMarkGrad';
  return (
    <svg width={size} height={size} viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rummage">
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
          <stop offset="0" stopColor="var(--brand-600)" />
          <stop offset="1" stopColor="var(--brand-400)" />
        </linearGradient>
      </defs>
      <path d="M32 4C18.7 4 8 14.6 8 27.7c0 6.2 3 12 7.4 17.6 3.9 4.9 8.8 9.2 12.3 12.1a6 6 0 0 0 8.6 0c3.5-2.9 8.4-7.2 12.3-12.1C53 39.7 56 33.9 56 27.7 56 14.6 45.3 4 32 4Z" fill={`url(#${gid})`} />
      <circle cx="32" cy="26.5" r="10.5" fill="var(--paper)" />
      <circle cx="32" cy="26.5" r="4" fill="var(--tape-500)" />
    </svg>
  );
}

// Full lockup: mark + "Rummage" wordmark, for splash/auth-style screens.
function RummageLogo({ markSize = 56, textSize = 26 }) {
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8}}>
      <RummageMark size={markSize} />
      <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:textSize,letterSpacing:'-0.03em',color:'var(--ink-900)'}}>Rummage</div>
    </div>
  );
}

// ── Celebration effects ──────────────────────────────────────────────────────
// Confetti scoped to the phone-mockup frame (id="phone-frame") rather than
// canvas-confetti's default full-browser-window canvas -- the app renders
// inside a scaled/centered phone mockup, so an unscoped burst would fire
// across the dark backdrop around it instead of the actual "screen."
function burstConfetti() {
  const frame = document.getElementById('phone-frame');
  if (!frame || !window.confetti) return;
  const canvas = document.createElement('canvas');
  canvas.width = frame.clientWidth;
  canvas.height = frame.clientHeight;
  canvas.style.cssText = 'position:absolute;inset:0;z-index:9999;pointer-events:none';
  frame.appendChild(canvas);
  const fire = window.confetti.create(canvas, { resize: false, useWorker: true });
  fire({
    particleCount: 100, spread: 75, startVelocity: 42, gravity: 1.1, ticks: 220,
    origin: { x: 0.5, y: 0.35 },
    colors: ['#0D9488', '#E8B923', '#3F5E3A', '#2C4A7C', '#211D17'],
  });
  setTimeout(() => canvas.remove(), 3200);
}

const SORT_MO_IDX = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
// Sortable timestamp for a sale's start date, parsed from its display label
// (e.g. "Sat, Jul 4 – Sun, Jul 5" → the Jul 4 start). Sales with no
// parseable date sort to the very end rather than the very start.
function saleSortDate(dateLabel) {
  const label = dateLabel || '';
  if (!label) return Infinity;
  const hits = [...label.matchAll(/([A-Za-z]{3,9})\s+(\d{1,2})(?:,?\s*(\d{4}))?/g)]
    .filter(m => SORT_MO_IDX[m[1].toLowerCase().slice(0,3)] !== undefined);
  if (!hits.length) return Infinity;
  const m = hits[0];
  const mo = SORT_MO_IDX[m[1].toLowerCase().slice(0,3)];
  const day = parseInt(m[2]);
  const year = m[3] ? parseInt(m[3]) : new Date().getFullYear();
  return new Date(year, mo, day).getTime();
}

// Every day-of-week (0=Sun..6=Sat) a sale's dateLabel actually mentions —
// a multi-day label like "Sat, Oct 3 - Sun, Oct 4" matches both days, so a
// "Sunday" filter correctly still surfaces a sale that started Saturday.
function saleWeekdays(dateLabel) {
  const label = dateLabel || '';
  const hits = [...label.matchAll(/([A-Za-z]{3,9})\s+(\d{1,2})(?:,?\s*(\d{4}))?/g)]
    .filter(m => SORT_MO_IDX[m[1].toLowerCase().slice(0,3)] !== undefined);
  return hits.map(m => {
    const mo = SORT_MO_IDX[m[1].toLowerCase().slice(0,3)];
    const day = parseInt(m[2]);
    const year = m[3] ? parseInt(m[3]) : new Date().getFullYear();
    return new Date(year, mo, day).getDay();
  });
}

// ── Constants ─────────────────────────────────────────────────────────────────
const CAT = {
  estate: { label:'Estate Sale', glyph:'Armchair' },
  yard:   { label:'Yard Sale',   glyph:'Tent' },
  moving: { label:'Moving Sale', glyph:'Truck' },
};
const FILTER_TYPES = [
  {key:'estate',label:'Estate'},{key:'yard',label:'Yard'},
  {key:'moving',label:'Moving'},
];

// Applied to every real sale photo -- both scraped from the source listing
// and freshly uploaded when posting one -- since most are quick phone
// snapshots (garages, driveways) that run flat and a little dark. A small,
// consistent lift rather than a heavy "filter" look: richer color, a touch
// more contrast, a slight brightness lift.
const PHOTO_FILTER = 'saturate(1.12) contrast(1.08) brightness(1.02)';

// Must match server.js's ITEM_KEYWORDS tag strings exactly (case-sensitive)
// -- these are matched directly against a listing's `items` array server-side
// for interest-tag push notifications, not just used for display here.
const INTEREST_TAGS = ['Furniture','Tools','Vinyl & Records','Electronics','Jewelry','Clothing','Books','Kitchenware','Art','Toys & Games','Sporting Goods','Antiques & Collectibles','Lighting','Rugs','Appliances','Musical Instruments','Holiday Decor','Garden & Outdoor'];
const INTEREST_TAG_ICONS = {
  'Furniture':'Sofa', 'Tools':'Wrench', 'Vinyl & Records':'Disc3', 'Electronics':'Cpu',
  'Jewelry':'Gem', 'Clothing':'Shirt', 'Books':'BookOpen', 'Kitchenware':'UtensilsCrossed',
  'Art':'Palette', 'Toys & Games':'Gamepad2', 'Sporting Goods':'Dumbbell', 'Antiques & Collectibles':'Archive',
  'Lighting':'Lightbulb', 'Rugs':'LayoutGrid', 'Appliances':'Plug', 'Musical Instruments':'Music',
  'Holiday Decor':'Gift', 'Garden & Outdoor':'Flower2',
};

// Sale `items` may be plain strings (legacy/scraped) or richer objects — normalize to one shape.
function normalizeItem(it, i, saleId) {
  if (typeof it === 'string') {
    return { id:`${saleId}-item-${i}`, name:it, category:null, price:null, originalPrice:null, sold:false, image:null, condition:null, size:null, description:null };
  }
  return {
    id: it.id || `${saleId}-item-${i}`, name: it.name || it.label || 'Item',
    category: it.category || null, price: it.price ?? null, originalPrice: it.originalPrice ?? null,
    sold: !!it.sold, image: it.image || null, condition: it.condition || null,
    size: it.size || null, description: it.description || null,
  };
}

// No mock data — all listings come from the live API
const ALL_SALES = [];

// ── Design system components ──────────────────────────────────────────────────
function Btn({ variant='primary', size='default', fullWidth, leadingIcon, onClick, children, style, disabled }) {
  const base = {
    display:'inline-flex', alignItems:'center', justifyContent:'center',
    gap:8, border:'none', cursor:'pointer', fontFamily:'var(--font-sans)',
    fontWeight:700, letterSpacing:'-0.01em', whiteSpace:'nowrap',
    transition:`all var(--dur-fast) var(--ease-out)`,
    borderRadius:'var(--radius-btn)', width: fullWidth?'100%':'auto',
    flex: fullWidth ? '1 1 0%' : 'initial', minWidth: fullWidth ? 0 : 'auto',
  };
  const sz = size==='lg' ? {height:56,padding:'0 32px',fontSize:17}
           : size==='sm' ? {height:36,padding:'0 16px',fontSize:13}
           : {height:48,padding:'0 24px',fontSize:15};
  // Solid black fills are self-defining against a light page -- no shadow
  // needed. The one light-on-light variant ("surface") gets a real border
  // instead, same reasoning as Card.
  const v = variant==='primary'  ? {background:'var(--brand-grad)',color:'#FFFFFF',boxShadow:'none'}
          : variant==='secondary'? {background:'var(--ink-900)',color:'#FFFFFF',boxShadow:'none'}
          : variant==='ghost'    ? {background:'var(--brand-grad)',color:'#FFFFFF',boxShadow:'none'}
          : variant==='surface'  ? {background:'#FFFFFF',color:'var(--ink-900)',boxShadow:'none',border:'1px solid var(--border-default)'}
          : {background:'var(--brand-grad)',color:'#FFFFFF',boxShadow:'none'};
  return (
    <button onClick={onClick} disabled={disabled} style={{...base,...sz,...v,
      ...(disabled ? {opacity:0.45,cursor:'not-allowed'} : null),...style}}>
      {leadingIcon && <span style={{display:'inline-flex'}}>{leadingIcon}</span>}
      {children}
    </button>
  );
}

function Card({ padded=true, interactive, onClick, children, style, elevation, ...rest }) {
  const shadow = elevation==='lg' ? 'var(--shadow-lg)' : elevation==='md' ? 'var(--shadow-md)' : 'var(--shadow-sm)';
  return (
    <div onClick={onClick} style={{
      // Shadows are flattened to none across the app now -- a real border
      // takes over as the only separation from the page background,
      // instead of cards silently losing all definition.
      background:'var(--surface-card)', border:'1px solid var(--border-default)',
      borderRadius:'var(--radius-xl)', boxShadow:shadow,
      padding: padded ? 20 : 0, overflow:'hidden',
      position:'relative', zIndex:0, isolation:'isolate',
      cursor: interactive ? 'pointer' : 'default',
      transition: interactive ? 'box-shadow var(--dur-fast), transform var(--dur-base) var(--ease-spring)' : 'none',
      ...style,
    }} {...rest}>
      {children}
    </div>
  );
}

function Badge({ tone, children }) {
  const colors = tone==='success'
    ? {background:'var(--success-bg)',color:'var(--success)'}
    : tone==='accent'
    ? {background:'var(--accent)',color:'#fff'}
    : {background:'var(--surface-sunken)',color:'var(--text-secondary)'};
  return (
    <span style={{
      display:'inline-flex', alignItems:'center', gap:4,
      padding:'2px 8px', borderRadius:'var(--radius-pill)',
      fontFamily:'var(--font-sans)', fontWeight:700, fontSize:'var(--text-2xs)',
      letterSpacing:'0.04em', textTransform:'uppercase', ...colors,
    }}>
      {children}
    </span>
  );
}

// Plain mono uppercase text -- no icon glyph, no badge shape, no per-type
// color coding. Was a small icon-in-a-square overlaid on the photo; that
// read fine as a black square but didn't actually need to be an icon (the
// browse row and detail screen already say "Yard sale" etc. in this exact
// style elsewhere). Meant for inline text-flow use, not overlaid directly
// on a photo -- text has no legible background against arbitrary photos.
function SaleTypeTag({ type, size }) {
  const fontSize = size==='xs' ? 10 : size==='sm' ? 11 : 12;
  return (
    <span style={{
      fontFamily:'var(--font-mono)', fontWeight:600, fontSize,
      letterSpacing:'0.06em', textTransform:'uppercase', color:'var(--text-muted)',
    }}>
      {CAT[type]?.label || type}
    </span>
  );
}

function Avatar({ name='?', size=44, emoji=null }) {
  if (emoji) {
    const isImg = typeof emoji === 'string' && (emoji.startsWith('/') || emoji.startsWith('http') || /\.(png|jpe?g|webp|svg)$/i.test(emoji));
    return (
      <div style={{
        width:size, height:size, borderRadius:'50%', flexShrink:0,
        background:'#FFFFFF',
        border:'none', overflow:'hidden',
        display:'flex', alignItems:'center', justifyContent:'center',
        fontSize: Math.round(size * 0.52),

      }}>
        {isImg ? <img src={emoji} alt={name} style={{width:'100%',height:'100%',objectFit:'cover'}} /> : emoji}

    );
  }
  const initials = name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();

  return (
    <div style={{

// ── Leaflet real map ──────────────────────────────────────────────────────────
// Same green pin color regardless of sale type (a Google-Maps-style green,
// not category color-coding -- every sale reads the same).
const TYPE_COLOR_HEX = {
  estate:'#0F9D58', yard:'#0F9D58', moving:'#0F9D58',
};

function RealMap({ sales, selectedId, onSelect, centerLat, centerLng, zoom=13, interactive=true }) {
  const containerRef = useRef(null);
  const mapRef       = useRef(null);
  const markersRef   = useRef({});
  // centerLat/centerLng come from the real geocoded search location (or a
  // specific sale's coords) -- when they're not known yet (still loading,
  // or geocoding failed), there's no honest "here" to show. A hardcoded
  // lat/lng used to fill in here, which silently planted the blue
  // "you are here" dot on the developer's own hometown for every user this
  // happened to -- same mistake as the ZIP fallback removed elsewhere in
  // this file, just harder to notice since it's a map instead of a ZIP.
  const hasCenter = Number.isFinite(centerLat) && Number.isFinite(centerLng);

  // Init map once on mount
  useEffect(() => {
    const L = window.L;
    if (!L || !containerRef.current || mapRef.current) return;
    const map = L.map(containerRef.current, {
      // No known center yet -- open on a wide, neutral view instead of
      // implying a specific location; fitBounds (below) takes over the
      // instant real sale pins or a real center show up.
      center: hasCenter ? [centerLat, centerLng] : [39.8283, -98.5795],
      zoom: hasCenter ? zoom : 3,
      zoomControl: false, attributionControl: false,
      scrollWheelZoom: interactive, dragging: interactive,
      touchZoom: interactive, doubleClickZoom: interactive,
      boxZoom: false, keyboard: false,
    });
    // CARTO's basemaps now require an API key we don't have (was rendering
    // "API KEY REQUIRED" tiled across every map in the app) -- switched to
    // plain OpenStreetMap tiles, the same provider TripMap already uses
    // successfully elsewhere in this file, no key needed.
    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      { maxZoom: 19, subdomains: 'abc' }
    ).addTo(map);
    if (interactive) L.control.zoom({ position: 'bottomright' }).addTo(map);
    // Blue user-location dot is added by the effect below (it also has to
    // handle the center arriving after mount, so both cases live in one
    // place instead of two).
    mapRef.current = map;
    // Leaflet measures its container's size once at construction and caches
    // it -- it only reacts to a later resize via an explicit invalidateSize()
    // call or a *window* resize event, neither of which fires when this
    // component mounts into a container whose size was only just set by a
    // conditional render (e.g. a "Show map" toggle) rather than a page
    // resize. Without this, the map silently believes it's much smaller than
    // it actually is and only ever paints the one tile that covers that
    // stale size -- confirmed via headless testing of the new desktop map
    // toggle, where the tile pane stayed stuck at a single tile indefinitely.
    requestAnimationFrame(() => map.invalidateSize());
    return () => { map.remove(); mapRef.current = null; };
  }, []);

  // Update markers whenever sales or selection changes
  useEffect(() => {
    const L = window.L;
    if (!L || !mapRef.current) return;
    const map = mapRef.current;
    // Remove old markers
    Object.values(markersRef.current).forEach(m => m.remove());
    markersRef.current = {};

    const points = [];
    sales.forEach(s => {
      if (s.lat == null || s.lng == null) return;
      points.push([s.lat, s.lng]);
      const sel   = s.id === selectedId;
      const color = TYPE_COLOR_HEX[s.type] || '#1C1B17';
      const size  = sel ? 16 : 10;
      const icon  = L.divIcon({
        className: '',
        html: `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
          <circle cx="${size/2}" cy="${size/2}" r="${size/2-1.25}"
            fill="${sel ? color : '#fff'}" stroke="${color}" stroke-width="1.5" />
        </svg>`,
        iconSize:   [size, size],
        iconAnchor: [size / 2, size / 2],
      });
      const marker = L.marker([s.lat, s.lng], { icon, zIndexOffset: sel ? 1000 : 0 })
        .addTo(map)
        .on('click', () => onSelect?.(s.id));
      markersRef.current[s.id] = marker;
    });

    if (selectedId && markersRef.current[selectedId]) {
      // A specific pin is selected — pan to just that one.
      const target = sales.find(s => s.id === selectedId);
      if (target?.lat && interactive) {
        map.panTo([target.lat, target.lng], { animate: true, duration: 0.4 });
      }
    } else if (interactive && points.length) {
      // Nothing selected — fit the view so every pin is visible at once,
      // instead of opening at a fixed zoom/center that can leave most of a
      // wide-radius search off-screen.
      const bounds = L.latLngBounds(hasCenter ? [...points, [centerLat, centerLng]] : points);
      map.fitBounds(bounds, { padding: [48, 48], maxZoom: 15 });
    }
  }, [sales, selectedId]);

  // Blue "you are here" dot, added/moved whenever a real center is known.
  // Handled here rather than in the mount effect above because on the
  // Explore map the real center often resolves a moment after mount
  // (geocoding the search ZIP is async) -- this reacts to it arriving late
  // instead of leaving the dot missing for the rest of the map's lifetime.
  const dotRef = useRef(null);
  useEffect(() => {
    const L = window.L;
    const map = mapRef.current;
    if (!L || !map || !hasCenter) return;
    if (dotRef.current) dotRef.current.setLatLng([centerLat, centerLng]);
    else {
      dotRef.current = L.circleMarker([centerLat, centerLng], {
        radius: 7, fillColor: '#3B82F6', fillOpacity: 1,
        color: '#fff', weight: 2.5,
      }).addTo(map);
      if (!sales.some(s => s.lat != null && s.lng != null)) map.setView([centerLat, centerLng], zoom);
    }
  }, [centerLat, centerLng]);

  if (!window.L) return <FauxMap sales={sales} selectedId={selectedId} onSelect={onSelect} />;
  return <div ref={containerRef} style={{position:'absolute',inset:0}} />;
}

// ── Sale card ─────────────────────────────────────────────────────────────────
function proxyImgUrl(url) {
  try {
    const h = new URL(url).hostname;
    if (h === 'estatesales.org' || h.endsWith('.estatesales.org') ||
        h === 'estatesales.net' || h.endsWith('.estatesales.net') ||
        h.endsWith('.amazonaws.com') || h.endsWith('.cloudfront.net') ||
        h.endsWith('.imgix.net') || h.endsWith('.tlcdn.workers.dev') || h === 'eso-cdn.tlcdn.workers.dev' ||
        h === 'images.craigslist.org' || h === 'maps.geoapify.com' ||
        h.endsWith('.fbcdn.net') || h === 'fbcdn.net' || h.endsWith('.facebook.com') ||
        h.endsWith('.nextdoor.com') || h === 'nextdoor.com')
      return `${API_BASE}/api/img?url=${encodeURIComponent(url)}`;
  } catch(_) {}
  return url;
}

// Type-specific placeholder — looks intentional, not broken
const PLACEHOLDER_STYLES = {
  estate:  { bg: '#E8E5DE', icon: 'Home',  color: '#675F52' },

};
function PhotoPlaceholder({ height, type = 'yard', blurb, title }) {
  const s = PLACEHOLDER_STYLES[type] || PLACEHOLDER_STYLES.yard;
  const tall = height > 120;
  const snippet = blurb || title || '';
  return (
    <div style={{height, background: s.bg, display:'flex', flexDirection:'column',
      alignItems: snippet && tall ? 'flex-start' : 'center',
      justifyContent: snippet && tall ? 'flex-end' : 'center',
      gap: 6, flexShrink: 0, padding: snippet && tall ? '14px 16px' : 0, boxSizing: 'border-box', overflow: 'hidden'}}>
      {!(snippet && tall) && Icon(s.icon, tall ? 34 : 22, { stroke: s.color, strokeWidth: 1.5 })}
      {snippet && tall && (
        <p style={{margin:0, fontFamily:'var(--font-sans)', fontSize: height > 200 ? 14 : 12,
          lineHeight: 1.45, color: s.color, fontWeight: 500,
          display:'-webkit-box', WebkitLineClamp: height > 200 ? 5 : 3,
          WebkitBoxOrient:'vertical', overflow:'hidden'}}>
          {snippet}

// A small non-interactive map centered on the sale's location — shown in place
// of a photo when a listing has no images (but does have coordinates).
function MapPlaceholder({ height, width, lat, lng, type='yard', id='ph', zoom=15 }) {
  return (
    <div style={{position:'relative', zIndex:0, isolation:'isolate', height, width: width || '100%', flexShrink:0, overflow:'hidden', background:'var(--surface-sunken)'}}>
      {/* selectedId intentionally left unset -- passing the sale's own id here
          made RealMap treat this single marker as "selected", which bumps it
          to 38px and fills it solid with the type color instead of the small
          white/outlined pin used everywhere else, reading as an oversized
          color blob instead of a location hint. */}
      <RealMap sales={[{ id, lat, lng, type }]} onSelect={()=>{}}
        centerLat={lat} centerLng={lng} zoom={zoom} interactive={false} />
    </div>

}

// Image with automatic fallback to a location map (or a generic placeholder if
// there are no coordinates either) on load error.
function SaleImg({ src, height, width, style, type, blurb, title, lat, lng, id }) {
  const [failed, setFailed] = React.useState(false);
  if (!src || failed) {
    if (lat != null && lng != null) return <MapPlaceholder height={height} width={width} lat={lat} lng={lng} type={type} id={id} />;
    return <PhotoPlaceholder height={height} type={type} blurb={blurb} title={title} />;
  }
  return (
    <div style={{ width: width || '100%', height, overflow:'hidden', background:'transparent', ...style }}>
      <img
        src={proxyImgUrl(src)}
        onError={() => setFailed(true)}
        loading="lazy"
        decoding="async"
        style={{ width:'100%', height:'100%', objectFit:'cover', display:'block', filter:PHOTO_FILTER }}
      />
    </div>
  );
}

function HeartBtn({ saved, onSave }) {
  const [tick, setTick] = useState(0);
  const handle = (e) => {
    e.stopPropagation();
    if (!saved) setTick(t => t + 1);
    onSave?.();
  };
  return (
    <button type="button" onClick={handle} style={{
      width:36,height:36,borderRadius:0,border:'none',
      background:'rgba(255,253,248,0.9)',backdropFilter:'blur(8px)',
      display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',
      boxShadow:'var(--shadow-sm)',overflow:'hidden',
    }}>
      <span key={tick} style={{
        display:'inline-flex',
        animation: tick > 0 ? 'heart-pop .55s cubic-bezier(.34,1.56,.64,1) both' : 'none',
      }}>
        {Icon('Heart',18,saved?{fill:'var(--coral)',stroke:'var(--coral)'}:{stroke:'var(--ink-500)'})}
      </span>
    </button>
  );
}

function useViewport() {
  const [size, setSize] = useState(() => ({ width: window.innerWidth, height: window.innerHeight }));
  useEffect(() => {
    const onResize = () => setSize({ width: window.innerWidth, height: window.innerHeight });
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  return { ...size, isLandscape: size.width > size.height };
}

// ── Photo gallery ─────────────────────────────────────────────────────────────
// Full-screen photo viewer -- tap any real photo in PhotoGallery to open.
// Swipe or use the arrow buttons to move between photos. Once open, pinch
// (or double-tap, or the zoom button) to zoom in on the current photo, same
// as a normal mobile photo viewer, then drag with one finger to pan around
// while zoomed. Purely a viewer: no save/share actions duplicated here, just
// Escape/X to close.
function PhotoLightbox({ images, startIndex=0, onClose }) {
  const MIN_SCALE = 1, MAX_SCALE = 4, TAP_ZOOM_SCALE = 2.5, DOUBLE_TAP_MS = 300;
  const [idx, setIdx] = useState(startIndex);
  const [scale, setScale] = useState(1);
  const [tx, setTx] = useState(0);
  const [ty, setTy] = useState(0);
  const [dragStart, setDragStart] = useState(null);
  const [dragDelta, setDragDelta] = useState(0);
  const total = images.length;
  const clamp = n => Math.max(0, Math.min(total-1, n));
  const zoomed = scale > 1.01;
  const stageRef = useRef(null);
  const wrapRef = useRef(null);
  const gestureRef = useRef({ lastTapTime: 0 });

  useEffect(() => {
    const onKey = e => { if (e.key==='Escape') onClose(); if (e.key==='ArrowLeft') setIdx(i=>clamp(i-1)); if (e.key==='ArrowRight') setIdx(i=>clamp(i+1)); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const resetZoom = () => { setScale(1); setTx(0); setTy(0); };
  // useLayoutEffect (not useEffect) so this runs before the browser paints the
  // newly-active photo, not after -- otherwise the new photo can render for one
  // frame with the previous photo's leftover zoom/pan transform still applied.
  React.useLayoutEffect(() => { resetZoom(); }, [idx]);

  // Keep the zoomed-in image from panning past its own edges.
  const clampPan = (nx, ny, s) => {
    const rect = stageRef.current?.getBoundingClientRect();
    if (!rect) return { x: nx, y: ny };
    const maxX = Math.max(0, (rect.width * (s - 1)) / 2);
    const maxY = Math.max(0, (rect.height * (s - 1)) / 2);
    return { x: Math.min(maxX, Math.max(-maxX, nx)), y: Math.min(maxY, Math.max(-maxY, ny)) };
  };
  const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  const mid  = (a, b) => ({ x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 });

  // Zoom to targetScale while keeping the point under (clientX, clientY) fixed on screen.
  const zoomAt = (clientX, clientY, targetScale) => {
    const rect = stageRef.current?.getBoundingClientRect();
    if (!rect) return;
    const localX = clientX - rect.left - rect.width / 2;
    const localY = clientY - rect.top - rect.height / 2;
    const contentX = (localX - tx) / scale;
    const contentY = (localY - ty) / scale;
    const s = Math.max(MIN_SCALE, Math.min(MAX_SCALE, targetScale));
    const p = clampPan(localX - s * contentX, localY - s * contentY, s);
    setScale(s); setTx(p.x); setTy(p.y);
  };
  const toggleZoom = (clientX, clientY) => zoomed ? resetZoom() : zoomAt(clientX, clientY, TAP_ZOOM_SCALE);
  const toggleZoomCentered = () => {
    const rect = stageRef.current?.getBoundingClientRect();
    if (rect) toggleZoom(rect.left + rect.width/2, rect.top + rect.height/2);
  };

  const onTouchStart = e => {
    e.preventDefault();
    const g = gestureRef.current;
    if (e.touches.length === 2) {
      g.pinching = true; g.panning = false;
      g.startDist = dist(e.touches[0], e.touches[1]);
      g.startScale = scale; g.startTx = tx; g.startTy = ty;
      g.startMid = mid(e.touches[0], e.touches[1]);
      setDragStart(null); setDragDelta(0);
      return;
    }
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    const now = Date.now();
    if (now - g.lastTapTime < DOUBLE_TAP_MS) {
      g.lastTapTime = 0;
      toggleZoom(t.clientX, t.clientY);
      return;
    }
    g.lastTapTime = now;
    if (zoomed) {
      g.panning = true;
      g.startTouch = { x: t.clientX, y: t.clientY };
      g.startTx = tx; g.startTy = ty;
    } else {
      setDragStart(t.clientX);
    }
  };

  const onTouchMove = e => {
    e.preventDefault();
    const g = gestureRef.current;
    if (g.pinching && e.touches.length === 2) {
      const newDist = dist(e.touches[0], e.touches[1]);
      const s = Math.max(MIN_SCALE, Math.min(MAX_SCALE, g.startScale * (newDist / g.startDist)));
      const rect = stageRef.current?.getBoundingClientRect();
      if (!rect) return;
      const localX0 = g.startMid.x - rect.left - rect.width / 2;
      const localY0 = g.startMid.y - rect.top - rect.height / 2;
      const contentX = (localX0 - g.startTx) / g.startScale;
      const contentY = (localY0 - g.startTy) / g.startScale;
      const m = mid(e.touches[0], e.touches[1]);
      const localX = m.x - rect.left - rect.width / 2;
      const localY = m.y - rect.top - rect.height / 2;
      const p = clampPan(localX - s * contentX, localY - s * contentY, s);
      setScale(s); setTx(p.x); setTy(p.y);
    } else if (g.panning && e.touches.length === 1) {
      const dx = e.touches[0].clientX - g.startTouch.x;
      const dy = e.touches[0].clientY - g.startTouch.y;
      const p = clampPan(g.startTx + dx, g.startTy + dy, scale);
      setTx(p.x); setTy(p.y);
    } else if (dragStart != null && !zoomed) {
      setDragDelta(e.touches[0].clientX - dragStart);
    }
  };

  const onTouchEnd = e => {
    const g = gestureRef.current;
    if (e.touches.length === 1 && g.pinching) {
      // One finger lifted mid-pinch -- keep going as a single-finger pan.
      g.pinching = false; g.panning = true;
      g.startTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      g.startTx = tx; g.startTy = ty;
      return;
    }
    if (e.touches.length > 0) return;
    // Snap fully back to baseline whenever a gesture ends near 1x zoom -- not just
    // when the gesture's last phase was still a pinch. A common real sequence is
    // pinch, lift one finger (which hands off to single-finger panning), then lift
    // the last finger; by then g.pinching is already false, so gating this reset on
    // it left scale/tx/ty stuck at a barely-zoomed, non-baseline value that could
    // carry into the next photo swipe instead of resetting cleanly.
    if (scale < MIN_SCALE + 0.05) resetZoom();
    g.pinching = false; g.panning = false;
    if (dragStart != null && !zoomed && Math.abs(dragDelta) > 60) {
      setIdx(i => clamp(i + (dragDelta<0?1:-1)));
    }
    setDragStart(null); setDragDelta(0);
  };

  // Attached natively with {passive:false} instead of as onTouchStart/Move/End
  // JSX props -- React registers touch listeners as passive by default, which
  // makes preventDefault() inside them a silent no-op. That's fine on desktop
  // Chromium (which is all any of this was tested against), but real iOS
  // WKWebView doesn't fully honor touch-action:none for its own native pinch
  // gesture either -- without a real preventDefault() actually taking effect,
  // pinch/pan here did nothing at all on a real device despite working
  // correctly in every simulated/headless test. handlersRef holds the latest
  // closures (re-synced every render) so this one-time listener attachment
  // still sees current scale/tx/ty/etc. instead of stale values from mount.
  const handlersRef = useRef({});
  handlersRef.current = { onTouchStart, onTouchMove, onTouchEnd };
  useEffect(() => {
    const el = wrapRef.current;
    if (!el) return;
    const start = e => handlersRef.current.onTouchStart(e);
    const move  = e => handlersRef.current.onTouchMove(e);
    const end   = e => handlersRef.current.onTouchEnd(e);
    el.addEventListener('touchstart', start, { passive: false });
    el.addEventListener('touchmove', move, { passive: false });
    el.addEventListener('touchend', end, { passive: false });
    el.addEventListener('touchcancel', end, { passive: false });
    return () => {
      el.removeEventListener('touchstart', start);
      el.removeEventListener('touchmove', move);
      el.removeEventListener('touchend', end);
      el.removeEventListener('touchcancel', end);
    };
  }, []);

  return (
    <div style={{position:'absolute',inset:0,zIndex:200,background:'rgba(10,9,7,.97)',display:'flex',flexDirection:'column'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'var(--safe-top) 14px 0',flexShrink:0}}>
        <span style={{fontFamily:'var(--font-mono)',fontSize:12,color:'rgba(255,255,255,.7)',padding:'8px 0'}}>{idx+1} / {total}</span>
        <div style={{display:'flex',gap:8}}>
          <button type="button" onClick={toggleZoomCentered} aria-label={zoomed?'Zoom out':'Zoom in'}
            style={{width:38,height:38,borderRadius:'50%',background:'rgba(255,255,255,.14)',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
            {Icon(zoomed?'ZoomOut':'ZoomIn',18,{stroke:'#fff'})}
          </button>
          <button type="button" onClick={onClose} aria-label="Close"
            style={{width:38,height:38,borderRadius:'50%',background:'rgba(255,255,255,.14)',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
            {Icon('X',20,{stroke:'#fff'})}
          </button>
        </div>
      </div>
      <div ref={wrapRef} style={{flex:1,position:'relative',overflow:'hidden',touchAction:'none'}}>
        <div style={{display:'flex',width:total*100+'%',height:'100%',
          transform:'translateX(calc('+(-idx*(100/total))+'% + '+(zoomed?0:dragDelta/total)+'px))',
          transition:dragStart!=null?'none':'transform .32s var(--ease-out)'}}>
          {images.map((src,i) => {
            const active = i===idx;
            return (
              <div key={i} ref={active ? stageRef : null} onDoubleClick={e=>toggleZoom(e.clientX, e.clientY)} style={{
                width:(100/total)+'%',height:'100%',flexShrink:0,
                display:'flex', alignItems:'center',justifyContent:'center',
                overflow:'hidden',
              }}>
                <img src={proxyImgUrl(src)} loading="lazy" decoding="async" style={{
                  width:'100%', height:'100%',
                  objectFit:'contain',display:'block',
                  transform: active ? `translate(${tx}px, ${ty}px) scale(${scale})` : 'none',
                  transition: (active && (gestureRef.current.pinching || gestureRef.current.panning)) ? 'none' : 'transform .2s var(--ease-out)',
                  cursor: active && zoomed ? 'zoom-out' : 'zoom-in',
                }} />
              </div>
            );
          })}
        </div>
      </div>
      {!zoomed && total > 1 && (
        <div style={{position:'absolute',bottom:'calc(20px + var(--safe-bottom))',left:0,right:0,display:'flex',justifyContent:'center',gap:6}}>
          {images.map((_,i)=>(
            <span key={i} style={{width: i===idx?20:7,height:7,borderRadius:'var(--radius-pill)',background: i===idx?'var(--accent)':'rgba(255,255,255,.4)',transition:'all var(--dur-base) var(--ease-out)'}} />
          ))}
        </div>
      )}
    </div>
  );
}

function PhotoGallery({ images, type, height=260, onBack, hideBack=false, saved, onSave, sale, onShare }) {
  const GRADS = {
    estate:['#E8E5DE','#E8E5DE','#E8E5DE'],
    yard:  ['#E8E5DE','#E8E5DE','#E8E5DE'],
    moving:['#E8E5DE','#E8E5DE','#E8E5DE'],
  };
  const hasCoords = sale?.lat != null && sale?.lng != null;
  const slides = (images && images.length) ? images : (hasCoords ? ['__MAP__'] : (GRADS[type]||GRADS.estate));
  const total = slides.length;
  const [idx, setIdx] = useState(0);
  const [dragStart, setDragStart] = useState(null);
  const [dragDelta, setDragDelta] = useState(0);
  const [dragging, setDragging] = useState(false);
  const thumbsRef = useRef(null);
  const [lightboxOpen, setLightboxOpen] = useState(false);
  const clamp = n => Math.max(0, Math.min(total-1, n));
  const isUrl = s => typeof s==='string' && (s.startsWith('http') || s.startsWith('data:'));

  const onTouchStart = e => { setDragStart(e.touches[0].clientX); setDragging(true); };
  const onTouchMove  = e => { if (dragStart==null) return; setDragDelta(e.touches[0].clientX - dragStart); };
  const onTouchEnd   = () => {
    if (Math.abs(dragDelta) > 44) setIdx(i => clamp(i + (dragDelta<0?1:-1)));
    setDragStart(null); setDragDelta(0); setDragging(false);
  };

  // Scroll active thumbnail into view — scroll only the strip, not outer containers
  React.useEffect(() => {
    if (!thumbsRef.current || !isUrl(slides[0])) return;
    const el = thumbsRef.current.children[idx];
    if (!el) return;
    const strip = thumbsRef.current;
    const target = el.offsetLeft - (strip.offsetWidth - el.offsetWidth) / 2;
    strip.scrollTo({ left: target, behavior: 'smooth' });
  }, [idx]);

  const hasPhotos = isUrl(slides[0]);

  return (
    <div style={{flexShrink:0, width:'100%', overflow:'hidden'}}>
      {/* Main carousel */}
      <div style={{position:'relative',height,overflow:'hidden',background:'var(--paper-2)'}}>
        <div
          onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
          style={{display:'flex',width:total*100+'%',height:'100%',
            transform:'translateX(calc('+(-idx*(100/total))+'% + '+(dragDelta/total)+'px))',
            transition:dragging?'none':'transform .32s var(--ease-out)',userSelect:'none'}}>
          {slides.map((slide,i) => (
            <div key={i} onClick={()=>isUrl(slide) && setLightboxOpen(true)} style={{width:(100/total)+'%',height:'100%',flexShrink:0,overflow:'hidden',
              background:isUrl(slide)?'#111':'transparent',cursor:isUrl(slide)?'zoom-in':'default'}}>
              {isUrl(slide)
                ? <SaleImg src={slide} height="100%" type={type} blurb={sale?.blurb} title={sale?.title} style={{width:'100%',height:'100%',pointerEvents:'none'}} />
                : slide==='__MAP__'
                ? <div style={{width:'100%',height:'100%',pointerEvents:'none'}}><MapPlaceholder height="100%" width="100%" lat={sale.lat} lng={sale.lng} type={type} id={sale.id} /></div>
                : <div style={{width:'100%',height:'100%',background:slide,display:'flex',alignItems:'flex-end',padding:'0 20px 24px',boxSizing:'border-box'}}>
                    {sale?.blurb ? <p style={{margin:0,fontFamily:'var(--font-sans)',fontSize:14,lineHeight:1.5,color:'rgba(0,0,0,.65)',fontWeight:500,display:'-webkit-box',WebkitLineClamp:4,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{sale.blurb}</p> : null}
                  </div>}
            </div>
          ))}
        </div>
        <div style={{position:'absolute',inset:0,background:'linear-gradient(180deg,rgba(0,0,0,.32) 0%,transparent 30%,transparent 65%,rgba(0,0,0,.18) 100%)',pointerEvents:'none'}} />
        <div style={{position:'absolute',top:'var(--safe-top)',left:14,right:14,display:'flex',justifyContent: hideBack ? 'flex-end' : 'space-between'}}>
          {!hideBack && (
            <button onClick={onBack} aria-label="Back" style={{display:'flex',alignItems:'center',gap:4,background:'rgba(0,0,0,.55)',backdropFilter:'blur(4px)',border:'none',borderRadius:'var(--radius-btn)',padding:'7px 14px 7px 10px',cursor:'pointer'}}>
              {Icon('ChevronLeft',18,{stroke:'#fff',sw:2.5})}
              <span style={{color:'#fff',fontSize:13,fontWeight:700,fontFamily:'var(--font-sans)'}}>Back</span>
            </button>
          )}
          <div style={{display:'flex',gap:8}}>
            <IconButton icon={Icon('Share',19)} shape="circle" aria-label="Share" onClick={()=>onShare && onShare()} />
            <IconButton icon={Icon('Heart',19,sale&&sale.saved?{fill:'var(--coral)',stroke:'var(--coral)'}:{})} shape="circle" aria-label="Save" onClick={()=>onSave&&onSave()} />
          </div>
        </div>
        {total > 1 && (
          <div style={{position:'absolute',bottom:12,left:0,right:0,display:'flex',justifyContent:'center',gap:6}}>
            {slides.map((_,i)=>(
              <span key={i} style={{width: i===idx?20:7,height:7,borderRadius:'var(--radius-pill)',background: i===idx?'var(--accent)':'rgba(255,255,255,.5)',transition:'all var(--dur-base) var(--ease-out)',boxShadow:'0 1px 3px rgba(0,0,0,.3)'}} />
            ))}
          </div>
        )}
      </div>

      {/* Thumbnail strip — only shown when there are real photos */}
      {hasPhotos && total > 1 && (
        <div ref={thumbsRef} style={{display:'flex',gap:4,overflowX:'auto',padding:'6px 8px',background:'var(--surface-app)',scrollbarWidth:'none',WebkitOverflowScrolling:'touch'}}>
          {slides.map((slide, i) => (
            <button key={i} onClick={()=>setIdx(i)} style={{
              flexShrink:0, width:62, height:62, borderRadius:0, overflow:'hidden', padding:0, border:'none',
              outline: i===idx ? '2.5px solid var(--accent)' : '2.5px solid transparent',
              opacity: i===idx ? 1 : 0.62, cursor:'pointer', transition:'opacity .18s,outline .18s',
            }}>
              <SaleImg src={slide} height={62} type={type} />
            </button>
          ))}
        </div>
      )}

      {/* Photos come straight from the original listing -- we don't vet or
          host them ourselves, so a quiet caption here sets that expectation
          right where it matters instead of only in the Terms of Service. */}
      {hasPhotos && (
        <div style={{padding:'6px 14px 0',fontFamily:'var(--font-sans)',fontSize:11,color:'var(--text-faint)',textAlign:'center'}}>
          Photos from the original listing
        </div>
      )}

      {lightboxOpen && hasPhotos && ReactDOM.createPortal(
        <PhotoLightbox images={slides.filter(isUrl)} startIndex={idx} onClose={()=>setLightboxOpen(false)} />,
        document.body
        // Portaled straight to <body> -- this gallery's own wrapper (and
        // DetailScreen's root above it) both set overflow:hidden, which
        // clips position:absolute;inset:0 descendants to that ancestor's
        // box even though the sizing itself resolves against the viewport.
        // Without the portal the lightbox rendered as a small clipped
        // rectangle instead of a true full-screen overlay.
      )}
    </div>
  );
}

// A light tactile "press" on tap -- shared by every listing tile so they all
// feel the same, rather than each card wiring its own transform handlers.
const pressScaleHandlers = {
  onMouseDown: e => { e.currentTarget.style.transform = 'scale(.97)'; },
  onMouseUp:   e => { e.currentTarget.style.transform = 'scale(1)'; },
  onMouseLeave:e => { e.currentTarget.style.transform = 'scale(1)'; },
  onTouchStart:e => { e.currentTarget.style.transform = 'scale(.97)'; },
  onTouchEnd:  e => { e.currentTarget.style.transform = 'scale(1)'; },
  onTouchCancel:e => { e.currentTarget.style.transform = 'scale(1)'; },
};

function SaleCard({ id, type='estate',title,address,distanceMi,dateLabel,timeLabel,photoCount,images,blurb='',saved=false,onSave,onClick,layout='full',inTrip=false,onToggleTrip,lat,lng }) {

        {onToggleTrip && (

            position:'absolute',top:12,right:12,zIndex:1000,

        <div style={{position:'absolute',bottom:12,right:12,zIndex:1000}}><HeartBtn saved={saved} onSave={onSave} /></div>
      </div>
      <div style={{padding:'14px 16px 16px'}}>
        <h3 style={{fontWeight:800,fontSize:17,lineHeight:1.2,color:'var(--ink-900)',marginBottom:4,letterSpacing:'-0.02em'}}>{title}</h3>
        <div style={{fontSize:13,color:'var(--text-muted)',marginBottom:6,fontWeight:500}}>{address}</div>

        <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>

          {photoCount!=null && (

        </div>
      </div>
    </Card>
  );
}

            display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',

            position:'absolute',bottom:8,left:8,zIndex:1000,
            width:30,height:30,borderRadius:0,border:'none',

}

function ExploreScreen({ sales, onOpenSale, onOpenFilters, onToggleSave, radiusMi, zip, apiStatus, coverageMessage, mapCenter,
    homeZip, detectedCity, awayFromHome, useHomeZip, setUseHomeZip,
    setZip, locating, locationDenied, onRequestLocation,
    activeTypes, setActiveTypes, keyword, onClearKeyword, tripIds=[], onToggleTrip, onOpenVintageStores }) {

  const [selected, setSelected] = useState(null);

  const selectedTypes = Object.keys(activeTypes).filter(k => activeTypes[k] === true);

  // criterion leads. "Closest" ranks by distance from your account's ZIP

  const typeFiltered = sales.filter(s => selectedTypes.length === 0 || selectedTypes.includes(s.type));
  const shown = typeFiltered
    .slice().sort((a, b) => {
      const distDiff = (a.distanceMi ?? 999) - (b.distanceMi ?? 999);
      const dateDiff = saleSortDate(a.dateLabel) - saleSortDate(b.dateLabel);
      return sortBy === 'date' ? (dateDiff || distDiff) : (distDiff || dateDiff);
    });
  const sel = shown.find(s=>s.id===selected) || null;

  // No resolved ZIP yet (geolocation still pending, denied, or unavailable,

function SavedScreen({ sales, onOpenSale, onToggleSave, tripIds=[], onToggleTrip }) {
  const [tab, setTab] = useState('upcoming');
  const { isLandscape } = useViewport();
  const saved = sales.filter(s=>s.saved);
  const now = new Date();
  const MO = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};

  const saleEndDate = (s) => {
    const label = s.dateLabel || '';
    const hits = [...label.matchAll(/([A-Za-z]{3,9})\s+(\d{1,2})(?:,?\s*(\d{4}))?/g)]
      .filter(m => MO[m[1].toLowerCase().slice(0,3)] !== undefined);
    if (hits.length) {
      const m = hits[hits.length-1];
      const mo = MO[m[1].toLowerCase().slice(0,3)];
      const day = parseInt(m[2]);
      const yr = m[3] ? parseInt(m[3]) : now.getFullYear();
      return new Date(yr, mo, day, 23, 59, 59);
    }
    return null;
  };

  const upcoming  = saved.filter(s => { const d=saleEndDate(s); return !d || d >= now; });
  const past      = saved.filter(s => { const d=saleEndDate(s); return d && d < now; });
  const shown     = tab==='past' ? past : upcoming;

  const EmptyState = ({icon, title, body}) => (
    <div style={{textAlign:'center',padding:'48px 28px',background:'var(--surface-card)',borderRadius:'var(--radius-2xl)',boxShadow:'var(--shadow-sm)'}}>
      <div style={{fontSize:44,marginBottom:12}}>{icon}</div>
      <p style={{fontWeight:800,fontSize:20,color:'var(--ink-900)',margin:'0 0 8px',letterSpacing:'-0.02em'}}>{title}</p>
      <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',margin:0,lineHeight:1.6}}>{body}</p>
    </div>
  );

  return (
    <div style={{position:'absolute',inset:0,overflowY:'auto',background:'var(--surface-app)',display:'flex',flexDirection:'column'}}>
      <div style={{paddingTop:'var(--safe-top)'}} />
      <div style={{padding:'8px 20px 14px'}}>
        <div className="rmg-eyebrow" style={{marginBottom:4}}>{saved.length} {saved.length===1?'sale':'sales'} saved</div>
        <h1 style={{fontSize:36,fontWeight:900,letterSpacing:'-0.03em',color:'var(--ink-900)',lineHeight:1.05}}>Saved Sales</h1>
        <div style={{marginTop:16}}>
          <SegmentedControl
            options={[
              {value:'upcoming', label:`Upcoming${upcoming.length ? ` · ${upcoming.length}` : ''}`},
              {value:'past',     label:`Past${past.length     ? ` · ${past.length}`     : ''}`},
            ]}
            value={tab} onChange={setTab} style={{width:'100%',display:'flex'}} />
        </div>
      </div>
      <div style={{padding:'14px 20px 120px',background:'rgba(246,246,246,0.96)',flex:1}}>
        {saved.length===0 ? (
          <EmptyState icon="🔖" title="Nothing saved yet" body="Tap the heart on any sale to save it here for later." />
        ) : shown.length===0 ? (
          tab==='past'
            ? <EmptyState icon="📦" title="No past sales" body="Sales you've attended will appear here." />
            : <EmptyState icon="🗓️" title="No upcoming saves" body="Heart a sale on the Explore tab to save it." />
        ) : (
          <div>
            {shown.map(s=>(
              <div key={s.id} onClick={()=>onOpenSale(s.id)} style={{

// ── Auth Screen ───────────────────────────────────────────────────────────────
// Verification is email-based (via Resend). Phone/SMS verification was
// tried via Twilio, but the toll-free number got stuck in a rejected-then-
// blocked-from-resubmitting state with no fast resolution, while email has
// worked reliably the whole time -- reverted back to email for now.
function AuthScreen({ onAuth }) {
  const [mode, setMode]         = useState('signin'); // 'signin' | 'signup'
  const [email, setEmail]       = useState('');
  const [password, setPassword] = useState('');
  const [confirm, setConfirm]   = useState('');
  const [fullName, setFullName] = useState('');
  // Optional -- verification still runs on email (see sendCode/verifyCode
  // below). This collects phone + shows the SMS consent disclosure so the
  // toll-free registration has a real, truthful point of collection to
  // point to, without switching the app back to phone-based verification
  // before Twilio's side is actually approved.
  const [phone, setPhone] = useState('');
  const [showPw, setShowPw]         = useState(false);
  const [errors, setErrors]         = useState({});
  const [loading, setLoading]       = useState(false);
  const [authStep, setAuthStep]     = useState('form'); // 'form' | 'verify'
  const [codeDigits, setCodeDigits] = useState(['','','','','','']);
  const [codeError, setCodeError]   = useState('');
  const [resendTimer, setResendTimer] = useState(0);
  const [legalPage, setLegalPage]     = useState(null); // null | 'terms' | 'privacy'
  const codeRefs = [useRef(),useRef(),useRef(),useRef(),useRef(),useRef()];

  useEffect(() => {
    if (resendTimer <= 0) return;
    const t = setTimeout(() => setResendTimer(n => n-1), 1000);
    return () => clearTimeout(t);
  }, [resendTimer]);

  if (legalPage === 'terms')   return <TermsScreen   onBack={()=>setLegalPage(null)} />;
  if (legalPage === 'privacy') return <PrivacyScreen onBack={()=>setLegalPage(null)} />;

  const validate = () => {
    const e = {};
    if (!fullName.trim() && mode==='signup') e.fullName = 'Name is required';
    if (!email.trim())    e.email    = 'Email is required';
    else if (!/\S+@\S+\.\S+/.test(email)) e.email = 'Enter a valid email';
    if (!password)        e.password = 'Password is required';
    else if (password.length < 6) e.password = 'At least 6 characters';
    if (mode==='signup' && password !== confirm) e.confirm = "Passwords don't match";
    return e;
  };

  const sendCode = () => {
    setResendTimer(30);
    return fetch(`${API_BASE}/api/send-verification`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: email.trim() }),
    }).then(r => r.json());
  };

  const submit = () => {
    const e = validate();
    if (Object.keys(e).length) { setErrors(e); return; }
    if (mode === 'signin') {
      setLoading(true);
      setTimeout(() => {
        setLoading(false);
        onAuth({ name: fullName.trim() || 'Rummager', email: email.trim(), avatar: null });
      }, 600);
      return;
    }
    setLoading(true);
    sendCode().then(res => {
      setLoading(false);
      if (res.error) { setErrors({ email: res.error }); return; }
      setAuthStep(res.devMode ? 'verify-dev' : 'verify');
      setTimeout(() => codeRefs[0].current?.focus(), 100);
    }).catch(() => {
      setLoading(false);
      setErrors({ email: 'Could not reach the server. Make sure server.js is running on port 3002.' });
    });
  };

  const onDigit = (i, val) => {
    const d = val.replace(/\D/g,'').slice(-1);
    const next = [...codeDigits]; next[i] = d; setCodeDigits(next); setCodeError('');
    if (d && i < 5) setTimeout(() => codeRefs[i+1].current?.focus(), 0);
    if (!d && i > 0) setTimeout(() => codeRefs[i-1].current?.focus(), 0);
  };

  const onCodeKey = (i, e) => {
    if (e.key==='Backspace' && !codeDigits[i] && i>0) codeRefs[i-1].current?.focus();
  };

  const onCodePaste = (e) => {
    const pasted = e.clipboardData.getData('text').replace(/\D/g,'').slice(0,6);
    if (pasted.length===6) { setCodeDigits(pasted.split('')); codeRefs[5].current?.focus(); }
    e.preventDefault();
  };

  const verifyCode = () => {
    const code = codeDigits.join('');
    if (code.length < 6) { setCodeError('Enter all 6 digits'); return; }
    setLoading(true);
    fetch(`${API_BASE}/api/check-code`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: email.trim(), code }),
    }).then(r=>r.json()).then(res => {
      setLoading(false);
      if (res.error) { setCodeError(res.error); setCodeDigits(['','','','','','']); setTimeout(()=>codeRefs[0].current?.focus(),0); return; }
      burstConfetti();
      onAuth({ name: fullName.trim(), email: email.trim(), avatar: null });
    }).catch(() => { setLoading(false); setCodeError('Could not verify — is the backend server running?'); });
  };

  if (authStep === 'verify' || authStep === 'verify-dev') {
    const isDevMode = authStep === 'verify-dev';
    return (
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'var(--surface-app)',padding:'32px 24px',textAlign:'center'}}>
        <div style={{width:72,height:72,borderRadius:0,background:'var(--ink-900)',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:20}}>
          {Icon('Mail',34,{stroke:'#fff',sw:1.75})}
        </div>
        <h1 style={{fontSize:26,fontWeight:900,letterSpacing:'-0.03em',color:'var(--ink-900)',margin:'0 0 8px'}}>Check your email</h1>
        <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',lineHeight:1.6,margin:'0 0 28px',maxWidth:280}}>
          {isDevMode
            ? <>No email provider configured — check the <strong style={{color:'var(--ink-900)'}}>server.js console</strong> for your code.</>
            : <>We sent a 6-digit code to<br/><strong style={{color:'var(--ink-900)'}}>{email}</strong></>
          }
        </p>

        {/* 6-digit code input */}
        <div style={{display:'flex',gap:8,marginBottom:12}} onPaste={onCodePaste}>
          {codeDigits.map((d,i) => (
            <input key={i} ref={codeRefs[i]} type="text" inputMode="numeric" maxLength={1} value={d}
              onChange={e=>onDigit(i,e.target.value)} onKeyDown={e=>onCodeKey(i,e)}
              style={{width:44,height:54,textAlign:'center',fontSize:24,fontWeight:800,
                fontFamily:'var(--font-mono)',color:'var(--ink-900)',
                background:'var(--surface-raised)',
                border:'none',
                boxShadow: codeError ? '0 0 0 2px #DC2626' : d ? 'var(--shadow-focus)' : 'var(--shadow-sm)',
                borderRadius:'var(--radius-lg)',outline:'none',
                transition:'border-color var(--dur-fast), box-shadow var(--dur-fast)'}} />
          ))}
        </div>
        {codeError && <div style={{fontFamily:'var(--font-sans)',fontSize:13,color:'#DC2626',marginBottom:12}}>{codeError}</div>}

        {/* flex:'none' overrides Btn's own flex:1 (meant for filling a row
            next to a sibling button) -- inside this screen's vertical
            centered column it would otherwise stretch to fill all the
            leftover height instead of sizing to its own content. */}
        <Btn variant="primary" size="lg" fullWidth onClick={verifyCode}
          style={{marginBottom:14,flex:'none',opacity:loading?.6:1,pointerEvents:loading?'none':'auto'}}
          leadingIcon={loading?Icon('Loader',18,{stroke:'#fff'}):null}>
          {loading ? 'Verifying…' : 'Verify Email'}
        </Btn>

        <div style={{display:'flex',alignItems:'center',gap:8,fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-muted)'}}>
          Didn't get it?{' '}
          {resendTimer > 0
            ? <span style={{color:'var(--text-faint)'}}>Resend in {resendTimer}s</span>
            : <span style={{color:'var(--secondary)',fontWeight:600,cursor:'pointer'}} onClick={()=>sendCode()}>Resend code</span>
          }
        </div>
        <button type="button" onClick={()=>setAuthStep('form')} style={{marginTop:16,fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-faint)',background:'none',border:'none',cursor:'pointer'}}>
          ← Back
        </button>
      </div>
    );
  }

  return (
    <div style={{position:'absolute',inset:0,overflowY:'auto',background:'var(--surface-app)'}}>
      <div style={{paddingTop:'var(--safe-top)'}} />

      {/* Branding */}
      <div style={{padding:'24px 24px 20px',textAlign:'center'}}>
        <div style={{margin:'0 auto 16px'}}>
          <RummageLogo markSize={60} textSize={24} />
        </div>
        <div style={{fontWeight:900,fontSize:22,letterSpacing:'-0.03em',color:'var(--ink-900)',lineHeight:1.1}}>
          {mode==='signin' ? 'Welcome back' : 'Join Rummage'}
        </div>
        <div style={{fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-muted)',marginTop:4}}>
          {mode==='signin' ? 'Sign in to find sales near you' : 'Create your free account'}
        </div>
      </div>

      {/* Mode tabs */}
      <div style={{margin:'0 24px 20px'}}>
        <div style={{display:'flex',background:'var(--surface-sunken)',borderRadius:'calc(var(--radius-btn) + 3px)',padding:3}}>
          {[{value:'signin',label:'Sign In'},{value:'signup',label:'Create Account'}].map(opt=>(
            <button key={opt.value} type="button"
              onClick={()=>{setMode(opt.value);setErrors({});}}
              style={{flex:1,height:40,cursor:'pointer',borderRadius:'var(--radius-btn)',fontFamily:'var(--font-sans)',fontWeight:700,fontSize:13,
                border: mode===opt.value ? '1px solid var(--ink-200)' : 'none',
                background: mode===opt.value ? 'var(--ink-900)' : 'transparent',
                color: mode===opt.value ? '#fff' : 'var(--text-muted)',
                boxShadow: mode===opt.value ? 'var(--shadow-sm)' : 'none',
                transition:'all var(--dur-base) var(--ease-spring)',
              }}>
              {opt.label}
            </button>
          ))}
        </div>
      </div>

      <div style={{padding:'0 24px 100px',display:'flex',flexDirection:'column',gap:14}}>

        {mode==='signup' && (
          <Field label="Full name" value={fullName} onChange={v=>{setFullName(v);setErrors(p=>({...p,fullName:''}));}}
            placeholder="Your name" error={errors.fullName} />
        )}

        <Field label="Email address" value={email} onChange={v=>{setEmail(v);setErrors(p=>({...p,email:''}));}}
          type="email" placeholder="you@example.com" error={errors.email} autoCapitalize="none" />

        {mode==='signup' && (
          <div>
            <Field label="Phone number (optional)" value={phone} onChange={setPhone}
              type="tel" placeholder="(555) 123-4567" autoCapitalize="none" />
            <p style={{fontFamily:'var(--font-sans)',fontSize:12,color:'var(--text-faint)',lineHeight:1.5,margin:'6px 2px 0'}}>
              By entering your phone number and creating an account, you agree to receive a one-time SMS verification code from Rummage. Message and data rates may apply. We don't send marketing texts.
            </p>
          </div>
        )}

        <Field label="Password" value={password} onChange={v=>{setPassword(v);setErrors(p=>({...p,password:''}));}}
          type={showPw?'text':'password'} placeholder={mode==='signup'?'At least 6 characters':'Your password'} error={errors.password}
          trailing={{icon:Icon(showPw?'EyeOff':'Eye',18,{stroke:'currentColor'}),onClick:()=>setShowPw(p=>!p)}} />

        {mode==='signup' && (
          <Field label="Confirm password" value={confirm} onChange={v=>{setConfirm(v);setErrors(p=>({...p,confirm:''}));}}
            type={showPw?'text':'password'} placeholder="Re-enter password" error={errors.confirm} />
        )}

        {mode==='signin' && (
          <div style={{textAlign:'right',marginTop:-6}}>
            <span style={{fontFamily:'var(--font-sans)',fontSize:13,color:'var(--secondary)',fontWeight:600,cursor:'pointer'}}>Forgot password?</span>
          </div>
        )}

        <Btn variant="primary" size="lg" fullWidth onClick={submit}
          style={{marginTop:4,height:'auto',padding:'24px 32px',fontSize:19,opacity:loading?.6:1,pointerEvents:loading?'none':'auto'}}
          leadingIcon={loading ? Icon('Loader',18,{stroke:'#fff'}) : null}>
          {loading ? 'Just a sec…' : mode==='signin' ? 'Sign In' : 'Create Account'}
        </Btn>

        <button type="button"
          onClick={()=>onAuth({ name:'Guest', avatar:null, guest:true })}
          style={{textAlign:'center',fontFamily:'var(--font-sans)',fontWeight:600,fontSize:14,color:'var(--text-muted)',background:'none',border:'none',cursor:'pointer',padding:'2px 0'}}>
          Continue as guest
        </button>

        <div style={{textAlign:'center',fontFamily:'var(--font-sans)',fontSize:12,color:'var(--text-faint)',lineHeight:1.5,marginTop:4}}>
          By continuing you agree to our{' '}
          <span onClick={()=>setLegalPage('terms')} style={{color:'var(--secondary)',fontWeight:600,cursor:'pointer'}}>Terms</span>{' '}and{' '}
          <span onClick={()=>setLegalPage('privacy')} style={{color:'var(--secondary)',fontWeight:600,cursor:'pointer'}}>Privacy Policy</span>
        </div>
      </div>
    </div>
  );
}

          <h1 style={{fontSize:20,fontWeight:800,letterSpacing:'-0.02em',color:'var(--ink-900)',margin:0}}>Help & FAQ</h1>
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'16px 20px 48px',display:'flex',flexDirection:'column',gap:10}}>
        <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',margin:'0 0 6px',lineHeight:1.6}}>
          Have a question? Find answers to the most common ones below.
        </p>
        {FAQ_ITEMS.map((item, i) => {
          const isOpen = open === i;
          return (
            <button key={i} type="button" onClick={() => setOpen(isOpen ? null : i)} style={{
              display:'flex',flexDirection:'column',gap:0,width:'100%',textAlign:'left',
              background:'var(--surface-card)',borderRadius:'var(--radius-xl)',
              border:'none',cursor:'pointer',overflow:'hidden',

// Downscales a photo client-side (long edge capped, re-encoded as JPEG) --
// a phone camera photo can be 4-12MB, and keeping the upload small matters
// on mobile data. Originally written for Price Check but also used by
// ListScreen's photo picker -- shared, so it stays defined here, outside
// the Price Check block disabled below, rather than getting disabled along
// with it (that exact mistake briefly broke ListScreen's photo upload with
// a ReferenceError after Price Check was first shelved).
function downscalePhoto(file, maxEdge = 1024, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read that file'));
    reader.onload = () => {
      img.onerror = () => reject(new Error('Could not read that image'));
      img.onload = () => {
        const scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
