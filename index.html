// ── Icon helper ───────────────────────────────────────────────────────────────
function Icon(name, size = 20, opts = {}) {
  const node = window.lucide && window.lucide.icons && window.lucide.icons[name];
  if (!node) return null;
  const walk = (m) => {
    const tag = m[0], attrs = { ...m[1] || {} }, kids = m[2] || [];
    if (tag === 'svg') {
      attrs.width = size; attrs.height = size;
      if (opts.stroke) attrs.stroke = opts.stroke;
      if (opts.fill) attrs.fill = opts.fill;
      if (opts.sw) attrs['stroke-width'] = opts.sw;
    }
    return `<${tag} ${Object.entries(attrs).map(([k,v]) => `${k}="${v}"`).join(' ')}>${kids.map(walk).join('')}</${tag}>`;
  };
  return <span style={{display:'inline-flex',flex:'0 0 auto'}} dangerouslySetInnerHTML={{__html:walk(node)}} />;
}

// ── Reminder helpers (Web Notifications + localStorage) ──────────────────────
function parseSaleStart(dateLabel, timeLabel) {
  if (!timeLabel) return null;
  const tMatch = timeLabel.match(/(\d+)(?::(\d+))?\s*(am|pm)/i);
  if (!tMatch) return null;
  let h = parseInt(tMatch[1]);
  const m = tMatch[2] ? parseInt(tMatch[2]) : 0;
  const ap = tMatch[3].toLowerCase();
  if (ap === 'pm' && h !== 12) h += 12;
  if (ap === 'am' && h === 12) h = 0;
  const MO = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const DY = {sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
  const now = new Date();
  const full = dateLabel && dateLabel.match(/\w+,\s+(\w+)\s+(\d+)/);
  if (full) {
    const mo = MO[full[1].toLowerCase().slice(0,3)];
    if (mo !== undefined) {
      const d = new Date(now.getFullYear(), mo, parseInt(full[2]), h, m, 0);
      if (d < now) d.setFullYear(now.getFullYear() + 1);
      return d;
    }
  }
  const dm = dateLabel && dateLabel.match(/^(\w{3})/i);
  if (dm) {
    const dn = DY[dm[1].toLowerCase()];
    if (dn !== undefined) {
      let diff = dn - now.getDay();
      if (diff < 0) diff += 7;
      if (diff === 0 && now.getHours() >= h) diff = 7;
      return new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff, h, m, 0);
    }
  }
  return null;
}

function getReminders() {
  try { return JSON.parse(localStorage.getItem('rummage_reminders') || '{}'); } catch(e) { return {}; }
}
function saveReminder(id, fireAt) {
  const r = getReminders(); r[id] = fireAt; localStorage.setItem('rummage_reminders', JSON.stringify(r));
}
function removeReminder(id) {
  const r = getReminders(); delete r[id]; localStorage.setItem('rummage_reminders', JSON.stringify(r));
}
function scheduleNotification(sale) {
  const start = parseSaleStart(sale.dateLabel, sale.timeLabel);
  if (!start) return null;
  const fireAt = new Date(start.getTime() - 30 * 60 * 1000);
  const delay = fireAt.getTime() - Date.now();
  if (delay > 0) {
    setTimeout(() => {
      new Notification('🧺 Sale starting soon!', {
        body: (sale.title || 'A sale') + ' starts in 30 min at ' + (sale.address || sale.neighborhood || ''),
        tag: 'rummage-' + sale.id,
      });
    }, delay);
  }
  return fireAt;
}
function restoreReminders(allSales) {
  const r = getReminders();
  const now = Date.now();
  Object.keys(r).forEach(id => {
    if (r[id] < now) { removeReminder(id); return; }
    const sale = allSales.find(s => s.id === id);
    if (sale) scheduleNotification(sale);
  });
}

// ── Design system components ──────────────────────────────────────────────────
function Btn({ variant='primary', size='default', fullWidth, leadingIcon, onClick, children, style }) {
  const base = {
    display:'inline-flex', alignItems:'center', justifyContent:'center',
    gap:8, border:'none', cursor:'pointer', fontFamily:'var(--font-sans)',
    fontWeight:700, letterSpacing:'-0.01em', whiteSpace:'nowrap',
    transition:`all var(--dur-fast) var(--ease-out)`,
    borderRadius:'var(--radius-pill)', width: fullWidth?'100%':'auto',
  };
  const sz = size==='lg' ? {height:56,padding:'0 32px',fontSize:17}
           : size==='sm' ? {height:36,padding:'0 16px',fontSize:13}
           : {height:48,padding:'0 24px',fontSize:15};
  const v = variant==='primary'  ? {background:'var(--accent)',color:'#FFFFFF',border:'none',boxShadow:'0 6px 20px rgba(249,115,22,.38)'}
          : variant==='secondary'? {background:'var(--brand-50)',color:'var(--accent)',border:'2px solid var(--brand-200)'}
          : {background:'transparent',color:'var(--text-primary)',border:'none'};
  return (
    <button onClick={onClick} style={{...base,...sz,...v,...style}}>
      {leadingIcon && <span style={{display:'inline-flex'}}>{leadingIcon}</span>}
      {children}
    </button>
  );
}

function Card({ padded=true, interactive, onClick, children, style, elevation }) {
  const shadow = elevation==='lg' ? 'var(--shadow-lg)' : elevation==='md' ? 'var(--shadow-md)' : 'var(--shadow-sm)';
  return (
    <div onClick={onClick} style={{
      background:'var(--surface-card)', border:'none',
      borderRadius:'var(--radius-xl)', boxShadow:shadow,
      padding: padded ? 20 : 0, overflow:'hidden',
      cursor: interactive ? 'pointer' : 'default',
      transition: interactive ? 'box-shadow var(--dur-fast), transform var(--dur-fast)' : 'none',
      ...style,
    }}>
      {children}
    </div>
  );
}

function Badge({ tone, children }) {
  const colors = tone==='live'
    ? {background:'var(--success-bg)',color:'var(--success)'}
    : {background:'var(--surface-sunken)',color:'var(--text-secondary)'};
  return (
    <span style={{
      display:'inline-flex', alignItems:'center', gap:4,
      padding:'2px 8px', borderRadius:'var(--radius-pill)',
      fontFamily:'var(--font-sans)', fontWeight:700, fontSize:'var(--text-2xs)',
      letterSpacing:'0.04em', textTransform:'uppercase', ...colors,
    }}>
      {tone==='live' && <span style={{width:6,height:6,borderRadius:'50%',background:'var(--success)',display:'inline-block'}} />}
      {children}
    </span>

// ── Leaflet real map ──────────────────────────────────────────────────────────
const TYPE_COLOR_HEX = {
  estate:'#7C3AED', yard:'#15803D', thrift:'#C2410C', moving:'#B45309',
};

function RealMap({ sales, selectedId, onSelect, centerLat=33.9792, centerLng=-118.0328, zoom=13, interactive=true }) {
  const containerRef = useRef(null);
  const mapRef       = useRef(null);
  const markersRef   = useRef({});

  // Init map once on mount
  useEffect(() => {
    const L = window.L;
    if (!L || !containerRef.current || mapRef.current) return;
    const map = L.map(containerRef.current, {
      center: [centerLat, centerLng], zoom,
      zoomControl: false, attributionControl: false,
      scrollWheelZoom: interactive, dragging: interactive,
      touchZoom: interactive, doubleClickZoom: interactive,
      boxZoom: false, keyboard: false,
    });
    L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
      { maxZoom: 19, subdomains: 'abcd' }
    ).addTo(map);
    if (interactive) L.control.zoom({ position: 'bottomright' }).addTo(map);
    // Blue user-location dot at center
    L.circleMarker([centerLat, centerLng], {
      radius: 7, fillColor: '#3B82F6', fillOpacity: 1,
      color: '#fff', weight: 2.5,
    }).addTo(map);
    mapRef.current = map;
    return () => { map.remove(); mapRef.current = null; };
  }, []);

  // Update markers whenever sales or selection changes
  useEffect(() => {
    const L = window.L;
    if (!L || !mapRef.current) return;
    const map = mapRef.current;
    // Remove old markers
    Object.values(markersRef.current).forEach(m => m.remove());
    markersRef.current = {};

    sales.forEach(s => {
      if (s.lat == null || s.lng == null) return;
      const sel   = s.id === selectedId;
      const color = TYPE_COLOR_HEX[s.type] || '#888';
      const size  = sel ? 38 : 28;
      const icon  = L.divIcon({
        className: '',
        html: `<div style="
          width:${size}px;height:${size}px;
          border-radius:50% 50% 50% 0;transform:rotate(45deg);
          background:${sel ? color : '#fff'};border:2.5px solid ${color};
          box-shadow:${sel ? '0 4px 14px rgba(0,0,0,.35)' : '0 2px 6px rgba(0,0,0,.22)'};
          transition:all .18s ease;
        "></div>`,
        iconSize:   [size, size],
        iconAnchor: [size / 2, size],
      });
      const marker = L.marker([s.lat, s.lng], { icon, zIndexOffset: sel ? 1000 : 0 })
        .addTo(map)
        .on('click', () => onSelect?.(s.id));
      markersRef.current[s.id] = marker;
    });

    // Pan to selected marker
    if (selectedId && markersRef.current[selectedId]) {
      const target = sales.find(s => s.id === selectedId);
      if (target?.lat && interactive) {
        map.panTo([target.lat, target.lng], { animate: true, duration: 0.4 });
      }
    }
  }, [sales, selectedId]);

  if (!window.L) return <FauxMap sales={sales} selectedId={selectedId} onSelect={onSelect} />;
  return <div ref={containerRef} style={{position:'absolute',inset:0}} />;
}

// ── Countdown hook ────────────────────────────────────────────────────────────
function useCountdown(dateLabel, timeLabel) {
  const [info, setInfo] = useState({label:'', status:'upcoming'});
  useEffect(() => {
    const start = parseSaleStart(dateLabel, timeLabel);
    if (!start) return;
    const allTimes = (timeLabel||'').match(/(\d+)(?::(\d+))?\s*(am|pm)/gi) || [];
    let end = null;
    if (allTimes.length >= 2) {
      const last = allTimes[allTimes.length - 1].match(/(\d+)(?::(\d+))?\s*(am|pm)/i);
      if (last) {
        let h = parseInt(last[1]), m = last[2] ? parseInt(last[2]) : 0;
        const ap = last[3].toLowerCase();
        if (ap==='pm' && h!==12) h+=12;
        if (ap==='am' && h===12) h=0;
        end = new Date(start); end.setHours(h,m,0,0);
        if (end <= start) end.setDate(end.getDate()+1);
      }
    }
    const calc = () => {
      const now = Date.now(), startMs = start.getTime();
      const diff = startMs - now;
      if (diff > 0) {
        const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000);
        const label = h>=48 ? 'Starts in '+(Math.floor(h/24))+'d'
                    : h>0   ? 'Starts in '+h+'h '+m+'m'
                             : m>0 ? 'Starts in '+m+'m' : 'Starting soon';
        setInfo({label, status:'upcoming'});
      } else if (end && now < end.getTime()) {
        const rem = end.getTime()-now;
        const h = Math.floor(rem/3600000), m = Math.floor((rem%3600000)/60000);
        const label = h>0 ? 'Ends in '+h+'h '+m+'m' : m>0 ? 'Ends in '+m+'m' : 'Ending soon';
        setInfo({label, status:'live'});
      } else {
        setInfo({label:'Ended', status:'ended'});
      }
    };
    calc();
    const t = setInterval(calc, 60000);
    return () => clearInterval(t);
  }, [dateLabel, timeLabel]);
  return info;
}

    moving:['linear-gradient(135deg,#FFFBEB 0%,#FDE68A 100%)','linear-gradient(135deg,#FEF3C7 0%,#FCD34D 100%)','linear-gradient(135deg,#FDE68A 0%,#D97706 100%)'],
  };
  const slides = (images && images.length) ? images : (GRADS[type]||GRADS.estate);
  const total = slides.length;
  const [idx, setIdx] = useState(0);
  const [dragStart, setDragStart] = useState(null);
  const [dragDelta, setDragDelta] = useState(0);
  const [dragging, setDragging] = useState(false);
  const clamp = n => Math.max(0, Math.min(total-1, n));
  const isUrl = s => typeof s==='string' && (s.startsWith('http') || s.startsWith('data:'));

  const onTouchStart = e => { setDragStart(e.touches[0].clientX); setDragging(true); };
  const onTouchMove  = e => { if (dragStart==null) return; setDragDelta(e.touches[0].clientX - dragStart); };
  const onTouchEnd   = () => {
    if (Math.abs(dragDelta) > 44) setIdx(i => clamp(i + (dragDelta<0?1:-1)));
    setDragStart(null); setDragDelta(0); setDragging(false);
  };

  return (
    <div style={{position:'relative',height,overflow:'hidden',background:'var(--paper-2)',flexShrink:0}}>
      <div
        onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
        style={{display:'flex',width:total*100+'%',height:'100%',
          transform:'translateX(calc('+(-idx*(100/total))+'% + '+(dragDelta/total)+'px))',
          transition:dragging?'none':'transform .32s var(--ease-out)',userSelect:'none'}}>
        {slides.map((slide,i) => (
          <div key={i} style={{width:(100/total)+'%',height:'100%',flexShrink:0,
            background:isUrl(slide)?'#000':slide,overflow:'hidden'}}>
            {isUrl(slide) && <img src={proxyImgUrl(slide)} style={{width:'100%',height:'100%',objectFit:'cover',display:'block',pointerEvents:'none'}} />}
            {!isUrl(slide) && (
              <div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',opacity:.35}}>
                {Icon('Image',52,{stroke:'#fff',sw:1})}
              </div>
            )}
          </div>
        ))}
      </div>
      <div style={{position:'absolute',inset:0,background:'linear-gradient(180deg,rgba(0,0,0,.32) 0%,transparent 30%,transparent 65%,rgba(0,0,0,.18) 100%)',pointerEvents:'none'}} />
      <div style={{position:'absolute',top:'var(--safe-top)',left:14,right:14,display:'flex',justifyContent:'space-between'}}>
        <IconButton icon={Icon('ChevronLeft',22)} shape="circle" aria-label="Back" onClick={onBack} />
        <div style={{display:'flex',gap:8}}>
          <IconButton icon={Icon('Share',19)} shape="circle" aria-label="Share" onClick={async ()=>{
            const s = sale;
            if (!s) return;
            const text = [s.title, s.dateLabel, s.timeLabel, s.address].filter(Boolean).join(' · ');
            try {
              if (navigator.share) {
                await navigator.share({ title: s.title, text, url: s.url || window.location.href });
              } else {
                await navigator.clipboard.writeText(text);
              }
            } catch(e) { if (e.name !== 'AbortError') console.warn('share failed', e); }
          }} />
          <IconButton icon={Icon('Heart',19,sale&&sale.saved?{fill:'var(--coral)',stroke:'var(--coral)'}:{})} shape="circle" aria-label="Save" onClick={()=>onSave&&onSave()} />
        </div>
      </div>
      {idx>0 && (
        <button onClick={()=>setIdx(i=>clamp(i-1))} style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',width:34,height:34,borderRadius:'50%',background:'rgba(255,255,255,.88)',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'var(--shadow-md)'}}>
          {Icon('ChevronLeft',18,{stroke:'var(--ink-900)'})}
        </button>
      )}
      {idx<total-1 && (
        <button onClick={()=>setIdx(i=>clamp(i+1))} style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',width:34,height:34,borderRadius:'50%',background:'rgba(255,255,255,.88)',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'var(--shadow-md)'}}>
          {Icon('ChevronRight',18,{stroke:'var(--ink-900)'})}
        </button>
      )}
      {total>1 && (
        <div style={{position:'absolute',bottom:14,left:0,right:0,display:'flex',justifyContent:'center',gap:5,pointerEvents:'none'}}>
          {slides.map((_,i)=>(
            <span key={i} style={{height:5,width:i===idx?20:5,borderRadius:3,background:i===idx?'#fff':'rgba(255,255,255,.5)',transition:'all .3s var(--ease-spring)'}} />
          ))}
        </div>
      )}
      <div style={{position:'absolute',bottom:14,right:14,background:'rgba(0,0,0,.5)',backdropFilter:'blur(4px)',color:'#fff',borderRadius:'var(--radius-pill)',padding:'3px 10px',fontSize:11,fontWeight:700,fontFamily:'var(--font-mono)'}}>
        {idx+1} / {total}
      </div>
    </div>
  );
}

function SavedScreen({ sales, onOpenSale, onToggleSave }) {
  const [tab, setTab] = useState('upcoming');
  const saved = sales.filter(s=>s.saved);
  const now = new Date();
  const MO = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};

  const saleEndDate = (s) => {
    const label = s.dateLabel || '';
    const hits = [...label.matchAll(/([A-Za-z]{3,9})\s+(\d{1,2})(?:,?\s*(\d{4}))?/g)]
      .filter(m => MO[m[1].toLowerCase().slice(0,3)] !== undefined);
    if (hits.length) {
      const m = hits[hits.length-1];
      const mo = MO[m[1].toLowerCase().slice(0,3)];
      const day = parseInt(m[2]);
      const yr = m[3] ? parseInt(m[3]) : now.getFullYear();
      return new Date(yr, mo, day, 23, 59, 59);
    }
    return null;
  };

  const upcoming  = saved.filter(s => { const d=saleEndDate(s); return !d || d >= now; });
  const past      = saved.filter(s => { const d=saleEndDate(s); return d && d < now; });
  const happening = upcoming.filter(s => s.live);
  const shown     = tab==='happening' ? happening : tab==='past' ? past : upcoming;

  const EmptyState = ({icon, title, body}) => (
    <div style={{textAlign:'center',padding:'48px 28px',background:'var(--surface-card)',borderRadius:'var(--radius-2xl)',boxShadow:'var(--shadow-sm)'}}>
      <div style={{fontSize:44,marginBottom:12}}>{icon}</div>
      <p style={{fontWeight:800,fontSize:20,color:'var(--ink-900)',margin:'0 0 8px',letterSpacing:'-0.02em'}}>{title}</p>
      <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',margin:0,lineHeight:1.6}}>{body}</p>
    </div>
  );

  return (
    <div style={{position:'absolute',inset:0,overflowY:'auto',background:'var(--surface-app)'}}>
      <div style={{paddingTop:'var(--safe-top)'}} />
      <div style={{padding:'8px 20px 14px'}}>
        <div className="rmg-eyebrow" style={{marginBottom:4}}>{saved.length} {saved.length===1?'sale':'sales'} saved</div>
        <h1 style={{fontSize:36,fontWeight:900,letterSpacing:'-0.03em',color:'var(--ink-900)',lineHeight:1.05}}>Saved Sales</h1>
        <div style={{marginTop:16}}>
          <SegmentedControl
            options={[
              {value:'upcoming', label:`Upcoming${upcoming.length ? ` · ${upcoming.length}` : ''}`},
              {value:'happening',label:`Now${happening.length ? ` · ${happening.length}` : ''}`},
              {value:'past',     label:`Past${past.length     ? ` · ${past.length}`     : ''}`},
            ]}
            value={tab} onChange={setTab} style={{width:'100%',display:'flex'}} />
        </div>
      </div>
      <div style={{padding:'4px 20px 120px',display:'flex',flexDirection:'column',gap:14}}>
        {saved.length===0 ? (
          <EmptyState icon="🔖" title="Nothing saved yet" body="Tap the heart on any sale to save it here for later." />
        ) : shown.length===0 ? (
          tab==='happening'
            ? <EmptyState icon="⏳" title="None happening now" body="Check the Upcoming tab for sales starting soon." />
            : tab==='past'
            ? <EmptyState icon="📦" title="No past sales" body="Sales you've attended will appear here." />
            : <EmptyState icon="🗓️" title="No upcoming saves" body="Heart a sale on the Explore tab to save it." />
        ) : shown.map(s=>(
          <SaleCard key={s.id} type={s.type} title={s.title} address={s.address} distanceMi={s.distanceMi}
            dateLabel={s.dateLabel} timeLabel={s.timeLabel} photoCount={s.photoCount} images={s.images} live={s.live}

          <div style={{display:'flex',alignItems:'center',gap:6,justifyContent:'center',padding:'8px 0',fontSize:13,color:'var(--text-muted)'}}>
            {Icon('Bell',14)} We'll remind you before your saved sales start

        )}
      </div>
    </div>
  );
}

// ── Auth Screen ───────────────────────────────────────────────────────────────
function AuthScreen({ onAuth }) {
  const [mode, setMode]         = useState('signin'); // 'signin' | 'signup'
  const [email, setEmail]       = useState('');
  const [password, setPassword] = useState('');
  const [confirm, setConfirm]   = useState('');
  const [fullName, setFullName] = useState('');
  const [selAvatar, setSelAvatar] = useState(AVATARS[0].id);
  const [showPw, setShowPw]         = useState(false);
  const [errors, setErrors]         = useState({});
  const [loading, setLoading]       = useState(false);
  const [authStep, setAuthStep]     = useState('form'); // 'form' | 'verify'
  const [codeDigits, setCodeDigits] = useState(['','','','','','']);
  const [codeError, setCodeError]   = useState('');
  const [resendTimer, setResendTimer] = useState(0);
  const codeRefs = [useRef(),useRef(),useRef(),useRef(),useRef(),useRef()];

  useEffect(() => {
    if (resendTimer <= 0) return;
    const t = setTimeout(() => setResendTimer(n => n-1), 1000);
    return () => clearTimeout(t);
  }, [resendTimer]);

  const validate = () => {
    const e = {};
    if (!fullName.trim() && mode==='signup') e.fullName = 'Name is required';
    if (!email.trim())    e.email    = 'Email is required';
    else if (!/\S+@\S+\.\S+/.test(email)) e.email = 'Enter a valid email';
    if (!password)        e.password = 'Password is required';
    else if (password.length < 6) e.password = 'At least 6 characters';
    if (mode==='signup' && password !== confirm) e.confirm = "Passwords don't match";
    return e;
  };

  const sendCode = () => {
    setResendTimer(30);
    return fetch('http://localhost:3002/api/send-verification', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: email.trim() }),
    }).then(r => r.json());
  };

  const submit = () => {
    const e = validate();
    if (Object.keys(e).length) { setErrors(e); return; }
    if (mode === 'signin') {
      setLoading(true);
      setTimeout(() => {
        setLoading(false);
        onAuth({ name: email.split('@')[0], email: email.trim(), avatar: AVATARS.find(a=>a.id===selAvatar)?.emoji || null });
      }, 600);
      return;
    }
    setLoading(true);
    sendCode().then(res => {
      setLoading(false);
      if (res.error) { setErrors({ email: res.error }); return; }
      setAuthStep(res.devMode ? 'verify-dev' : 'verify');
      setTimeout(() => codeRefs[0].current?.focus(), 100);
    }).catch(() => {
      setLoading(false);
      setErrors({ email: 'Could not reach the server. Make sure server.js is running on port 3002.' });
    });
  };

  const onDigit = (i, val) => {
    const d = val.replace(/\D/g,'').slice(-1);
    const next = [...codeDigits]; next[i] = d; setCodeDigits(next); setCodeError('');
    if (d && i < 5) setTimeout(() => codeRefs[i+1].current?.focus(), 0);
    if (!d && i > 0) setTimeout(() => codeRefs[i-1].current?.focus(), 0);
  };

  const onCodeKey = (i, e) => {
    if (e.key==='Backspace' && !codeDigits[i] && i>0) codeRefs[i-1].current?.focus();
  };

  const onCodePaste = (e) => {
    const pasted = e.clipboardData.getData('text').replace(/\D/g,'').slice(0,6);
    if (pasted.length===6) { setCodeDigits(pasted.split('')); codeRefs[5].current?.focus(); }
    e.preventDefault();
  };

  const verifyCode = () => {
    const code = codeDigits.join('');
    if (code.length < 6) { setCodeError('Enter all 6 digits'); return; }
    setLoading(true);
    fetch('http://localhost:3002/api/check-code', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: email.trim(), code }),
    }).then(r=>r.json()).then(res => {
      setLoading(false);
      if (res.error) { setCodeError(res.error); setCodeDigits(['','','','','','']); setTimeout(()=>codeRefs[0].current?.focus(),0); return; }
      onAuth({ name: fullName.trim(), email: email.trim(), avatar: AVATARS.find(a=>a.id===selAvatar)?.emoji || null });
    }).catch(() => { setLoading(false); setCodeError('Could not verify — is the backend server running?'); });
  };

  if (authStep === 'verify' || authStep === 'verify-dev') {
    const isDevMode = authStep === 'verify-dev';
    return (
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'var(--surface-app)',padding:'32px 24px',textAlign:'center'}}>
        <div style={{width:72,height:72,borderRadius:22,background:'linear-gradient(135deg,var(--brand-500),var(--brand-300))',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:20,boxShadow:'0 8px 32px rgba(249,115,22,.30)'}}>
          {Icon('Mail',34,{stroke:'#fff',sw:1.75})}
        </div>
        <h1 style={{fontSize:26,fontWeight:900,letterSpacing:'-0.03em',color:'var(--ink-900)',margin:'0 0 8px'}}>Check your email</h1>
        <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',lineHeight:1.6,margin:'0 0 28px',maxWidth:280}}>
          {isDevMode
            ? <>No SMTP configured — check the <strong style={{color:'var(--ink-900)'}}>server.js console</strong> for your code.</>
            : <>We sent a 6-digit code to<br/><strong style={{color:'var(--ink-900)'}}>{email}</strong></>
          }
        </p>

        {/* 6-digit code input */}
        <div style={{display:'flex',gap:8,marginBottom:12}} onPaste={onCodePaste}>
          {codeDigits.map((d,i) => (
            <input key={i} ref={codeRefs[i]} type="text" inputMode="numeric" maxLength={1} value={d}
              onChange={e=>onDigit(i,e.target.value)} onKeyDown={e=>onCodeKey(i,e)}
              style={{width:44,height:54,textAlign:'center',fontSize:24,fontWeight:800,
                fontFamily:'var(--font-mono)',color:'var(--ink-900)',
                background:'var(--surface-raised)',
                border:'none',
                boxShadow: codeError ? '0 0 0 2px #DC2626' : d ? 'var(--shadow-focus)' : 'var(--shadow-sm)',
                borderRadius:'var(--radius-lg)',outline:'none',
                transition:'border-color var(--dur-fast), box-shadow var(--dur-fast)'}} />
          ))}
        </div>
        {codeError && <div style={{fontFamily:'var(--font-sans)',fontSize:13,color:'#DC2626',marginBottom:12}}>{codeError}</div>}

        <Btn variant="primary" size="lg" fullWidth onClick={verifyCode}
          style={{marginBottom:14,opacity:loading?.6:1,pointerEvents:loading?'none':'auto'}}
          leadingIcon={loading?Icon('Loader',18,{stroke:'#fff'}):null}>
          {loading ? 'Verifying…' : 'Verify Email'}
        </Btn>

        <div style={{display:'flex',alignItems:'center',gap:8,fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-muted)'}}>
          Didn't get it?{' '}
          {resendTimer > 0
            ? <span style={{color:'var(--text-faint)'}}>Resend in {resendTimer}s</span>
            : <span style={{color:'var(--accent)',fontWeight:600,cursor:'pointer'}} onClick={()=>sendCode()}>Resend code</span>
          }
        </div>
        <button type="button" onClick={()=>setAuthStep('form')} style={{marginTop:16,fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-faint)',background:'none',border:'none',cursor:'pointer'}}>
          ← Back
        </button>
      </div>
    );
  }

  return (
    <div style={{position:'absolute',inset:0,overflowY:'auto',background:'var(--surface-app)'}}>
      <div style={{paddingTop:'var(--safe-top)'}} />

      {/* Branding */}
      <div style={{padding:'24px 24px 20px',textAlign:'center'}}>
        <div style={{width:64,height:64,borderRadius:20,background:'linear-gradient(135deg,var(--brand-600) 0%,var(--brand-400) 100%)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 14px',boxShadow:'0 8px 28px rgba(249,115,22,.32)'}}>
          {Icon('ShoppingBag',30,{stroke:'#fff',sw:1.75})}
        </div>
        <div style={{fontWeight:900,fontSize:26,letterSpacing:'-0.03em',color:'var(--ink-900)',lineHeight:1.1}}>
          {mode==='signin' ? 'Welcome back' : 'Join Rummage'}
        </div>
        <div style={{fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-muted)',marginTop:4}}>
          {mode==='signin' ? 'Sign in to find sales near you' : 'Create your free account'}
        </div>
      </div>

      {/* Mode tabs */}
      <div style={{margin:'0 24px 20px'}}>
        <div style={{display:'flex',background:'var(--surface-sunken)',borderRadius:'var(--radius-lg)',padding:3}}>
          {[{value:'signin',label:'Sign In'},{value:'signup',label:'Create Account'}].map(opt=>(
            <button key={opt.value} type="button"
              onClick={()=>{setMode(opt.value);setErrors({});}}
              style={{flex:1,height:40,border:'none',cursor:'pointer',borderRadius:'calc(var(--radius-lg) - 2px)',fontFamily:'var(--font-sans)',fontWeight:700,fontSize:13,
                background: mode===opt.value ? 'var(--surface-card)' : 'transparent',
                color: mode===opt.value ? 'var(--ink-900)' : 'var(--text-muted)',
                boxShadow: mode===opt.value ? 'var(--shadow-sm)' : 'none',
                transition:'all var(--dur-base) var(--ease-spring)',
              }}>
              {opt.label}
            </button>
          ))}
        </div>
      </div>

      <div style={{padding:'0 24px 100px',display:'flex',flexDirection:'column',gap:14}}>

        {/* Avatar picker — sign up only */}
        {mode==='signup' && (
          <div>
            <div className="rmg-eyebrow" style={{marginBottom:10}}>Pick your avatar</div>
            <div style={{display:'flex',gap:8,overflowX:'auto',paddingBottom:6,scrollbarWidth:'none'}}>
              {AVATARS.map(av => {
                const on = selAvatar===av.id;
                return (
                  <button key={av.id} type="button" onClick={()=>setSelAvatar(av.id)} style={{
                    flexShrink:0,width:52,height:52,borderRadius:'var(--radius-lg)',
                    border:'2.5px solid '+(on?'var(--accent)':'transparent'),
                    background:on?'var(--brand-50)':'var(--surface-sunken)',
                    fontSize:26,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',
                    boxShadow:on?'var(--shadow-focus)':'none',
                    transition:'all var(--dur-base) var(--ease-spring)',
                  }}>
                    {av.emoji}
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {mode==='signup' && (
          <Field label="Full name" value={fullName} onChange={v=>{setFullName(v);setErrors(p=>({...p,fullName:''}));}}
            placeholder="Your name" error={errors.fullName} />
        )}

        <Field label="Email address" value={email} onChange={v=>{setEmail(v);setErrors(p=>({...p,email:''}));}}
          type="email" placeholder="you@example.com" error={errors.email} autoCapitalize="none" />

        <Field label="Password" value={password} onChange={v=>{setPassword(v);setErrors(p=>({...p,password:''}));}}
          type={showPw?'text':'password'} placeholder={mode==='signup'?'At least 6 characters':'Your password'} error={errors.password}
          trailing={{icon:Icon(showPw?'EyeOff':'Eye',18,{stroke:'currentColor'}),onClick:()=>setShowPw(p=>!p)}} />

        {mode==='signup' && (
          <Field label="Confirm password" value={confirm} onChange={v=>{setConfirm(v);setErrors(p=>({...p,confirm:''}));}}
            type={showPw?'text':'password'} placeholder="Re-enter password" error={errors.confirm} />
        )}

        {mode==='signin' && (
          <div style={{textAlign:'right',marginTop:-6}}>
            <span style={{fontFamily:'var(--font-sans)',fontSize:13,color:'var(--accent)',fontWeight:600,cursor:'pointer'}}>Forgot password?</span>
          </div>
        )}

        <Btn variant="primary" size="lg" fullWidth onClick={submit}
          style={{marginTop:4,opacity:loading?.6:1,pointerEvents:loading?'none':'auto'}}
          leadingIcon={loading ? Icon('Loader',18,{stroke:'#fff'}) : null}>
          {loading ? 'Just a sec…' : mode==='signin' ? 'Sign In' : 'Create Account'}
        </Btn>

        <div style={{textAlign:'center',fontFamily:'var(--font-sans)',fontSize:12,color:'var(--text-faint)',lineHeight:1.5,marginTop:4}}>
          By continuing you agree to our{' '}
          <span style={{color:'var(--accent)',fontWeight:600,cursor:'pointer'}}>Terms</span>{' '}and{' '}
          <span style={{color:'var(--accent)',fontWeight:600,cursor:'pointer'}}>Privacy Policy</span>
        </div>
      </div>
    </div>
  );
}

          );
        })}
        <div style={{marginTop:8,textAlign:'center',fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-muted)',lineHeight:1.6}}>
          Still need help?{' '}
          <span style={{color:'var(--accent)',fontWeight:600}}>Send us a message</span>
        </div>
      </div>
    </div>
  );
}

// ── Send Feedback screen ──────────────────────────────────────────────────────
const FEEDBACK_CATS = [
  { key:'bug',     label:'Bug report',       icon:'Bug' },
  { key:'feature', label:'Feature request',  icon:'Lightbulb' },
  { key:'general', label:'General feedback', icon:'MessageSquare' },
  { key:'listing', label:'Listing issue',    icon:'Flag' },
];

function FeedbackScreen({ onBack }) {
  const [cat, setCat]       = useState('general');
  const [message, setMessage] = useState('');
  const [sent, setSent]     = useState(false);

  const submit = () => {
    if (!message.trim()) return;
    setSent(true);
  };

  if (sent) {
    return (
      <div style={{position:'absolute',inset:0,background:'var(--surface-app)',zIndex:50,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'32px 28px',textAlign:'center'}}>
        <div style={{width:80,height:80,borderRadius:'50%',background:'var(--brand-50)',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:20,boxShadow:'0 8px 32px rgba(249,115,22,.20)'}}>
          {Icon('CheckCircle',40,{stroke:'var(--accent)'})}
        </div>
        <h2 style={{fontSize:26,fontWeight:900,letterSpacing:'-0.03em',color:'var(--ink-900)',margin:'0 0 10px'}}>Thanks for your feedback!</h2>
        <p style={{fontFamily:'var(--font-sans)',fontSize:15,color:'var(--text-muted)',lineHeight:1.6,margin:'0 0 32px',maxWidth:280}}>
          We read every message and use it to make Rummage better.
        </p>
        <Btn variant="primary" size="lg" onClick={onBack}>Back to Account</Btn>
      </div>
    );
  }

  return (
    <div style={{position:'absolute',inset:0,background:'var(--surface-app)',zIndex:50,display:'flex',flexDirection:'column'}}>
      <div style={{paddingTop:'var(--safe-top)',background:'rgba(255,253,249,0.96)',backdropFilter:'blur(24px)',borderBottom:'1px solid var(--line)'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,padding:'10px 16px 14px'}}>
          <IconButton icon={Icon('ChevronLeft',22)} shape="circle" aria-label="Back" onClick={onBack} />
          <h1 style={{fontSize:20,fontWeight:800,letterSpacing:'-0.02em',color:'var(--ink-900)',margin:0}}>Send Feedback</h1>
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'20px 20px 48px',display:'flex',flexDirection:'column',gap:20}}>
        <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',margin:0,lineHeight:1.6}}>
          We'd love to hear from you. Let us know what's working, what isn't, or what you'd like to see.
        </p>

        {/* Category */}
        <div>
          <div className="rmg-eyebrow" style={{marginBottom:12}}>Category</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            {FEEDBACK_CATS.map(c => {
              const on = cat === c.key;
              return (
                <button key={c.key} type="button" onClick={() => setCat(c.key)} style={{
                  display:'flex',alignItems:'center',gap:10,padding:'14px 16px',
                  background: on ? 'var(--accent)' : 'var(--surface-card)',
                  borderRadius:'var(--radius-xl)',border:'none',cursor:'pointer',textAlign:'left',
                  boxShadow: on ? '0 4px 14px rgba(249,115,22,.35)' : 'var(--shadow-sm)',
                  transition:'all var(--dur-fast)',
                }}>
                  <span style={{display:'inline-flex',color: on ? '#fff' : 'var(--accent)'}}>
                    {Icon(c.icon, 18, {stroke:'currentColor'})}
                  </span>
                  <span style={{fontFamily:'var(--font-sans)',fontWeight:600,fontSize:13,color: on ? '#fff' : 'var(--ink-900)',lineHeight:1.2}}>{c.label}</span>
                </button>
              );
            })}
          </div>
        </div>

        {/* Message */}
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          <div className="rmg-eyebrow">Your message</div>
          <textarea
            value={message}
            onChange={e => setMessage(e.target.value)}
            placeholder="Tell us what's on your mind…"
            rows={6}
            style={{
              width:'100%',padding:'14px 16px',fontFamily:'var(--font-sans)',fontSize:15,
              color:'var(--text-primary)',background:'var(--surface-card)',
              border:'none',borderRadius:'var(--radius-lg)',
              boxShadow:'var(--shadow-sm)',outline:'none',resize:'none',
              lineHeight:1.6,boxSizing:'border-box',
            }}
          />
          <div style={{fontFamily:'var(--font-sans)',fontSize:12,color:'var(--text-faint)',textAlign:'right'}}>{message.length} / 500</div>
        </div>

        <Btn variant="primary" size="lg" fullWidth
          onClick={submit}
          style={{opacity: message.trim() ? 1 : 0.45, pointerEvents: message.trim() ? 'auto' : 'none'}}
          leadingIcon={Icon('Send',18,{stroke:'#fff'})}>
          Send feedback
        </Btn>
      </div>
    </div>
  );
}

// ── Privacy screen ────────────────────────────────────────────────────────────
function PrivacyScreen({ onBack }) {
  const Section = ({ title, children }) => (

        <div style={{display:'flex',alignItems:'center',gap:12,padding:'10px 16px 14px'}}>
          <IconButton icon={Icon('ChevronLeft',22)} shape="circle" aria-label="Back" onClick={onBack} />
          <h1 style={{fontSize:20,fontWeight:800,letterSpacing:'-0.02em',color:'var(--ink-900)',margin:0}}>Privacy Policy</h1>
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'20px 20px 48px',display:'flex',flexDirection:'column',gap:22}}>
        <p style={{fontFamily:'var(--font-mono)',fontSize:11,color:'var(--text-faint)',margin:0}}>Last updated: June 2026</p>

        <Section title="What we collect">
          When you use Rummage, we may collect your approximate location (to show nearby sales), your email address (for account creation and verification), and any sale listings you publish, including address, photos, and contact information you choose to share.
        </Section>

        <Section title="How we use it">
          Your location is used only to calculate distances to sales and is never stored on our servers. Your email is used to send a one-time verification code and, if you opt in, sale reminders. We do not sell or share your personal information with third parties for advertising.
        </Section>

        <Section title="Sale listings">
          When you list a sale, the details you provide — address, dates, description, and contact info — are visible to other Rummage users within the app. You can remove your listing at any time from the List tab.
        </Section>

        <Section title="Third-party services">
          Rummage uses Resend (resend.com) to deliver email verification codes. Your email address is passed to Resend solely for this purpose and is governed by their privacy policy. We do not use third-party analytics or advertising SDKs.
        </Section>

        <Section title="Data retention">
          Account data is stored locally on your device. If you sign out, your saved sales and preferences are cleared. We do not maintain a persistent server-side user database at this time.
        </Section>

        <Section title="Your rights">
          You can stop using Rummage at any time. To request deletion of any data associated with your email address, contact us using the feedback form in the app.
        </Section>

        <Section title="Contact">
          Questions about this policy? Use the Send Feedback option in your Account tab to reach us directly.
        </Section>
      </div>
    </div>
  );
}

// ── Account Screen ─────────────────────────────────────────────────────────────
function AccountScreen({ radiusMi, setRadiusMi, authUser, onSignOut, onUpdateUser, userListings=[], onDeleteListing, onOpenSale, savedCount=0 }) {
  const [name, setName] = useState(authUser?.name || 'Rummager');
  const [avatar, setAvatar] = useState(authUser?.avatar || null);
  const [zip, setZip] = useState('90601');
  const [saleTypes, setSaleTypes] = useState({estate:true,yard:true,thrift:true,moving:true});
  const [push, setPush] = useState(true);
  const [newSales, setNewSales] = useState(true);
  const [reminders, setReminders] = useState(true);

  // Edit sheet: null | 'profile' | 'zip' | 'radius' | 'types'
  const [sheet, setSheet] = useState(null);
  const [draft, setDraft] = useState({});
  const [page, setPage] = useState(null); // null | 'help' | 'feedback' | 'privacy'
  const [deleteConfirm, setDeleteConfirm] = useState(null); // listing id pending delete

  const openSheet = (key) => {
    const defaults = {
      profile: { name, avatar },
      zip:     { zip },
      radius:  { radiusMi },
      types:   { saleTypes: {...saleTypes} },
    };
    setDraft(defaults[key]);
    setSheet(key);
  };

  const saveSheet = () => {
    if (sheet==='profile') {
      const newName   = draft.name;
      const newAvatar = draft.avatar ?? null;
      setName(newName);
      setAvatar(newAvatar);
      onUpdateUser?.({ ...authUser, name: newName, avatar: newAvatar });
    }
    if (sheet==='zip')    setZip(draft.zip);
    if (sheet==='radius') setRadiusMi(draft.radiusMi);
    if (sheet==='types')  setSaleTypes(draft.saleTypes);
    setSheet(null);
  };

  const typeCount = Object.values(saleTypes).filter(Boolean).length;
  const typesLabel = typeCount === Object.keys(saleTypes).length ? 'All' : typeCount === 0 ? 'None' : `${typeCount} selected`;
  const chev = Icon('ChevronRight',18,{stroke:'var(--text-faint)'});

  return (
    <div style={{position:'absolute',inset:0,overflowY:'auto',background:'var(--surface-app)'}}>
      <div style={{paddingTop:'var(--safe-top)'}} />
      <div style={{padding:'8px 20px 120px'}}>
        <h1 style={{fontSize:36,fontWeight:900,letterSpacing:'-0.03em',color:'var(--ink-900)',lineHeight:1.05,marginBottom:16}}>Account</h1>

        {/* Profile card */}
        <Card padded={false}>
          {/* Gradient banner */}
          <div style={{height:56,background:'linear-gradient(135deg,var(--brand-600) 0%,var(--brand-400) 100%)',position:'relative'}}>
            <button type="button" onClick={()=>openSheet('profile')}
              style={{position:'absolute',top:8,right:12,fontFamily:'var(--font-sans)',fontWeight:600,fontSize:13,color:'rgba(255,255,255,.9)',background:'rgba(255,255,255,.18)',border:'none',borderRadius:'var(--radius-pill)',padding:'5px 14px',cursor:'pointer',backdropFilter:'blur(4px)'}}>
              Edit
            </button>
          </div>
          <div style={{padding:'0 16px 16px'}}>
            <div style={{marginTop:-28,marginBottom:10,display:'inline-block',borderRadius:'50%',border:'3px solid var(--surface-card)',overflow:'hidden',position:'relative',zIndex:1}}>
              <Avatar name={name} size={56} emoji={avatar} />
            </div>
            <div style={{fontWeight:800,letterSpacing:'-0.025em',fontSize:20,color:'var(--text-primary)'}}>{name}</div>
            <div style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:13,color:'var(--text-muted)',marginTop:2}}>{Icon('MapPin',13,{stroke:'var(--accent)'})} {zip}</div>
            {/* Stats row */}
            <div style={{display:'flex',gap:0,marginTop:14,borderTop:'1px solid var(--border-default)',paddingTop:14}}>
              {[
                {n: savedCount,         label:'Saved'},
                {n: userListings.length, label:'Listed'},
              ].map((stat,i) => (
                <div key={i} style={{flex:1,textAlign:'center',borderRight:i===0?'1px solid var(--border-default)':'none'}}>
                  <div style={{fontWeight:800,fontSize:22,color:'var(--ink-900)',letterSpacing:'-0.02em'}}>{stat.n}</div>
                  <div style={{fontFamily:'var(--font-sans)',fontSize:12,color:'var(--text-muted)',marginTop:1}}>{stat.label}</div>
                </div>
              ))}
            </div>
          </div>
        </Card>

        {/* Search defaults */}
        <div className="rmg-eyebrow" style={{padding:'0 4px 8px',marginTop:22}}>Search defaults</div>
        <Card padded={false}>
          <ListRow first icon={Icon('MapPin',18)} label="Home ZIP code" value={zip} trailing={chev} onClick={()=>openSheet('zip')} />
          <ListRow icon={Icon('Ruler',18)} label="Default radius" value={`${radiusMi} mi`} trailing={chev} onClick={()=>openSheet('radius')} />
          <ListRow icon={Icon('Tag',18)} label="Sale types" value={typesLabel} trailing={chev} onClick={()=>openSheet('types')} />
        </Card>

        {/* Notifications */}
        <div className="rmg-eyebrow" style={{padding:'0 4px 8px',marginTop:22}}>Notifications</div>
        <Card padded={false}>
          <ListRow first icon={Icon('Bell',18)} label="Push notifications" trailing={<Switch checked={push} onChange={setPush} />} />
          <ListRow icon={Icon('Sparkles',18)} label="New sales nearby" sublabel="Within your radius" trailing={<Switch checked={newSales} onChange={setNewSales} />} />
          <ListRow icon={Icon('Clock',18)} label="Sale reminders" sublabel="1 hour before saved sales" trailing={<Switch checked={reminders} onChange={setReminders} />} />
        </Card>

        {/* My Listings */}
        <div className="rmg-eyebrow" style={{padding:'0 4px 8px',marginTop:22}}>My Listings</div>
        {userListings.length === 0 ? (
          <Card>
            <div style={{textAlign:'center',padding:'10px 0 6px'}}>
              <div style={{fontSize:32,marginBottom:8}}>🏷️</div>
              <div style={{fontWeight:700,fontSize:15,color:'var(--ink-900)',marginBottom:4}}>No listings yet</div>
              <div style={{fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-muted)',lineHeight:1.5}}>
                Post your first sale from the List tab and it'll appear here.
              </div>
            </div>
          </Card>
        ) : (
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {userListings.map(listing => (
              <div key={listing.id} style={{background:'var(--surface-card)',borderRadius:'var(--radius-xl)',boxShadow:'var(--shadow-sm)',overflow:'hidden'}}>
                <div style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px'}}>
                  {/* Thumbnail */}
                  <div style={{width:56,height:56,borderRadius:'var(--radius-lg)',overflow:'hidden',flexShrink:0,background:'var(--surface-sunken)'}}>
                    {listing.images?.[0]
                      ? <img src={listing.images[0]} style={{width:'100%',height:'100%',objectFit:'cover'}} />
                      : <div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center'}}>
                          {Icon('Image',22,{stroke:'var(--text-faint)'})}
                        </div>
                    }
                  </div>
                  {/* Info */}
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:700,fontSize:14,color:'var(--ink-900)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{listing.title}</div>
                    <div style={{fontFamily:'var(--font-sans)',fontSize:12,color:'var(--text-muted)',marginTop:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{listing.address}</div>
                    <div style={{display:'flex',alignItems:'center',gap:6,marginTop:4}}>
                      <SaleTypeTag type={listing.type} size="xs" />
                      {listing.dateLabel && (
                        <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'var(--text-faint)'}}>{listing.dateLabel}</span>
                      )}
                    </div>
                  </div>
                  {/* Actions */}
                  <div style={{display:'flex',gap:6,flexShrink:0}}>
                    <button type="button" onClick={()=>onOpenSale?.(listing.id)}
                      style={{height:32,padding:'0 12px',borderRadius:'var(--radius-pill)',background:'var(--brand-50,#ede9ff)',border:'none',cursor:'pointer',fontFamily:'var(--font-sans)',fontWeight:600,fontSize:12,color:'var(--brand-600)',whiteSpace:'nowrap'}}>
                      View
                    </button>
                    <button type="button" onClick={()=>setDeleteConfirm(listing.id)}
                      style={{width:32,height:32,borderRadius:'50%',background:'var(--surface-sunken)',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                      {Icon('Trash2',15,{stroke:'#EF4444'})}
                    </button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}

        {/* Support */}
        <div className="rmg-eyebrow" style={{padding:'0 4px 8px',marginTop:22}}>Support</div>
        <Card padded={false}>
          <ListRow first icon={Icon('CircleHelp',18)} label="Help & FAQ" trailing={chev} onClick={()=>setPage('help')} />
          <ListRow icon={Icon('MessageSquare',18)} label="Send feedback" trailing={chev} onClick={()=>setPage('feedback')} />
          <ListRow icon={Icon('Shield',18)} label="Privacy" trailing={chev} onClick={()=>setPage('privacy')} />
        </Card>
        <div style={{marginTop:16}}>
          <Card padded={false}>
            <ListRow first icon={Icon('LogOut',18)} label="Sign out" danger onClick={onSignOut} />
          </Card>
        </div>
        <div style={{textAlign:'center',marginTop:18,fontFamily:'var(--font-mono)',fontSize:11,color:'var(--text-faint)'}}>Rummage · v1.0.0</div>
      </div>

      {/* Delete confirmation sheet */}
      {deleteConfirm && (
        <div style={{position:'absolute',inset:0,zIndex:80,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
          <div onClick={()=>setDeleteConfirm(null)} style={{position:'absolute',inset:0,background:'rgba(28,25,23,.42)',backdropFilter:'blur(2px)'}} />
          <div style={{position:'relative',background:'var(--surface-card)',borderRadius:'var(--radius-xl) var(--radius-xl) 0 0',padding:'24px 20px 36px',boxShadow:'var(--shadow-sheet)'}}>
            <div style={{textAlign:'center',marginBottom:20}}>
              <div style={{width:52,height:52,borderRadius:'50%',background:'#FEF2F2',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px'}}>
                {Icon('Trash2',24,{stroke:'#EF4444'})}
              </div>
              <div style={{fontWeight:800,fontSize:19,color:'var(--ink-900)',marginBottom:6}}>Delete listing?</div>
              <div style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',lineHeight:1.5}}>
                This will remove your listing from the map immediately. This can't be undone.
              </div>
            </div>
            <div style={{display:'flex',gap:10}}>
              <Btn variant="ghost" size="lg" fullWidth onClick={()=>setDeleteConfirm(null)}>Cancel</Btn>
              <Btn variant="primary" size="lg" fullWidth onClick={()=>{onDeleteListing?.(deleteConfirm);setDeleteConfirm(null);}}
                style={{background:'#EF4444',boxShadow:'0 4px 16px rgba(239,68,68,.35)'}}>
                Delete
              </Btn>
            </div>
          </div>
        </div>
      )}

      {/* Edit profile sheet */}
      {sheet==='profile' && (
        <EditSheet title="Edit profile" onSave={saveSheet} onCancel={()=>setSheet(null)}>
          {/* Current avatar preview */}
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8}}>
            <div style={{position:'relative'}}>
              <Avatar name={draft.name||'?'} size={80} emoji={draft.avatar||null} />
              {draft.avatar && (
                <button type="button" onClick={()=>setDraft(d=>({...d,avatar:null}))}
                  style={{position:'absolute',top:-4,right:-4,width:22,height:22,borderRadius:'50%',background:'var(--ink-900)',border:'2px solid var(--paper)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
                  {Icon('X',11,{stroke:'#fff'})}
                </button>
              )}
            </div>
            <p style={{fontFamily:'var(--font-sans)',fontSize:12,color:'var(--text-muted)',margin:0}}>
              {draft.avatar ? 'Tap × to use your initials instead' : 'Choose an avatar below or use your initials'}
            </p>
          </div>

          <div>
            <div className="rmg-eyebrow" style={{marginBottom:10}}>Pick an avatar</div>

      {sheet==='zip' && (

          <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',margin:0}}>Sales are sorted by distance from this ZIP code.</p>
          <RmgInput leadingIcon={Icon('MapPin',19)} placeholder="e.g. 90601" inputMode="numeric"
            value={draft.zip||''} onChange={e=>setDraft(d=>({...d,zip:e.target.value}))} />
        </EditSheet>
      )}

      {/* Edit radius sheet */}
      {sheet==='radius' && (
        <EditSheet title="Default radius" onSave={saveSheet} onCancel={()=>setSheet(null)}>
          <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',margin:0}}>How far out to search when you open the app.</p>

      {/* Edit sale types sheet */}
      {sheet==='types' && (
        <EditSheet title="Sale types" onSave={saveSheet} onCancel={()=>setSheet(null)}>

function DetailScreen({ sale, onBack, onToggleSave }) {
  const s = sale;
  const [reminded, setReminded] = useState(() => !!getReminders()[sale.id]);
  const [toast, setToast] = useState(null);
  const countdown = useCountdown(s.dateLabel, s.timeLabel);

  const openDirections = () => {
    const addr = [s.address, s.neighborhood].filter(Boolean).join(', ');
    const q = encodeURIComponent(addr);
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    window.open(isIOS ? `maps://maps.apple.com/?q=${q}` : `https://www.google.com/maps/search/?api=1&query=${q}`, '_blank');
  };

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3500); };

  const toggleRemind = () => {
    if (reminded) {
      removeReminder(s.id);
      setReminded(false);
      showToast('Reminder removed');
      return;
    }
    if (!('Notification' in window)) { showToast('Notifications not supported in this browser'); return; }
    Notification.requestPermission().then(perm => {
      if (perm === 'granted') {
        const fireAt = scheduleNotification(s);
        saveReminder(s.id, fireAt ? fireAt.getTime() : Date.now());
        setReminded(true);
        const start = parseSaleStart(s.dateLabel, s.timeLabel);
        const timeStr = start ? start.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) : 'start time';
        showToast("Reminder set! We'll notify you 30 min before " + timeStr);
      } else {
        showToast('Notifications blocked — enable them in your browser settings');
      }
    });
  };

  return (
    <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',background:'var(--surface-app)'}}>
      <div style={{flex:1,overflowY:'auto'}}>
        <PhotoGallery
          images={s.images}
          type={s.type}
          height={280}
          onBack={onBack}
          saved={s.saved}
          onSave={()=>onToggleSave(s.id)}
          sale={s}
        />
        <div style={{padding:'16px 18px 0'}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10,flexWrap:'wrap'}}>
            <SaleTypeTag type={s.type} />
            {countdown.status==='live' && <Badge tone="live">Happening now</Badge>}
            {countdown.label && countdown.status!=='ended' && (
              <span style={{display:'inline-flex',alignItems:'center',gap:4,height:22,padding:'0 9px',borderRadius:'var(--radius-pill)',
                background: countdown.status==='live' ? 'var(--success-bg)' : 'var(--brand-50)',
                color: countdown.status==='live' ? 'var(--success)' : 'var(--brand-600)',
                fontSize:12,fontWeight:700,fontFamily:'var(--font-mono)'}}>
                {Icon(countdown.status==='live'?'Clock':'Timer',12,{stroke:'currentColor'})}
                {countdown.label}
              </span>
            )}
            {countdown.status==='ended' && (
              <span style={{display:'inline-flex',alignItems:'center',gap:4,height:22,padding:'0 9px',borderRadius:'var(--radius-pill)',
                background:'var(--surface-sunken)',color:'var(--text-muted)',fontSize:12,fontWeight:700,fontFamily:'var(--font-mono)'}}>
                Sale ended
              </span>
            )}
          </div>
          <h1 style={{fontWeight:800,letterSpacing:'-0.025em',fontSize:28,lineHeight:1.12,letterSpacing:'-0.02em',color:'var(--text-primary)'}}>{s.title}</h1>
          <div style={{display:'flex',flexDirection:'column',gap:12,margin:'18px 0'}}>
            {[
              s.dateLabel && ['Calendar', s.dateLabel, s.timeLabel, true],
              ['MapPin', s.address || s.neighborhood, `${s.distanceMi} mi away`, false],
              s.price && ['Tag', 'Price range', s.price, false],
            ].filter(Boolean).map(([ic,a,b,mono],i)=>(
              <div key={i} style={{display:'flex',alignItems:'center',gap:12}}>
                <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:40,height:40,borderRadius:'var(--radius-lg)',background:'var(--brand-50)',color:'var(--accent)',flexShrink:0}}>
                  {Icon(ic,18,{stroke:'currentColor'})}
                </span>
                <div style={{minWidth:0}}>
                  <div style={{fontFamily:'var(--font-sans)',fontWeight:600,fontSize:15,color:'var(--text-primary)'}}>{a}</div>
                  <div style={{fontFamily:mono?'var(--font-mono)':'var(--font-sans)',fontSize:13,color:'var(--text-muted)'}}>{b}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
        <div style={{margin:'0 18px',height:130,borderRadius:'var(--radius-xl)',overflow:'hidden',position:'relative',boxShadow:'var(--shadow-sm)'}}>
          <RealMap sales={s.lat ? [s] : []} selectedId={s.id} onSelect={()=>{}}
            centerLat={s.lat || 33.9792} centerLng={s.lng || -118.0328}
            zoom={15} interactive={false} />
        </div>
        <div style={{padding:'20px 18px 6px'}}>
          <h2 style={{fontWeight:800,letterSpacing:'-0.025em',fontSize:19,color:'var(--text-primary)',marginBottom:8}}>About this sale</h2>
          <p style={{fontFamily:'var(--font-sans)',fontSize:15,lineHeight:1.55,color:'var(--text-secondary)'}}>{s.blurb}</p>

        {s.items && s.items.length>0 && (
          <div style={{padding:'14px 18px 8px'}}>
            <h2 style={{fontWeight:800,letterSpacing:'-0.025em',fontSize:19,color:'var(--text-primary)',marginBottom:10}}>What you'll find</h2>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              {s.items.map(it=>(
                <span key={it} style={{fontFamily:'var(--font-sans)',fontWeight:500,fontSize:13,color:'var(--text-secondary)',background:'var(--surface-card)',boxShadow:'var(--shadow-xs)',padding:'7px 14px',borderRadius:'var(--radius-pill)'}}>{it}</span>

                  <div style={{fontFamily:'var(--font-sans)',fontWeight:600,fontSize:15,color:'var(--text-primary)'}}>{s.host}</div>
                  <div style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:13,color:'var(--text-muted)'}}>{Icon('BadgeCheck',13,{stroke:'var(--secondary)'})} Verified host</div>
                </div>
                {Icon('ChevronRight',20,{stroke:'var(--text-faint)'})}
              </div>
            </Card>
          </div>
        )}
        <div style={{height:80}} />
      </div>
      <div style={{padding:'12px 16px 28px',background:'rgba(255,255,255,.95)',backdropFilter:'blur(16px)',borderTop:'1.5px solid var(--border-default)',display:'flex',flexDirection:'column',gap:10}}>
        {s.contact && (
          <Btn variant="primary" size="lg" fullWidth leadingIcon={Icon('MessageCircle',18)}
            onClick={()=>{
              const c = s.contact.trim();
              if (/^\+?[\d\s\-().]{7,}$/.test(c)) window.open('sms:'+c.replace(/\s/g,''),'_blank');
              else if (c.includes('@')) window.open('mailto:'+c,'_blank');
              else window.open('tel:'+c,'_blank');
            }}>
            Contact Seller
          </Btn>
        )}
        <div style={{display:'flex',gap:10}}>
          <Btn variant="secondary" size="lg" leadingIcon={Icon('Navigation',18)} onClick={openDirections}>Directions</Btn>
          <div style={{flex:1}}>
            <Btn variant={reminded?'secondary':'primary'} size="lg" fullWidth
              leadingIcon={Icon(reminded?'BellOff':'Bell',18)}
              onClick={toggleRemind}
              style={reminded?{borderColor:'var(--green-600)',color:'var(--green-600)'}:{}}>
              {reminded ? 'Reminder set' : 'Remind me'}

          </div>
        </div>
      </div>
      {toast && (
        <div style={{position:'absolute',bottom:110,left:16,right:16,background:'var(--ink-900)',color:'#fff',borderRadius:'var(--radius-xl)',padding:'14px 18px',fontWeight:600,fontSize:14,textAlign:'center',boxShadow:'var(--shadow-lg)',animation:'slideUp .3s var(--ease-out)',zIndex:100}}>

function ListScreen({ onPublish }) {
  const [step, setStep]           = useState(0);
  const [saleType, setSaleType]   = useState('yard');
  const [photos, setPhotos]       = useState([]);
  const [title, setTitle]         = useState('');
  const [addr, setAddr]           = useState('');
  const [zip, setZip]             = useState('');
  const [startDate, setStartDate] = useState('');
  const [endDate, setEndDate]     = useState('');
  const [hrs, setHrs]             = useState('');
  const [desc, setDesc]           = useState('');
  const [contact, setContact]     = useState('');
  const [touched, setTouched]     = useState({});
  const [published, setPublished] = useState(null);

  const handleFile = (e, idx) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => setPhotos(prev => { const n=[...prev]; n[idx]=ev.target.result; return n; });
    reader.readAsDataURL(file);
  };

  const required2 = { title: title.trim(), addr: addr.trim(), zip: zip.trim(), startDate };
  const missing2  = Object.entries(required2).filter(([,v])=>!v).map(([k])=>k);
  const canNext2  = missing2.length === 0;

  const tryNext2 = () => {
    if (!canNext2) { setTouched({title:true,addr:true,zip:true,startDate:true}); return; }
    setStep(3);
  };

  const fmtDate = iso => {
    if (!iso) return '';
    const [y,m,d] = iso.split('-').map(Number);
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return months[m-1]+' '+d+', '+y;
  };

  const publish = () => {
    const dateStr = fmtDate(startDate) + (endDate && endDate!==startDate ? ' – '+fmtDate(endDate) : '');
    const listing = {
      id: 'u'+Date.now(),
      type: saleType,
      title: title.trim(),
      address: addr.trim()+', '+zip.trim(),
      neighborhood: 'Your listing',
      distanceMi: 0.4,
      dateLabel: dateStr,
      timeLabel: hrs.trim() || 'Hours TBD',
      photoCount: photos.filter(Boolean).length,
      images: photos.filter(Boolean),
      live: true,
      blurb: desc.trim(),
      price: '',
      items: [],
      x: 50, y: 50,
      isOwnListing: true,
      contact: contact.trim(),
    };
    onPublish(listing);
    setPublished(listing);
    setStep(4);
  };

  const inputStyle = {
    width:'100%', height:48, padding:'0 14px',
    fontFamily:'var(--font-sans)', fontSize:14, color:'var(--text-primary)',
    background:'var(--surface-card)', border:'none', boxShadow:'var(--shadow-sm)',
    borderRadius:'var(--radius-md)', outline:'none', boxSizing:'border-box',

    return (
      <div style={{position:'absolute',inset:0,overflowY:'auto',background:'var(--surface-app)'}}>
        <div style={{paddingTop:'var(--safe-top)'}} />
        <div style={{padding:'20px 20px 0'}}>
          <h1 style={{fontSize:32,fontWeight:900,letterSpacing:'-0.03em',color:'var(--ink-900)',lineHeight:1.05,marginBottom:4}}>Sell Your Stuff</h1>
          <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',margin:'0 0 24px',lineHeight:1.6}}>
            Got a garage full of treasures? List your sale and let local shoppers find you.

        {/* Hero CTA block */}

            width:'100%',borderRadius:'var(--radius-2xl)',border:'none',cursor:'pointer',

            padding:'28px 24px',textAlign:'left',
