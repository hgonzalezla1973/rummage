// A dedicated, full-page view for exactly one sale -- what a browser tab
// opened straight to /app?sale=<id> shows (see deepLinkSaleId in App()).
// No browse grid, no backdrop: just that listing, with a way back out.
function SaleDetailPage({ sale, apiStatus, onToggleSave, itemsView, setItemsView }) {
  const backToBrowse = () => { window.location.href = '/app'; };
  const stillLoading = !sale && (apiStatus === 'loading' || apiStatus === 'idle');
  // The reused screens below (DetailScreen, ItemsGalleryScreen, ...) are a
  // single stacked column designed for a ~390px phone screen -- left to fill
  // a real desktop window edge to edge, the photo goes short-and-wide and
  // text lines run the full window. Page background spans the window (capped
  // at 1440 so it doesn't stretch further on an ultra-wide monitor); the
  // actual column of content is centered and held to a reading-friendly 900.
  const CONTENT_W = 900;
  return (
    <div style={{position:'fixed', inset:0, background:'var(--surface-app)', display:'flex', flexDirection:'column'}}>
      <div style={{flexShrink:0, borderBottom:'1px solid var(--line)', background:'var(--surface)'}}>
        <div style={{maxWidth:1440, margin:'0 auto', display:'flex', alignItems:'center', gap:14, padding:'14px 28px'}}>
          <a href="/app" style={{display:'flex', alignItems:'center', gap:8, textDecoration:'none', color:'var(--ink-900)'}}>
            <RummageMark size={26} />
            <span style={{fontFamily:'var(--font-display)', fontWeight:900, fontSize:16}}>Rummage</span>
          </a>
          <span style={{color:'var(--ink-300)'}}>/</span>
          <a href="/app" style={{fontFamily:'var(--font-sans)', fontWeight:700, fontSize:13.5, color:'var(--text-link)', textDecoration:'none'}}>
            ← All sales
          </a>
        </div>
      </div>
      <div style={{position:'relative', flex:1, minHeight:0}}>
        <div style={{position:'absolute', top:0, bottom:0, left:'50%', transform:'translateX(-50%)', width:'100%', maxWidth:CONTENT_W}}>
          {stillLoading && (
            <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12}}>
              <span style={{display:'inline-flex',animation:'spin 1s linear infinite',color:'var(--accent)'}}>{Icon('Loader2',28)}</span>
              <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',margin:0}}>Loading this sale…</p>
            </div>
          )}
          {!sale && !stillLoading && (
            <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:10,textAlign:'center',padding:24}}>
              <div style={{fontSize:44}}>😕</div>
              <p style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:18,margin:0}}>Can't find this sale</p>
              <p style={{fontFamily:'var(--font-sans)',fontSize:14,color:'var(--text-muted)',margin:'0 0 6px',maxWidth:320}}>
                It may have ended, been taken down, or be outside your current search area.
              </p>
              <Btn variant="primary" onClick={backToBrowse}>Browse all sales</Btn>
            </div>
          )}
          {sale && itemsView?.mode==='gallery' && (
            <ItemsGalleryScreen sale={sale} onBack={()=>setItemsView(null)}
              onOpenItem={idx=>setItemsView({mode:'item', idx})}
              onDirections={()=>openSaleDirections(sale)} />
          )}
          {sale && itemsView?.mode==='item' && (
            <ItemDetailScreen sale={sale} idx={itemsView.idx}
              onBack={()=>setItemsView({mode:'gallery'})}
              onOpenSale={()=>setItemsView(null)}
              onSelectItem={idx=>setItemsView({mode:'item', idx})} />
          )}
          {sale && !itemsView && (
            <DetailScreen sale={sale} onBack={backToBrowse} hideBack photoHeight={440} onToggleSave={onToggleSave}
              onOpenItems={sale.items?.length>0 ? ()=>setItemsView({mode:'gallery'}) : undefined} />
          )}
        </div>
      </div>
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState('explore');
  const [showWalkthrough, setShowWalkthrough] = useState(true);
  const finishWalkthrough = () => setShowWalkthrough(false);
  const [authUser, _setAuthUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem('rummage_user') || 'null'); } catch { return null; }
  });
  const setAuthUser = user => {
    if (user) localStorage.setItem('rummage_user', JSON.stringify(user));
    else localStorage.removeItem('rummage_user');
    _setAuthUser(user);
  };
  const [activeTypes, setActiveTypes] = useState({});
  const [keyword, setKeyword]         = useState('');
  const [detailId, setDetailId] = useState(null);
  // Captured once, synchronously, at the very first render -- before the
  // deep-link effect below strips ?sale= from the URL. On desktop this is
  // how a browse-grid card click (which opens `/app?sale=<id>` in a new
  // tab) is told apart from an in-page preview (a map pin click, which
  // calls openSaleDetail directly with no URL change): a tab that *arrived*
  // on a sale link renders that sale as its own dedicated page; a sale
  // opened while already browsing stays a lightweight modal over the grid.
  const [deepLinkSaleId] = useState(() => new URLSearchParams(window.location.search).get('sale'));
  // Every "open this listing" entry point routes through here, regardless
  // of which screen (Explore, Saved, Search, notifications...) the tap
  // came from.
  const openSaleDetail = (id) => setDetailId(id);
  const [itemsView, setItemsView] = useState(null); // null | {mode:'gallery'} | {mode:'item', idx}
  const [notificationsOpen, setNotificationsOpen] = useState(false);
  const [filtersOpen, setFiltersOpen] = useState(false);
  const [vintageStoresOpen, setVintageStoresOpen] = useState(false);
  const [tripIds, setTripIds] = useState(() => { try { return JSON.parse(localStorage.getItem('rummage-trip') || '[]'); } catch { return []; } });

  const toggleTrip = (id) => setTripIds(prev => {
    const adding = !prev.includes(id);
    const next = adding ? [...prev, id] : prev.filter(x => x !== id);
    localStorage.setItem('rummage-trip', JSON.stringify(next));
    return next;
  });
  const clearTrip = () => { setTripIds([]); localStorage.removeItem('rummage-trip'); };
  // Vintage stores are fetched on-demand by VintageStoresScreen (Places API
  // costs money per call, so we don't want this hitting on every app load).
  // Kept in App state -- not just the screen -- so a store added to the trip
  // can still be resolved to a full stop object (title/lat/lng) by
  // TripPlannerPanel even after the user navigates away from that screen.
  const [vintageStores, setVintageStores] = useState(() => {
    try { return JSON.parse(localStorage.getItem('rummage_vintage_stores') || '[]'); } catch { return []; }
  });
  const addVintageStores = (stores) => setVintageStores(prev => {
    const merged = [...prev];
    stores.forEach(s => { if (!merged.find(m => m.id === s.id)) merged.push(s); });
    localStorage.setItem('rummage_vintage_stores', JSON.stringify(merged));
    return merged;
  });
  const [radiusMi, _setRadiusMi] = useState(() => {
    const saved = localStorage.getItem('rummage_radius');
    return saved ? Number(saved) : 10;
  });
  const setRadiusMi = (r) => { localStorage.setItem('rummage_radius', r); _setRadiusMi(r); };
  // No hardcoded ZIP fallback here on purpose -- a prior version defaulted
  // to the developer's own home ZIP (90601, Whittier CA) whenever geolocation
  // was denied/slow on first run, which silently showed strangers California
  // sales with no indication why. Better to show an honest "where are you"
  // prompt (see ExploreScreen) until we actually know, via geolocation or
  // manual entry.
  const [zip, _setZip] = useState(() => localStorage.getItem('rummage_zip') || null);
  const setZip = (z) => {
    if (z) localStorage.setItem('rummage_zip', z); else localStorage.removeItem('rummage_zip');
    _setZip(z || null);
  };
  const [savedIds, _setSavedIds] = useState(() => {
    try { return JSON.parse(localStorage.getItem('rummage_saved') || '{}'); } catch { return {}; }
  });
  const setSavedIds = (updater) => {
    _setSavedIds(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      localStorage.setItem('rummage_saved', JSON.stringify(next));
      return next;
    });
  };
  const [userListings, setUserListings] = useState([]);
  const [apiListings, setApiListings]   = useState([]);
  const [apiStatus, setApiStatus]       = useState('idle'); // idle | loading | ok | error
  const [coverageMessage, setCoverageMessage] = useState(null);
  const [mapCenter, setMapCenter] = useState(null); // {lat,lng} of the searched zip, from the API response
  const [scale, setScale] = useState(1);
  const [libsReady, setLibsReady] = useState(false);
  const frameRef = useRef(null);

  // Auto geo-detection: if the device's current GPS location resolves to a
  // different ZIP than the saved home ZIP (e.g. you're traveling), search
  // near where you actually are instead of silently showing sales back
  // home. Re-checked on load and whenever the app is foregrounded again
  // (not continuously watched) — a backgrounded native app doesn't reload
  // this page on resume, so without the visibility re-check, traveling
  // with the app already open would leave it stuck on wherever you were
  // when it first loaded. This is "am I somewhere else right now," not
  // live turn-by-turn tracking (that already exists separately, in the
  // trip navigator).
  const [detectedZip, setDetectedZip] = useState(null);
  const [detectedCity, setDetectedCity] = useState(null);
  const [useHomeZip, setUseHomeZip] = useState(false); // explicit "no, use my home ZIP" override
  const [locating, setLocating] = useState(false);
  const [locationDenied, setLocationDenied] = useState(false);
  const resolvePosition = (lat, lng) => {
    fetch(`${API_BASE}/api/reverse-geocode?lat=${lat}&lng=${lng}`)
      .then(r => r.json())
      .then(data => {
        if (!data.zip) { setLocationDenied(true); return; }
        // No saved home ZIP yet -- use the real detected location as
        // home. Once a home ZIP exists, later detections only drive the
        // "away from home" banner below, not overwrite it.
        if (!localStorage.getItem('rummage_zip')) setZip(data.zip);
        else { setDetectedZip(data.zip); setDetectedCity(data.city || null); }
      })
      .catch(() => setLocationDenied(true))
      .finally(() => setLocating(false));
  };
  // The plain web Geolocation API (navigator.geolocation) is unreliable
  // inside Capacitor's WKWebView -- confirmed on-device: with location
  // permission already granted, getCurrentPosition still never resolves to
  // anywhere but wherever the WebView was first loaded, so a real change of
  // location on the device never gets picked up. The official plugin
  // bridges to CoreLocation directly instead of going through the WebView's
  // own (unreliable) geolocation bridge, so it's used whenever the app is
  // running natively; plain browser access (rummagedeals.com) has no such
  // plugin and keeps using navigator.geolocation as before.
  const requestLocation = () => {
    const GeoPlugin = window.Capacitor?.Plugins?.Geolocation;
    const opts = { enableHighAccuracy: false, timeout: 8000, maximumAge: 10 * 60 * 1000 };
    if (GeoPlugin) {
      setLocating(true);
      GeoPlugin.checkPermissions()
        .then(status => status.location === 'granted' ? status : GeoPlugin.requestPermissions())
        .then(status => {
          if (status.location !== 'granted') { setLocating(false); setLocationDenied(true); return; }
          return GeoPlugin.getCurrentPosition(opts).then(
            pos => resolvePosition(pos.coords.latitude, pos.coords.longitude)
          );
        })
        .catch(() => { setLocating(false); setLocationDenied(true); });
      return;
    }
    if (!navigator.geolocation) { setLocationDenied(true); return; }
    setLocating(true);
    navigator.geolocation.getCurrentPosition(
      pos => resolvePosition(pos.coords.latitude, pos.coords.longitude),
      () => { setLocating(false); setLocationDenied(true); }, // permission denied or unavailable
      opts
    );
  };
  useEffect(() => {
    requestLocation();
    const onVisible = () => { if (document.visibilityState === 'visible') requestLocation(); };
    document.addEventListener('visibilitychange', onVisible);
    return () => document.removeEventListener('visibilitychange', onVisible);
  }, []);
  const awayFromHome = !!(detectedZip && detectedZip !== zip);
  const effectiveZip = (awayFromHome && !useHomeZip) ? detectedZip : zip;

  // Fetch live listings from local backend
  const fetchApiListings = (zip, radius) => {
    setApiStatus('loading');
    fetch(`${API_BASE}/api/listings?zip=${zip}&radius=${radius}`)
      .then(r => r.json())
      .then(data => {
        setApiListings(data.listings || []);
        setCoverageMessage(data.outOfCoverage ? data.message : null);
        setMapCenter(data.center || null);
        setApiStatus('ok');
      })
      .catch(() => setApiStatus('error'));
  };

  useEffect(() => {
    const fit = () => {
      const s = Math.min((window.innerWidth - 32) / 390, (window.innerHeight - 32) / 844, 1);
      setScale(Math.max(s, 0.2));
    };
    window.addEventListener('resize', fit);
    fit();
    const poll = setInterval(() => {
      if (window.lucide?.icons) { clearInterval(poll); setLibsReady(true); }
    }, 60);
    return () => { window.removeEventListener('resize', fit); clearInterval(poll); };
  }, []);

  // Re-fetch whenever the effective search ZIP or radius changes (debounced
  // 600ms) — also covers the initial load, since effects always run once
  // on mount. Skipped entirely until we actually know a ZIP (geolocation
  // resolved or the user entered one) -- see ExploreScreen's prompt for the
  // no-ZIP-yet state.
  useEffect(() => {
    if (!effectiveZip) return;
    const t = setTimeout(() => fetchApiListings(effectiveZip, radiusMi), 600);
    return () => clearTimeout(t);
  }, [effectiveZip, radiusMi]);

  const MO_IDX = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);

  const kwMatch = (s) => {
    if (!keyword.trim()) return true;
    const q = keyword.toLowerCase();
    return [s.title, s.blurb, s.address, s.neighborhood, ...(s.items||[])].join(' ').toLowerCase().includes(q);
  };

  // Default window is 2 days before today through 2 days after — wide enough
  // to still catch a sale that started yesterday, but not a stale posting
  // from weeks ago.
  const PAST_WINDOW_MS = 2 * 24 * 60 * 60 * 1000;
  const FUTURE_WINDOW_MS = 2 * 24 * 60 * 60 * 1000;
  const windowStart = todayStart.getTime() - PAST_WINDOW_MS;
  const windowEnd   = todayStart.getTime() + FUTURE_WINDOW_MS;

  const allSales = [...ALL_SALES, ...apiListings, ...userListings]
    .map(s => ({ ...s, saved: !!savedIds[s.id] }))
    .filter(s => {
      // If we can't determine when a sale is/was happening, we can't show it —
      // no date means no way to tell it apart from a stale, long-dead listing.
      const label = s.dateLabel || '';
      if (!label) return false;
      // Scan for every "MonthName DD" or "MonthName DD, YYYY" — first match is
      // the start of the range, last match is the end (a single date has both
      // point to the same hit).
      const hits = [...label.matchAll(/([A-Za-z]{3,9})\s+(\d{1,2})(?:,?\s*(\d{4}))?/g)]
        .filter(m => MO_IDX[m[1].toLowerCase().slice(0,3)] !== undefined);
      if (!hits.length) return false; // dateLabel present but unparseable → can't confirm it's current
      const toDate = m => new Date(m[3] ? parseInt(m[3]) : todayStart.getFullYear(), MO_IDX[m[1].toLowerCase().slice(0,3)], parseInt(m[2])).getTime();
      const startDay = toDate(hits[0]);
      const endDay   = toDate(hits[hits.length - 1]);
      // Overlap test: the sale's [startDay, endDay] range must intersect [windowStart, windowEnd].
      return endDay >= windowStart && startDay <= windowEnd;
    });
  let salesInRadius = allSales.filter(s=>s.distanceMi<=radiusMi).filter(kwMatch);
  if (salesInRadius.length===0 && !keyword) salesInRadius = allSales.slice(0,1);
  const detailSale = allSales.find(s=>s.id===detailId)||null;

  // Deep link support (?sale=<id>, used by the daily digest email's "Open
  // in app" links) — open straight to that sale once it shows up in
  // allSales, then strip the param so navigating away/back doesn't reopen it.
  useEffect(() => {
    const saleId = new URLSearchParams(window.location.search).get('sale');
    if (!saleId || detailId) return;
    if (allSales.some(s => s.id === saleId)) {
      setDetailId(saleId);
      window.history.replaceState({}, '', window.location.pathname);
    }
  }, [allSales, detailId]);

  // Push notifications: registered once for the app's lifetime (not tied to
  // whichever screen is active) so a tapped notification opens the right
  // sale via the same openSaleDetail every other entry point uses, and a
  // device token reaches the backend as soon as it's issued -- even if
  // AccountScreen (where the toggle lives) isn't mounted anymore by then.
  const authUserRef = useRef(authUser);
  useEffect(() => { authUserRef.current = authUser; }, [authUser]);
  useEffect(() => {
    const PN = window.Capacitor?.Plugins?.PushNotifications;
    if (!isMobileDevice || !PN) return;
    // addListener's return value isn't consistently a Promise across
    // Capacitor/plugin versions (confirmed via on-device testing: chaining
    // .then() here threw "is not a function") -- these listeners live for
    // the app's whole lifetime anyway (this effect never re-runs or
    // unmounts in practice), so there's nothing worth cleaning up.
    PN.addListener('registration', (token) => {
      const email = authUserRef.current?.email;
      if (!email) return;
      fetch(`${API_BASE}/api/push/register`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, pushToken: token.value }),
      }).catch(() => {});
    });
    PN.addListener('registrationError', (err) => {
      console.warn('Push registration failed:', err);
    });
    PN.addListener('pushNotificationActionPerformed', (action) => {
      const saleId = action.notification?.data?.saleId;
      if (saleId) openSaleDetail(saleId);
    });
  }, []);
  const savedCount = allSales.filter(s=>s.saved).length;

  const toggleSave = (id) => {
    setSavedIds(p=>({...p,[id]:!p[id]}));
    // Sync to the backend so "sale starting soon" reminders have something
    // to check against later -- listings are ephemeral (re-scraped every 8
    // min, never stored durably), so a snapshot has to be sent now rather
    // than relying on the backend to look the id back up itself.
    if (!authUser?.email) return;
    const nowSaved = !savedIds[id];
    if (nowSaved) {
      const sale = allSales.find(s => s.id === id);
      if (!sale) return;
      fetch(`${API_BASE}/api/push/watch`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ email: authUser.email, sale: { id: sale.id, title: sale.title, dateLabel: sale.dateLabel, timeLabel: sale.timeLabel } }),
      }).catch(()=>{});
    } else {
      fetch(`${API_BASE}/api/push/watch`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ email: authUser.email, unwatchId: id }),
      }).catch(()=>{});
    }
  };
  const ic = (name, size) => libsReady ? Icon(name, size) : null;

  const closeDetail = () => { setDetailId(null); setItemsView(null); };

  // Notifications feed — built from real in-app activity (sales published).
  const notifications = React.useMemo(() => {
    const list = [];
    userListings.forEach(l => {
      list.push({
        id:'listing-'+l.id, icon:'Tag', iconBg:'var(--surface-sunken)', iconFg:'var(--text-secondary)',
        title:'Your sale went live', body:`${l.title} is now visible to nearby shoppers.`,
        time:'Just now', unread:false, saleId:l.id,
      });
    });
    return list;
  }, [userListings]);

  const tabItems = [
    {key:'explore',label:'Explore',  icon:ic('Map',24)},
    {key:'saved',  label:'Saved',    icon:ic('Heart',24),   badge:savedCount>0},
    {key:'list',   label:'List',     icon:ic('PlusCircle',24)},
    {key:'trip',   label:'My Trip',  icon:ic('Route',24),   badge:tripIds.length>0},
    {key:'account',label:'Account',  icon:ic('User',24)},
  ];

  // Rendered once, then dropped into whichever shell below actually mounts —
  // real phones/tablets (isMobileDevice) get a full-bleed shell with real
  // safe-area insets, everything else keeps the phone-mockup preview frame.
  // Both shells share the id="phone-frame" (only one ever mounts at a time)
  // so burstConfetti()'s `document.getElementById('phone-frame')` lookup
  // keeps working unchanged in either mode.
  const screens = (
    <>
        {/* App screens -- each stays mounted while a sale detail is open
            (rather than unmounting on !detailSale) so its scroll position
            survives a round trip into the detail screen and back. Safe to
            leave rendered underneath: DetailScreen is a full opaque overlay
            (zIndex:60) covering it entirely. */}
        {tab==='explore' && (
          <ExploreScreen sales={salesInRadius} radiusMi={radiusMi} zip={effectiveZip} apiStatus={apiStatus} coverageMessage={coverageMessage} mapCenter={mapCenter}
            homeZip={zip} detectedCity={detectedCity} awayFromHome={awayFromHome} useHomeZip={useHomeZip} setUseHomeZip={setUseHomeZip}
            setZip={setZip} locating={locating} locationDenied={locationDenied} onRequestLocation={requestLocation}
            onOpenSale={openSaleDetail} onOpenFilters={()=>setFiltersOpen(true)} onToggleSave={toggleSave}
            activeTypes={activeTypes} setActiveTypes={setActiveTypes}
            keyword={keyword} onClearKeyword={()=>setKeyword('')}
            tripIds={tripIds} onToggleTrip={toggleTrip}
            onOpenVintageStores={()=>setVintageStoresOpen(true)} />
        )}
        {tab==='saved' && (
          <SavedScreen sales={allSales} onOpenSale={openSaleDetail} onToggleSave={toggleSave}
            tripIds={tripIds} onToggleTrip={toggleTrip} />
        )}
        {tab==='trip' && (
          <TripPlannerPanel
            allSales={[...allSales, ...vintageStores]} tripIds={tripIds}
            onToggleTrip={toggleTrip} onClearTrip={clearTrip}
            onClose={()=>setTab('explore')}
            onOpenSale={openSaleDetail}
            asTab={true}
          />
        )}
        {tab==='search' && (
          <SearchScreen radiusMi={radiusMi} setRadiusMi={setRadiusMi}
            activeTypes={activeTypes} setActiveTypes={setActiveTypes}
            keyword={keyword} setKeyword={setKeyword}
            onSearch={()=>setTab('explore')} />
        )}
        {tab==='list' && (
          <ListScreen onPublish={listing=>{setUserListings(p=>[...p,listing]);setTab('explore');}} />
        )}
        {tab==='account' && (
          authUser
            ? <AccountScreen
                radiusMi={radiusMi} setRadiusMi={setRadiusMi}
                zip={zip} setZip={setZip}
                authUser={authUser}
                onSignOut={()=>setAuthUser(null)}
                onUpdateUser={user=>setAuthUser(user)}
                userListings={userListings}
                savedCount={savedCount}
                onDeleteListing={id=>setUserListings(p=>p.filter(l=>l.id!==id))}
                onOpenSale={openSaleDetail}
                onOpenNotifications={()=>setNotificationsOpen(true)}
                onReplayWalkthrough={()=>setShowWalkthrough(true)}
                tripIds={tripIds} onToggleTrip={toggleTrip}
                onStoresLoaded={addVintageStores}
              />
            : <AuthScreen onAuth={user=>setAuthUser(user)} />
        )}


        {/* Tab bar */}
        {!detailSale && (
          <div style={{position:'absolute',left:0,right:0,bottom:0,zIndex:30}}>
            <TabBar active={tab} onChange={k=>{setTab(k);closeDetail();}} items={tabItems} />
          </div>
        )}

        {/* Filters sheet */}
        {filtersOpen && (
          <FiltersSheet onClose={()=>setFiltersOpen(false)} radiusMi={radiusMi} setRadiusMi={setRadiusMi} count={salesInRadius.length} />
        )}

        {vintageStoresOpen && (
          <VintageStoresScreen onBack={()=>setVintageStoresOpen(false)} zip={effectiveZip} tripIds={tripIds} onToggleTrip={toggleTrip} onStoresLoaded={addVintageStores} />
        )}


        {/* Detail */}
        {detailSale && (
          <div style={{position:'absolute',inset:0,zIndex:60,overflow:'hidden'}}>
            <DetailScreen sale={detailSale} onBack={closeDetail} onToggleSave={toggleSave}
              inTrip={tripIds.includes(detailSale.id)} onToggleTrip={()=>toggleTrip(detailSale.id)}
              onOpenItems={detailSale.items?.length>0 ? ()=>setItemsView({mode:'gallery'}) : undefined}
              onNavigateTo={() => {
                if (!tripIds.includes(detailSale.id)) toggleTrip(detailSale.id);
                setDetailId(null);
                setItemsView(null);
                setTab('trip');
              }} />
          </div>
        )}

        {/* Items gallery / item detail */}
        {detailSale && itemsView && (
          <div style={{position:'absolute',inset:0,zIndex:65,overflow:'hidden'}}>
            {itemsView.mode==='gallery' && (
              <ItemsGalleryScreen sale={detailSale}
                onBack={()=>setItemsView(null)}
                onOpenItem={idx=>setItemsView({mode:'item', idx})}
                onDirections={()=>openSaleDirections(detailSale)} />
            )}
            {itemsView.mode==='item' && (
              <ItemDetailScreen sale={detailSale} idx={itemsView.idx}
                onBack={()=>setItemsView({mode:'gallery'})}
                onOpenSale={()=>setItemsView(null)}
                onSelectItem={idx=>setItemsView({mode:'item', idx})} />
            )}
          </div>
        )}

        {/* Notifications */}
        {notificationsOpen && (
          <div style={{position:'absolute',inset:0,zIndex:80,overflow:'hidden'}}>
            <NotificationsScreen notifications={notifications}
              onBack={()=>setNotificationsOpen(false)}
              onOpenSale={id=>{ setNotificationsOpen(false); setItemsView(null); openSaleDetail(id); }} />
          </div>
        )}
    </>
  );

  const walkthrough = showWalkthrough && <WalkthroughScreen onDone={finishWalkthrough} userName={authUser?.name} />;

  if (isMobileDevice) {
    // Full-bleed shell for real phones/tablets (native app or mobile Safari):
    // no scaled mockup, no painted-on fake status bar/notch -- the real
    // device chrome shows through, and real safe-area insets (which move to
    // the left/right edge in landscape, not just top/bottom) replace the
    // fixed --safe-top constant used throughout every screen.
    return (
      <div id="phone-frame" style={{
        position:'fixed', inset:0, overflow:'hidden', background:'var(--surface-app)',
        '--safe-top':'env(safe-area-inset-top, 20px)',
        '--safe-bottom':'env(safe-area-inset-bottom, 0px)',
        '--safe-left':'env(safe-area-inset-left, 0px)',
        '--safe-right':'env(safe-area-inset-right, 0px)',
      }}>
        {screens}
        {walkthrough}
      </div>
    );
  }

  // A tab that arrived straight on a sale link (a browse-grid card opens
  // `/app?sale=<id>` in a new tab, same as a shared/digest-email link) gets
  // that one sale as its own page -- no grid, no backdrop, just the listing
  // and a way back to browsing. See deepLinkSaleId above.
  if (deepLinkSaleId) {
    return (
      <SaleDetailPage sale={detailSale} apiStatus={apiStatus} onToggleSave={toggleSave}
        itemsView={itemsView} setItemsView={setItemsView} />
    );
  }

  // Desktop/mouse visitors (rummagedeals.com in a real browser) get the full
  // web experience below instead of the phone-mockup preview frame -- see
  // isMobileDevice and WebHomeScreen. A sale opened from *within* this page
  // (a map pin click) still reuses the exact same DetailScreen the mobile
  // app and SaleDetailPage both use, just presented in a centered modal
  // panel instead of a full-screen shell -- quick preview, not a navigation.
  const closeModal = () => { closeDetail(); setTab('explore'); };
  return (
    <div id="phone-frame" style={{position:'fixed', inset:0, overflow:'auto', background:'var(--paper)'}}>
      <WebHomeScreen
        sales={salesInRadius} zip={effectiveZip} setZip={setZip}
        locating={locating} locationDenied={locationDenied} onRequestLocation={requestLocation}
        radiusMi={radiusMi} setRadiusMi={setRadiusMi}
        activeTypes={activeTypes} setActiveTypes={setActiveTypes}
        keyword={keyword} setKeyword={setKeyword}
        onOpenSale={openSaleDetail} onToggleSave={toggleSave}
        apiStatus={apiStatus} coverageMessage={coverageMessage} mapCenter={mapCenter}
        onOpenPost={()=>setTab('list')}
      />

      {(detailSale || tab==='list') && (
        <div onClick={closeModal} style={{position:'fixed',inset:0,zIndex:60,background:'rgba(17,15,13,.6)',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
          <div onClick={e=>e.stopPropagation()} style={{position:'relative',width:420,maxWidth:'100%',height:'min(860px, calc(100vh - 48px))',background:'var(--surface-app)',borderRadius:28,overflow:'hidden',boxShadow:'0 40px 90px rgba(0,0,0,.45)'}}>
            <button type="button" onClick={closeModal} aria-label="Close" style={{position:'absolute',top:-14,right:-14,zIndex:100,width:36,height:36,borderRadius:'50%',background:'#fff',border:'none',boxShadow:'var(--shadow-lg)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
              {Icon('X',18)}
            </button>
            {detailSale && itemsView?.mode==='gallery' && (
              <ItemsGalleryScreen sale={detailSale} onBack={()=>setItemsView(null)}
                onOpenItem={idx=>setItemsView({mode:'item', idx})}
                onDirections={()=>openSaleDirections(detailSale)} />
            )}
            {detailSale && itemsView?.mode==='item' && (
              <ItemDetailScreen sale={detailSale} idx={itemsView.idx}
                onBack={()=>setItemsView({mode:'gallery'})}
                onOpenSale={()=>setItemsView(null)}
                onSelectItem={idx=>setItemsView({mode:'item', idx})} />
            )}
            {detailSale && !itemsView && (
              <DetailScreen sale={detailSale} onBack={closeDetail} onToggleSave={toggleSave}
                onOpenItems={detailSale.items?.length>0 ? ()=>setItemsView({mode:'gallery'}) : undefined} />
            )}
            {!detailSale && tab==='list' && (
              <ListScreen onPublish={listing=>{setUserListings(p=>[...p,listing]);setTab('explore');}} />
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
